<style>
/* 本棚レイアウト：左に話の目次（狭い画面では引き出し）、右に横書きの本文を1本の柱で読む。沼の苔の緑を差し色に */
:root {
  --paper: #f1f2ec;
  --side: #e6e8df;
  --ink: #23251f;
  --muted: #676b5f;
  --line: #d6d9cd;
  --accent: #4b6a2a;
  --accent-soft: #dfe7d2;
  --shadow: rgba(30, 36, 22, .18);
  --f-body: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
  --f-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --size: 18px;
  --side-w: 270px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151719; --side: #1c1f21; --ink: #d8dad1; --muted: #8b8f85;
    --line: #2c302d; --accent: #a5c47d; --accent-soft: #263020; --shadow: rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151719; --side: #1c1f21; --ink: #d8dad1; --muted: #8b8f85;
  --line: #2c302d; --accent: #a5c47d; --accent-soft: #263020; --shadow: rgba(0,0,0,.5);
  color-scheme: dark;
}
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--f-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }

html { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); height: 100%; }
.col { height: 100%; overflow-y: auto; min-width: 0; -webkit-overflow-scrolling: touch; }

/* 目次 */
.toc {
  height: 100%; box-sizing: border-box;
  overflow-y: auto; background: var(--side); border-right: 1px solid var(--line);
  padding-block: 20px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 12px;
}
.toc-head { padding: 0 8px 14px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.work { font-family: var(--f-body); font-weight: 700; font-size: 20px; line-height: 1.35; margin: 0; }
.count { font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: .05em; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc button {
  width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink);
  font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 6px; cursor: pointer;
  display: grid; grid-template-columns: 3.6em minmax(0,1fr) 10px; align-items: baseline; gap: 4px;
}
.toc button:hover { background: var(--accent-soft); }
.toc button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.toc .no { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.toc .t { overflow-wrap: anywhere; }
.toc .read { width: 6px; height: 6px; border-radius: 50%; background: transparent; align-self: center; }
.toc li.done .read { background: var(--muted); opacity: .5; }
.toc li.cur button { background: var(--accent-soft); font-weight: 700; }
.toc li.cur .no { color: var(--accent); }

/* 上のバー */
.bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 8px;
  background: var(--paper); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar .where { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .chars { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; padding-right: 4px; }
.btn {
  border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: inherit; font-size: 13px;
  padding: 6px 11px; border-radius: 6px; cursor: pointer; line-height: 1.2;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#tocBtn { display: none; }
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--accent); width: 0; }

/* 本文 */
.page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 80px; }
article { max-width: 34em; margin: 0 auto; font-family: var(--f-body); font-size: var(--size); line-height: 2; }
.ep-head { padding-block: 56px 36px; text-align: center; }
.ep-no { font-family: var(--f-ui); font-size: 13px; letter-spacing: .3em; color: var(--accent); }
.ep-title { font-size: 1.7em; font-weight: 700; line-height: 1.4; margin: 10px 0 0; text-wrap: balance; }
article p { margin: 0 0 .85em; overflow-wrap: anywhere; }
article p.n { text-indent: 1em; }
.voice { font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 400; transform: skewX(-10deg); transform-origin: left center; color: var(--muted); letter-spacing: .12em; margin: 1.4em 0 1.4em 1.5em; }
rt { font-size: .5em; letter-spacing: 0; }
.gap { height: 2.6em; }
.brk { text-align: center; color: var(--muted); letter-spacing: 1.2em; padding-left: 1.2em; margin: 1.8em 0; font-size: .8em; }
.nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 34em; margin: 56px auto 0; font-family: var(--f-ui); }
.nav button {
  border: 1px solid var(--line); background: var(--side); color: var(--ink); font: inherit; text-align: left;
  padding: 12px 14px; border-radius: 8px; cursor: pointer; min-width: 0;
}
.nav button:hover { border-color: var(--accent); }
.nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.nav .next { text-align: right; grid-column: 2; }
.nav small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.nav span { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.end { text-align: center; color: var(--muted); font-size: 13px; margin-top: 40px; font-family: var(--f-ui); }

.scrim { display: none; }

/* 無料分の終わり：noteへの案内 */
.nav .more { grid-column: 1 / -1; text-align: center; border: 1px solid var(--line); background: var(--side); border-radius: 10px; padding: 26px 16px 28px; }
.more-lead { margin: 0 0 16px; font-family: var(--f-body); font-size: 17px; }
.more-btn { display: inline-block; background: var(--accent); color: var(--paper); text-decoration: none; font-weight: 700; padding: 12px 26px; border-radius: 999px; }
.more-btn:hover { filter: brightness(1.08); }
.more-soon { color: var(--muted); font-size: 14px; }
/* 登場人物 */
.cast { grid-column: 1 / -1; margin-top: 40px; }
.cast-h { font-family: var(--f-body); font-size: 22px; text-align: center; margin: 0; letter-spacing: .2em; }
.cast-sub { text-align: center; color: var(--muted); font-size: 13px; margin: 6px 0 4px; }
.cast-g { font-size: 14px; color: var(--accent); margin: 20px 0 10px; padding-bottom: 4px; border-bottom: 1px solid var(--line); letter-spacing: .1em; }
.cast-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
.cast-card { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1px solid var(--line); background: var(--side); border-radius: 10px; padding: 8px 6px 10px; cursor: pointer; font: inherit; color: var(--ink); text-align: center; min-width: 0; }
.cast-card:hover { border-color: var(--accent); }
.cast-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.cast-card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: #fff; margin-bottom: 4px; }
.cast-card .cn { font-weight: 700; font-size: 14px; }
.cast-card .cr { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.cast-open { margin: 16px 8px 0; width: calc(100% - 16px); border: 1px solid var(--accent); background: var(--accent-soft); color: var(--ink); font: inherit; font-size: 14px; font-weight: 700; padding: 10px; border-radius: 8px; cursor: pointer; }
.cv { position: fixed; inset: 0; z-index: 60; background: rgba(10, 12, 8, .72); overflow-y: auto; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); box-sizing: border-box; }
.cv-box { background: var(--paper); border-radius: 12px; max-width: 920px; margin: 0 auto; box-shadow: 0 10px 40px rgba(0,0,0,.4); overflow: clip; }
.cv-person { max-width: 1080px; }
.cv-person .cv-top { position: sticky; top: -16px; z-index: 3; background: var(--paper); border-bottom: 1px solid var(--line); }
.cv-tt { font-family: var(--f-body); font-weight: 700; letter-spacing: .2em; }
.cv-names { background: var(--side); }
.cv-ng { font-size: 11px; color: var(--accent); letter-spacing: .1em; }
.cv-nm { border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: inherit; font-size: 14px; border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.cv-nm:hover { border-color: var(--accent); }
.cv-nm.on { background: var(--accent); color: var(--paper); border-color: var(--accent); font-weight: 700; }
/* スマホ：名前は上に横一列（指で横に送る） */
@media (max-width: 759px) {
  .cv-names { position: sticky; top: 37px; z-index: 2; display: flex; align-items: center; gap: 6px; overflow-x: auto; padding: 8px 10px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .cv-names::-webkit-scrollbar { display: none; }
  .cv-ng { flex: none; padding-left: 6px; }
  .cv-ng:first-child { padding-left: 0; }
}
/* 広い画面：名前は左に縦一列 */
@media (min-width: 760px) {
  .cv-body { display: grid; grid-template-columns: 170px minmax(0, 1fr); }
  .cv-names { position: sticky; top: 37px; align-self: start; max-height: calc(100vh - 90px); overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding: 12px 10px 16px; border-right: 1px solid var(--line); }
  .cv-ng { margin: 10px 4px 2px; }
  .cv-ng:first-child { margin-top: 0; }
  .cv-nm { text-align: left; border-radius: 8px; }
}
.cv-list { max-width: 720px; padding-bottom: 20px; }
.cv-list .cast { margin-top: 0; padding: 0 16px; }
.cv-top { display: flex; justify-content: space-between; align-items: center; padding: 8px; }
.cv-back { border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.cv-x { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-size: 16px; cursor: pointer; }
.cv-img { display: block; width: 100%; height: auto; background: #fff; }
.cv-txt { padding: 14px 18px 22px; }
.cv-name { font-family: var(--f-body); font-size: 22px; font-weight: 700; }
.cv-role { font-size: 12px; color: var(--accent); margin-top: 2px; }
.cv-lead { font-family: var(--f-body); line-height: 1.9; margin: 10px 0 12px; }
.cv-txt dl { margin: 0; display: grid; grid-template-columns: 5em minmax(0,1fr); gap: 6px 10px; font-size: 14px; }
.cv-txt dt { color: var(--muted); }
.cv-txt dd { margin: 0; }
/* 読み上げ：読んでいる段落に薄い色 */
article p.speaking { background: var(--accent-soft); border-radius: 4px; box-shadow: 0 0 0 6px var(--accent-soft); }
#readBtn[aria-pressed="true"] { background: var(--accent); color: var(--paper); border-color: var(--accent); }
#rateBtn { font-variant-numeric: tabular-nums; min-width: 3.4em; }
@media (max-width: 420px) { .bar .chars { display: none; } .bar { gap: 6px; } .btn { padding: 6px 9px; } }

@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  #tocBtn { display: inline-block; }
  .toc {
    position: fixed; top: 0; left: 0; bottom: 0; height: auto; z-index: 40;
    width: min(84vw, 320px); transform: translateX(-102%); transition: transform .22s ease;
    box-shadow: 4px 0 24px var(--shadow);
    padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  }
  body.open .toc { transform: none; }
  body.open .scrim { display: block; position: fixed; inset: 0; z-index: 35; background: var(--shadow); }
  .ep-head { padding-block: 36px 24px; }
}
@media (prefers-reduced-motion: reduce) { .toc { transition: none; } }
</style>
</head>
<body>


<div class="shell">
  <nav class="toc" id="toc" aria-label="話の一覧">
    <div class="toc-head">
      <h1 class="work">毒も薬もさじ加減！</h1>
      <div class="count" id="count"></div>
    </div>
    <ol id="list"></ol>
    <button class="cast-open" id="castOpen" type="button">登場人物を見る</button>
  </nav>
  <div class="scrim" id="scrim"></div>
  <div class="col" id="col">
    <div class="bar">
      <button class="btn" id="tocBtn" type="button">目次</button>
      <div class="where" id="where"></div>
      <div class="chars" id="chars" title="この話の文字数（空白・ふりがな・＊を除く）"></div>
      <button class="btn" id="readBtn" type="button" aria-pressed="false" title="画面に見えている所から読み上げる">▶ 読む</button>
      <button class="btn" id="rateBtn" type="button" title="読む速さ">×1.0</button>
      <button class="btn" id="smaller" type="button" aria-label="文字を小さく">小</button>
      <button class="btn" id="bigger" type="button" aria-label="文字を大きく">大</button>
      <div class="progress" id="progress"></div>
    </div>
    <main class="page">
      <article id="art"></article>
      <div class="nav" id="nav"></div>
    </main>
  </div>
</div>

<script>
const EPS = [{"n": 1, "title": "死の沼地", "p": ["目が覚めて最初に感じたのは、肺の痛みだった。", "息を吸うたび、喉の奥が焼ける。視界の端が黄色い。指先が痺れている。", "ああ、これは知っている。前世の記憶が教えてくれる。", "人が死に向かう時の症状。その順番だ。", "俺は、泥沼の浅い所に、仰向けに寝ているようだった。", "体を起こすと、背中から泥が糸を引いて落ちた。", "目の前には、紫がかった灰色の沼がどこまでも広がっている。ところどころで泡が膨らみ、ぱちんと割れては、白い煙を吐いた。立ち枯れた木が何本か突き出しているが、幹はどれも黒く崩れかけている。鳥の声も、虫の羽音もしない。", "空は、濁ったスープの色をしていた。", "「……話が違うだろ」", "かすれた声が、自然と口からこぼれた。", "俺は、誰に言っている？", "ぼんやりとした頭が、少しずつはっきりとしてくる。", "そうだ。ここで目を覚ます前、俺は別の場所にいた。", "白い場所だった。", "床も、壁も、空もなかった。足の裏には何も触れていないのに、俺はそこに立っていた。音がしない。自分の息の音さえ、聞こえなかった。", "目の前に、人の形をした何かがいた。顔を思い出そうとしても、輪郭がほどけて思い出せない。", "「……ここは、どこですか」", "声が、震えていた。", "《私は、この世界の｜理（ことわり）を預かる者だ》", "それは、俺の問いには答えなかった。", "「理……？　俺は、どうなったんですか」", "《お前は、死んだ》", "静かな声だった。責めるようでも、哀れむようでもなかった。", "死んだ。", "俺は、自分の手首に指を当てた。昔から、何かあると脈を取る癖があった。", "脈は、なかった。", "指の下で、何も打っていなかった。", "膝から力が抜けそうになった。どうして。いつ。どこで。", "思い出そうとした。", "けれど、どう死んだかは、覚えていない。そこの記憶だけが、ぽっかりと消えていた。前の日のことも、子どもの頃のことも覚えているのに、最後の所だけが、白く塗りつぶされたように何もなかった。", "いや。", "一つだけ、残っていた。", "何か、とてつもなく大きくて、硬いもの。それが、俺にぶつかってきた。", "形も、色も分からない。ただ、逃げようのない重さと硬さだけが、体の奥に焼きついていた。", "指先が、また冷たくなった。", "《お前の死は、あまりに報われなかった。理に照らしても、釣り合いが取れぬ。よって願いを三つ叶え、次の世へ送る》", "それは、少しだけ間を置いた。", "《ただし、願えるのは、お前自身の体に関わる能力だけだ》", "報われなかった。", "何が、どう報われなかったのか。自分の死なのに、俺には分からなかった。", "「次の世、というのは……どんな所なんですか」", "《人が生き、人が死ぬ。ここと変わらぬ世だ》", "それだけだった。", "願い。三つ。子どもの頃なら喜んだのだろう。", "けれど今は、手が冷たかった。", "知らない世界へ、一人で放り出される。誰も知らない。何も分からない。そこで生きていくための、三つだ。", "「……病気にならない体、というのは」", "《病は、魂の巡りに関わる。願いの外だ》", "すぐに返ってきた。", "なら、何がいる。", "俺は、考えた。", "体の奥に、あの重さと硬さがまだ残っていた。", "どんな世界でも、人は物に囲まれて生きている。足の下の地面。身を守る壁。閉じこめる扉。人を斬る刃。どれも、その硬さで人を守り、その硬さで人を傷つける。", "俺を殺したのも、きっと、硬い何かだった。", "その硬さを、自分で決められたら。", "「……あの」", "俺は、顔を上げた。", "「硬いものを、柔らかく変える。そういう力も、願えるんですか。物を変える力なのに、体の能力、になるんですか」", "それは、少しの間、黙っていた。", "《物を変えるのではない。物に触れ、その在り方を感じ取り、思うままにする。それは、お前の体に宿る力だ。願いの内にある》", "体に宿る力。", "それなら。", "どこへ放り出されても、きっと、生き延びる道を作れる。", "「物の硬さを、好きに変えられる力が欲しいです。石を粘土みたいに柔らかく変えたり、水を床みたいに硬くして、その上を歩けたり……そんなこと、できますか」", "《命に触れていないものであれば、その力は通るであろう》", "命に触れていないもの。", "「……命に触れていないもの、って、どういうことですか」", "《それは、お前が自ら確かめることだ》", "「確かめる……」", "《答えを与えられた者は、そこで止まる。自ら触れ、自ら知った者だけが、その先へ進める》", "それきり、何も言わなかった。", "願いが通ったのかどうかも、よく分からなかった。けれど、手のひらの奥が、かすかに熱かった。", "ふたつ目は、考えるより先に口から出ていた。", "「もう二度と、腹を空かせたくありません」", "言ってから、自分で驚いた。", "もう二度と。", "どこで、そんなに腹を空かせたのか。それも、思い出せなかった。", "それは、わずかに首を傾げたように見えた。", "《妙な願いだ。……よかろう。もっとも、それがどんな形で実を結ぶかは、お前次第だが》", "意味は分からなかった。", "《三つ目は》", "すぐには答えられなかった。", "向こうの世界がどんな場所なのか、俺はまだ何も知らない。知らないまま最後の一つを決めてしまうのは、怖かった。", "「あの……三つ目は、今決めないと駄目ですか」", "《ほう》", "「向こうに行ってから、本当に困った時に使う、というのは……できますか」", "言ってから、少し後悔した。相手は神様なのか何なのか、正体も分からない。厚かましいと思われたら、それきりかもしれない。", "人の形をした何かは、少しの間、黙っていた。", "《構わぬ》", "それから、初めて笑ったようだった。", "《持っていくがいい。わが姿を念じて声に出せば、いつでも届く》", "その声が、遠くなった。", "白い光が、まわりからじわじわと濃くなっていった。人の形をした何かの輪郭が、光の中に溶けていく。", "「待ってください。まだ――」", "声を出したつもりだった。けれど、自分の声が聞こえなかった。", "手の先から、体の重さが消えていった。腕。肩。胸。どこまでが自分の体なのか、分からなくなった。", "白が、だんだんと暗くなった。", "考えようとしても、考えがまとまらない。何かを思い出しかけて、それもほどけていく。", "そして、何も分からなくなった。", "それが、白い場所の最後の記憶だった。", "_gap", "ぼんやりしていた頭が、少しずつはっきりしてきた。", "「……話が違うだろ」", "もう一度、同じ言葉がこぼれた。", "報われない死を哀れんで、送ってくれた先が、死の毒沼か。", "……笑えないな。", "尻の下で、泥がぬるりと動いた。冷たい泥が、服の中までしみこんでいる。気持ちが悪かった。", "俺は、ふらつきながら立ち上がった。", "自分の掌を見る。皮膚に、赤い斑点が浮き始めていた。", "沼から立ちのぼる煙には、腐った卵の臭いが混じっている。ただし、さっきより薄い。", "薄くなったわけがない。鼻がやられ始めたのだ。この手のガスは、臭いを感じなくなった時が一番危ない。そして、たいていは空気より重い。", "つまり、低い場所にいる俺は、ゆっくり死んでいる最中だった。", "頭で考えたわけではなかった。前の世界で覚えたことが、本能のように勝手に浮かんでくる。体も、もう動き出していた。", "「……上だ」", "足元の泥に手をついた。", "硬くなれ、と念じるより早く、掌の下で泥が変わった。ぬるりとした感触が消え、石畳のような手応えになる。", "息をのんだ。", "本当に、できる。", "固めた泥の縁に手をかけ、その周りの泥を掘り寄せ、積み上げてはまた固める。指の皮が破れても、やめなかった。一段。二段。三段。", "階段と呼ぶには不格好なそれを這い上がり、背丈の三倍ほどの高さまで来たところで、俺は倒れ込んだ。", "息を吸う。", "まだ痛い。だが、ほんの少しだけ、ましだった。", "神様。あんたがくれた力は本物らしい。ついでに、もう少しましな転生先も選んでほしかった。", "笑おうとして、咳き込んだ。手で押さえると、掌に血が混じっていた。", "水の問題は、翌朝に解決した。いや、解決と呼ぶには程遠い。", "泥を薄く伸ばして固めた皿を作り、夜のうちに並べておく。朝になると、皿には露が溜まった。舐めると舌が痺れ、そのあと半日は腹を抱えてのたうち回る。", "沼の水を飲めば、たぶん一口で終わる。それに比べれば、上等だ。", "日数を忘れないよう、一日の終わりに、足場の壁の固める前の泥へ、爪で線を一本引くことにした。一本。二本。三本。", "服は四日目に崩れ始めた。袖をつまむと、濡れた紙のようにちぎれた。ここでは、死んだものが長く形を保てないらしい。", "俺がまだ形を保っているのは、たぶん、まだ死んでいないからだ。", "この日は、遠くへ出ようと試みた。足場を伸ばし、固めた泥の道を作って、半日かけて進んだ。だが、どちらを見ても同じ景色で、煙はむしろ濃くなった。意識が遠のきかけて、這うように引き返した。", "五本。六本。七本。", "腹が減っていた。", "最初の数日は、痛みの陰に隠れていた空腹が、今は一番前に出てきている。胃が内側から自分を噛んでいるようだ。立ち上がると視界が暗くなる。足にも力が入りにくくなってきた。体は今、自分の肉を燃やしてどうにか動いている。", "食べられるものを探した。立ち枯れの木は、触れただけで黒い粉になった。沼の縁に生えた苔を噛んで飲みこむと、舌が焼けて、半日吐き続けた。吐くものなど、もう何も残っていないのに。", "……もう二度と、腹を空かせたくありません……", "あの願いは、どこへ行ったのだろう。", "硬さの力は、確かに使えている。なら、二つ目の願いは、どこで、どう叶っているのか。", "「誰か……教えてくれ……」", "八本目の印は、まっすぐに引けなかった。", "九本目を引いた夜、雨が降った。", "雨粒が当たった皮膚が、じくじくと痛んだ。隠れる場所を固めて作る力も、もう残っていない。俺は足場の上で丸くなり、歯を鳴らしながら空を見ていた。", "《わが姿を念じて声に出せば、いつでも届く》", "思い出してしまった。", "ここから出してくれ、と願いかけた。", "けれど、すぐに思い直した。願えるのは、自分の体に関わる能力だけだ。ここから出してくれ、では、きっと届かない。", "なら、力として願えばいい。どこへでも、ひと息に移れる体。そういう力なら、通るかもしれない。", "ひと言で、この痛みは終わる。温かい場所へ行けるかもしれない。腹いっぱい食べられるかもしれない。", "口が開いた。", "「どこへでも――」", "その時、腹の底がきりきりと痛んだ。空っぽの胃が、また内側から俺を噛んでいる。", "腹。", "……もう二度と、腹を空かせたくありません……", "願いを言いかけた口が、そこで止まった。", "苔のことを思い出した。舌が焼けるほどの毒だった。あれだけの毒を飲みこめば、ふつうの人間は、吐くだけでは済まない。", "なのに俺は、吐いただけで、まだ生きている。", "もしかして俺は、とんでもない体をもらったんじゃないのか。", "考えてみれば、この九日間、俺はまだ一度も腹を満たしていない。苔は、飲みこんだそばから吐いてしまった。皿の底にたまる数滴の露では、腹の足しにもならない。", "腹いっぱいに食べてみなければ、あの願いが本物かどうかは分からない。", "ただ、固いものは駄目だ。噛めば噛むほど味が舌に残って、体が先に吐き出してしまう。", "なら、噛まなければいい。", "足場の下には、柔らかいままの泥がいくらでもある。あれなら、味が分かる前に喉を通る。吐くより先に、腹を満たせるかもしれない。", "駄目なら、その時こそ三つ目を使えばいい。あの姿を念じて、声さえ出せば、届く。", "「……まだ、使う時じゃない」", "かすれて、ほとんど声にならなかった。", "雨は明け方に止んだ。", "十本目の印は、引けなかった。腕が上がらない。", "足場の縁から、下の沼が見えた。朝の光の中で、泥は紫色に鈍く光っている。煙を吐き、泡を立て、この九日間、俺の体を少しずつ削り続けてきたものだ。", "ずるずると体を引きずって、階段を下りた。", "泥をひとすくい、両手に取った。", "両手にすくったそれを、しばらく眺めた。紫色の泥が、指の間からゆっくりと垂れていく。", "固める必要はない。柔らかいままなら、噛まずに一気に流しこめるはずだ。", "頭の奥で、昔覚えた知識が冷静に告げる。摂取すれば、数分で激しい嘔吐。続いて痙攣。その後は、考えるまでもない。", "「知ってるよ」", "ふつうの体なら、だ。", "腹の底が、きゅうっと縮んだ。", "こんな時でも腹は減るのか、と少しおかしくなって、俺はひび割れた唇の端を上げた。", "両手を、口へ運んだ。"]}, {"n": 2, "title": "悪食", "p": ["味は、鉄と腐った卵だった。", "喉が押し返そうとするのを、飲み込む勢いでねじ伏せた。噛まない。味わわない。流し込み、またすくって、流し込む。胃の底が、少しずつ重くなっていく。", "腹が張るほど流し込んだところで、胃が裏返った。", "吐こうとしても、体が言うことを聞かない。腹の底で何かが燃え始め、それが背骨を伝って頭まで駆け上がる。視界が白く弾けた。自分が泥の上へ倒れたことに、頬が濡れてから気づいた。", "始まった。", "予想どおりの順番だった。嘔吐。痙攣。手足の先から感覚が消え、代わりに、腹の中だけが異様にはっきりしてくる。", "肝臓が悲鳴を上げている。", "腎臓も、そう長くはもたない。", "それでも心臓だけは、まだ律儀に打っていた。もういいのに、と思った。お前ももう休んでいい。誰もそこまで頼んでいない。", "どくん。", "どくん。", "どくん。", "時間の感覚がなくなった。空が暗くなり、また明るくなった気がする。歯を食いしばりすぎて、奥歯が一本割れた。自分の悲鳴を遠くで聞いた。駄目なら三つ目を使えばいい。そう決めていたはずなのに、願いを声にする余裕さえ、もうなかった。", "人の体は、よくできている。", "こんな時に、そんなことを考えていた。三十七兆の細胞が、誰に命じられたわけでもなく、ただ今日を生きるために働いている。肝臓は毒の形を変え、腎臓はそれを濾し、血は休まず運ぶ。自分が死ぬその瞬間まで、誰一人として仕事をやめない。", "そこで、意識が途切れた。", "冷たい。", "頬に、露が落ちた。", "ゆっくりと目を開ける。濁ったスープの色の空があった。いつもの空だ。つまり、ここは天国ではないらしい。", "死ななかった。", "なぜだ。", "計算が合わない。あれだけ流し込めば、人間が何人も死ぬ量だった。俺は、いつものように肘をついて、這うように体を起こそうとした。", "すっと、起き上がれた。", "腕に力が入る。昨日は泥に印を引くことさえできなかった腕だ。手を握り、開く。痺れがない。胸に手を当てて、深く息を吸う。肺はまだ痛むが、焼けるほどではない。", "そして、一番おかしなことに気づいた。", "腹が、減っていない。", "九日間、内側から俺を噛み続けていたものが、きれいに消えている。空腹が消えたのではない。満ちているのだ。温かいものを腹いっぱい食べた後の、あの重さと眠気がある。", "腕を見た。骨に皮が貼りついていたはずの腕に、わずかだが肉が戻っている。", "たった一晩で？ いや、一晩なのかも分からない。それにしても、ありえない。", "足元の泥を見る。", "まさか。", "もう一度、自分の腹を見る。", "「……もう二度と、腹を空かせたくありません」", "口の中で、繰り返してみた。", "……もっとも、それがどんな形で実を結ぶかは、お前次第だが……", "あの時の声がよみがえった。人の形をした何かは、わずかに首を傾げていた。", "毒は、肝臓で形を変えられて無害になる。ふつうの体なら、そこで終わりだ。", "俺の体は、その先をやったらしい。", "毒を壊し、ばらして、組み直し、足りないものへと作り変えた。今、この体が欲しがっていたものへ。筋肉には筋肉の材料を。血には血の材料を。", "ふと、舌で奥歯を探った。", "割れたはずの歯が、つるりと元の形に戻っていた。", "壊れた所には、真っ先に回るらしい。", "「ふざけるな……」", "笑いがこみ上げた。", "何でも食える。", "それが、俺の二つ目の願いだった。", "確かめなければならない。", "沼の縁まで歩き、苔を一本むしった。八日前、俺に半日吐かせたやつだ。じっと見てから、口へ放り込んだ。", "苦い。舌の上に、かすかな痺れ。", "待った。百数えた。五百数えた。", "何も起きなかった。胃は静かで、それどころか、腹の底がほんのりと温かい。", "一度入れば、体が覚える。免疫に似ている。いや、そんな上品なものではない。もっと乱暴な何かだ。", "なら、あの泥はどうだ。", "もう一度すくって、飲み下す。今度は一度えずいただけで、腹に収まった。", "「……うまくはないな」", "味はひどいままだった。そこは、願いの範囲外らしい。", "足場の壁に戻り、十本目の印を引いた。少し迷って、もう一本引いた。たぶん、一日は寝ていた。", "線は、まっすぐだった。", "そうなると、試したいことが出てくる。", "毒が食えるなら、石はどうだ。", "足元に、拳ほどの石が落ちていた。手に取って、柔らかくなれ、と念じる。指が沈む。石は、こねたパン生地のように形を変えた。", "口へ入れて、噛んだ。歯が、抵抗なく沈む。ざらりとした舌触りが喉を落ちていく。", "腹が、静かに温まった。", "俺はしばらく、手の中に残った石を見つめていた。", "それから、ゆっくりと周りを見回した。", "紫の泥。黒く崩れた木。白い煙を吐く泡。どこまでも続く沼。この九日間、俺を殺そうとしてきたものすべて。", "この場所に、俺の食えないものは、ない。", "その時、風向きが変わった。", "沼の奥から、濃い煙が流れてきた。喉がひりついた。これまでの煙とは違う。目を凝らすと、遠くの泥はこのあたりより黒く、泡の立ち方も激しい。", "ためしに、足場を延ばして近づいた。煙の濃くなる手前で、黒い泥をひとすくい取って戻る。", "舐めてみた。", "次の瞬間、俺は足場の上に転がっていた。", "二日間、動けなかった。", "吐き、のたうち、また心臓の音を聞いた。死んだほうがましだと、本気で思った。", "三日目の朝、目を開けると、腹がまた満ちていた。立ち上がると、昨日までより体が軽い。あの煙を吸っても、もう喉はひりつかなかった。", "なるほど。", "そういうことか。", "何でも食べられる体。その「何でも」の、一番遠い所にあるもの。食べ物の、ちょうど反対側にあるもの。", "それが、毒だ。", "あの白い場所で、言われた。それがどんな形で実を結ぶかは、お前次第だ、と。", "腹を空かせない体は、もらった。けれど、それを使いこなせる体にするのは、自分でやれということか。", "だから、この沼なのか。", "ここで鍛えろ、と。", "一つの毒に倒れて、起き上がるたびに、体はその毒を覚える。次に同じものが来ても、もう負けない。前の世界で、病にかかった体が、その病に強くなっていくのと似ていた。", "毒も、ほんの少しなら薬になる。前の世界には、そういう見方もあった。", "けれど、俺にとっての毒は、薬ではなかった。この体を鍛え直すための、材料だ。", "だったら、ここは地獄なんかじゃない。", "俺は足場の一番上に立ち、沼の奥を見た。濃い煙の向こうは、まだ見通せない。あの先に何があるのか、どれほどの毒が眠っているのか、見当もつかない。", "三つ目の願いは、まだ使っていない。", "使う必要も、なさそうだった。", "腹が、ぐう、と鳴った。", "おかしな話だ。もう二度と空かないはずの腹が、まだ足りないと言っている。", "俺は、ひび割れた唇の端を上げた。", "「この沼、全部食ってやる」"]}, {"n": 3, "title": "千の印", "p": ["百日目を過ぎた頃、俺は毒に番号を振り始めた。", "一番は、最初に食った紫の泥。二番は苔。三番は、あの黒い泥。味と症状と、動けなかった大まかな日数を、足場の壁に刻んでいく。", "書き残す相手はいない。ただ、そうしていないと、自分が何をしているのか分からなくなりそうだった。", "十二番は、泡の中に溜まる透明な液だった。口にした時は、何ともなかった。忘れた頃に目が見えなくなり、三日間そのままだった。", "二十五番は、枯れ木の根に張りつく赤い粘菌だった。全身の皮膚が剥けた。新しい皮膚は、前より丈夫な気がした。", "三十一番を食った時は、心臓が二度止まった。二度とも、しばらくすると何事もなかったように動き出した。律儀なやつだ。", "新しい毒を見つける。食う。死にかける。起きる。腹が満ちて、体が少し変わっている。", "それを、ひたすら繰り返した。", "二百日目の頃には、沼の煙で喉が痛むことはなくなった。", "三百日目の頃には、素足で泥の中を歩いても、皮膚が爛れなくなった。", "力のほうも、だいぶ分かってきた。", "固めた泥は、俺が触れて念じない限り、そのままの硬さを保つ。足場は、上へではなく、横へ横へと広がっていった。食べるものは、下の沼にしかないからだ。沼にも雨は降り、風も吹く。固めた泥で壁を立て、屋根をかけた。いつの間にか、いくつかの部屋を持った、いびつな小屋のようなものができていた。泥を布のようにしなやかに固めれば、腰に巻くものも作れる。服の代わりとしては上等だ。", "このあたりの沼は、思っていたより浅かった。たいていの所は、立てば胸のあたりまでしかない。その下には、固く締まった底がある。", "だから道を作るには、足元から底まで、泥を柱のように固めてやればいい。上に乗っても、もう沈まない。", "けれど、奥へ行くと、底の見えない深みもあった。そういう所で底まで柱を伸ばすのは、手間がかかりすぎる。", "かといって、足の下だけを固めても、その塊ごと沈んでいくだけだ。だから、目の前の泥の表面を、広く、一度に固める。薄く張った氷の上を行くように、その上をそっと歩いて渡る。", "俺は、力をいろいろと試してみた。立ち枯れたもろい木は、鉄のように硬くなった。逆に、素手では絶対に割れないような硬い石も、柔らかい粘土に変えることができた。", "使い続けていると、ある所で急に手応えが重くなる。そこで無理に続けると、腹がひどく鳴った。毒を食ったばかりでも、関係なく鳴る。", "ところが翌朝には、昨日限界だったところを楽々と越えられるようになっていた。", "筋肉と同じだ。限界の少し先まで使えば、体はそこに合わせて育つ。", "それから毎日、腹が鳴るまで使った。四百日を過ぎた頃には、どれだけ固めても、手応えが重くなることはなくなった。", "都合のいい体だ、と思った。", "ただ、効かないものもある。", "ある朝、伸び放題の髭が鬱陶しくなった。根もとを水のように柔らかくすれば、長い髭だけをするりと落とせるはずだ。顎に指を当てて、念じた。", "何も起きない。爪も、皮膚も駄目だった。沼の縁の苔も、まだ生きている部分には効かなかった。", "ところが、石の刃で切り落とした髭の束は、手の中であっさりと硬くなった。", "《命に触れていないものであれば、その力は通るであろう》", "あれは、そういう意味か。", "硬くした髭は、よく尖った。針が一本あると、案外便利だった。", "飲み水は、今も夜露から取っていた。", "小屋の屋根の縁に、固めた泥で細い溝をつけ、その先に泥の椀を置いておく。朝になると、椀の底に澄んだ水が溜まっている。", "見た目は澄んでいても、毒の煙の中で溜まった露だ。最初の頃は、舐めるだけで半日のたうち回った。今は、舌の先がかすかに痺れるだけだ。俺の体のほうが、変わったのだ。", "髭を切った日の朝、その椀を覗きこんだ。", "水面に、男の顔が映っていた。", "俺は、椀を持ったまま動けなくなった。", "この世界に来てから、自分の顔を一度も見ていなかった。見ようと思ったことさえなかった。生きることに、手一杯だったからだ。", "けれど、椀の水は小さくて、煙の下では暗い。少し息がかかるだけで揺れて、顔の形がすぐに崩れた。", "もっと、はっきり見たかった。", "椀の水を手のひらに取り、薄く、平らに伸ばしながら固めた。透き通った、硬い板ができた。けれど、透き通りすぎて、向こうの泥が見えるだけだった。", "前の世界の記憶が、ひとつ浮かんだ。窓のガラスは、外が暗くなると、部屋の中を映す。", "俺は小屋の中で、一番黒い泥の壁を探した。その前に、水の板を立てかけた。", "覗きこむ。うまくいかない。何も映らなかった。", "暗い小屋の中で、顔に光が当たっていない。これでは無理か。", "戸口のそばへ板を移し、差しこむ光を顔に受けて覗いてみた。顔を、右へ、左へ。", "ある角度で、板の中に、ぼんやりと何かが浮かんだ。", "息を止めて、そのまま動かずにいた。", "今度は、かろうじて映った。", "影のような顔だった。黒い髪が、肩の下まで伸び放題になっているのは分かる。頬がこけているのも分かる。けれど、目や口の形までは、はっきりしなかった。少し首を動かすだけで、顔は板の中から消えかけた。", "たぶん、三十くらいの男だ。", "これが、今の俺の顔か。", "前の世界の俺と、同じ顔なのかどうか。確かめようとは思わなかった。前の世界のことを深く思い出すのは、まだ怖かった。", "口の端を、上げてみた。", "板の中の影も、片方だけ、少し上がったように見えた。", "「……悪くは、ないか」", "水の板は、そのまま戸口のそばの壁に立てかけておいた。それからは、髭を切るたびに、明るい時を選んでその前に立った。", "五百日目、俺は沼の流れに気づいた。", "毎日見ていたはずなのに、それまで気づかなかった。この沼は、止まっていない。泥も水も、目に見えないほどゆっくりと、ある一方向へ動いている。外から、奥へ。", "気づいたのは、大木の上からだった。", "小屋からかなり離れた所に、一本だけ、とてつもなく大きな立ち枯れの木が残っていた。幹は、大人が何人も手をつないでやっと囲めるほど太い。てっぺんは、煙の中にかすんで見えなかった。", "幹も枝も、半ば朽ちていた。けれど、手を当てて硬くすれば、ぼろぼろの枝が鉄の横木のようになった。一本ずつ硬くしながら、俺は上へ上へと登った。", "下から見ても分からないものが、そこからは見えた。細い流れが集まって太くなり、また枝分かれしている。その筋が、網の目のように沼じゅうに広がっていた。", "どこかで見た形だ、と思った。", "どこで見たのかは、思い出せなかった。", "流れが集まっていく先には、煙が厚く溜まっていた。奥へ行くほど、毒は濃くなる。つまり、奥へ行くほど、腹が満ちる。", "けれど、すぐには向かわなかった。小屋の周りにさえ、まだ食っていない毒がいくらでもある。奥で動けなくなれば、戻る場所もない。まずは近くからだ。", "それからは小屋を拠点にして、周りを一つずつ歩いた。固めた泥の道を延ばし、新しい毒を見つけては食う。動けるようになったら道を戻り、小屋の壁に番号と味を刻んだ。留守にした日の数だけ、印もまとめて引いた。", "六百日目。七百日目。", "煙の向こうには、赤い泉があった。酸の霧が降る谷があった。溶けた骨のようなものが積もる白い浜があった。どれも食った。どれも、一度か二度は俺を殺しかけた。", "番号は百を超えた。", "苦しみ方も変わった。昔は三日のたうち回った毒が、今は半日の腹痛で済む。その分、より遠くへ足を延ばせた。", "八百日を過ぎた頃には、どこにどんな毒があるか、泥の上に地図を描けるほどになっていた。まだ行っていないのは、流れが集まっていく先だけだった。", "俺は小屋を後にして、流れを下った。", "奥へ進むほど、煙は濃く、泥は深くなった。底の見えない深みでは、一歩ごとに足元を固めなければならない。日が暮れれば固めた泥の上で眠り、目が覚めればまた歩いた。振り返っても、小屋はとうに煙の向こうに消えていた。", "何日歩いたか分からなくなった頃、急に煙が晴れた。その先に、湖があった。", "沼地の流れは、すべてそこへ注いでいた。", "黒かった。泥の黒でも、夜の黒でもない。光がそこで終わっているような、底も表面も分からない黒だ。波ひとつ立たない。音もしない。ただ、真っ黒な何かが、そこにある。", "なぜか、目が離せなかった。", "岸に膝をつき、指先を浸した。", "波紋が立ったはずだった。指を動かしたのだから、立たないわけがない。それなのに、何も見えなかった。光を少しも返さないから、揺れたことさえ分からない。", "引き上げた指先に、一滴だけ残っていた。舐めた。", "次に目を開けた時、俺は湖から遠く離れた泥の上に倒れていた。どうやってそこまで這ったのか、覚えていない。", "爪の伸びを見るに、十日ほどは経っているようだった。", "その間ずっと、意識が飛んでいたことになる。", "たった一滴でだ。", "体が動くようになると、道を戻って小屋へ帰った。留守にした日の数だけ、壁に印を引く。眠っていた日の数は、爪の伸びから当たりをつけるしかなかった。", "あれには、番号を振らなかった。", "しばらく小屋で体を休めてから、もう一度だけ湖へ向かった。今度は舐めない。あの黒の真ん中に何があるのか、見てみたかった。", "岸の前の黒い水を、広く固める。氷の上を行くように、湖の中へ踏み出した。", "十歩ほど進んだ所で、足が前へ出なくなった。", "見えない何かが、胸を押し返してくる。風ではない。体を前へ傾けるほど、同じだけの力で、静かに押し戻される。足元は、まだ先まで固められるのに、俺の体だけが進めない。", "何かの力に、阻まれていた。", "俺はしばらく、黒い湖のことを考えないようにした。", "九百日目の頃、ひとつ、おかしなことに気づいた。", "その日は、六十七番の黒い苔を噛んでいた。何度も食った毒だ。もう体を痛めることもなく、ただ腹を満たすだけの、いつもの食事だった。", "うまい、と思った。", "噛むのをやめた。", "鉄と、腐肉と、焼けた髪の味がする。ひどい味だ。毒沼に放り出されて三年。最初の頃の俺なら、一口で吐いている。", "それを今、俺はうまいと思った。", "しばらく口の中に残してから、飲み込んだ。", "腹は、まだ少し足りないと言っている。", "「……贅沢になったな」", "声に出してみると、ひどくかすれていた。そういえば、最後に声を出したのはいつだったか。", "その夜、初めて自分の記憶の中から、人の顔を思い出そうとした。", "思い出せなかった。たぶん、思い出さないようにしてきたからだ。", "代わりに、湯気が浮かんだ。", "小さな食卓に、湯気の立つ椀がひとつ。「熱いから、気をつけて」と誰かが言って、俺の前に置く。顔は見えない。声だけが、すぐそばにある。", "息を吹きかけて、ひと口すする。舌の先が痛いほど熱い。腹の底から温かさが広がって、肩の力がふっと抜けていく。", "ただのスープだった。名前も覚えていない。", "なのに、毒をうまいと思ったこの舌が、あの味だけは忘れていなかった。", "湯気の立つ食卓。", "そういうものが、自分の記憶には確かにあった。", "*", "日数の印は、いつの間にか千本を超えていた。", "その日、俺は、あの大木に登った。", "自分のいた沼地の周りなら、深い泥や固い地面がどこにあるか、もう全て頭に入っていた。だが、煙の向こう、沼地の外がどうなっているのかを、俺はまだ知らない。", "拠点の周囲は確認したが、沼の外側を見ようとしたことがなかった。見るのが怖かったのかもしれない。", "けれど今は、遠くを見たいと思った。", "沼の中なら、どんな毒が出ても俺は死なない。奥へ進めたのは、そのためだ。だが、外はそうはいかない。煙を抜けた先に何が待っているのか、俺は何ひとつ知らないのだ。何も知らずに歩いて出れば、それこそ命取りになる。", "「……出る前に、まず見ておかないとな」", "木の上から見ても、俺の目では遠くまでは見渡せなかった。煙も邪魔をしているので、なおさらだ。遠くを見るための道具。俺は記憶をたどった……前の世界の記憶に、確かあったはずだ。", "人の目の奥には、透き通った、真ん中のふくらんだものが一つ入っている。それが光を集めて、物の形を結ぶ。前の世界では、レンズと呼んでいた。大きさの違うレンズを筒の両端に一つずつはめれば、遠くの物が近くに見える。", "作り方までは知らない。けれど、形だけは分かっていた。", "翌朝、泥を薄く伸ばして、筒を二本固めた。腕の長さほどの太い筒と、その内側にちょうど収まる細い筒だ。細いほうを太いほうへ差し込むと、抜き差しするたびに全体の長さが変わった。", "次に、椀に溜めた夜露を手のひらに取り、ゆっくりと固めた。透き通った、小さな塊ができた。", "それから、きめの細かい泥を選んで固め、平らな砥石を作った。", "砥石の上で、露の塊を少しずつ削った。真ん中をふくらませ、縁を薄くしていく。削っては光にかざし、また削る。削りすぎれば、また露を足して固め直した。", "少し大きいものと、小さいものを一つずつ。二つ削り終えるまでに、二日かかった。", "レンズと呼ぶには、いびつな形だった。それでも、手のひらに載せて覗くと、指の筋が大きく、くっきりと見えた。", "大きいレンズを太い筒の先に、小さいレンズを細い筒の手元にはめ込み、大木のてっぺん近くまで登って、煙の上から覗いた。", "ぼやけた灰色。", "細い筒を少しずつ抜き差しする。", "灰色が、ゆっくりと形になった。", "枯れ木の枝。泡。泥の筋。そのずっと先。煙が薄くなるあたりに、見たことのない線が一本、地平を横に走っている。", "俺は息を止めた。", "森林の緑だった。", "この世界に放り出されて、初めて見る色だった。", "どれくらいそうしていたのか分からない。目が痛くなって、レンズから顔を離した。自分の頬が濡れているのに気づいて、驚いた。まだ、そんなものが出るのか。", "小屋に戻って、壁の印を見上げた。", "印はもう隙間がなく、天井まで届いていた。千を超える線。よくもまあ、と思う。", "三つ目の願いは、一度も使わないまま、ここまで来た。", "そろそろ、この沼から出てもいいのかもしれない。", "そんなことを考えながら、その日も望遠鏡を覗いた。すっかり毎日の習慣になっていた。緑の線を眺めて、ゆっくりと筒を左へ動かす。", "筒が止まった。", "煙の薄い沼の縁に、昨日までなかったものが立っている。", "細くまっすぐな、一本の杭だった。", "枯れ木ではない。誰かが削って、誰かが打ち込まなければ、あんな形にはならない。", "心臓が、三十一番を食った時より大きく打った。", "杭のそばで、何かが動いた。", "指先が震えて、筒が揺れる。息を殺して、合わせ直す。", "レンズの向こうで、黒い人影が三つ、こちらを向いて立っていた。"]}, {"n": 4, "title": "接触", "p": ["人だ。", "三年ぶりに見る人間に、俺が最初に感じたのは、喜びではなかった。", "まずい、だった。", "望遠鏡を下ろし、大木の上から下に広がる沼地を見渡した。遠くにかすかに見える、いびつな泥の小屋。沼の奥へ何本も延びる、不規則に固めた泥の道。", "自然にできるものではない。これを見た人間は、必ず考える。誰が作ったのか、と。", "そして、その誰かを見つけたら、どうするだろう。", "毒の沼で三年暮らし、石を食い、毒で腹を満たす男。俺がもし街の人間なら、そんなものを人とは呼ばない。", "どうしたいのかは、自分でも分からない。ただ、見られてはいけないことだけは分かった。", "もう一度、望遠鏡を覗く。人影は杭のそばで何かをしていて、沼の中へ入ってくる様子はない。まだ時間はある。", "大木を下りると、遠い道から順に、溶かしていった。", "端に手をつき、柔らかくなれ、と念じる。道はため息をつくように形を失い、紫の沼へ沈んでいった。二年かけて延ばした道が、半日で消えた。", "最後に、小屋へ戻った。", "壁の前に座り、刻んだ番号を一番から順に読んでいった。味と症状と、動けなかった日数。百を超える毒を、一つずつ頭に入れていく。この壁を読めるのは、今日が最後だ。", "それから、日数の印を見上げた。天井まで埋め尽くした、千を超える線。最初のほうの線は曲がっている。八本目は、特にひどい。指でなぞると、その線を引いた日の冷たい泥を思い出した。", "少しの間、そうして見ていた。", "小屋の外へ出て、壁に手をつく。", "「世話になったな」", "掌の下で、壁が緩んだ。小屋はゆっくりと形を失い、紫の沼へ沈んでいった。中の印も、一本目も八本目も最後の一本も、区別なく混ざり合って、ただの泥に戻ったはずだ。沈みきるまで、それほど時間はかからなかった。", "あとには、波紋ひとつ残らなかった。", "手元には望遠鏡だけが残った。ふたつのレンズを外して、口へ入れる。硬さを解くと、ただの夜露に戻って喉を落ちた。筒は沼へ返した。", "さて。", "これで、俺がここにいた証拠は、俺だけになった。", "隠れ場所には困らなかった。", "人の目が届くのは、沼の表面までだ。泥の中に潜り、細く固めた管を水面すれすれまで伸ばして、息をする。泥が目に入っても、もう沁みることはない。", "そうやって、俺は少しずつ杭のほうへ近づいた。", "幸い、杭が打ってある辺りには巨大な岩山があった。向こうからこちらの様子を知るには、その岩山を登らなければならない。", "俺は巨大な岩の真下まで、ゆっくりと沼に沈みながら近づいた。そのまま、左側の岩が途切れて杭が向こうに見えるところまで、さらに進む。岩の向こうからかすかに、数人の話し声が聞こえてきた。", "ただ、顔を出すわけにはいかない。", "俺は岩陰から杭が確かめられるぎりぎりまで、体を隠しながら覗いてみた。", "煙の向こうに、杭と黒い人影が見えた。", "人だった。", "岩陰から見えるのは、一人だけだった。", "全身を、厚い革で覆っている。頭には、鳥の嘴のような面をつけていた。腰に剣。背中には、細い木の杭を何本も束ねて背負っている。", "人だ。本当に、人だ。", "俺は、岩肌に頬を押しつけたまま、瞬きも忘れていた。", "その人が、浅い泥の中に立つ、石の杭のそばにしゃがみこんだ。", "人の背丈ほどもある、太い石の柱だった。頭には鉄の輪がはめてあり、雨風にさらされて赤く錆びていた。", "面の下から、結んだ銀色の髪がひと房、背中へこぼれていた。灰色の煙の中で、そこだけが淡く光って見えた。", "その人は、杭の根もとを確かめてから、立ち上がった。そこから沼の外へ、乾いた土のほうへ向かって、一歩、また一歩と、ゆっくり歩き出した。", "歩きながら、指を一本ずつ折っている。", "歩幅を数えているのだ。", "十を数えて、指が全部折れた。それを、もう一度。", "泥が切れて、土が乾いた所で、その人は足を止めた。", "「杭より二十歩、沼が出てる」", "声だった。", "三年ぶりに聞く、自分以外の声だった。体が、勝手に震えた。", "低い女の声だった。面を通して、くぐもっている。", "右奥の少し離れた所から、男の声がした。", "「また広がったのか。この前は十五だったろう」", "右手の岩壁の向こうにも、人がいる。一人ではなかった。", "「十日で五歩。領主様には、そのまま報告する」", "女は、再確認するために、再び杭まで歩数を数えながら戻ってきた。そして腰の袋から帳面のようなものを出して、何かを書きつけた。", "言葉が、分かった。", "聞いたことのない音のはずなのに、耳に入った瞬間に意味になる。願いに入れた覚えはない。あの白い場所からの、おまけだろうか。だとしたら、会話の無い俺には、今まで一度も使い道がなかったことになる。", "岩壁の向こうで、木を打つ鈍い音がした。新しい杭を打ちこんでいるのだろう。別の足音が、泥を踏んで行ったり来たりしている。", "声と足音を数えると、三人か、四人。", "誰も、ほとんど無駄口をきかなかった。測って、書いて、打って、確かめる。見えない所からも、慣れた仕事の音だけが聞こえてくる。", "岩陰で、俺だけが息を詰めていた。", "煙の色が変わったのにも気づかなかった。日が傾いて、銀色の髪が見えなくなるまで、俺は一度も目を離さなかった。", "足音が、すっかり聞こえなくなった。", "俺もそれ以上は深入りせず、巨大な岩の下、目立たない所に足場を固め、小さい拠点を作って体を休めた。", "*", "彼らは、十日に一度やって来た。", "人数はいつも三人か四人。俺はそのたびに同じ岩陰へ回り、息を殺して覗き、聞き続けた。", "彼らを観察し始めて、ずいぶん多くのことが分かった。", "ここは「死の沼地」と呼ばれていること。最寄りの街はハーレンといい、馬で丸一日の距離にあること。領主の命令で、街の兵が沼の広がりを調べに来ていること。", "この沼が少しずつ広がっていること。去年は、東の村が一つ、井戸をやられて捨てられたこと。", "踏み込んで、戻った者はいないこと。", "杭が二通りあることも分かった。", "背負ってくる細い木の杭は、その日の沼の端に打つ目印だ。沼が広がれば、すぐに呑まれてしまう。測る時に基準にするのは、石の杭のほうだった。", "その石の杭を、新しく一本立てる日もあった。", "一番大柄な男が、人の背丈ほどもある石の柱を肩に担いで、岩陰から見える所を横切っていった。腕で抱えるほどの太さがある。先は鉄で包んで尖らせてあり、頭には鉄の輪がはめてあった。", "男は柱を、沼から離れた所に立てた。それから、大きな鉄の槌を振り上げた。", "ずしん、と腹に響く音がした。岩陰にいる俺の足もとまで、泥が震えた。", "ずしん。ずしん。", "ぬかるんだ地面に、石の柱が少しずつ沈んでいく。二十も打った頃、急に沈まなくなった。下のさらに固い地面にまで届いたのだ。それでも男は、さらに十ほど打ちこんだ。柱は、半分近くが土の中に消えていた。", "男は柱の頭に手をかけて、力いっぱい揺すった。びくともしなかった。", "「これで、また何年かはもつ」", "彼らが去った後、その杭まで行ってみた。", "柱の頭には、四十一、と数字が刻まれていた。", "*", "「そういえば、このあたりの街道も物騒になったみたいだな」", "別の日、その大柄な男が言った。", "「追い剥ぎか」", "「身ぐるみ剥がされて放り出された商人が、先月だけで二人だ。ひどい話さ」", "追い剥ぎ。", "岩陰で、俺は少し考えた。", "この沼から、人の中へ出ていく方法を。", "そして四度目の訪問で、俺は別のことにも気づいた。", "一番若い隊員が、トマと呼ばれていた。背丈はあるが、声がまだ少年に近い。その彼が、作業の合間に何度も咳をしている。", "こん、こん、と短く、乾いた咳だった。", "「トマ、面の布を替えたか」", "低い声の女が言った。周りからは、リゼ副長と呼ばれている。", "「替えました。大丈夫です」", "「大丈夫な奴の咳じゃない」", "「今朝も薬草は入れました。リゼさんこそ、昨日も寝てないでしょう」", "「いいから、杭を打ったら下がれ」", "咳は止まらなかった。", "俺は聞いていた。", "音が浅い。胸の奥ではなく、もっと手前で鳴っている。息を吐ききる前に咳が出る。肺の奥はまだ無事だが、気道の壁が荒れ始めている。そのまま沼へ通い続ければ、一年、いや半年で、あの咳はもっと深いところから鳴り始めるだろう。", "面の中の薬草は、たぶん見当違いだ。匂いをごまかしているだけで、毒は止まっていない。", "布を水で濡らして、炭を挟むだけでも、ずっとましになる。", "たったそれだけのことを、俺は知っている。", "三年間、毒を調べ続けてきた。百を超える毒を、自分の体で確かめてきた。その全部が、今は泥の底に溶けて、誰の役にも立っていない。", "その時、", "咳の音にまぎれて、俺の腹がかすかに鳴った。", "そういえば今日はまだ、毒を食べていない。", "毒を食べられるようになってから、一日も欠かさなかったことだった。岩陰で人の声を聞いているうちに、すっかり忘れていた。", "湯気の立つ食卓。", "「熱いから、気をつけて」という、あの声も、また聞こえた気がした。", "「……そろそろ、行ってもいい頃合いか」", "泡がひとつ、音を立てて割れた。", "*", "ただ、沼から歩いて出ていくわけにはいかない。毒の沼の奥から平気な顔で出てきた男を、誰が人として迎えるだろう。", "追い剥ぎの話を思い出した。身ぐるみ剥がされて、街道に放り出された商人。", "俺も、その一人になればいい。", "追い剥ぎに襲われ、逃げるうちに沼へ迷い込んで、死にかけている男。そういう男なら、彼らはきっと助けて、街まで連れていってくれる。", "準備には、十日あれば足りた。", "旅人として倒れているなら、まず見た目だ。", "髪と髭を石の刃で切り、三年分の長さを落とした。切り口はわざと不揃いにする。", "次に、毒沼の岩に張り付いている黄色い硫黄を指で練り、顔と腕にすり込んだ。白目の端にも、ごく薄く。毒にやられた人間の肌は、よく知っている。なにしろ、毒沼に放り出されたばかりの俺が、そうだった。", "皮肉な話だった。", "本物の毒をいくら飲んでも、俺の体はもう黄色くならない。肌に症状を描くしかない。死にかけの人間の真似を、死にかけ続けた本人が、絵の具でやっている。", "服は、ある日トマが落としていった布切れを、腰に巻いた。追い剥ぎに身ぐるみ剥がされた男なら、これで十分だ。", "息の仕方にも、気を配った。", "毒にやられた人間は、浅く、速く息をする。吸う時に肩が上がる。喉の奥で、かすかに音が鳴る。沼の奥で何度も練習した。トマの咳も真似た。誰もいない沼の真ん中で、半日も咳の練習をしている男というのは、なかなかの絵だと思う。", "話も決めた。街道で追い剥ぎに襲われ、全部奪われて、逃げるうちに沼へ迷い込んだ。入ったばかりで、何も見ていない。", "千四十日目の朝だった。", "印はもう、どこにも刻まなかった。頭の中で数えるだけだ。", "沼の奥を、一度だけ振り返った。煙の向こうに、黒い湖は見えない。", "全部食ってやると言ったが、結局、一番奥の一滴は食えなかった。", "「また来る」", "沼の先端から百歩ほど奥に進んだあたりの、泥が浅くなっている所に決めた。彼らの目に入り、しかも向こうから助けに来られる距離だ。遠すぎれば見捨てられる。", "俺は泥の上にうつ伏せになり、片腕を前へ伸ばした。必死に這ってきて、力尽きたように。", "頬に泥が冷たい。", "毒沼に放り出された日にも、こうして倒れていたのを思い出した。あの時は、演技をする元気などなかったが。", "三つ目の願いは、まだ残っている。", "使うなら今かもしれない、とは少しも思わなかった。", "遠くで、杭を打つ音がした。", "こん、こん、と乾いた咳が混じる。", "俺は、肩を上げて浅く息を吸った。喉の奥を、かすかに鳴らす。", "「……お、おい！」", "若い声だった。", "「副長、あそこ！ 誰か倒れてます！」", "「馬鹿を言うな、こんな所に人が――」", "声が、途切れた。", "泥を蹴る重い足音が、ゆっくりと、こちらへ近づいてくる。", "俺は、目を閉じた。"]}, {"n": 5, "title": "空気の味", "p": ["最初に届いたのは、革の匂いだった。", "足音が止まり、誰かが俺のそばに膝をついた。厚い手袋が顎をつかみ、顔を横へ向ける。親指がまぶたを押し上げた。", "薄目の先に、鳥の嘴があった。", "「息はある」", "低い女の声だった。岩越しに何度も聞いた声が、今は手を伸ばせば届く所にある。", "「嘘だろ……本当に人かよ」", "重い足音の男が言った。", "「副長、この人、面をしてません」", "トマの声は震えていた。言い終わる前に、こん、と咳が混じる。", "「分かっている。肌が黄色い。毒はもう回っているな」", "硫黄は、うまく働いているらしい。俺は肩を上げて浅く息を吸い、喉の奥をかすかに鳴らした。", "「聞こえるか。どこから来た」", "唇を動かす。この世界で人へ向けて話すのは、これが初めてだった。ちゃんと言葉が出るのか、少しだけ怖かった。", "「……街道で……全部、取られて……」", "知らないはずの音が、俺の口から出ていた。あの白い場所のおまけは、話すほうにも効くらしい。", "「追い剥ぎか。ここまで逃げたのか」", "「……分からない……煙で、道が……」", "「名は」", "しまった。", "名前を、用意していなかった。", "十日もあったのに、そこだけがすっかり抜けていた。頭の中を探っても、自分の名前らしきものは見つからない。沼のどこかへ落としてきたのかもしれない。", "ただ、自分が何者だったのかだけは、残っていた。", "「……やく……」", "そこだけ、なぜかこの世界の音になって響いた。続きを言いかけて、俺は咳き込んだ。", "「ヤーク？」", "女は短く繰り返した。", "「珍しい名だ。ヤーク、死にたくなければ、しばらく黙っていろ。マルコ、担げ」", "ヤーク。", "悪くない、と思った。", "太い腕が腹の下に入り、体が持ち上がった。幅の広い大きな肩に、俺の腹が乗る。男が、おっ、と声を上げた。", "「こいつ、見た目より重いな」", "「骨が太いんだろう。急げ」", "揺れる視界の端を、杭が通り過ぎていった。十日ごとに眺め続けた杭だ。岩も見えた。その陰に、俺は十日ごとに身を潜めていた。", "煙が少しずつ薄くなる。", "足元の泥が乾いた土に変わり、土の色が濃くなっていく。", "馬が三頭、つないであった。どの馬も、鼻先を厚い革の面で覆われている。この世界で初めて見る、人以外の生き物だった。面の奥で、ぶるる、と鼻を鳴らしている。", "マルコの足が、止まった。", "「ここまで来りゃいいだろう」", "俺は地面に下ろされ、仰向けに寝かされた。三人が面を外す音がする。", "俺は、息を吸った。", "何の味もしなかった。", "おかしい、と思った。もう一度吸う。三年間、息には必ず味があった。鉄か、腐った卵か、焦げた髪か。喉を削り、舌に貼りつき、肺の底へ沈んでいくもの。それが息というものだった。", "今、俺の胸に入ってきたものは、冷たくて、薄くて、どこにも引っかからずに奥まで届いた。", "味がしない。", "ただ、かすかに、匂いがあった。湿った土と、青くて少し苦い何か。", "目を開けた。", "草だった。", "頬のすぐ横で、草が風に揺れていた。紫でも黒でもない。ひと筋ごとに違う緑で、葉の先に朝の露を載せている。その上に、空があった。濁ったスープの色ではない。どこまでも抜けていく、馬鹿みたいに青い空だった。", "どこかで、鳥が鳴いた。すぐ近くで、水の流れる音もしている。", "視界がにじんだ。", "肌の色は硫黄で塗った。息は沼で練習した。咳はトマの真似で、話は全部でたらめだ。今日の俺に、本物と呼べるものは一つもない。", "頬を伝っていくこれだけは、誰にも教わっていなかった。", "「……泣く元気があるなら、大丈夫だ」", "面を外した女が、俺を見下ろしていた。後ろでひとつに結んだ、銀色の髪。寝不足の目。思っていたより若い。", "俺は目を閉じて、死にかけの男に戻った。", "「トマ、水だ。泥を落としてやれ」", "副長の声がした。", "馬の背から、小さな樽が一つ下ろされた。そばを流れる川から汲んできた水で、沼から戻るたびに、長靴や手袋についた毒を洗い流しているらしい。三人は、まず自分の長靴に柄杓で水をかけた。それから革の手袋を外して、手を洗った。", "それが済むと、トマが布を樽の水にひたして、俺のそばにしゃがみこんだ。", "「冷たいですけど、我慢してくださいね」", "濡れた布が、足に触れた。", "冷たかった。けれど、嫌な冷たさではなかった。", "トマは、足の指の間から、すね、膝へと、泥を拭い取っていった。布はすぐに真っ黒になる。樽の水でゆすいでは、また拭く。三年分の泥は、なかなか落ちなかった。", "布が、腕に来た。", "俺は、息を詰めた。", "腕には、硫黄をすり込んである。", "トマが布をゆすぐと、桶の水に、うっすらと黄色が混じった。", "「うわ、黄色い泥まで。沼の縁には、こういうのも多いですからね」", "トマは気にした様子もなく、また布を絞った。", "布が、顔に近づいた時だった。", "「顔はいい。目に入ったら、かえって毒だ。街の薬師に任せろ」", "副長だった。", "トマは「はい」と言って、布を引っこめた。", "俺は、浅い息のまま、そっと目を閉じた。", "体を拭き終えると、副長が、畳んだ服を俺の胸の上に置いた。", "「隊の替えだ。腰の布切れ一枚では、街の門はくぐれない。着いたら返せ」", "生成りのシャツと、膝の薄くなった麻のズボンだった。トマが、袖を通すのを手伝ってくれた。袖は手首より少し短く、ズボンの裾も足首の上で止まった。", "それでも、この世界では初めて着る、人の服だった。", "布というものが、こんなに柔らかいとは知らなかった。", "街までは馬で丸一日かかる。今日は動かせないと副長が言い、馬を引いて風上の林の縁まで移り、その夜は、そこで野営になった。", "俺は火のそばに寝かされ、苦い薬草の煎じ汁を飲まされた。六十七番に比べれば水のようなものだったが、礼儀として顔をしかめた。", "火の向こうでは、マルコが鍋をかき回していた。", "面の下は、日に焼けた、人のよさそうな顔だった。腕まくりをすると、丸太のような腕が出てきた。その太い指で、拳ほどの玉ねぎを革の上で器用に刻んでいる。薄く切った玉ねぎが鍋の底の脂に落ちると、じゅっ、と音がした。", "俺は、薄目を開けた。", "玉ねぎの色が透き通り、ゆっくりと色づいていく。そこへ、細く裂いた干し肉と、ひとつかみの麦が入った。水が注がれ、鍋の底から小さな泡が上がり始める。", "匂いが、風に乗って届いた。", "焦げる寸前の玉ねぎの、甘い匂い。肉の脂の匂い。その奥に、麦の煮える、乳に似た匂いがある。", "喉が、勝手に動いた。上半身がいつの間にか起き上がっていた。", "腹が減っているわけではない。今朝も沼の苔で満たしてきた。それなのに、舌の根から唾が湧いてきて止まらない。", "「起きてるなら、食え。食えなきゃ死ぬぞ」", "マルコが木の椀を持ってきて、俺の背を太い腕で支えた。", "「俺の生まれた村の麦じゃねえのが悔しいがな。故郷の麦はな、もっとこう、甘いんだ」", "「マルコ、その話は百回聞いた」", "トマが笑い、また咳をした。", "両手に、椀を受け取った。", "熱かった。", "木を通して、熱が掌の皮へじんわりと染みてくる。三年間、俺の手が持ったものは、冷たいか、焼けただれるかのどちらかだった。ただ温かいというものを、すっかり忘れていた。", "湯気が顎に当たり、頬を湿らせて、鼻の奥へ入ってくる。", "椀の中で、ふくらんだ麦が揺れていた。薄い脂の玉が、火の色を映していくつも浮いている。", "口元へ運びかけて、俺は手を止めた。", "何か、あった気がした。", "食べる前に言う言葉が、あったはずだ。短い言葉だ。毎日、何も考えずに言っていた。どんな言葉だったか。", "思い出せなかった。", "さじを入れて、すくい、口へ入れた。", "まず、熱さが来た。舌の先がひりつき、思わず息を吸う。次に塩が来た。それから、玉ねぎの甘さが、塩の後ろからゆっくりと広がった。とろけた玉ねぎは噛む前に崩れ、麦の粒は歯の間でぷつりと潰れて、中からほのかな甘みをこぼした。干し肉を奥歯で噛むと、煮汁を吸った繊維がほどけ、脂と旨みが舌の両側へ流れていった。", "飲み込む。", "熱い塊が喉を落ちていき、胸の真ん中を通って、腹の底で広がった。", "どこも、痛まなかった。", "舌は痺れず、胃は裏返らなかった。手足の先は冷たくならず、心臓はただ静かに打っている。", "俺が三年間「うまい」と呼んできたものは、何だったのだろう。", "沼では、鉄と硫黄、腐肉の味を噛みしめて、腹が満ちたことに満足していた。それを、うまいと思っていた。", "さじが、止まらなくなった。", "すくう。口へ入れる。熱い。甘い。噛む。また、すくう。", "「おお、いい食いっぷりだ！」", "マルコが笑った。", "さじが、椀の底を鳴らした。", "顔を上げると、火の向こうから、副長がこちらを見ていた。", "何も言っていない。ただ、見ている。", "血の気が引いた。", "毒の回った人間は、物を食えない。胃が受けつけない。毒沼に放り出されたばかりの俺なら、ひと口で吐いている。そんなことは、この世界の誰より俺がよく知っている。", "俺はさじを置き、ひどく咳き込んで、椀を膝へ下ろした。", "「……すみません……もう……」", "椀の中には、まだ半分残っていた。", "「無理するな。腹に入っただけ上等だ」", "マルコが椀を取り上げ、鍋のそばへ戻した。", "九日間の飢えよりも、三十一番よりも、つらかったかもしれない。俺は火のそばに横たわり、残り半分の椀が遠ざかるのを、口惜しい思いで見ていた。", "夜が更けた。", "見張りはトマの番だった。薪のそばに座り、口元を押さえて、こん、こん、と咳を噛み殺している。", "濡らした布と、炭。", "言わないつもりだった。何も知らない旅人のふりをすると決めていた。ただの追い剥ぎの被害者でいるつもりだった。", "こん、こん。", "「……布を」", "俺の声に、トマが振り向いた。", "「え？」", "「面の布を、濡らすといい。間に、炭を砕いて挟むんだ。薬草より、そのほうが……効く」", "トマは目を丸くして、それから笑った。少年の顔だった。", "「詳しいんですね」", "「昔……薬師の所に、少し……」", "「やってみます。あ、僕、トマです。ヤークさんを見つけたの、僕なんですよ」", "自慢げに胸を張ってから、また咳をした。", "余計なことをした、と思った。不思議と、悔いはなかった。", "トマが薪を取りに立つと、入れ替わるように、誰かが俺の横へ腰を下ろした。", "副長だった。リゼという名前を、俺はまだ知らないことになっている。", "「眠れないか」", "答える前に、手首をつかまれた。革の手袋を外した、乾いた細い指だった。指先が脈の上に置かれる。", "俺は、息を止めそうになった。", "息は練習した。咳も練習した。肌も塗った。", "脈はどうしようもない。", "どくん。どくん。どくん。", "律儀なやつが、いつもの調子で、ゆったりと力強く打っている。三年間、一度も頼んだことのない仕事を、今夜も真面目にこなしている。", "百も数えただろうか。リゼの指が離れた。", "彼女は火を見たまま、しばらく何も言わなかった。", "「私の父は、沼の毒で死んだ」", "それだけ言って、立ち上がった。", "「明日には街だ。薬師に診せる。しっかり休んでおけ」", "足音が遠ざかっていった。", "俺は仰向けのまま、枝の隙間を見上げた。", "星が出ていた。", "この世界で、星を見るのは初めてだった。沼の空は、いつも煙に塞がれていた。", "知っている形は、一つもない。", "それなのに、なぜか懐かしかった。誰かと並んで、こうして見上げたことがあった気がする。誰とだったのかは、思い出せなかった。", "翌朝、馬の支度をしていたマルコが、俺の胸の上に何かを放った。", "木のさじだった。", "ゆうべのさじだ。柄の先がすり減って丸くなり、木の肌に麦の匂いが染みている。柄の穴には、細い革紐が通してあった。", "「やる。替えならある」", "「……どうして」", "「お前ほどうまそうに食う奴は、初めて見た。飯係をやってて、あれが一番うれしいんだ」", "マルコは歯を見せて笑い、鍋を背負い直した。", "「首から下げとけ。次は残さず、それで全部食え。だから死ぬなよ」", "俺は、さじを握った。", "沼からは、何ひとつ持ち出さなかった。腰の布切れは、落とし物を拾っただけだ。", "人から何かをもらったのは、この世界で初めてだった。", "その日の夕方、マルコの馬の上で、俺はその街を見た。", "丘を越えた先の、灰色の石壁。その向こうに、屋根がいくつも重なっている。数えきれないほどの煙突から、細い煙が立ちのぼっていた。", "毒の煙ではない。", "夕飯の煙だ。", "風が変わり、匂いが丘を上ってきた。薪と、焼けた小麦。どこかの家で肉を焼く脂の匂い。あの一本一本の煙の下に鍋があり、火があり、誰かが腹を空かせて待っている。", "湯気の立つ食卓は、本当にこの世にあった。", "マルコの太い腕の間で、俺は目を閉じ、弱々しく息をした。", "三つ目の願いは、まだ使っていない。", "ゆうべの半分が、今も舌に残っている。あの麦のことを思うだけで、唾が湧く。あんなにうまいものを、俺は知らなかった。", "腹が、ぐう、と鳴った。", "いつもの声だった。沼で聞いたのと同じ、低い声だった。", "「お、腹が鳴るなら助かるぞ、お前」", "頭の上で、マルコが腹を揺らして笑った。", "胸元で、木のさじが小さく揺れた。", "街の門が、ゆっくりと近づいてくる。"]}];

    if (v) { html += `<p class="voice" data-i="${k}">……${rb(v[1])}……</p>`; return; }
    const talk = /^[「『（(―\-]/.test(p);
    html += `<p class="${talk ? "" : "n"}" data-i="${k}">${rb(p)}</p>`;
  });
  $("art").innerHTML = html;
  const prev = EPS[i - 1], next = EPS[i + 1];
  $("nav").innerHTML =
    (prev ? `<button type="button" data-go="${prev.n}"><small>前の話</small><span>第${prev.n}話　${esc(prev.title)}</span></button>` : "") +
    (next ? `<button type="button" class="next" data-go="${next.n}"><small>次の話</small><span>第${next.n}話　${esc(next.title)}</span></button>`
          : `<div class="more"><p class="more-lead">無料で読めるのは、ここまでです。</p><a class="more-btn" href="https://note.com/note_koichi_note" target="_blank" rel="noopener">続きを note で読む</a></div>` + castHTML());
  $("nav").querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(+b.dataset.go, true)));
  $("where").textContent = `第${e.n}話　${e.title}`;
  $("chars").textContent = charCount(e).toLocaleString("ja-JP") + "字";
  document.title = "毒も薬もさじ加減！";
}

function go(n, fromTop) {
  if (!EPS.some(e => e.n === n)) n = EPS[0].n;
  if (tts.on && !tts.auto) stopRead();
  saveScroll();
  cur = n;
  render(n);
  read.add(n); store.set("read", [...read]);
  store.set("cur", n);
  markList();
  if (location.hash !== "#ep-" + n) history.replaceState(null, "", "#ep-" + n);
  const y = fromTop ? 0 : store.get("y:" + n, 0);
  requestAnimationFrame(() => { col.scrollTop = y; updateProgress(); });
}

const col = $("col");
function saveScroll() { if (cur !== null) store.set("y:" + cur, Math.round(col.scrollTop)); }
function updateProgress() {
  const h = col.scrollHeight - col.clientHeight;
  $("progress").style.width = (h > 0 ? Math.min(100, col.scrollTop / h * 100) : 0) + "%";
}
let t = null;
col.addEventListener("scroll", () => { updateProgress(); clearTimeout(t); t = setTimeout(saveScroll, 250); }, { passive: true });

function openToc() { document.body.classList.add("open"); }
function closeToc() { document.body.classList.remove("open"); }
$("tocBtn").addEventListener("click", openToc);
$("castOpen").addEventListener("click", () => { closeToc(); openCast(0); });
$("scrim").addEventListener("click", closeToc);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeToc(); });
$("smaller").addEventListener("click", () => { size = Math.max(14, size - 1); applySize(); store.set("size", size); });
$("bigger").addEventListener("click", () => { size = Math.min(26, size + 1); applySize(); store.set("size", size); });

// ── 読み上げ（端末に入っている日本語の声を使う。段落ごとに色を付けて追いかける）──
const tts = { on: false, auto: false, gen: 0, u: null, lock: null, rates: [0.8, 1.0, 1.2, 1.4, 1.6], rate: store.get("rate", 1.0) };
const HAS_TTS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
function jaVoice() {
  const vs = HAS_TTS ? speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang)) : [];
  return vs.find(v => /Google/i.test(v.name)) || vs.find(v => /Nanami|Haruka|Kyoko|O-?ren|Ayumi/i.test(v.name)) || vs[0] || null;
}
if (HAS_TTS) speechSynthesis.getVoices();
// ふりがなは読みのほうを声にする。《》の心の声はそのまま読む
function sayText(p) { return p.replace(/^《([\s\S]*)》$/, "$1").replace(/｜([^｜（]+)（([^）]+)）/g, "$2").replace(/[―─]+/g, "、"); }
function splitSentences(s) { return (s.match(/[^。！？!?]+[。！？!?」』）)]*|[。！？!?」』）)]+/g) || [s]).map(x => x.trim()).filter(Boolean); }
function setReadBtn() {
  $("readBtn").setAttribute("aria-pressed", tts.on ? "true" : "false");
  $("readBtn").textContent = tts.on ? "■ 止める" : "▶ 読む";
  $("rateBtn").textContent = "×" + tts.rate.toFixed(1);
}
function clearHi() { $("art").querySelectorAll("p.speaking").forEach(p => p.classList.remove("speaking")); }
function paraEls() { return [...$("art").querySelectorAll("p[data-i]")]; }
function firstVisible() {
  const top = col.getBoundingClientRect().top + 60;
  for (const p of paraEls()) if (p.getBoundingClientRect().bottom > top) return +p.dataset.i;
  return 0;
}
function say(text, gen, done) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP"; u.rate = tts.rate;
  const v = jaVoice(); if (v) u.voice = v;
  let fired = false;
  const next = () => { if (fired) return; fired = true; if (gen === tts.gen && tts.on) done(); };
  u.onend = next; u.onerror = next;
  tts.u = u;                      // 参照を持っておかないと途中で止まる端末がある
  speechSynthesis.speak(u);
}
function sayAll(list, gen, done) {
  let k = 0;
  const step = () => { if (k >= list.length) return done(); say(list[k++], gen, step); };
  step();
}
function readFrom(i, withTitle) {
  const gen = ++tts.gen;
  // 何も読んでいない時に cancel するとスマホで最初の声が消えることがある
  if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
  const e = EPS.find(x => x.n === cur);
  const el = paraEls().find(p => +p.dataset.i >= i);
  if (!el) {                      // この話を読み終えた→次の話へ続ける
    clearHi();
    const j = EPS.findIndex(x => x.n === cur);
    const nx = EPS[j + 1];
    if (!nx) { stopRead(); return; }
    tts.auto = true; go(nx.n, true); tts.auto = false;
    setTimeout(() => { if (gen + 0 === tts.gen && tts.on) readFrom(0, true); }, 600);
    return;
  }
  const k = +el.dataset.i;
  clearHi(); el.classList.add("speaking");
  el.scrollIntoView({ block: "center", behavior: "smooth" });
  const list = splitSentences(sayText(e.p[k]));
  if (withTitle) list.unshift(`第${e.n}話。${e.title}。`);
  sayAll(list, gen, () => {
    // 場面の切れ目（＊）をまたぐ時は少し長めに間をあける
    let m = k + 1, pause = 250;
    while (m < e.p.length && (e.p[m] === "*" || e.p[m] === "_gap")) { pause = e.p[m] === "*" ? 1100 : Math.max(pause, 600); m++; }
    setTimeout(() => { if (gen === tts.gen && tts.on) readFrom(m); }, pause);
  });
}
// 知らせは本文の上に帯で出す（バーの中だと狭いスマホで切れて読めない）。タップで消える
function note(msg) {
  let w = $("ttsNote");
  if (!w) {
    w = document.createElement("div"); w.id = "ttsNote";
    w.style.cssText = "position:fixed;left:12px;right:12px;top:calc(56px + env(safe-area-inset-top,0px));z-index:50;background:var(--accent);color:var(--paper);padding:12px 14px;border-radius:8px;font-size:15px;line-height:1.6;box-shadow:0 4px 16px var(--shadow)";
    w.addEventListener("click", () => w.remove());
    document.body.appendChild(w);
  }
  w.textContent = msg;
  clearTimeout(note.t); note.t = setTimeout(() => w.remove(), 15000);
}
function startRead() {
  if (!HAS_TTS) { note("このアプリの中では声が出せません。Chromeで開いてください"); return; }
  tts.on = true; setReadBtn();
  // スマホはボタンを押したその場で speak しないと声が出ない（await を先にはさまない）
  if (speechSynthesis.paused) speechSynthesis.resume();
  const atTop = col.scrollTop < 80;
  readFrom(atTop ? 0 : firstVisible(), atTop);
  if (navigator.wakeLock) navigator.wakeLock.request("screen").then(l => tts.lock = l).catch(() => {});
  // 3秒たっても声が出ていなければ知らせる
  const g = tts.gen;
  setTimeout(() => {
    if (!tts.on || g !== tts.gen || speechSynthesis.speaking) return;
    const n = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang)).length;
    note(n ? "声が出ません。音量とマナーモードを確かめてください" : "日本語の声が見つかりません。Chromeで開いてください");
  }, 3000);
}
function stopRead() {
  tts.on = false; tts.gen++;
  if (HAS_TTS) speechSynthesis.cancel();
  clearHi(); setReadBtn();
  try { if (tts.lock) tts.lock.release(); } catch (e) {} tts.lock = null;
}
$("readBtn").addEventListener("click", () => tts.on ? stopRead() : startRead());
$("rateBtn").addEventListener("click", () => {
  const r = tts.rates; tts.rate = r[(r.indexOf(tts.rate) + 1) % r.length] ?? 1.0;
  store.set("rate", tts.rate); setReadBtn();
  if (tts.on) { const p = $("art").querySelector("p.speaking"); readFrom(p ? +p.dataset.i : firstVisible()); }
});
// 読んでいる最中に段落をタップすると、そこから読み直す
$("art").addEventListener("click", ev => {
  if (!tts.on) return;
  const p = ev.target.closest("p[data-i]");
  if (p) readFrom(+p.dataset.i);
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && tts.on && !tts.lock && navigator.wakeLock) navigator.wakeLock.request("screen").then(l => tts.lock = l).catch(() => {}); });
setReadBtn();

function fromHash() { const m = location.hash.match(/^#ep-(\d+)$/); return m ? +m[1] : null; }
window.addEventListener("hashchange", () => { const n = fromHash(); if (n && n !== cur) go(n); });

buildList();
go(fromHash() || store.get("cur", 1));
</script>

</body>
</html>
