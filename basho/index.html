<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><!-- アプリ全体のピンチ拡縮禁止（地図のピンチはLeafletが自前処理なので影響なし・箱v2.9.33と同方式） -->
<meta name="theme-color" content="#EDEFE8">
<meta name="description" content="今いる場所をひと押しで登録。次からは名前を選ぶだけで地図が開きます。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="leaflet.css">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>場所帳</title>
<style>
  :root{
    --paper:#EDEFE8; --card:#F8F9F5; --ink:#1B2422; --soft:#5C6763;
    --line:#D5DACF; --route:#0B6E5F; --mark:#C99000; --danger:#A33A2A;
    --r:14px;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
    --gothic:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--gothic);color:var(--ink);background-color:var(--paper);
    background-image:
      repeating-linear-gradient(0deg,rgba(27,36,34,.045) 0 1px,transparent 1px 28px),
      repeating-linear-gradient(90deg,rgba(27,36,34,.045) 0 1px,transparent 1px 28px);
    min-height:100vh;padding-bottom:130px;font-size:16px;line-height:1.5;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}

  header{position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,var(--paper) 84%,rgba(237,239,232,0));
    padding-top:env(safe-area-inset-top)}
  .head-in{display:flex;align-items:baseline;gap:10px;padding:14px 0 8px}
  h1{font-family:var(--mincho);font-size:23px;font-weight:600;margin:0;letter-spacing:.14em}
  .tally{font-family:var(--mono);font-size:11px;color:var(--soft);letter-spacing:.08em}
  .sp{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--soft);
    border-radius:10px;padding:7px 9px;font-size:13px;font-family:var(--gothic);cursor:pointer;
    white-space:nowrap}
  /* head-inはbaseline揃え＝SVGだけのボタンは文字の底辺を持たず浮き上がる(v0.49.0実機)→
     ゼロ幅スペースで文字の底辺を与え、SVGはその行に沈めて重ねる(v0.49.1) */
  .iconbtn svg{display:inline-block;vertical-align:-4px;pointer-events:none}
  .searchrow{display:flex;gap:8px;padding-bottom:10px}
  #q{flex:1;min-width:0;font-family:var(--gothic);font-size:17px;padding:12px 14px;
    border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink)}
  #q:focus{outline:none;border-color:var(--route);box-shadow:0 0 0 3px rgba(11,110,95,.13)}
  #clearq{display:none}#clearq.on{display:block}
  .legend{display:flex;gap:7px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
  .legend::-webkit-scrollbar{display:none}
  .legend:empty{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:var(--card);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--soft);
    cursor:pointer;white-space:nowrap}
  .chip .dot{width:8px;height:8px;border-radius:50%}
  .chip.on{background:var(--ink);color:#F8F9F5;border-color:var(--ink)}
  .chip.fix{border-color:rgba(163,58,42,.45);color:var(--danger)}
  .chip.fix.on{background:var(--danger);color:#fff;border-color:var(--danger)}

  /* ホームタブ（一覧⇄本棚） */
  .hometabs{display:flex;gap:8px;padding:0 0 10px}
  .hometabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--soft);
    border-radius:12px;padding:9px 0;font-size:14px;font-family:var(--mincho);letter-spacing:.12em;cursor:pointer}
  .hometabs button.on{background:var(--ink);color:#F8F9F5;border-color:var(--ink);font-weight:600}
  /* 本棚: カテゴリ=本。左角は直角・右角は丸（表紙のフォルム）・左端に背表紙の色ライン */
  .shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 16px}
  .book{border:0;background:none;padding:0;cursor:pointer;font-family:inherit;color:inherit;
    text-align:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .book:active .bcover{transform:translateY(1px)}
  .bcover{position:relative;aspect-ratio:3/4;border-radius:4px 14px 14px 4px;overflow:hidden;
    background:var(--card);border:1px solid var(--line);
    box-shadow:2px 3px 9px rgba(27,36,34,.2)}
  .bcover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;
    background:var(--catcolor,#6B7280);z-index:2}
  .bcover::after{content:"";position:absolute;left:11px;top:0;bottom:0;width:2px;
    background:rgba(27,36,34,.14);z-index:2}   /* 表紙の折り目 */
  .bcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
  .bdefault{position:absolute;inset:0;
    background-image:linear-gradient(155deg,rgba(255,255,255,.24),rgba(255,255,255,0) 45%,rgba(0,0,0,.2))}
  /* 表紙のタイトル: 黒帯にカテゴリ名。長い名前は折り返さずフォント縮小で1行に収める（帯は横に伸びてよい） */
  .btitle{position:absolute;left:50%;top:15%;transform:translateX(-50%);max-width:95%;
    background:rgba(18,22,21,.85);color:#F8F9F5;font-family:var(--mincho);font-weight:600;
    font-size:16px;line-height:1.45;padding:7px 13px;border-radius:3px;letter-spacing:.1em;
    text-align:center;z-index:3;white-space:nowrap;overflow:hidden;box-sizing:border-box}
  .bcount{font-family:var(--mono);font-size:11px;color:var(--soft);margin-top:8px}
  .shelfhint{grid-column:1/-1;font-size:12px;color:var(--soft);text-align:center;padding:8px 0 0}

  .list{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    overflow:hidden;position:relative}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--catcolor,#6B7280)}
  .card::after{content:"";position:absolute;right:0;top:0;bottom:0;width:7px;background:var(--catcolor,#6B7280)}
  /* v0.36.0: 周辺ビューから戻ってきた場所のカードを一瞬だけ光らせる（どれのことか一目で分かるように） */
  .card.justcame,.tile.justcame,.row.justcame{animation:justcame 1.9s ease-out 1}
  @keyframes justcame{0%,55%{box-shadow:inset 0 0 0 3px var(--catcolor,#6B7280)}100%{box-shadow:inset 0 0 0 3px rgba(0,0,0,0)}}
  .card-main{padding:13px 44px 11px 18px;cursor:pointer;display:flex;align-items:center;gap:10px;
    width:100%;text-align:left;border:0;background:none;font-family:inherit;color:inherit}
  .card-main:active{background:rgba(11,110,95,.05)}
  .cm-text{flex:1;min-width:0}

  /* 写真ボックス（カード右・独立エリア）: 上=サムネ列(スワイプ) / 下=固定ボタン2つ */
  .phbox{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;width:150px}
  /* サムネ62px+隙間5px: 2枚(134px)フル表示+3枚目が16px(約1/4)右から顔を出す=続きがあると分かる */
  .phstrip{display:flex;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:none;
    overscroll-behavior-x:contain;padding:2px 0}
  .phstrip::-webkit-scrollbar{display:none}
  .ph{width:62px;height:62px;border-radius:8px;object-fit:cover;flex:0 0 auto;
    border:1px solid var(--line);background:#E3E6DE;cursor:pointer;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .phbtns{display:flex;gap:4px}
  .phbtns button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--soft);
    border-radius:8px;padding:6px 2px;font-size:11px;font-family:var(--gothic);
    cursor:pointer;white-space:nowrap}
  .phbtns button:active{background:rgba(11,110,95,.07)}

  /* 添付（URL・PDF）: サムネ列にはミニタイル、実体カードは写真の縦閲覧(pv)の中に並ぶ */
  .attile{display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;
    background-size:cover;background-position:center;cursor:pointer}
  .attile .abdg{position:absolute;right:2px;bottom:2px;font-size:11px;line-height:1;
    background:rgba(255,255,255,.88);border-radius:6px;padding:2px 3px;pointer-events:none}
  .pv-body .attcard{margin:0 0 14px}   /* 縦閲覧の中では写真と同じ縦リズムで並ぶ */
  .attcard{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;
    background:var(--card);padding:8px 10px;cursor:pointer;text-align:left;
    font-family:inherit;color:inherit;width:100%;box-sizing:border-box}
  .attcard:active{background:rgba(11,110,95,.05)}
  .atticon{flex:0 0 auto;width:46px;height:46px;border-radius:9px;border:1px solid var(--line);
    background:#F2F4EE center/cover no-repeat;display:flex;align-items:center;justify-content:center;
    font-size:22px;overflow:hidden}
  .atttxt{flex:1;min-width:0}
  .attt{font-size:13px;font-weight:700;line-height:1.35;overflow:hidden;display:-webkit-box;
    -webkit-line-clamp:1;-webkit-box-orient:vertical;word-break:break-all}
  .attd{font-size:11.5px;color:var(--soft);line-height:1.4;overflow:hidden;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
  .atth{font-family:var(--mono);font-size:10.5px;color:var(--soft);opacity:.85;margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 自前の注意ダイアログ（標準alertの「◯◯の内容」ヘッダー回避） */
  .dlg{position:fixed;inset:0;z-index:76;background:rgba(27,36,34,.45);display:none;
    align-items:center;justify-content:center;padding:24px}
  .dlg.on{display:flex}
  .dlg-box{background:var(--card);border-radius:14px;max-width:340px;width:100%;
    padding:18px 18px 14px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .dlg-t{font-weight:700;font-size:16px;margin-bottom:8px;color:var(--danger)}
  .dlg-m{font-size:13.5px;line-height:1.75;color:var(--ink);white-space:pre-line}
  .dlg-btns{display:flex;gap:8px;margin-top:15px;justify-content:flex-end}
  .dlg-btns button{border:1px solid var(--line);background:var(--card);border-radius:10px;
    padding:10px 18px;font-size:13.5px;font-family:var(--gothic);cursor:pointer;color:var(--ink)}
  .dlg-btns button.pri{background:var(--route);border-color:var(--route);color:#fff;font-weight:700}

  /* ライトボックス */
  .lb{position:fixed;inset:0;background:rgba(10,14,13,.93);z-index:70;display:none;
    align-items:center;justify-content:center}
  .lb.on{display:flex}
  .lb img{max-width:96vw;max-height:92vh;object-fit:contain;border-radius:6px}
  .lbnav{position:fixed;top:50%;transform:translateY(-50%);border:0;background:rgba(0,0,0,.35);
    color:#fff;font-size:44px;font-weight:700;line-height:1;padding:22px 16px;border-radius:14px;cursor:pointer;
    text-shadow:0 0 4px #000,0 2px 6px rgba(0,0,0,.9);box-shadow:0 2px 10px rgba(0,0,0,.4)}
  .lbnav:active{background:rgba(0,0,0,.55)}
  /* 写真の縦閲覧: カードの写真を縦に連ねてスクロール（ループなし・一番下で止まる）。
     背景=そのカードのカテゴリ色のパステル。ヘッダー固定=どれだけ下がっても左上の←で戻れる */
  .pv{position:fixed;inset:0;z-index:58;display:none;overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;--pvc:#EDEFE8;--pvh:#DDE2D8;background:var(--pvc)}
  .pv.on{display:block}
  html.pvon,html.pvon body{overflow:hidden}   /* 背面の一覧をスクロールさせない */
  .pv-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;
    padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--pvh);
    border-bottom:1px solid rgba(27,36,34,.12)}
  .pv-back{border:0;background:transparent;font-size:25px;line-height:1;padding:6px 12px;
    cursor:pointer;color:var(--ink);font-family:var(--gothic)}
  .pv-title{font-size:16px;font-weight:700;color:var(--ink);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .pv-cnt{font-family:var(--mono);font-size:11px;color:rgba(27,36,34,.55);margin-left:auto;
    padding-right:6px;flex:0 0 auto}
  .pv-body{padding:14px 12px calc(34px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
  .pv-body img{display:block;width:100%;border-radius:10px;margin:0 0 14px;cursor:pointer;
    background:rgba(255,255,255,.45)}
  .lbc{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;
    color:#F8F9F5;font-family:var(--mono);font-size:12px;letter-spacing:.1em}
  .cat{font-size:11px;letter-spacing:.1em;color:var(--catcolor,#6B7280);font-weight:700}
  .preftag{color:var(--soft);font-weight:400}
  .name{font-family:var(--mincho);font-size:21px;font-weight:600;margin:2px 0 3px;line-height:1.35}
  .sub{font-size:12.5px;color:var(--soft);word-break:break-all}
  /* 電話番号が入っているカードだけ、その行の右端に☎（タップで発信）。
     住所が無いカードでは名前のすぐ下の行になる */
  .metarow{display:flex;align-items:center;gap:8px;margin-top:5px}
  .metarow .pill{margin-top:0}
  .metarow .telmk{margin-left:auto}
  .telmk{flex:0 0 auto;border:1.5px solid var(--line);background:var(--paper);color:var(--route);
    border-radius:999px;padding:2px 10px;font-size:15px;line-height:1.35;cursor:pointer}
  .telmk:active{background:rgba(27,36,34,.06)}
  .pill{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;
    border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-top:5px;color:var(--soft)}
  .pill.warn{border-color:rgba(163,58,42,.4);color:var(--danger)}
  .star{position:absolute;right:6px;top:4px;border:0;background:none;font-size:20px;line-height:1;
    padding:8px;cursor:pointer;color:#C8CEC4}
  .star.on{color:var(--mark)}
  .actions{display:flex;border-top:1px solid var(--line)}
  .actions button{flex:1;border:0;border-left:1px solid var(--line);background:none;
    font-family:var(--gothic);font-size:13px;color:var(--soft);padding:11px 4px;cursor:pointer}
  .actions button:first-child{border-left:0;color:var(--route);font-weight:700}
  .actions button:active{background:rgba(27,36,34,.05)}
  /* 赤=このボタンが頼る位置情報が未確定（正確なピンが無い）。白=問題なく動く */
  .actions button.warn{color:var(--danger);background:rgba(163,58,42,.06)}

  .empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:34px 20px;
    text-align:center;color:var(--soft);font-size:14px}
  .empty b{display:block;font-family:var(--mincho);font-size:19px;color:var(--ink);
    margin-bottom:8px;font-weight:600}

  /* 下段FAB三点配置: 左=足あと / 真ん中=📍近く(正円) / 右=ここを登録。左右は同じ大きさ・同じ形 */
  .fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;
    width:calc(50vw - 56px);max-width:180px;height:64px;padding:0 6px;
    background:var(--route);color:#fff;border:0;border-radius:999px;
    font-size:15px;font-family:var(--gothic);font-weight:700;
    box-shadow:0 6px 20px rgba(11,110,95,.34);cursor:pointer}
  .fab small{display:block;font-size:10px;font-weight:400;opacity:.85;letter-spacing:.02em;white-space:nowrap}

  .veil.abovepv{z-index:62}   /* 縦閲覧(pv z58)の上で開く添付メニュー用 */
  .veil{position:fixed;inset:0;background:rgba(27,36,34,.42);z-index:40;display:none;
    align-items:flex-end;justify-content:center}
  .veil.on{display:flex}
  .sheet{background:var(--paper);width:100%;max-width:760px;max-height:92vh;overflow-y:auto;
    border-radius:18px 18px 0 0;padding:18px 16px calc(26px + env(safe-area-inset-bottom))}
  .sheet h2{font-family:var(--mincho);font-size:19px;margin:0 0 6px;letter-spacing:.08em;font-weight:600}
  label{display:block;font-size:12px;color:var(--soft);margin:14px 0 5px;letter-spacing:.04em}
  input[type=text],input[type=tel],textarea,select{width:100%;font-family:var(--gothic);font-size:16px;
    padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  textarea{min-height:60px;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--route)}
  .two{display:flex;gap:8px}.two>*{flex:1;min-width:0}
  .hint{font-size:11.5px;color:var(--soft);margin-top:5px;line-height:1.5}
  .gps{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;font-size:13px;color:var(--soft);margin-top:4px}
  .gps.ok{border-color:rgba(11,110,95,.5);color:var(--route)}
  .gps.ng{border-color:rgba(163,58,42,.4);color:var(--danger)}
  .gps .mono{font-family:var(--mono);font-size:11px;margin-left:auto}
  details{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
  summary{font-size:13px;color:var(--route);cursor:pointer;padding:6px 0;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"＋ ";font-weight:700}
  details[open] summary::before{content:"− "}
  .sheet-actions{display:flex;gap:8px;margin-top:20px}
  .btn{flex:1;padding:14px;border-radius:12px;font-family:var(--gothic);font-size:15px;
    border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .btn.primary{background:var(--route);border-color:var(--route);color:#fff;font-weight:700}
  .btn.del{border-color:rgba(163,58,42,.4);color:var(--danger);flex:0 0 auto;padding:14px 18px}
  .subbtn{border:1px solid var(--line);background:var(--card);color:var(--route);border-radius:10px;
    padding:9px 12px;font-size:13px;font-family:var(--gothic);cursor:pointer;margin-top:8px}
  .menu-item{display:block;width:100%;text-align:left;padding:15px 8px;border:0;
    border-bottom:1px solid var(--line);background:none;font-family:var(--gothic);font-size:15px;
    color:var(--ink);cursor:pointer}
  .catrow{display:flex;align-items:center;gap:10px;margin:9px 0}
  .catrow input{flex:1;min-width:0;margin:0}
  .catdot{width:32px;height:32px;border-radius:50%;border:2px solid rgba(0,0,0,.15);
    flex:0 0 auto;cursor:pointer;padding:0}
  .catdel{background:none;border:0;font-size:19px;padding:6px 4px;cursor:pointer;flex:0 0 auto}
  .catmv{flex:0 0 auto;width:38px;height:36px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);font-size:15px;cursor:pointer;padding:0}
  .catmv:disabled{opacity:.25}
  /* カラーパレット窓（Googleカレンダー風・色名付きリスト） */
  .cpick{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:none;
    align-items:center;justify-content:center}
  .cpick.on{display:flex}
  .cpick-win{background:var(--card);border-radius:18px;max-height:62vh;overflow-y:auto;
    width:min(76vw,290px);padding:8px 4px;box-shadow:0 14px 44px rgba(0,0,0,.35);
    overscroll-behavior:contain}
  .cpick-row{display:flex;align-items:center;gap:16px;width:100%;padding:12px 20px;border:0;
    background:none;font-family:var(--gothic);font-size:15px;color:var(--ink);cursor:pointer;text-align:left}
  .cpick-row:active{background:rgba(11,110,95,.07)}
  .cpick-ring{width:14px;height:14px;border-radius:50%;flex:0 0 auto;border:6px solid var(--c);background:#fff}
  .cpick-ring.sel{background:var(--c)}
  .cpick-row.cat{border-radius:12px;margin:3px 0}
  /* サブカテゴリ行: 選ぶボタン＋右端に🗑＝ピッカーの中で作成も削除も完結（v0.42.0） */
  .cpick-sub{display:flex;align-items:center}
  .cpick-sub .cpick-row{flex:1;min-width:0}
  .cpick-del{flex:0 0 auto;border:0;background:none;font-size:16px;padding:12px 14px;cursor:pointer;opacity:.65}
  .cpick-del:active{opacity:1}
  /* カテゴリ選択フィールド（ネイティブselectの代替・現在色をうっすら敷く） */
  .catsel{display:flex;align-items:center;gap:10px;width:100%;font-family:var(--gothic);font-size:16px;
    padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);
    color:var(--ink);cursor:pointer;text-align:left}
  .catsel-dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto}
  .catsel-arrow{margin-left:auto;color:var(--soft);font-size:12px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;z-index:60;background:var(--ink);
    color:#F8F9F5;padding:11px 18px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;
    transition:opacity .22s;max-width:88%;text-align:center}
  .toast.on{opacity:1}
  .toast.act{pointer-events:auto}
  .toast .undo{border:0;background:none;color:#F4C960;font-weight:700;font-size:13.5px;
    margin-left:12px;cursor:pointer;font-family:var(--gothic)}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--catcolor,#6B7280)}
  .tile-main{display:flex;flex-direction:column;justify-content:center;gap:4px;width:100%;min-height:96px;
    padding:14px 12px 14px 18px;border:0;background:none;text-align:left;cursor:pointer;
    color:inherit;font-family:inherit}
  .tile-main:active{background:rgba(11,110,95,.07)}
  .t-name{font-family:var(--mincho);font-size:18px;font-weight:600;line-height:1.3;word-break:break-all}
  .t-sub{font-size:11.5px;color:var(--soft)}
  .t-edit{position:absolute;right:2px;top:2px;border:0;background:none;color:#C8CEC4;
    font-size:14px;padding:8px;cursor:pointer}
  /* ───── リスト表示（v0.50.0 テスターFB）: 細い1行=左に名前・右に大きめ3ボタン。
     外で文字を打つ暇がない時、1画面に沢山並べて即タップするための表示。
     編集に入るタップ面積は名前部分だけに絞り、押す場所はボタン側だと見た目で示す */
  .rows{display:flex;flex-direction:column;gap:7px}
  .row{position:relative;display:flex;align-items:stretch;background:var(--card);
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--catcolor,#6B7280);z-index:1}
  .r-name{flex:1;min-width:0;border:0;background:none;text-align:left;cursor:pointer;
    padding:11px 6px 11px 14px;color:inherit;font-family:var(--mincho);font-size:15.5px;
    font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r-name:active{background:rgba(11,110,95,.07)}
  .r-acts{display:flex;flex:none}
  .r-acts button{border:0;border-left:1px solid var(--line);background:rgba(11,110,95,.045);
    color:var(--ink);font-size:11.5px;font-weight:600;padding:0 9px;cursor:pointer;white-space:nowrap}
  .r-acts button:first-child{color:var(--route);font-weight:700}
  .r-acts button:active{background:rgba(27,36,34,.08)}
  .r-acts button.warn{color:var(--danger);background:rgba(163,58,42,.06)}
  /* ───── 周辺モード（拡大地図ナビ） ───── */
  .nvov{position:fixed;inset:0;z-index:50;background:var(--paper);display:none;flex-direction:column;
    touch-action:none}   /* 地図中はブラウザのスクロール/引っ張って更新を渡さない */
  html.nvon,html.nvon body{overscroll-behavior:none}   /* 周辺モード中は「引っ張って更新」無効 */
  .nvov.on{display:flex}
  .nv-top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
    background:var(--paper);border-bottom:1px solid var(--line);z-index:2}
  .nv-back{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;
    padding:9px 13px;font-size:14px;font-family:var(--gothic);cursor:pointer;white-space:nowrap}
  .nv-tt{flex:1;min-width:0}
  .nv-name{font-family:var(--mincho);font-size:15px;font-weight:600;line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nv-sub{font-size:11px;color:var(--soft);font-family:var(--mono)}
  .nv-dist{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--route);white-space:nowrap}
  .nv-dist small{font-size:11px;font-weight:400;color:var(--soft)}
  .nv-unpark{border:1px solid rgba(163,58,42,.4);background:var(--card);color:var(--danger);
    border-radius:10px;padding:9px 11px;font-size:13px;font-family:var(--gothic);cursor:pointer;white-space:nowrap}
  .nv-side{position:absolute;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:1000;
    display:flex;flex-direction:column;gap:8px}
  .nv-side button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font-size:12px;font-family:var(--gothic);cursor:pointer;
    box-shadow:0 3px 10px rgba(27,36,34,.18)}
  .nv-side button.on{background:var(--route);border-color:var(--route);color:#fff}
  .nv-note{position:absolute;left:0;right:0;bottom:0;z-index:1000;text-align:center;
    padding:9px 14px calc(10px + env(safe-area-inset-bottom));font-size:12px;color:var(--soft);
    background:linear-gradient(0deg,var(--paper) 55%,rgba(237,239,232,0));pointer-events:none}
  .nv-note b{color:var(--route)}
  /* 自位置マーカー（青丸＋向きの扇） */
  .me-wrap{position:relative;width:0;height:0}
  .me-cone{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;
    background:conic-gradient(from -30deg,rgba(28,110,225,.34) 0 60deg,transparent 60deg);
    transform-origin:50% 50%;display:none}
  .me-dot{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;
    background:#1C6EE1;border:2.5px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35)}
  /* 目的地・駐車ピン */
  .dest-pin{font-size:30px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));
    transform:translate(-50%,-92%);position:absolute}
  .dest-name{position:absolute;transform:translate(-50%,10px);background:rgba(27,36,34,.82);color:#F8F9F5;
    font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;font-family:var(--gothic)}
  /* 位置ピック（地図で位置を決める） */
  /* 駐車写真（駐車メモの時だけ表示・3枚まで・解除で消える一時保存） */
  .nv-photos{display:none;gap:8px;padding:8px 10px;background:var(--bg)}
  .nvov.car .nv-photos{display:flex}
  .nv-photos .pslot{flex:1;min-width:0;aspect-ratio:1;border-radius:12px;overflow:hidden;
    border:2px dashed var(--line);background:var(--card);padding:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;position:relative;
    font-size:30px;color:var(--route);font-family:var(--gothic)}
  .nv-photos .pslot.filled{border:2px solid var(--line)}
  .nv-photos .pslot img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .nv-photos .pdel{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;
    border:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .nv-mapwrap{flex:1;position:relative;min-height:0;overflow:hidden}
  #nvMap{width:100%;height:100%;background:#DDE2D8;transition:transform .3s ease-out}
  /* 「向き上」モード: 地図ごとCSSで回転。ピン絵文字と名前ラベルは.crで逆回転して読める向きを保つ */
  .cr{position:absolute;left:0;top:0;width:0;height:0;
    transform:rotate(var(--mrot,0deg));transition:transform .3s ease-out}
  .nvov.pick #nvHead{display:none}
  .nv-pickbar{display:none;gap:8px;padding:8px 10px;background:var(--paper);
    border-bottom:1px solid var(--line);position:relative;z-index:3}
  .nvov.pick .nv-pickbar{display:flex}
  .nv-pickbar input{flex:1;min-width:0;font-family:var(--gothic);font-size:15px;padding:9px 12px;
    border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  .nv-pickbar button{border:1px solid var(--line);background:var(--card);color:var(--route);
    border-radius:10px;padding:9px 14px;font-size:14px;font-family:var(--gothic);cursor:pointer;white-space:nowrap}
  .nv-cands{position:absolute;top:100%;left:10px;right:10px;z-index:1200;background:var(--card);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(27,36,34,.2)}
  .nv-cands:empty{display:none}
  .nv-cand{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);
    background:none;font-family:var(--gothic);font-size:14px;color:var(--ink);padding:11px 13px;cursor:pointer}
  .nv-cand:last-child{border-bottom:0}
  .nv-cross{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:1000;pointer-events:none;color:var(--danger);font-size:34px;line-height:1;
    text-shadow:0 0 3px #fff,0 0 6px #fff;font-weight:700}
  .nvov.pick .nv-cross{display:block}
  /* 画面外ピンの方向インジケータ（ピンが見えない時だけ端に出る・タップでピンへ） */
  .nv-edge{display:none;position:absolute;z-index:940;width:60px;height:60px;margin:-30px 0 0 -30px;
    border-radius:50%;background:#fff;border:2px solid var(--danger);
    box-shadow:0 3px 12px rgba(0,0,0,.35);cursor:pointer;padding:0;font-family:var(--gothic);
    flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .nv-edge.on{display:flex}
  .nv-edge .ico{font-size:18px;line-height:1;pointer-events:none}
  .nv-edge .d{font-size:11px;font-weight:800;color:#274A73;line-height:1;pointer-events:none}
  .nv-edge-arr{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;
    border:8px solid transparent;border-left:13px solid var(--danger)}
  .nv-okbar{display:none;position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:1000;text-align:center;pointer-events:none}
  .nvov.pick .nv-okbar{display:block}
  .nv-okbar button{pointer-events:auto;background:var(--route);color:#fff;border:0;border-radius:999px;
    padding:15px 30px;font-size:16px;font-family:var(--gothic);font-weight:700;cursor:pointer;
    box-shadow:0 6px 20px rgba(11,110,95,.34)}
  .nvov.pick .nv-note{display:none}
  .nvov.pick #nvFollow{display:none}
  /* 駐車FAB（左下） */
  .fab2{position:fixed;left:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;
    width:calc(50vw - 56px);max-width:180px;height:64px;padding:0 6px;
    background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;
    font-size:15px;font-family:var(--gothic);font-weight:700;
    box-shadow:0 4px 14px rgba(27,36,34,.16);cursor:pointer}
  .fab2 small{display:block;font-size:10px;font-weight:400;color:var(--soft);letter-spacing:.02em;white-space:nowrap}
  .fab2.parked{background:#274A73;border-color:#274A73;color:#fff}
  .fab2.parked small{color:rgba(255,255,255,.8)}
  /* 📍近くFAB（下段中央・正円） */
  .fab3{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;
    width:64px;height:64px;padding:0;border-radius:50%;
    background:var(--card);color:var(--ink);border:1.5px solid var(--line);
    font-size:19px;line-height:1.1;font-family:var(--gothic);font-weight:700;
    box-shadow:0 4px 14px rgba(27,36,34,.16);cursor:pointer}
  .fab3 span{display:block;font-size:11px;letter-spacing:.04em}
  /* ───── 📍近くビュー（上=カード列 / 下=地図・連動フォーカス） ───── */
  /* ヘルプ（使い方）: ⋯メニュー最下部から。v0.37.0=画像をやめてHTML本文に刷新
     （目次タップで各章へ・右下の「▲目次」で先頭へ・オフラインで開ける点は従来どおり） */
  .helpov{position:fixed;inset:0;z-index:57;display:none;overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;--pvc:#EDEFE8;--pvh:#DDE2D8;background:var(--pvc)}
  .helpov.on{display:block}
  .helpov .pv-body{font-size:15.5px;line-height:1.8;padding-top:10px}
  /* 🔍Gマップの写真（私用の隠し機能）: 候補グリッド→タップで複数選択→取り込み */
  .gpov{position:fixed;inset:0;z-index:57;display:none;flex-direction:column;
    --pvc:#EDEFE8;--pvh:#DDE2D8;background:var(--pvc)}
  .gpov.on{display:flex}
  .gp-body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    width:100%;max-width:760px;margin:0 auto;padding:10px 12px 16px}
  .gp-q{display:flex;gap:8px;margin:0 0 10px}
  .gp-q input{flex:1;min-width:0;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
    background:var(--card);color:var(--ink);font-family:var(--gothic);font-size:15px}
  .gp-q button{flex:0 0 auto;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;
    background:var(--card);color:var(--route);font-family:var(--gothic);font-size:14px;cursor:pointer}
  .gp-place{font-size:13px;line-height:1.5;color:var(--soft);margin:0 0 6px}
  .gp-place b{color:var(--ink);font-size:14px}
  .gp-status{font-size:13px;color:var(--soft);margin:0 0 10px;min-height:1.2em}
  .gp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .gp-item{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;cursor:pointer;
    background:rgba(255,255,255,.5);border:3px solid transparent}
  .gp-item img{width:100%;height:100%;object-fit:cover;display:block}
  .gp-item.sel{border-color:var(--route)}
  .gp-item.sel::after{content:"✓";position:absolute;top:5px;right:5px;width:24px;height:24px;
    border-radius:50%;background:var(--route);color:#fff;font-size:15px;line-height:24px;text-align:center}
  .gp-foot{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--pvh);border-top:1px solid rgba(27,36,34,.12)}
  .gp-foot .btn:disabled{opacity:.4;cursor:default}
  /* ⚙追加機能（上級者向け）: 🔍写真取得の説明・手順書・キー登録 */
  .advov{position:fixed;inset:0;z-index:57;display:none;overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;--pvc:#EDEFE8;--pvh:#DDE2D8;background:var(--pvc)}
  .advov.on{display:block}
  .advov .pv-body{font-size:15px;line-height:1.75;padding-top:10px}
  .advov h3{font-size:15.5px;margin:26px 0 8px;padding-top:6px;border-top:1px solid var(--line)}
  .advov h3:first-of-type{border-top:0;margin-top:8px}
  .advov p{margin:0 0 10px}
  .advov ul{margin:0 0 10px;padding-left:20px}
  .adv-note{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:10px 12px;font-size:13.5px;margin:0 0 14px}
  .adv-warn{border-color:rgba(163,58,42,.45);background:#F7EFEA}
  .adv-key{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
    padding:12px;margin:14px 0 6px}
  .adv-key input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
    background:#fff;color:var(--ink);font-family:var(--mono);font-size:13px}
  .adv-btns{display:flex;gap:8px;margin-top:10px}
  .adv-btns .btn{padding:12px;font-size:14px}
  .adv-btns .btn:disabled{opacity:.4;cursor:default}
  .adv-res{font-size:13.5px;margin-top:10px;min-height:1.2em;white-space:pre-wrap}
  .adv-res.ok{color:var(--route);font-weight:700}
  .adv-res.ng{color:var(--danger);font-weight:700}
  .adv-st{font-size:13px;color:var(--soft);margin:4px 0 0}
  .hp-lead{font-size:13px;color:var(--soft);margin:0 0 10px}
  .hp-toc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 10px;margin:0 0 26px}
  .hp-toc button{display:flex;gap:4px;align-items:baseline;width:100%;text-align:left;border:0;
    border-bottom:1px solid var(--line);background:transparent;font-family:var(--gothic);
    font-size:15px;color:var(--ink);padding:11px 2px;cursor:pointer}
  .hp-toc button:last-child{border-bottom:0}
  .hp-toc .num{flex:0 0 2em;color:var(--route);font-weight:700;font-family:var(--mono);font-size:13px}
  .hp-sec{scroll-margin-top:54px}   /* 目次から飛んだ時、上の固定バーに章タイトルが隠れないように */
  .hp-sec h3{display:flex;gap:7px;align-items:baseline;font-size:17px;font-weight:700;letter-spacing:.03em;
    margin:34px 0 12px;padding:9px 11px;background:var(--card);border-left:5px solid var(--route);
    border-radius:0 10px 10px 0}
  .hp-sec h3 .num{color:var(--route);font-family:var(--mono);font-size:13px}
  .hp-sec p{margin:0 0 12px}
  .hp-sec ul{margin:0 0 12px;padding-left:19px}
  .hp-sec li{margin:0 0 8px}
  .hp-note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    font-size:13.5px;color:var(--soft);margin:0 0 12px;line-height:1.7}
  .hp-note.warn{border-color:rgba(163,58,42,.45);color:var(--danger)}
  /* 本文中でアプリのボタンを指す時の小さな「ボタン風」表記 */
  .hp-btn{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:8px;
    padding:0 7px;font-size:.92em;white-space:nowrap}
  .hp-btn svg{width:13px;height:13px;vertical-align:-1px}
  .hp-top{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:58;display:none;
    border:0;border-radius:999px;background:var(--ink);color:#F8F9F5;font-family:var(--gothic);
    font-size:13.5px;padding:12px 17px;box-shadow:0 4px 14px rgba(27,36,34,.3);cursor:pointer}
  .hp-top.on{display:block}
  #hpBottomToc{width:100%;margin-top:26px}
  .hp-foot{margin:26px 0 46px;padding-top:14px;border-top:1px solid var(--line);
    font-size:12px;color:var(--soft);text-align:center;line-height:1.9}
  /* 表紙の位置調整: 枠=本と同じ3:4。ドラッグで移動・ピンチ/ホイールで拡縮（cover方式=枠内に余白を出さない） */
  .cvcrop{position:fixed;inset:0;z-index:72;background:rgba(18,22,21,.78);display:none;
    align-items:center;justify-content:center;padding:20px}
  .cvcrop.on{display:flex}
  .cvcrop-box{background:var(--paper);border-radius:16px;padding:16px 14px;width:100%;max-width:340px}
  .cvcrop-tt{font-family:var(--mincho);font-size:17px;font-weight:600;text-align:center;
    margin-bottom:10px;letter-spacing:.06em}
  .cvcrop-vp{position:relative;aspect-ratio:3/4;width:min(58vw,240px);margin:0 auto;background:#000;
    border-radius:4px 14px 14px 4px;overflow:hidden;border:2px solid var(--route);
    touch-action:none;user-select:none;cursor:grab}
  .cvcrop-vp.drag{cursor:grabbing}
  /* 左端=背表紙の色ライン。実物の本と同じだけ隠れる範囲を見せて位置決めの正直なプレビューにする */
  .cvcrop-vp::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;
    background:var(--catcolor,#6B7280);z-index:2}
  .cvcrop-vp img{position:absolute;left:50%;top:50%;transform-origin:0 0;max-width:none;
    pointer-events:none;user-select:none;-webkit-user-drag:none}
  .cvcrop-hint{font-size:11.5px;color:var(--soft);text-align:center;margin:9px 0 12px;line-height:1.5}
  .cvcrop-acts{display:flex;gap:8px}
  .nearov{position:fixed;inset:0;z-index:46;background:var(--paper);display:none;flex-direction:column}
  .nearov.on{display:flex}
  body.nearon .fab,body.nearon .fab2,body.nearon .fab3{display:none}   /* 表示中はFAB全部隠す */
  .near-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1.5px solid var(--line)}
  /* 施設中心の時は名前が入るので、長い名前は詰めて…にする（距離ボタンを押し出さない） */
  .near-tt{font-family:var(--mincho);font-weight:600;font-size:15px;letter-spacing:.05em;
    max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .near-r{display:flex;gap:5px;margin-left:auto}
  .near-r button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:6px 10px;font-size:12px;font-family:var(--gothic);cursor:pointer}
  .near-r button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  /* v0.51.0: 自由半径チップ＝ピンチで円を広げた時だけ5kmの右に出る（おおよそ表示・破線で「自由」と分かる） */
  .near-r button.free{border-style:dashed;font-variant-numeric:tabular-nums}
  /* ピンチ中に地図の上へ大きく半径を出す（チップだけだと指で隠れて見えないため） */
  .near-rbig{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:1000;
    background:rgba(10,14,13,.78);color:#F8F9F5;border-radius:999px;padding:7px 16px;
    font-size:15px;font-weight:700;font-family:var(--gothic);white-space:nowrap;
    pointer-events:none;opacity:0;transition:opacity .25s}
  .near-rbig.on{opacity:1}
  .near-cards{flex:0 0 42%;position:relative;overflow-y:auto;padding:0 12px;scrollbar-width:none;overscroll-behavior:contain}
  .near-cards::-webkit-scrollbar{display:none}
  .near-empty{color:var(--soft);font-size:13px;text-align:center;padding:26px 14px;line-height:1.8}
  .nearrow{display:flex;align-items:center;gap:10px;background:var(--card);
    border:1.5px solid var(--line);border-left:7px solid var(--nrc,#6B7280);
    border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer;
    transition:border-color .15s,box-shadow .15s}
  .nearrow .nr-t{flex:1;min-width:0}
  .nearrow .nr-c{font-size:11px;font-weight:700;color:var(--nrc,#6B7280);letter-spacing:.04em}
  .nearrow .nr-n{font-family:var(--mincho);font-size:15px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nearrow .nr-d{font-size:14px;font-weight:700;color:var(--route);white-space:nowrap}
  .nearrow .nr-b{display:flex;gap:6px}
  .nearrow .nr-b button{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
    border-radius:9px;padding:7px 10px;font-size:12px;font-family:var(--gothic);cursor:pointer;white-space:nowrap}
  /* フォーカス=そのカードのカテゴリ色で太くぐるっと囲む（赤固定だと赤カテゴリと紛らわしい） */
  .nearrow.focus{border-color:var(--nrc,#6B7280);box-shadow:0 0 0 2.5px var(--nrc,#6B7280)}
  .nearrow.focus .nr-d{color:var(--nrc,#6B7280)}
  .near-map{flex:1;position:relative;background:#DDE2D8}
  /* ───── 🧭経由地モード(v0.52.0) ───── */
  .rtov{position:fixed;inset:0;z-index:46;background:var(--paper);display:none;flex-direction:column}
  .rtov.on{display:flex}
  body.rton .fab,body.rton .fab2,body.rton .fab3{display:none}
  .rt-top{display:flex;align-items:center;gap:8px;
    padding:calc(8px + env(safe-area-inset-top)) 12px 4px}
  .rt-tt{font-family:var(--mincho);font-weight:600;font-size:15px;letter-spacing:.05em}
  .rt-acts{display:flex;gap:5px;margin-left:auto}
  .rt-acts button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:6px 9px;font-size:11.5px;font-family:var(--gothic);cursor:pointer;
    -webkit-user-select:none;user-select:none;white-space:nowrap}
  .rtrow.mem{border-left-color:#0B6E5F}   /* メモリ行は帳面色の左帯で場所と区別 */
  /* 出発地→①②③→目的地の一本線。各枠は3段固定(上段16/中段30/下段16px)＝
     両端は名前が上・ラベルが線上、経由地は丸数字が線上・名前が下（コーイチさんスケッチ準拠） */
  .rt-line{position:relative;display:flex;align-items:flex-start;justify-content:space-between;
    padding:10px 10px 0;gap:3px}
  .rt-line::before{content:"";position:absolute;left:20px;right:26px;top:41.5px;height:3px;
    background:var(--route);border-radius:2px;opacity:.85}
  .rt-line::after{content:"";position:absolute;right:12px;top:36.5px;
    border:6.5px solid transparent;border-left:11px solid var(--route);opacity:.85}
  .rt-stop{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;
    flex:1 1 0;min-width:0;cursor:pointer;border-radius:10px;padding:2px 2px 1px}
  .rt-stop.sel{box-shadow:0 0 0 2.5px var(--route);background:var(--card)}
  .rt-pad{height:16px}
  .rt-mid{height:30px;display:flex;align-items:center;justify-content:center}
  .rt-lab{font-size:13px;font-weight:700;letter-spacing:.04em;background:var(--paper);padding:0 3px}
  .rt-stop.sel .rt-lab{background:var(--card)}
  .rt-num{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);
    font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;font-family:var(--gothic)}
  .rt-stop.filled .rt-num{background:var(--ink);color:var(--paper)}
  .rt-name{height:16px;line-height:16px;font-size:10.5px;max-width:100%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:600}
  .rt-name.ph{color:var(--soft);font-weight:400}
  .rt-hint{min-height:32px;display:flex;align-items:center;justify-content:center;
    font-size:11.5px;color:var(--soft);padding:3px 10px;text-align:center}
  .rt-hint button{border:1.5px solid var(--line);background:var(--card);color:#B3261E;
    border-radius:999px;padding:5px 12px;font-size:12px;font-family:var(--gothic);cursor:pointer;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rt-gorow{padding:2px 12px 8px}
  #rtGo{width:100%;border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:700;
    background:var(--line);color:var(--soft);font-family:var(--gothic);cursor:pointer}
  #rtGo.ready{background:var(--ink);color:var(--paper)}
  .rt-search{display:flex;gap:6px;padding:7px 12px 4px;border-top:1.5px solid var(--line)}
  .rt-search input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;
    padding:9px 10px;font-size:14px;background:var(--card);color:var(--ink);font-family:var(--gothic)}
  .rt-cats{display:flex;gap:5px;overflow-x:auto;padding:3px 12px 6px;scrollbar-width:none}
  .rt-cats::-webkit-scrollbar{display:none}
  .rt-cats button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:5px 10px;font-size:12px;font-family:var(--gothic);cursor:pointer}
  .rt-cats button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .rt-list{flex:1;overflow-y:auto;padding:0 12px 12px;overscroll-behavior:contain}
  .rtrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);
    border-left:6px solid var(--nrc,#6B7280);border-radius:10px;padding:10px 11px;margin:7px 0;cursor:pointer}
  .rt-rn{font-family:var(--mincho);font-size:14px;font-weight:600;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
  .rt-ra{margin-left:auto;font-size:11px;color:var(--soft);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;text-align:right;flex:1 1 40%}
  /* ───── OCR（スクショから読み取る: 名前・住所・座標） ───── */
  .ocrov{position:fixed;inset:0;z-index:55;background:rgba(10,14,13,.96);display:none;
    flex-direction:column;touch-action:none}
  .ocrov.on{display:flex}
  .ocr-top{display:flex;align-items:center;gap:8px;
    padding:calc(8px + env(safe-area-inset-top)) 10px 8px;color:#F8F9F5}
  .ocr-tt{flex:1;font-family:var(--mincho);font-size:15px;font-weight:600;letter-spacing:.06em}
  .ocr-stage{flex:1;position:relative;min-height:0;display:flex;align-items:center;
    justify-content:center;overflow:hidden;padding:4px}
  /* 2本指で拡大縮小・移動できる（v0.30.0）。★変えるのは見た目だけ＝読み取りは常に元画像の
     画素を使うので、拡大しても粗くならないし精度も変わらない。
     transform-originは中央固定＝倍率と位置の計算をひとつの式で済ませる */
  #ocrImg{max-width:100%;max-height:100%;transform-origin:50% 50%;will-change:transform;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;pointer-events:none;
    -webkit-user-drag:none}
  /* 今の倍率＝押すと元の大きさに戻る。拡大している時だけ出す */
  .ocr-zoom{position:absolute;right:8px;bottom:8px;display:none;
    padding:7px 12px;border-radius:999px;border:none;
    background:rgba(11,110,95,.92);color:#F8F9F5;
    font-size:12px;font-weight:700;font-family:var(--gothic);letter-spacing:.04em;
    white-space:nowrap;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  .ocr-zoom.on{display:block}
  .ocr-selbox{position:absolute;border:2px solid #F4C960;background:rgba(244,201,96,.16);
    border-radius:4px;pointer-events:none;display:none}
  /* 読み取り中の目印。★下の帯は読めたものが並ぶと説明文が隠れて見えなくなるので、
     進んでいるのか止まっているのかが画像の上で分かるようにする（コーイチさん指摘 v0.28.0） */
  .ocr-busy{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;
    padding:9px 16px;border-radius:999px;background:rgba(11,110,95,.92);color:#F8F9F5;
    font-size:13px;font-weight:700;letter-spacing:.06em;white-space:nowrap;pointer-events:none;
    box-shadow:0 2px 12px rgba(0,0,0,.4);animation:ocrBusyBlink 1.1s ease-in-out infinite}
  .ocr-busy.on{display:block}
  @keyframes ocrBusyBlink{0%,100%{opacity:1}50%{opacity:.3}}
  .ocr-bar{padding:10px 14px calc(14px + env(safe-area-inset-bottom));background:var(--paper);
    border-radius:14px 14px 0 0}
  /* ★下の帯は高さを固定する（v0.22.0）。説明文が伸び縮みしたり読み取り結果の行が増えると
     帯の高さが変わり、余った分だけ上の画像が再フィットして拡大縮小＝狙いを定めている最中に
     画像が動く（実測: タップした瞬間に272×604→281×624）。中身が増えたらここだけスクロールさせる */
  /* 読めたものが増えると入りきらないので、ここだけ指で上下に動かせる（touch-actionが要る＝
     OCR画面はスワイプを打ち消しているため、この枠だけ縦スクロールを通す） */
  .ocr-info{height:118px;overflow-y:auto;-webkit-overflow-scrolling:touch;
    touch-action:pan-y;overscroll-behavior:contain}
  .ocr-status{font-size:12.5px;color:var(--soft);line-height:1.55;min-height:1.55em}
  .ocr-status b{color:var(--route)}
  /* 読めたものは1行ずつチェックボックス付きで出す＝外したものは使わない。
     読み違えた1つのために、正しく読めた残りまで捨てなくて済む */
  .ocr-item{display:flex;align-items:flex-start;gap:7px;margin:3px 0}
  /* チェックは指で押せる大きさに（枠を広げて当たり判定を稼ぐ） */
  .ocr-chk{flex:none;display:flex;align-items:center;padding:2px 3px 7px 0;margin:0}
  .ocr-chk input{width:21px;height:21px;accent-color:var(--route)}
  /* ★読み取った文字はその場で直せる（1文字だけ違う時に全部打ち直さなくていい）。
     直せることが見た目で分かるように破線の下線を引く */
  .ocr-ed{flex:1;min-width:0;outline:none;padding:1px 3px;border-radius:3px;
    border-bottom:1px dashed rgba(31,42,38,.3)}
  .ocr-ed:focus{background:#FFF;border-bottom:1px solid var(--route)}
  .ocr-bad,.ocr-bad:focus{color:#B23B2E;border-bottom:1px solid #B23B2E}
  .ocr-res{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--route);
    word-break:break-all}
  /* 住所は日本語なので明朝ではなくゴシックで。座標行のすぐ下に出る＝両方そろったか一目で分かる */
  .ocr-addr{font-family:var(--gothic);font-size:14.5px;font-weight:700;color:var(--route);
    word-break:break-all;line-height:1.5}
  /* 名前は3つの中で一番の主役なので、いちばん上に少し大きく出す */
  .ocr-name{font-family:var(--gothic);font-size:16px;font-weight:700;color:var(--route);
    word-break:break-all;line-height:1.45}
  .ocr-btns{display:flex;gap:8px;margin-top:8px}
  .ocr-btns .btn{padding:12px}
  .ocr-btns .btn:disabled{opacity:.4;cursor:default}
  /* 本の中の小フォルダ: 左=先頭4件のミニカード2×2（フォルダの集合体だと一目で分かる）/ 右=フォルダ名と件数 */
  .folders{grid-column:1/-1}
  .folder{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:10px 19px;margin:0 0 10px;font-family:var(--gothic);color:var(--ink);
    position:relative;overflow:hidden}
  /* フォルダもカードと同じ左右のカテゴリ色バー（本＝カテゴリの一員だと分かる） */
  .folder::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--catcolor,#6B7280)}
  .folder::after{content:"";position:absolute;right:0;top:0;bottom:0;width:7px;background:var(--catcolor,#6B7280)}
  .fgrid{flex:0 0 104px;display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .fcell{height:46px;border-radius:7px;background:var(--paper);border:1px solid var(--line);
    font-size:9px;line-height:1.3;padding:3px 4px;overflow:hidden;color:var(--soft);
    background-size:cover;background-position:center;word-break:break-all}
  .fname{font-size:16px;font-weight:700;letter-spacing:.02em}
  .fcnt{font-family:var(--mono);font-size:11px;color:var(--soft);margin-top:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ★APK版(Capacitor)のスタート画面: OSのスプラッシュ機構はHyperOS等が独自加工して
     フル画像を出せない(実機実証)→アプリ自身のHTMLで描く=全端末で確実に同じ絵。
     PWAでは直後のスクリプトで即removeされ一切表示されない -->
<style>
/* 中身は上端基準+フェードイン=起動直後にWebViewの高さが確定し直しても跳ねて見えない */
@keyframes bsIn{from{opacity:0}to{opacity:1}}
#bootsplash{display:none;position:fixed;inset:0;z-index:99999;
  background:#0B6E5F;background-image:
    linear-gradient(rgba(255,255,255,.16) 2px,transparent 2px),
    linear-gradient(90deg,rgba(255,255,255,.16) 2px,transparent 2px);
  background-size:56px 56px;background-position:-1px -1px;
  transition:opacity .45s ease}
#bootsplash .bs-in{display:flex;flex-direction:column;align-items:center;gap:26px;
  padding-top:31vh;padding-top:31svh;animation:bsIn .4s ease-out}
/* スタート画面中はスクロール封印=裏の本文描画でスクロールバーが右端で暴れる(揺れて見える)のを防ぐ */
html.bs-lock,html.bs-lock body{overflow:hidden!important}
html.bs-lock::-webkit-scrollbar,html.bs-lock body::-webkit-scrollbar{display:none!important}
</style>
<div id="bootsplash">
  <div class="bs-in">
    <svg style="width:110px;height:141px" viewBox="0 0 100 128" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 4 C24 4 6 24 6 48 C6 80 50 124 50 124 C50 124 94 80 94 48 C94 24 76 4 50 4 Z" fill="#F7F5EE"/>
      <circle cx="50" cy="46" r="18" fill="#0B6E5F"/></svg>
    <div style="font-family:'Hiragino Mincho ProN','Yu Mincho',serif;font-weight:700;
      font-size:34px;letter-spacing:.14em;color:#F7F5EE">場所帳</div>
  </div>
</div>
<script>
(function(){
  var b=document.getElementById("bootsplash");
  if(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()){
    document.documentElement.classList.add("bs-lock");
    b.style.display="block";
    setTimeout(function(){ b.style.opacity="0"; setTimeout(function(){
      b.remove(); document.documentElement.classList.remove("bs-lock");
    },500); },2200);
  }else{ b.remove(); }
})();
</script>

<header>
  <div class="wrap">
    <div class="head-in">
      <h1>場所帳</h1>
      <span class="tally" id="tally"></span>
      <span class="sp"></span>
      <button class="iconbtn" id="viewBtn" aria-label="表示切り替え"></button>
      <button class="iconbtn" id="sortBtn">よく行く順</button>
      <button class="iconbtn" id="routeBtn">経由</button>
      <button class="iconbtn" id="menuBtn">⋯</button>
    </div>
    <div class="hometabs">
      <button id="tabList">一覧</button>
      <button id="tabShelf">📚 本棚</button>
    </div>
    <div class="searchrow">
      <input type="text" id="q" placeholder="名前・住所・メモ・電話などで検索" autocomplete="off">
      <button class="iconbtn" id="clearq">✕</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="legend" id="subs"></div>
    <div class="legend" id="areas"></div>
  </div>
</header>

<main class="wrap"><div class="list" id="list"></div></main>

<button class="fab" id="addBtn">ここを登録<small>GPSで今の位置を記録</small></button>
<button class="fab2" id="parkBtn">🚩 足あと<small>戻りたい場所に旗を立てる</small></button>
<button class="fab3" id="nearBtn">📍<span>周辺</span></button>

<!-- 📍周辺ビュー: 中心（現在地 or 選んだ場所）からの距離で絞った場所を「カード列+地図」で同時に見る -->
<div class="nearov" id="nearov">
  <div class="near-top">
    <button class="nv-back" id="nearBack">← 戻る</button>
    <div class="near-tt" id="nearTt">📍 周辺の場所</div>
    <div class="near-r" id="nearRads">
      <button data-r="500">500m</button><button data-r="1000">1km</button><button data-r="2000" class="on">2km</button><button data-r="5000">5km</button><button class="free" id="nearFree" hidden></button>
    </div>
  </div>
  <div class="near-cards" id="nearCards"></div>
  <div class="near-map" id="nearMap"><div class="near-rbig" id="nearRbig"></div></div>
</div>

<!-- 🧭経由地モード(v0.52.0 コーイチさん発案): Googleマップの「経由地を後から足す」操作は分かりにくい→
     場所帳側で 出発地→①②③→目的地 を登録場所から順不同に選び、経由地セット済みの経路でマップを開く。
     メモリ3枠=いつもの巡回コースをワンタップ再現（長押しで保存） -->
<div class="rtov" id="rtov">
  <div class="rt-top">
    <button class="nv-back" id="rtBack">← 戻る</button>
    <div class="rt-tt">🧭 経由地</div>
    <div class="rt-acts">
      <button id="rtClear">クリア</button>
      <button id="rtSave">💾 メモリに保存</button>
    </div>
  </div>
  <div class="rt-line">
    <div class="rt-stop rt-end" data-slot="s"><div class="rt-name ph">現在地</div><div class="rt-mid rt-lab">出発地</div><div class="rt-pad"></div></div>

    }
  }
  /* 海上・小島（間引き済み）: いちばん近い県境の県を採る（約150kmまで） */
  let bn="",bd=Infinity;
  const kx=Math.cos(lat*Math.PI/180);
  for(const name in G) for(const ring of G[name]) for(const p of ring){
    const dx=(p[0]-lng)*kx, dy=p[1]-lat, d=dx*dx+dy*dy;
    if(d<bd){bd=d;bn=name;}
  }
  return bd<1.35*1.35 ? bn : "";
}
function updatePref(p){
  if(!window.PREF_GEO) return;                  /* データ未読込時は触らない */
  if(p.lat&&p.lng){const pr=pointToPref(+p.lat,+p.lng); if(pr)p.pref=pr; else delete p.pref;}
  else delete p.pref;
}

/* ───── 写真（IndexedDB・端末内のみ。ギャラリーには保存しない仕様） ───── */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);
    const r=indexedDB.open("basho_img",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("img");
    r.onsuccess=()=>{this.db=r.result;res(this.db);};
    r.onerror=()=>rej(r.error);});},
  set(k,v){return this.open().then(db=>new Promise((res,rej)=>{
    const t=db.transaction("img","readwrite");t.objectStore("img").put(v,k);
    t.oncomplete=res;t.onerror=()=>rej(t.error);}));},
  get(k){return this.open().then(db=>new Promise((res,rej)=>{
    const q=db.transaction("img").objectStore("img").get(k);
    q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}));},
  del(k){return this.open().then(db=>new Promise((res,rej)=>{
    const t=db.transaction("img","readwrite");t.objectStore("img").delete(k);
    t.oncomplete=res;t.onerror=()=>rej(t.error);}));}
};
const phCache=new Map();
function phGet(id){
  if(phCache.has(id)) return Promise.resolve(phCache.get(id));
  return IDB.get(id).then(v=>{if(v)phCache.set(id,v);return v;}).catch(()=>null);
}
/* 1ファイル→縮小→IndexedDBへ保存して画像idを返す（写真取込の共通処理。失敗はnull） */
function phProcessFile(f){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=1400, sc=Math.min(1,MAX/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      const du=cv.toDataURL("image/jpeg",.82);
      URL.revokeObjectURL(img.src);
      const id="i"+Date.now()+Math.random().toString(36).slice(2,5);
      IDB.set(id,du).then(()=>{ phCache.set(id,du); res(id); }).catch(()=>res(null));
    };
    img.onerror=()=>{ URL.revokeObjectURL(img.src); res(null); };
    img.src=URL.createObjectURL(f);
  });
}
/* 撮影/選択（1枚）→新しい画像idをcbに渡す（カメラ撮影・表紙・駐車写真用） */
function phCapture(fromGallery,cb){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*";
  if(!fromGallery) inp.capture="environment";
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    phProcessFile(f).then(id=>{
      if(id) cb(id);
      else toast("写真を保存できませんでした（画像形式か空き容量を確認）");
    });
  };
  inp.click();
}
/* ギャラリーから複数選択でまとめて取り込む→ids配列をcbへ（選んだ順のまま） */
function phCaptureMulti(cb){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*"; inp.multiple=true;
  inp.onchange=async()=>{
    const fs=[...(inp.files||[])]; if(!fs.length) return;
    if(fs.length>1) toast(fs.length+"枚を取り込んでいます…");
    const ids=[]; let bad=0;
    for(const f of fs){ const id=await phProcessFile(f); if(id)ids.push(id); else bad++; }
    cb(ids,bad);
  };
  inp.click();
}
function phShoot(p,fromGallery){
  if(fromGallery){
    /* 📁保存画像=複数選択OK。いろんな所から貯めた画像を一気に登録できる */
    phCaptureMulti((ids,bad)=>{
      if(!ids.length){ toast("画像を読み込めませんでした"); return; }
      p.ph=(p.ph||[]).concat(ids); p.updated=Date.now(); save();   /* 古い順=左端が一番最初の1枚 */
      if(ids.length>1||bad) toast(ids.length+"枚を追加しました"+(bad?"（"+bad+"枚は読み込めず）":""));
    });
    return;
  }
  phCapture(false,id=>{
    p.ph=p.ph||[]; p.ph.push(id); p.updated=Date.now(); save();
  });
}
function phDelete(p,id){
  if(!confirm("この写真を削除します。\nこのアプリの中にしか無いため、元に戻せません。よろしいですか？")) return;
  p.ph=(p.ph||[]).filter(x=>x!==id);
  IDB.del(id).catch(()=>{}); phCache.delete(id);
  save(); toast("写真を削除しました");
}
function phPurgePlace(p){
  (p.ph||[]).forEach(id=>{IDB.del(id).catch(()=>{});phCache.delete(id);});
  /* 添付（URLカードのアイコン・PDF本体）もIndexedDBから道連れパージ */
  (p.att||[]).forEach(a=>["ic","ref"].forEach(k=>{
    if(a[k]){IDB.del(a[k]).catch(()=>{});phCache.delete(a[k]);}}));
}

/* ───── 🔍Gマップの写真（私用の隠し機能・v0.38.0） ─────
   カード名＋カードの座標で Places API (New) に聞き、投稿写真を最大10枚並べて選んで取り込む。
   APIキーはコードに置かない：ヘルプ末尾のバージョン表記を7回タップ→キーを登録した端末だけ
   カードに🔍ボタンが出る（一般配布版では存在ごと見えない）。キーは localStorage のみ。
   通信は places.googleapis.com（検索・写真URL）と lh3.googleusercontent.com（写真本体）へ直接。
   どちらもCORS許可を実測確認済み（2026-08-04）＝PWA/APK共通で素のfetchで動く。プロキシ不使用。 */
const GP_LS="basho_gpkey";
function gpKey(){ try{return (localStorage.getItem(GP_LS)||"").trim();}catch(e){return "";} }
function gpKeySet(v){
  try{ v=(v||"").trim(); if(v) localStorage.setItem(GP_LS,v); else localStorage.removeItem(GP_LS); }catch(e){v="";}
  toast(v?"🔍写真取得: ON":"🔍写真取得: OFF"); render();
}
let gpP=null, gpItems=[], gpBusy=false;   /* gpItems=[{uri,sel}] 表示中の候補 */
function gpOpen(p){
  gpP=p; gpItems=[];
  document.getElementById("gpQ").value=p.name||"";
  document.getElementById("gpov").classList.add("on");
  document.documentElement.classList.add("pvon");   /* 背面スクロール封じ（縦閲覧と同じ流儀） */
  gpSearch();

function gpClose(){
  document.getElementById("gpov").classList.remove("on");
  document.documentElement.classList.remove("pvon");
  document.getElementById("gpGrid").innerHTML="";
  document.getElementById("gpPlace").textContent="";
  document.getElementById("gpStatus").textContent="";
  gpItems=[]; gpP=null; gpFootSync();
}
async function gpJson(url,opt){
  const r=await fetch(url,opt);
  if(!r.ok){
    let m=""; try{ m=(await r.json()).error.message||""; }catch(e){}
    throw new Error("HTTP "+r.status+(m?(" "+m):""));
  }
  return r.json();
}
async function gpSearch(){
  if(gpBusy) return;
  const key=gpKey(), p=gpP; if(!key||!p) return;
  const q=(document.getElementById("gpQ").value||"").trim()||p.name||"";
  const grid=document.getElementById("gpGrid"), st=document.getElementById("gpStatus"),
        pl=document.getElementById("gpPlace");
  gpBusy=true; gpItems=[]; grid.innerHTML=""; pl.textContent=""; gpFootSync();
  st.textContent="検索中…";
  try{
    /* v0.46.0: 「稲荷神社」のような同名多数の名前だと、緩いバイアス＋最有力1件では
       知名度の高い別の場所が勝ってしまう（実使用で発覚）→ 候補を複数取り、
       カードの座標に最も近いものを選ぶ。座標こそがこのカードの正体という原則。
       v0.47.0: 5件では足りなかった＝国領町の実測でクチコミ4件の小さな稲荷神社は
       関連度順の上位5件に入れず圏外（稲荷系だけで周囲に8つ）。API上限の20件まで広げると
       6m先の本物が入った。料金は件数に関係なく1リクエスト分＝広げ得 */
    const body={textQuery:q,languageCode:"ja",regionCode:"JP",pageSize:(p.lat&&p.lng)?20:1};
    if(p.lat&&p.lng) body.locationBias={circle:{center:{latitude:+p.lat,longitude:+p.lng},radius:3000}};
    const d=await gpJson("https://places.googleapis.com/v1/places:searchText",{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Goog-Api-Key":key,
        "X-Goog-FieldMask":"places.displayName,places.formattedAddress,places.photos,places.location"},
      body:JSON.stringify(body)});
    const cands=d.places||[];
    if(!cands.length){ st.textContent="見つかりませんでした。検索語を変えて再検索してみてください。"; gpBusy=false; return; }
    let hit=cands[0], hitD=null;
    if(p.lat&&p.lng){
      const dv=(la1,lo1,la2,lo2)=>{const R=6371e3,r=x=>x*Math.PI/180;
        const a=Math.sin(r(la2-la1)/2)**2+Math.cos(r(la1))*Math.cos(r(la2))*Math.sin(r(lo2-lo1)/2)**2;
        return 2*R*Math.asin(Math.sqrt(a));};
      cands.forEach(c=>{
        if(!(c.location&&isFinite(c.location.latitude))) return;
        const dm=dv(+p.lat,+p.lng,c.location.latitude,c.location.longitude);
        if(hitD==null||dm<hitD){ hit=c; hitD=dm; }
      });
    }
    pl.innerHTML="<b>"+esc((hit.displayName&&hit.displayName.text)||q)+"</b><br>"+esc(hit.formattedAddress||"")+
      /* カードの位置との距離を出す＝「本当にこのカードの場所か」をひと目で確認できる */
      (hitD!=null?'<br>📍 カードの位置から約 '+esc(fmtDist(hitD))+(hitD>2000?'（遠いかも。検索語で絞り直せます）':''):'');
    const phs=(hit.photos||[]).slice(0,10);
    if(!phs.length){ st.textContent="この場所には写真の投稿がありません。"; gpBusy=false; return; }
    st.textContent="写真を読み込み中… 0/"+phs.length;
    /* 枠を先に並べておき、届いた順に埋める＝写真の並びが毎回同じになる */
    const cells=phs.map(()=>{ const c=document.createElement("div"); c.className="gp-item"; grid.appendChild(c); return c; });
    let done=0;
    await Promise.all(phs.map(async(ph,i)=>{
      try{
        const m=await gpJson("https://places.googleapis.com/v1/"+ph.name+
          "/media?maxWidthPx=1200&skipHttpRedirect=true&key="+encodeURIComponent(key));
        if(!(m&&m.photoUri)) throw new Error("no uri");
        const it={uri:m.photoUri,sel:false};
        gpItems.push(it);
        const im=new Image(); im.alt=""; im.draggable=false; im.src=m.photoUri;
        im.oncontextmenu=e=>e.preventDefault();
        cells[i].appendChild(im);
        cells[i].onclick=()=>{ it.sel=!it.sel; cells[i].classList.toggle("sel",it.sel); gpFootSync(); };
      }catch(e){ cells[i].remove(); }
      done++; st.textContent="写真を読み込み中… "+done+"/"+phs.length;
    }));
    st.textContent=gpItems.length?"タップで選択 → 下の「取り込む」":"写真を読み込めませんでした。";
  }catch(e){
    st.textContent="検索できませんでした（"+((e&&e.message)||"通信エラー")+"）";
  }
  gpBusy=false;
}
function gpFootSync(){
  const b=document.getElementById("gpImport"); if(!b) return;
  const n=gpItems.filter(x=>x.sel).length;
  b.textContent=n?("取り込む（"+n+"枚）"):"取り込む";
  b.disabled=!n;
}
function gpAllToggle(){
  if(!gpItems.length) return;
  const on=gpItems.some(x=>!x.sel);   /* 1つでも未選択なら全部ON／全部選択済みなら全部OFF */
  gpItems.forEach(x=>x.sel=on);
  document.querySelectorAll("#gpGrid .gp-item").forEach(c=>{ if(c.firstChild) c.classList.toggle("sel",on); });
  gpFootSync();
}
async function gpImport(){
  if(gpBusy) return;
  const sel=gpItems.filter(x=>x.sel), p=gpP;
  if(!sel.length||!p) return;
  const st=document.getElementById("gpStatus");
  gpBusy=true; st.textContent="取り込み中… 0/"+sel.length;
  const ids=[]; let bad=0, done=0;
  for(const it of sel){
    try{
      const r=await fetch(it.uri); if(!r.ok) throw new Error("http");
      const id=await phProcessFile(await r.blob());   /* 既存の写真経路に合流（圧縮→IndexedDB） */
      if(id) ids.push(id); else bad++;
    }catch(e){ bad++; }
    done++; st.textContent="取り込み中… "+done+"/"+sel.length;
  }
  gpBusy=false;
  if(ids.length){
    p.ph=(p.ph||[]).concat(ids); p.updated=Date.now(); save();
    toast(ids.length+"枚を取り込みました"+(bad?"（"+bad+"枚は失敗）":""));
    gpClose();
  }else st.textContent="取り込めませんでした。通信状態を確認してください。";
}

/* ───── 添付（URLカード・PDF） ─────
   p.att=[{t:"url",url,host,title,desc,ic} | {t:"pdf",ref,name,sz}]
   ic/ref は basho_img(IndexedDB) のキー（"a"+時刻+乱数）。
   URLはサイト名・説明・ロゴを自動取得してGoogleマップ風のカードにする。
   取得はまず直接fetch→CORSで弾かれたら公開プロキシ(allorigins/corsproxy)経由。
   ※送るのは貼り付けたURLだけ。位置情報・座標は一切送らない（従来方針のまま） */
function attId(){ return "a"+Date.now()+Math.random().toString(36).slice(2,5); }
/* 表示順 p.ord = 写真id("i…")と添付id("t…")を混ぜた1本のリスト。
   サムネ列も縦閲覧も この順で表示する。無ければ 写真→添付 の順で自動生成。
   写真/添付の追加・削除後もここで整合を取る（消えたものは除去・新規は末尾へ）＝冪等 */
function ordSync(p){
  const ph=p.ph||[], at=p.att||[];
  at.forEach(a=>{ if(!a.id) a.id="t"+Date.now()+Math.random().toString(36).slice(2,5); });
  const valid=new Set(ph.concat(at.map(a=>a.id)));
  const ord=(p.ord||[]).filter(t=>valid.has(t));
  const have=new Set(ord);
  ph.forEach(id=>{ if(!have.has(id)) ord.push(id); });
  at.forEach(a=>{ if(!have.has(a.id)) ord.push(a.id); });
  p.ord=ord; return ord;
}
function attFmtSize(n){ return n>=1048576?(n/1048576).toFixed(1)+"MB":Math.max(1,Math.round(n/1024))+"KB"; }
/* URL→HTML本文（最速優先）: 直接・プロキシ2系統を**同時に**投げ、最初に返った正常な本文を採用。
   旧: 順番に試す=最悪24秒 → 新: 最速の1本=通常1〜3秒。各経路は8秒で打ち切り。
   送るのは貼り付けたURLだけ（座標不送信は従来どおり） */
function attFetchHtml(u){
  const tryOne=async url=>{
    const ac=new AbortController(); const t=setTimeout(()=>ac.abort(),8000);
    try{
      const r=await fetch(url,{signal:ac.signal});
      if(!r.ok) throw 0;
      /* 文字化け対策: 一旦UTF-8で読み、meta charsetがShift_JIS等なら読み直す */
      const buf=await r.arrayBuffer();
      let txt=new TextDecoder("utf-8").decode(buf);
      const m=txt.slice(0,3000).match(/charset=["']?\s*([\w-]+)/i);
      if(m&&!/^utf-?8$/i.test(m[1])){ try{ txt=new TextDecoder(m[1].toLowerCase()).decode(buf); }catch(e){} }
      /* 旧sw.jsのオフライン保険が外部サイトの失敗に場所帳自身のindex.htmlを
         返してくることがある→自分の画面を掴んだら失敗扱い */
      if(txt.includes('id="menuBtn"')&&txt.includes("場所帳")) throw 0;
      return txt;
    }finally{ clearTimeout(t); }
  };
  return Promise.any([
    tryOne(u),
    tryOne("https://api.allorigins.win/raw?url="+encodeURIComponent(u)),
    tryOne("https://corsproxy.io/?url="+encodeURIComponent(u))
  ]).catch(()=>null);
}
/* URL→サイト名・説明を取得してattレコードを作る。
   ★ロゴ・画像は取りに行かない（v0.14.2で廃止=最大数十秒かかっていた真犯人）。
   カードの左は🌐マーク固定＝取得はHTML1本だけで即終わる */
async function attBuildUrl(url){
  let host=""; try{ host=new URL(url).hostname.replace(/^www\./,""); }catch(e){ return null; }
  const a={t:"url",url:url,host:host,title:"",desc:"",ic:null};
  const html=await attFetchHtml(url);
  if(html){
    const doc=new DOMParser().parseFromString(html,"text/html");
    const og=n=>{const m=doc.querySelector('meta[property="'+n+'"],meta[name="'+n+'"]');return (m&&m.content||"").trim();};
    a.title=og("og:title")||og("twitter:title")||(doc.querySelector("title")||{textContent:""}).textContent.trim();
    a.desc=og("og:description")||og("description")||og("twitter:description");
    if(a.desc.length>120) a.desc=a.desc.slice(0,120)+"…";
  }
  a.title=a.title||host;
  return a;
}

    let v=(document.getElementById("att_url").value||"").trim();
    const m=v.match(/https?:\/\/[^\s"'<>]+/);
    v=m?m[0]:(v&&!/^https?:\/\//.test(v)?"https://"+v:v);
    let ok=false; try{ ok=/^https?:$/.test(new URL(v).protocol); }catch(e){}
    if(!ok){ toast("URLの形になっていません（https://… を貼り付けてください）"); return; }
    const btn=document.getElementById("att_go");
    btn.disabled=true; btn.textContent="サイト情報を取得しています…";
    const a=await attBuildUrl(v);
    if(!a){ btn.disabled=false; btn.textContent="🔗 このURLを貼る"; toast("追加できませんでした"); return; }
    p.att=(p.att||[]); p.att.push(a); p.updated=Date.now();
    closeSheet(); save();
    toast(a.title&&a.title!==a.host?"リンクカードを追加しました":"追加しました（サイト名は取得できず。名前は長押しで変更できます）");
  };
  document.getElementById("att_pdf").onclick=()=>{
    const inp=document.createElement("input");
    inp.type="file"; inp.accept="application/pdf,.pdf";
    inp.onchange=()=>{
      const f=inp.files&&inp.files[0]; if(!f) return;
      if(f.size>25*1048576){ toast("25MBを超えるPDFは貼れません（"+attFmtSize(f.size)+"）"); return; }
      const r=new FileReader();
      r.onload=()=>{
        const id=attId();
        IDB.set(id,r.result).then(()=>{
          phCache.set(id,r.result);
          p.att=(p.att||[]); p.att.push({t:"pdf",ref:id,name:f.name.replace(/\.pdf$/i,""),sz:f.size});
          p.updated=Date.now(); closeSheet(); save(); toast("PDFを貼りました");
        }).catch(()=>toast("保存できませんでした（空き容量を確認）"));
      };
      r.onerror=()=>toast("読み込めませんでした");
      r.readAsDataURL(f);
    };
    inp.click();
  };
}

function attOpen(a){
  if(a.t==="url"){ openUrl(a.url); return; }
  phGet(a.ref).then(du=>{
    if(!du){ toast("PDFを読み込めませんでした"); return; }
    /* ★APK版(Capacitor): WebViewはPDFビューア非搭載でblob URLを開いても無反応。
       Filesystemでキャッシュに書き出し→FileOpenerで端末のPDFアプリに渡す（PWAは従来どおりblob） */
    const CP=window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()
      &&window.Capacitor.Plugins;
    if(CP&&CP.Filesystem&&CP.FileOpener){
      const b64=du.slice(du.indexOf(",")+1);
      const fn="att_"+String(a.ref||"pdf").replace(/[^A-Za-z0-9_-]/g,"")+".pdf";
      CP.Filesystem.writeFile({path:fn,data:b64,directory:"CACHE"})
        .then(r=>CP.FileOpener.open({filePath:r.uri,contentType:"application/pdf"}))
        .catch(()=>toast("PDFを開けませんでした。PDFを見るアプリが端末に入っているかご確認ください"));
      return;
    }
    fetch(du).then(r=>r.blob()).then(b=>{
      const u=URL.createObjectURL(b.type==="application/pdf"?b:new Blob([b],{type:"application/pdf"}));
      openUrl(u); setTimeout(()=>URL.revokeObjectURL(u),60000);
    }).catch(()=>toast("PDFを開けませんでした"));
  });
}

/* ⇅並び順: 写真・リンク・PDFを1本のリストで入れ替える（このカードの中だけ）。
   ▲▼で1つずつ移動。動かすたびに保存＆一覧へ即反映 */
function ordSheet(p){
  if(!ordSync(p).length){ toast("写真やリンク・PDFがまだ入っていません"); return; }
  sheet.innerHTML=
    '<h2>⇅ 並び順</h2>'+
    '<div class="hint">▲▼で入れ替えます。左のチェックを付けて、下のボタンでまとめて削除もできます。</div>'+
    '<div id="ordList" style="max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-top:8px"></div>'+
    '<div class="sheet-actions"><button class="btn del" id="ord_del" style="flex:1" disabled>🗑 選んで削除</button>'+
    '<button class="btn primary" id="ord_done">完了</button></div>';
  veil.classList.add("on");
  document.getElementById("ord_done").onclick=closeSheet;
  const atMap=new Map((p.att||[]).map(a=>[a.id,a]));
  const listEl=document.getElementById("ordList");
  /* 一括削除（v0.48.0）: 長押し1枚ずつ+毎回確認は枚数が多いと大変（実使用FB）
     →チェックした分を1回の確認でまとめて削除 */
  const sel=new Set();
  const delBtn=document.getElementById("ord_del");
  const delSync=()=>{
    delBtn.disabled=!sel.size;
    delBtn.textContent=sel.size?("🗑 "+sel.size+"件を削除"):"🗑 選んで削除";
  };
  delBtn.onclick=()=>{
    if(!sel.size) return;
    const nPh=(p.ph||[]).filter(id=>sel.has(id)).length;
    const nAt=(p.att||[]).filter(a=>sel.has(a.id)).length;
    const what=[nPh?("写真 "+nPh+"枚"):"",nAt?("リンク・PDF "+nAt+"件"):""].filter(Boolean).join("と");
    dlgOpen(what+"を削除します。\nこのアプリの中にしか無いものは、元に戻せません。よろしいですか？",true,ok=>{
      if(!ok) return;
      (p.ph||[]).forEach(id=>{ if(sel.has(id)){IDB.del(id).catch(()=>{});phCache.delete(id);} });
      p.ph=(p.ph||[]).filter(id=>!sel.has(id));
      (p.att||[]).forEach(a=>{ if(sel.has(a.id)) ["ic","ref"].forEach(k=>{ if(a[k]){IDB.del(a[k]).catch(()=>{});phCache.delete(a[k]);} }); });
      p.att=(p.att||[]).filter(a=>!sel.has(a.id));
      sel.clear(); ordSync(p); p.updated=Date.now(); save();
      toast((nPh+nAt)+"件を削除しました");
      if(!p.ord.length){ closeSheet(); return; }
      delSync(); draw();
    },{yes:"削除する",no:"やめる"});
  };
  const draw=()=>{
    listEl.innerHTML="";
    p.ord.forEach((tok,i)=>{
      const row=document.createElement("div");
      row.style.cssText="display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--card)";
      const ck=document.createElement("input");
      ck.type="checkbox"; ck.checked=sel.has(tok);
      ck.style.cssText="width:22px;height:22px;flex:0 0 auto";
      ck.onchange=()=>{ if(ck.checked)sel.add(tok); else sel.delete(tok); delSync(); };
      row.appendChild(ck);
      const a=atMap.get(tok);
      const th=document.createElement("div");
      th.style.cssText="width:44px;height:44px;border-radius:8px;flex:0 0 auto;border:1px solid var(--line);background:#E9ECE4 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:20px";
      let label="写真";
      if(a){
        th.textContent=a.t==="pdf"?"📄":"🌐";
        if(a.ic) phGet(a.ic).then(du=>{ if(du){th.textContent="";th.style.backgroundImage="url("+du+")";} });
        label=a.t==="pdf"?("📄 "+(a.name||"PDF")):(a.title||a.host||"リンク");
      }else{
        phGet(tok).then(du=>{ if(du) th.style.backgroundImage="url("+du+")"; });
      }
      const tx=document.createElement("div");
      tx.style.cssText="flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap";
      tx.textContent=label;
      const mk=(sym,d)=>{
        const b=document.createElement("button");
        b.textContent=sym;
        const dead=(d<0&&i===0)||(d>0&&i===p.ord.length-1);
        b.style.cssText="flex:0 0 auto;width:46px;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:17px;cursor:pointer"+(dead?";opacity:.25":"");
        b.onclick=()=>{
          const j=i+d; if(j<0||j>=p.ord.length) return;
          [p.ord[i],p.ord[j]]=[p.ord[j],p.ord[i]];
          p.updated=Date.now(); save(); draw();   /* saveで一覧のサムネ列も即並び替わる */
        };
        return b;
      };
      row.append(th,tx,mk("▲",-1),mk("▼",1));
      listEl.appendChild(row);
    });
  };
  draw();
}

/* 自前の注意ダイアログ: dlgOpen(本文, キャンセルあり?, cb(true/false))
   標準alert/confirmは「◯◯.github.ioの内容」ヘッダーが強制で不格好なため自作。
   背景タップ・戻るボタン=キャンセル扱い */
const dlg=document.getElementById("dlg");
let dlgCb=null;
/* opt={yes,no,title}でボタンの文言と見出しを差し替えられる。
   ★入れ替えの確認のように「時間で消えると取り返しがつかない」ものは必ずこれを使う
   （トーストは数秒で消えるので、気づかないうちに読み取った内容が失われる） */
function dlgOpen(msg,withCancel,cb,opt){
  opt=opt||{};
  dlgCb=cb||null;
  document.querySelector("#dlg .dlg-t").textContent=opt.title||"⚠️ 注意";
  document.getElementById("dlgMsg").textContent=msg;
  document.getElementById("dlgBtns").innerHTML=withCancel
    ?'<button id="dlgNo">'+esc(opt.no||"やめる")+'</button><button class="pri" id="dlgYes">'+esc(opt.yes||"開く")+'</button>'
    :'<button class="pri" id="dlgYes">'+esc(opt.yes||"OK")+'</button>';
  const done=v=>{dlg.classList.remove("on");const f=dlgCb;dlgCb=null;if(f)f(v);};
  const no=document.getElementById("dlgNo");
  if(no) no.onclick=()=>done(false);
  document.getElementById("dlgYes").onclick=()=>done(true);
  dlg.classList.add("on");
}
function dlgClose(){
  if(!dlg.classList.contains("on")) return;
  dlg.classList.remove("on");
  const f=dlgCb; dlgCb=null; if(f)f(false);
}
dlg.onclick=e=>{ if(e.target===dlg) dlgClose(); };

  start(cb){

    if(!navigator.geolocation){ this.state="ng"; this.reason="この端末では位置情報が使えません"; return this.emit(); }

      p=>{

          this.state="ok"; this.emit();

    if(this.watch!=null){navigator.geolocation.clearWatch(this.watch);this.watch=null;}
    if(this.timer){clearTimeout(this.timer);this.timer=null;}
    if(!keep) this.cb=null;
  },

};

   ちゃんとお店のカードが出る。住所が無い時だけ座標にする＝「ここを登録」で自分が付けた名前

     短縮URLは中身が見えず見分けられないため、住所があればそちらを信じる */

/* ───── 距離（近い順ソート用） ───── */
function distM(a,b){
  const R=6371e3, rad=x=>x*Math.PI/180;
  const dLa=rad(b.lat-a.lat), dLo=rad(b.lng-a.lng);
  const s=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}

  return distM(lastPos,{lat:+p.lat,lng:+p.lng});
