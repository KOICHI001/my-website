<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEFE8">
<meta name="description" content="今いる場所をひと押しで登録。次からは名前を選ぶだけで地図が開きます。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="leaflet.css">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>場所帳</title>
<style>
  :root{
    --paper:#EDEFE8; --card:#F8F9F5; --ink:#1B2422; --soft:#5C6763;
    --line:#D5DACF; --route:#0B6E5F; --mark:#C99000; --danger:#A33A2A;
    --r:14px;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
    --gothic:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--gothic);color:var(--ink);background-color:var(--paper);
    background-image:
      repeating-linear-gradient(0deg,rgba(27,36,34,.045) 0 1px,transparent 1px 28px),
      repeating-linear-gradient(90deg,rgba(27,36,34,.045) 0 1px,transparent 1px 28px);
    min-height:100vh;padding-bottom:130px;font-size:16px;line-height:1.5;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}

  header{position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,var(--paper) 84%,rgba(237,239,232,0));
    padding-top:env(safe-area-inset-top)}
  .head-in{display:flex;align-items:baseline;gap:10px;padding:14px 0 8px}
  h1{font-family:var(--mincho);font-size:23px;font-weight:600;margin:0;letter-spacing:.14em}
  .tally{font-family:var(--mono);font-size:11px;color:var(--soft);letter-spacing:.08em}
  .sp{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--soft);
    border-radius:10px;padding:7px 9px;font-size:13px;font-family:var(--gothic);cursor:pointer;
    white-space:nowrap}
  .searchrow{display:flex;gap:8px;padding-bottom:10px}
  #q{flex:1;min-width:0;font-family:var(--gothic);font-size:17px;padding:12px 14px;
    border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink)}
  #q:focus{outline:none;border-color:var(--route);box-shadow:0 0 0 3px rgba(11,110,95,.13)}
  #clearq{display:none}#clearq.on{display:block}
  .legend{display:flex;gap:7px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
  .legend::-webkit-scrollbar{display:none}
  .legend:empty{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:var(--card);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--soft);
    cursor:pointer;white-space:nowrap}
  .chip .dot{width:8px;height:8px;border-radius:50%}
  .chip.on{background:var(--ink);color:#F8F9F5;border-color:var(--ink)}
  .chip.fix{border-color:rgba(163,58,42,.45);color:var(--danger)}
  .chip.fix.on{background:var(--danger);color:#fff;border-color:var(--danger)}

  .list{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    overflow:hidden;position:relative}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--catcolor,#6B7280)}
  .card::after{content:"";position:absolute;right:0;top:0;bottom:0;width:7px;background:var(--catcolor,#6B7280)}
  .card-main{padding:13px 44px 11px 18px;cursor:pointer;display:flex;align-items:center;gap:10px;
    width:100%;text-align:left;border:0;background:none;font-family:inherit;color:inherit}
  .card-main:active{background:rgba(11,110,95,.05)}
  .cm-text{flex:1;min-width:0}

  /* 写真ボックス（カード右・独立エリア）: 上=サムネ列(スワイプ) / 下=固定ボタン2つ */
  .phbox{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;width:150px}
  /* サムネ62px+隙間5px: 2枚(134px)フル表示+3枚目が16px(約1/4)右から顔を出す=続きがあると分かる */
  .phstrip{display:flex;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:none;
    overscroll-behavior-x:contain;padding:2px 0}
  .phstrip::-webkit-scrollbar{display:none}
  .ph{width:62px;height:62px;border-radius:8px;object-fit:cover;flex:0 0 auto;
    border:1px solid var(--line);background:#E3E6DE;cursor:pointer;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .phbtns{display:flex;gap:4px}
  .phbtns button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--soft);
    border-radius:8px;padding:6px 2px;font-size:11px;font-family:var(--gothic);
    cursor:pointer;white-space:nowrap}
  .phbtns button:active{background:rgba(11,110,95,.07)}

  /* ライトボックス */
  .lb{position:fixed;inset:0;background:rgba(10,14,13,.93);z-index:70;display:none;
    align-items:center;justify-content:center}
  .lb.on{display:flex}
  .lb img{max-width:96vw;max-height:92vh;object-fit:contain;border-radius:6px}
  .lbnav{position:fixed;top:50%;transform:translateY(-50%);border:0;background:rgba(0,0,0,.35);
    color:#fff;font-size:44px;font-weight:700;line-height:1;padding:22px 16px;border-radius:14px;cursor:pointer;
    text-shadow:0 0 4px #000,0 2px 6px rgba(0,0,0,.9);box-shadow:0 2px 10px rgba(0,0,0,.4)}
  .lbnav:active{background:rgba(0,0,0,.55)}
  .lbc{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;
    color:#F8F9F5;font-family:var(--mono);font-size:12px;letter-spacing:.1em}
  .cat{font-size:11px;letter-spacing:.1em;color:var(--catcolor,#6B7280);font-weight:700}
  .preftag{color:var(--soft);font-weight:400}
  .name{font-family:var(--mincho);font-size:21px;font-weight:600;margin:2px 0 3px;line-height:1.35}
  .sub{font-size:12.5px;color:var(--soft);word-break:break-all}
  .pill{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;
    border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-top:5px;color:var(--soft)}
  .pill.warn{border-color:rgba(163,58,42,.4);color:var(--danger)}
  .star{position:absolute;right:6px;top:4px;border:0;background:none;font-size:20px;line-height:1;
    padding:8px;cursor:pointer;color:#C8CEC4}
  .star.on{color:var(--mark)}
  .actions{display:flex;border-top:1px solid var(--line)}
  .actions button{flex:1;border:0;border-left:1px solid var(--line);background:none;
    font-family:var(--gothic);font-size:13px;color:var(--soft);padding:11px 4px;cursor:pointer}
  .actions button:first-child{border-left:0;color:var(--route);font-weight:700}
  .actions button:active{background:rgba(27,36,34,.05)}

  .empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:34px 20px;
    text-align:center;color:var(--soft);font-size:14px}
  .empty b{display:block;font-family:var(--mincho);font-size:19px;color:var(--ink);
    margin-bottom:8px;font-weight:600}

  .fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;
    background:var(--route);color:#fff;border:0;border-radius:999px;padding:17px 26px;
    font-size:17px;font-family:var(--gothic);font-weight:700;
    box-shadow:0 6px 20px rgba(11,110,95,.34);cursor:pointer}
  .fab small{display:block;font-size:11px;font-weight:400;opacity:.85;letter-spacing:.05em}

  .veil{position:fixed;inset:0;background:rgba(27,36,34,.42);z-index:40;display:none;
    align-items:flex-end;justify-content:center}
  .veil.on{display:flex}
  .sheet{background:var(--paper);width:100%;max-width:760px;max-height:92vh;overflow-y:auto;
    border-radius:18px 18px 0 0;padding:18px 16px calc(26px + env(safe-area-inset-bottom))}
  .sheet h2{font-family:var(--mincho);font-size:19px;margin:0 0 6px;letter-spacing:.08em;font-weight:600}
  label{display:block;font-size:12px;color:var(--soft);margin:14px 0 5px;letter-spacing:.04em}
  input[type=text],input[type=tel],textarea,select{width:100%;font-family:var(--gothic);font-size:16px;
    padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  textarea{min-height:60px;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--route)}
  .two{display:flex;gap:8px}.two>*{flex:1;min-width:0}
  .hint{font-size:11.5px;color:var(--soft);margin-top:5px;line-height:1.5}
  .gps{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;font-size:13px;color:var(--soft);margin-top:4px}
  .gps.ok{border-color:rgba(11,110,95,.5);color:var(--route)}
  .gps.ng{border-color:rgba(163,58,42,.4);color:var(--danger)}
  .gps .mono{font-family:var(--mono);font-size:11px;margin-left:auto}
  details{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
  summary{font-size:13px;color:var(--route);cursor:pointer;padding:6px 0;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"＋ ";font-weight:700}
  details[open] summary::before{content:"− "}
  .sheet-actions{display:flex;gap:8px;margin-top:20px}
  .btn{flex:1;padding:14px;border-radius:12px;font-family:var(--gothic);font-size:15px;
    border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .btn.primary{background:var(--route);border-color:var(--route);color:#fff;font-weight:700}
  .btn.del{border-color:rgba(163,58,42,.4);color:var(--danger);flex:0 0 auto;padding:14px 18px}
  .subbtn{border:1px solid var(--line);background:var(--card);color:var(--route);border-radius:10px;
    padding:9px 12px;font-size:13px;font-family:var(--gothic);cursor:pointer;margin-top:8px}
  .menu-item{display:block;width:100%;text-align:left;padding:15px 8px;border:0;
    border-bottom:1px solid var(--line);background:none;font-family:var(--gothic);font-size:15px;
    color:var(--ink);cursor:pointer}
  .catrow{display:flex;align-items:center;gap:10px;margin:9px 0}
  .catrow input{flex:1;min-width:0;margin:0}
  .catdot{width:32px;height:32px;border-radius:50%;border:2px solid rgba(0,0,0,.15);
    flex:0 0 auto;cursor:pointer;padding:0}
  .catdel{background:none;border:0;font-size:19px;padding:6px 4px;cursor:pointer;flex:0 0 auto}
  /* カラーパレット窓（Googleカレンダー風・色名付きリスト） */
  .cpick{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:none;
    align-items:center;justify-content:center}
  .cpick.on{display:flex}
  .cpick-win{background:var(--card);border-radius:18px;max-height:62vh;overflow-y:auto;
    width:min(76vw,290px);padding:8px 4px;box-shadow:0 14px 44px rgba(0,0,0,.35);
    overscroll-behavior:contain}
  .cpick-row{display:flex;align-items:center;gap:16px;width:100%;padding:12px 20px;border:0;
    background:none;font-family:var(--gothic);font-size:15px;color:var(--ink);cursor:pointer;text-align:left}
  .cpick-row:active{background:rgba(11,110,95,.07)}
  .cpick-ring{width:14px;height:14px;border-radius:50%;flex:0 0 auto;border:6px solid var(--c);background:#fff}
  .cpick-ring.sel{background:var(--c)}
  .cpick-row.cat{border-radius:12px;margin:3px 0}
  /* カテゴリ選択フィールド（ネイティブselectの代替・現在色をうっすら敷く） */
  .catsel{display:flex;align-items:center;gap:10px;width:100%;font-family:var(--gothic);font-size:16px;
    padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);
    color:var(--ink);cursor:pointer;text-align:left}
  .catsel-dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto}
  .catsel-arrow{margin-left:auto;color:var(--soft);font-size:12px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;z-index:60;background:var(--ink);
    color:#F8F9F5;padding:11px 18px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;
    transition:opacity .22s;max-width:88%;text-align:center}
  .toast.on{opacity:1}
  .toast.act{pointer-events:auto}
  .toast .undo{border:0;background:none;color:#F4C960;font-weight:700;font-size:13.5px;
    margin-left:12px;cursor:pointer;font-family:var(--gothic)}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--catcolor,#6B7280)}
  .tile-main{display:flex;flex-direction:column;justify-content:center;gap:4px;width:100%;min-height:96px;
    padding:14px 12px 14px 18px;border:0;background:none;text-align:left;cursor:pointer;
    color:inherit;font-family:inherit}
  .tile-main:active{background:rgba(11,110,95,.07)}
  .t-name{font-family:var(--mincho);font-size:18px;font-weight:600;line-height:1.3;word-break:break-all}
  .t-sub{font-size:11.5px;color:var(--soft)}
  .t-edit{position:absolute;right:2px;top:2px;border:0;background:none;color:#C8CEC4;
    font-size:14px;padding:8px;cursor:pointer}
  /* ───── 周辺モード（拡大地図ナビ） ───── */
  .nvov{position:fixed;inset:0;z-index:50;background:var(--paper);display:none;flex-direction:column;
    touch-action:none}   /* 地図中はブラウザのスクロール/引っ張って更新を渡さない */
  html.nvon,html.nvon body{overscroll-behavior:none}   /* 周辺モード中は「引っ張って更新」無効 */
  .nvov.on{display:flex}
  .nv-top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
    background:var(--paper);border-bottom:1px solid var(--line);z-index:2}
  .nv-back{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;
    padding:9px 13px;font-size:14px;font-family:var(--gothic);cursor:pointer;white-space:nowrap}
  .nv-tt{flex:1;min-width:0}
  .nv-name{font-family:var(--mincho);font-size:15px;font-weight:600;line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nv-sub{font-size:11px;color:var(--soft);font-family:var(--mono)}
  .nv-dist{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--route);white-space:nowrap}
  .nv-dist small{font-size:11px;font-weight:400;color:var(--soft)}
  .nv-unpark{border:1px solid rgba(163,58,42,.4);background:var(--card);color:var(--danger);
    border-radius:10px;padding:9px 11px;font-size:13px;font-family:var(--gothic);cursor:pointer;white-space:nowrap}
  .nv-side{position:absolute;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:1000;
    display:flex;flex-direction:column;gap:8px}
  .nv-side button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font-size:12px;font-family:var(--gothic);cursor:pointer;
    box-shadow:0 3px 10px rgba(27,36,34,.18)}
  .nv-side button.on{background:var(--route);border-color:var(--route);color:#fff}
  .nv-note{position:absolute;left:0;right:0;bottom:0;z-index:1000;text-align:center;
    padding:9px 14px calc(10px + env(safe-area-inset-bottom));font-size:12px;color:var(--soft);
    background:linear-gradient(0deg,var(--paper) 55%,rgba(237,239,232,0));pointer-events:none}
  .nv-note b{color:var(--route)}
  /* 自位置マーカー（青丸＋向きの扇） */
  .me-wrap{position:relative;width:0;height:0}
  .me-cone{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;
    background:conic-gradient(from -30deg,rgba(28,110,225,.34) 0 60deg,transparent 60deg);
    transform-origin:50% 50%;display:none}
  .me-dot{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;
    background:#1C6EE1;border:2.5px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35)}
  /* 目的地・駐車ピン */
  .dest-pin{font-size:30px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));
    transform:translate(-50%,-92%);position:absolute}
  .dest-name{position:absolute;transform:translate(-50%,10px);background:rgba(27,36,34,.82);color:#F8F9F5;
    font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;font-family:var(--gothic)}
  /* 位置ピック（地図で位置を決める） */
  /* 駐車写真（駐車メモの時だけ表示・3枚まで・解除で消える一時保存） */
  .nv-photos{display:none;gap:8px;padding:8px 10px;background:var(--bg)}
  .nvov.car .nv-photos{display:flex}
  .nv-photos .pslot{flex:1;min-width:0;aspect-ratio:1;border-radius:12px;overflow:hidden;
    border:2px dashed var(--line);background:var(--card);padding:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;position:relative;
    font-size:30px;color:var(--route);font-family:var(--gothic)}
  .nv-photos .pslot.filled{border:2px solid var(--line)}
  .nv-photos .pslot img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .nv-photos .pdel{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;
    border:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .nv-mapwrap{flex:1;position:relative;min-height:0;overflow:hidden}
  #nvMap{width:100%;height:100%;background:#DDE2D8;transition:transform .3s ease-out}
  /* 「向き上」モード: 地図ごとCSSで回転。ピン絵文字と名前ラベルは.crで逆回転して読める向きを保つ */
  .cr{position:absolute;left:0;top:0;width:0;height:0;
    transform:rotate(var(--mrot,0deg));transition:transform .3s ease-out}
  .nvov.pick #nvHead{display:none}
  .nv-pickbar{display:none;gap:8px;padding:8px 10px;background:var(--paper);
    border-bottom:1px solid var(--line);position:relative;z-index:3}
  .nvov.pick .nv-pickbar{display:flex}
  .nv-pickbar input{flex:1;min-width:0;font-family:var(--gothic);font-size:15px;padding:9px 12px;
    border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  .nv-pickbar button{border:1px solid var(--line);background:var(--card);color:var(--route);
    border-radius:10px;padding:9px 14px;font-size:14px;font-family:var(--gothic);cursor:pointer;white-space:nowrap}
  .nv-cands{position:absolute;top:100%;left:10px;right:10px;z-index:1200;background:var(--card);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(27,36,34,.2)}
  .nv-cands:empty{display:none}
  .nv-cand{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);
    background:none;font-family:var(--gothic);font-size:14px;color:var(--ink);padding:11px 13px;cursor:pointer}
  .nv-cand:last-child{border-bottom:0}
  .nv-cross{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:1000;pointer-events:none;color:var(--danger);font-size:34px;line-height:1;
    text-shadow:0 0 3px #fff,0 0 6px #fff;font-weight:700}
  .nvov.pick .nv-cross{display:block}
  /* 画面外ピンの方向インジケータ（ピンが見えない時だけ端に出る・タップでピンへ） */
  .nv-edge{display:none;position:absolute;z-index:940;width:60px;height:60px;margin:-30px 0 0 -30px;
    border-radius:50%;background:#fff;border:2px solid var(--danger);
    box-shadow:0 3px 12px rgba(0,0,0,.35);cursor:pointer;padding:0;font-family:var(--gothic);
    flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .nv-edge.on{display:flex}
  .nv-edge .ico{font-size:18px;line-height:1;pointer-events:none}
  .nv-edge .d{font-size:11px;font-weight:800;color:#274A73;line-height:1;pointer-events:none}
  .nv-edge-arr{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;
    border:8px solid transparent;border-left:13px solid var(--danger)}

<script>
(function(){
"use strict";
const VER = "0.6.13";

/* ───── カテゴリ（凡例の色） ───── */
const DEFAULT_CATS=[
  {n:"飲食",c:"#B4462F"},{n:"買い物",c:"#8A5FB0"},{n:"病院・薬局",c:"#2F7DBF"},
  {n:"仕事",c:"#0B6E5F"},{n:"公共",c:"#5A6B7A"},{n:"駐車場",c:"#7B6A2E"},
  {n:"レジャー",c:"#C07C00"}
];
/* カテゴリは自由に変更・新設できる（設定→カテゴリを編集）。
   「その他」だけは削除分の受け皿として常に最後に固定 */
const CAT_OTHER={n:"その他",c:"#6B7280"};
/* カラーパレット（色名付き・色相順。同じ色を複数カテゴリで使ってもよい） */
const CAT_PALETTE=[
  {n:"赤",c:"#C43A2F"},{n:"えんじ",c:"#8E2F3C"},{n:"ピンク",c:"#C9628B"},
  {n:"オレンジ",c:"#D96C2E"},{n:"茶色",c:"#8C5A3A"},{n:"こげ茶",c:"#5D4032"},
  {n:"山吹",c:"#C7920F"},{n:"からし",c:"#A8892B"},{n:"黄緑",c:"#7E9C2F"},
  {n:"緑",c:"#3B8A5E"},{n:"深緑",c:"#1F5E40"},{n:"青緑",c:"#2E8A8A"},
  {n:"水色",c:"#3E96C9"},{n:"青",c:"#2F6FBF"},{n:"紺",c:"#2C4370"},
  {n:"藤色",c:"#8B7FC7"},{n:"紫",c:"#7A4FB0"},{n:"赤紫",c:"#A34E8C"},
  {n:"グレー",c:"#6B7280"},{n:"墨",c:"#3A3F44"}
];
const CAT_COLORS=CAT_PALETTE.map(x=>x.c);
let CATS;
function loadCats(){
  let arr=null;
  try{arr=JSON.parse(localStorage.getItem("basho_cats"));}catch(e){}
  if(!Array.isArray(arr)||!arr.length) arr=DEFAULT_CATS.slice();
  arr=arr.filter(x=>x&&x.n&&x.n!==CAT_OTHER.n).map(x=>({n:String(x.n),c:x.c||CAT_COLORS[0]}));
  CATS=arr.concat([CAT_OTHER]);
}
loadCats();
function saveCats(){
  try{localStorage.setItem("basho_cats",JSON.stringify(CATS.filter(x=>x.n!==CAT_OTHER.n)));}catch(e){}
}
const catColor=n=>(CATS.find(x=>x.n===n)||{c:"#6B7280"}).c;

/* ───── 保存 ───── */
const KEY="basho_v1";
const Store={
  async load(){
    if(window.storage){try{const r=await window.storage.get(KEY);if(r&&r.value)return JSON.parse(r.value);}catch(e){}}
    try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}
    return null;
  },
  async save(d){
    const j=JSON.stringify(d);
    if(window.storage){try{await window.storage.set(KEY,j);return;}catch(e){}}
    try{localStorage.setItem(KEY,j);}catch(e){}
  }
};

/* ───── 都道府県（読み・地方） ───── */
const PREF_INFO={
  "北海道":["ほっかいどう","北海道"],
  "青森県":["あおもりけん","東北"],"岩手県":["いわてけん","東北"],"宮城県":["みやぎけん","東北"],
  "秋田県":["あきたけん","東北"],"山形県":["やまがたけん","東北"],"福島県":["ふくしまけん","東北"],
  "茨城県":["いばらきけん","関東"],"栃木県":["とちぎけん","関東"],"群馬県":["ぐんまけん","関東"],
  "埼玉県":["さいたまけん","関東"],"千葉県":["ちばけん","関東"],"東京都":["とうきょうと","関東"],
  "神奈川県":["かながわけん","関東"],
  "新潟県":["にいがたけん","中部"],"富山県":["とやまけん","中部"],"石川県":["いしかわけん","中部"],
  "福井県":["ふくいけん","中部"],"山梨県":["やまなしけん","中部"],"長野県":["ながのけん","中部"],
  "岐阜県":["ぎふけん","中部"],"静岡県":["しずおかけん","中部"],"愛知県":["あいちけん","中部"],
  "三重県":["みえけん","近畿"],"滋賀県":["しがけん","近畿"],"京都府":["きょうとふ","近畿"],
  "大阪府":["おおさかふ","近畿"],"兵庫県":["ひょうごけん","近畿"],"奈良県":["ならけん","近畿"],
  "和歌山県":["わかやまけん","近畿"],
  "鳥取県":["とっとりけん","中国"],"島根県":["しまねけん","中国"],"岡山県":["おかやまけん","中国"],
  "広島県":["ひろしまけん","中国"],"山口県":["やまぐちけん","中国"],
  "徳島県":["とくしまけん","四国"],"香川県":["かがわけん","四国"],"愛媛県":["えひめけん","四国"],
  "高知県":["こうちけん","四国"],
  "福岡県":["ふくおかけん","九州・沖縄"],"佐賀県":["さがけん","九州・沖縄"],"長崎県":["ながさきけん","九州・沖縄"],
  "熊本県":["くまもとけん","九州・沖縄"],"大分県":["おおいたけん","九州・沖縄"],"宮崎県":["みやざきけん","九州・沖縄"],
  "鹿児島県":["かごしまけん","九州・沖縄"],"沖縄県":["おきなわけん","九州・沖縄"]};
const PREF_ORDER=Object.keys(PREF_INFO);
const REGIONS=[["北海道","ほっかいどう"],["東北","とうほく"],["関東","かんとう"],["中部","ちゅうぶ"],
  ["近畿","きんき"],["中国","ちゅうごく"],["四国","しこく"],["九州・沖縄","きゅうしゅうおきなわ"]];
const prefRegion=pf=>(PREF_INFO[pf]||["",""])[1];

/* 緯度経度→都道府県（端末内で判定・どこにも送信しない） */
function pointToPref(lat,lng){
  const G=window.PREF_GEO; if(!G||!isFinite(lat)||!isFinite(lng)) return "";
  for(const name in G){
    for(const ring of G[name]){
      let c=false;
      for(let i=0,j=ring.length-1;i<ring.length;j=i++){
        const x1=ring[i][0],y1=ring[i][1],x2=ring[j][0],y2=ring[j][1];
        if((y1>lat)!==(y2>lat) && lng<(x2-x1)*(lat-y1)/(y2-y1)+x1) c=!c;
      }
      if(c) return name;
    }
  }
  /* 海上・小島（間引き済み）: いちばん近い県境の県を採る（約150kmまで） */
  let bn="",bd=Infinity;
  const kx=Math.cos(lat*Math.PI/180);
  for(const name in G) for(const ring of G[name]) for(const p of ring){
    const dx=(p[0]-lng)*kx, dy=p[1]-lat, d=dx*dx+dy*dy;
    if(d<bd){bd=d;bn=name;}
  }
  return bd<1.35*1.35 ? bn : "";
}
function updatePref(p){
  if(!window.PREF_GEO) return;                  /* データ未読込時は触らない */
  if(p.lat&&p.lng){const pr=pointToPref(+p.lat,+p.lng); if(pr)p.pref=pr; else delete p.pref;}
  else delete p.pref;
}

let places=[], filterCat="", onlyFix=false, filterRegion="", filterPref="";

/* ───── 写真（IndexedDB・端末内のみ。ギャラリーには保存しない仕様） ───── */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);
    const r=indexedDB.open("basho_img",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("img");
    r.onsuccess=()=>{this.db=r.result;res(this.db);};
    r.onerror=()=>rej(r.error);});},
  set(k,v){return this.open().then(db=>new Promise((res,rej)=>{
    const t=db.transaction("img","readwrite");t.objectStore("img").put(v,k);
    t.oncomplete=res;t.onerror=()=>rej(t.error);}));},
  get(k){return this.open().then(db=>new Promise((res,rej)=>{
    const q=db.transaction("img").objectStore("img").get(k);
    q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}));},
  del(k){return this.open().then(db=>new Promise((res,rej)=>{
    const t=db.transaction("img","readwrite");t.objectStore("img").delete(k);
    t.oncomplete=res;t.onerror=()=>rej(t.error);}));}
};
const phCache=new Map();
function phGet(id){
  if(phCache.has(id)) return Promise.resolve(phCache.get(id));
  return IDB.get(id).then(v=>{if(v)phCache.set(id,v);return v;}).catch(()=>null);
}
/* 撮影/選択→縮小→IndexedDBへ保存し、新しい画像idをcbに渡す（場所の写真・駐車写真の共通部品） */
function phCapture(fromGallery,cb){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*";
  if(!fromGallery) inp.capture="environment";
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const img=new Image();
    img.onload=()=>{
      const MAX=1400, sc=Math.min(1,MAX/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      const du=cv.toDataURL("image/jpeg",.82);
      URL.revokeObjectURL(img.src);
      const id="i"+Date.now()+Math.random().toString(36).slice(2,5);
      IDB.set(id,du).then(()=>{ phCache.set(id,du); cb(id); })
        .catch(()=>toast("写真を保存できませんでした（空き容量を確認）"));
    };
    img.onerror=()=>toast("この画像は読み込めません");
    img.src=URL.createObjectURL(f);
  };
  inp.click();
}
function phShoot(p,fromGallery){
  phCapture(fromGallery,id=>{
    p.ph=p.ph||[]; p.ph.push(id); p.updated=Date.now(); save();   /* 古い順=左端が一番最初の1枚 */
  });
}
function phDelete(p,id){
  if(!confirm("この写真を削除します。\nこのアプリの中にしか無いため、元に戻せません。よろしいですか？")) return;
  p.ph=(p.ph||[]).filter(x=>x!==id);
  IDB.del(id).catch(()=>{}); phCache.delete(id);
  save(); toast("写真を削除しました");
}
function phPurgePlace(p){ (p.ph||[]).forEach(id=>{IDB.del(id).catch(()=>{});phCache.delete(id);}); }

/* ライトボックス */
const lb=document.getElementById("lb");
let lbList=[], lbIdx=0;
function lbClose(){ lb.classList.remove("on"); lb.innerHTML=""; }
function lbShow(){
  const id=lbList[lbIdx];
  lb.innerHTML='<img alt="">'+
    (lbList.length>1
      ?'<button class="lbnav" style="left:8px">‹</button><button class="lbnav" style="right:8px">›</button>'+
       '<div class="lbc">'+(lbIdx+1)+" / "+lbList.length+'</div>'
      :"");
  phGet(id).then(du=>{const im=lb.querySelector("img");if(im&&du)im.src=du;});
  const nav=lb.querySelectorAll(".lbnav");
  if(nav.length){
    nav[0].onclick=e=>{e.stopPropagation();lbIdx=(lbIdx-1+lbList.length)%lbList.length;lbShow();};
    nav[1].onclick=e=>{e.stopPropagation();lbIdx=(lbIdx+1)%lbList.length;lbShow();};
  }
  lb.classList.add("on");
}
function lbOpen(p,id){ lbList=(p.ph||[]).slice(); lbIdx=Math.max(0,lbList.indexOf(id)); if(lbList.length)lbShow(); }
/* 左右フリックで前後の画像へ（最後→先頭のループ。箱と同じ操作感） */
let lbSwiped=false, lbTx=0, lbTy=0;
lb.addEventListener("touchstart",e=>{
  const t=e.touches[0]; lbTx=t.clientX; lbTy=t.clientY; lbSwiped=false;
},{passive:true});
lb.addEventListener("touchend",e=>{
  const t=e.changedTouches[0], dx=t.clientX-lbTx, dy=t.clientY-lbTy;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5 && lbList.length>1){
    lbSwiped=true;   /* 直後のclickで閉じないように（clickが来ない端末もあるため時間で自動解除） */
    setTimeout(()=>{lbSwiped=false;},400);
    lbIdx=(lbIdx+(dx<0?1:-1)+lbList.length)%lbList.length;
    lbShow();
  }
},{passive:true});
lb.onclick=()=>{ if(lbSwiped) return; lbClose(); };
let sortMode=localStorage.getItem("basho_sort")||"use";
if(sortMode!=="use"&&sortMode!=="kana"&&sortMode!=="near") sortMode="use";
let viewMode=localStorage.getItem("basho_view")==="tile"?"tile":"list";
let lastPos=null;

/* ───── GPS（押した瞬間から裏で走らせ、いちばん良い値を採る） ───── */
const Gps={
  best:null, watch:null, timer:null, cb:null, state:"idle",
  start(cb){
    this.stop(); this.best=null; this.cb=cb; this.state="wait"; this.emit();
    if(!navigator.geolocation){ this.state="ng"; this.reason="この端末では位置情報が使えません"; return this.emit(); }
    if(location.protocol==="file:"){ this.state="ng"; this.reason="ファイルを直接開くとGPSが使えません"; return this.emit(); }
    this.watch=navigator.geolocation.watchPosition(
      p=>{
        const c=p.coords;
        if(!this.best || c.accuracy < this.best.acc){
          this.best={lat:+c.latitude.toFixed(6), lng:+c.longitude.toFixed(6), acc:Math.round(c.accuracy)};
          this.state="ok"; this.emit();
        }
        if(this.best.acc<=15) this.stop(true);
      },
      err=>{
        if(this.best) return;
        this.state="ng";
        this.reason = err.code===1 ? "位置情報が許可されていません" : "位置を取得できませんでした";
        this.emit();
      },
      {enableHighAccuracy:true, timeout:20000, maximumAge:0}
    );
    this.timer=setTimeout(()=>this.stop(true),20000);
  },
  stop(keep){
    if(this.watch!=null){navigator.geolocation.clearWatch(this.watch);this.watch=null;}
    if(this.timer){clearTimeout(this.timer);this.timer=null;}
    if(!keep) this.cb=null;
  },
  emit(){ if(this.cb) this.cb(this.state,this.best,this.reason); }
};

/* ───── 便利関数 ───── */
function norm(s){
  if(!s) return "";
  return String(s).normalize("NFKC").toLowerCase()
    .replace(/[\u30a1-\u30f6]/g,m=>String.fromCharCode(m.charCodeAt(0)-0x60))
    .replace(/[\s\-ー・,、.。()（）]/g,"");
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function openUrl(u){const a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();}
function hasSpot(p){return !!(p.url||(p.lat&&p.lng)||p.addr);}
function q(p){ return (p.lat&&p.lng) ? p.lat+","+p.lng : encodeURIComponent(p.addr||p.name); }
function openMap(p){ bump(p); if(p.url) return openUrl(p.url); openUrl("https://www.google.com/maps/search/?api=1&query="+q(p)); }
function openRoute(p){ bump(p); openUrl("https://www.google.com/maps/dir/?api=1&destination="+q(p)); }
function openByName(p){ bump(p); openUrl("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.name+" "+(p.addr||""))); }
function bump(p){ p.count=(p.count||0)+1; p.used=Date.now(); save(); }
function pickCoords(url){
  if(!url) return null;
  const m = url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||url.match(/[?&]q=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)
        ||url.match(/[?&]query=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  return m?{lat:m[1],lng:m[2]}:null;
}
function save(){ Store.save(places); render(); }

/* ───── 距離（近い順ソート用） ───── */
function distM(a,b){
  const R=6371e3, rad=x=>x*Math.PI/180;
  const dLa=rad(b.lat-a.lat), dLo=rad(b.lng-a.lng);
  const s=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function fmtDist(m){ return m<950 ? Math.round(m/10)*10+"m" : (m/1000).toFixed(m<9500?1:0)+"km"; }
function placeDist(p){
  if(!lastPos||!(p.lat&&p.lng)) return null;
  return distM(lastPos,{lat:+p.lat,lng:+p.lng});
}
function ensurePos(){
  if(!navigator.geolocation) return toast("この端末では位置情報が使えません");
  navigator.geolocation.getCurrentPosition(
    p=>{lastPos={lat:p.coords.latitude,lng:p.coords.longitude};render();},
    ()=>toast("現在地が取れないため、いつもの順で表示しています"),
    {enableHighAccuracy:false,timeout:8000,maximumAge:60000}
  );
}

/* ───── ローマ字→ひらがな（検索用。yakkyoku→やっきょく） ───── */
const ROMA={kya:"きゃ",kyu:"きゅ",kyo:"きょ",gya:"ぎゃ",gyu:"ぎゅ",gyo:"ぎょ",
  sha:"しゃ",shu:"しゅ",sho:"しょ",sya:"しゃ",syu:"しゅ",syo:"しょ",
  ja:"じゃ",ju:"じゅ",jo:"じょ",ji:"じ",jya:"じゃ",jyu:"じゅ",jyo:"じょ",zya:"じゃ",zyu:"じゅ",zyo:"じょ",
  cha:"ちゃ",chu:"ちゅ",cho:"ちょ",tya:"ちゃ",tyu:"ちゅ",tyo:"ちょ",
  nya:"にゃ",nyu:"にゅ",nyo:"にょ",hya:"ひゃ",hyu:"ひゅ",hyo:"ひょ",
  bya:"びゃ",byu:"びゅ",byo:"びょ",pya:"ぴゃ",pyu:"ぴゅ",pyo:"ぴょ",
  mya:"みゃ",myu:"みゅ",myo:"みょ",rya:"りゃ",ryu:"りゅ",ryo:"りょ",
  shi:"し",chi:"ち",tsu:"つ",thi:"てぃ",dhi:"でぃ",
  fa:"ふぁ",fi:"ふぃ",fe:"ふぇ",fo:"ふぉ",
  ka:"か",ki:"き",ku:"く",ke:"け",ko:"こ",ga:"が",gi:"ぎ",gu:"ぐ",ge:"げ",go:"ご",
  sa:"さ",si:"し",su:"す",se:"せ",so:"そ",za:"ざ",zi:"じ",zu:"ず",ze:"ぜ",zo:"ぞ",
  ta:"た",ti:"ち",tu:"つ",te:"て",to:"と",da:"だ",di:"ぢ",du:"づ",de:"で",do:"ど",
  na:"な",ni:"に",nu:"ぬ",ne:"ね",no:"の",
  ha:"は",hi:"ひ",hu:"ふ",fu:"ふ",he:"へ",ho:"ほ",
  ba:"ば",bi:"び",bu:"ぶ",be:"べ",bo:"ぼ",pa:"ぱ",pi:"ぴ",pu:"ぷ",pe:"ぺ",po:"ぽ",
  ma:"ま",mi:"み",mu:"む",me:"め",mo:"も",ya:"や",yu:"ゆ",yo:"よ",
  ra:"ら",ri:"り",ru:"る",re:"れ",ro:"ろ",wa:"わ",wo:"を",
  a:"あ",i:"い",u:"う",e:"え",o:"お",n:"ん"};
function romaToHira(s){
  s=String(s||"").toLowerCase().replace(/[^a-z\-]/g,"");
  if(!s) return "";
  let out="",i=0;
  while(i<s.length){
    const c=s[i];
    if(c==="-"){out+="ー";i++;continue;}
    if(c===s[i+1]&&!"aiueon".includes(c)){out+="っ";i++;continue;}
    if(c==="n"){
      const nx=s[i+1];
      if(nx==null||!"aiueoyn".includes(nx)){out+="ん";i++;continue;}
      if(nx==="n"){out+="ん";i+=("aiueoy".includes(s[i+2]||"")?1:2);continue;}
    }
    const t3=ROMA[s.slice(i,i+3)],t2=ROMA[s.slice(i,i+2)],t1=ROMA[c];
    if(t3){out+=t3;i+=3;}
    else if(t2){out+=t2;i+=2;}
    else if(t1){out+=t1;i+=1;}
    else{out+=c;i++;}
  }
  return out;
}

/* ───── 一覧 ───── */
function sorted(){
  return places.slice().sort((a,b)=>{
    if(sortMode==="near"){
      const da=placeDist(a), db=placeDist(b);
      if(da!=null&&db!=null&&da!==db) return da-db;
      if((da!=null)!==(db!=null)) return da!=null?-1:1;
      return norm(a.kana||a.name).localeCompare(norm(b.kana||b.name),"ja");
    }
    if((b.fav?1:0)!==(a.fav?1:0)) return (b.fav?1:0)-(a.fav?1:0);
    if(sortMode==="kana") return norm(a.kana||a.name).localeCompare(norm(b.kana||b.name),"ja");
    if((b.count||0)!==(a.count||0)) return (b.count||0)-(a.count||0);
    return (b.used||b.created||0)-(a.used||a.created||0);
  });
}
function render(){
  /* 再描画（編集保存・★・写真操作など）で一覧のスクロールが先頭に戻らないよう保持。
     内容が減った時はブラウザが自動で上限に丸めてくれる */
  const se=document.scrollingElement||document.documentElement;
  const y=se.scrollTop;
  _renderBody();
  se.scrollTop=y;
}
function _renderBody(){
  const qi=document.getElementById("q"), qn=norm(qi.value);
  document.getElementById("clearq").classList.toggle("on",!!qi.value);

  const lg=document.getElementById("legend"); lg.innerHTML="";
  const cats=[...new Set(places.map(p=>p.cat).filter(Boolean))];
  const fixN=places.filter(p=>!hasSpot(p)||(p.acc&&p.acc>80)).length;
  if(places.length){
    lg.appendChild(chip("すべて","",""));
    cats.forEach(c=>lg.appendChild(chip(c,c,catColor(c))));
    if(fixN){
      const b=document.createElement("button");
      b.className="chip fix"+(onlyFix?" on":"");
      b.textContent="位置を直す "+fixN;
      b.onclick=()=>{onlyFix=!onlyFix;render();};
      lg.appendChild(b);
    }
  }

  /* エリア行: 2つ以上の県にまたがった時だけ出す */
  const ar=document.getElementById("areas"); ar.innerHTML="";
  const prefSet=[...new Set(places.map(p=>p.pref).filter(Boolean))];
  const multiPref=prefSet.length>1;
  if(!multiPref){ filterRegion=""; filterPref=""; }
  else{
    ar.appendChild(areaChip("全国",!filterRegion&&!filterPref,()=>{filterRegion="";filterPref="";}));
    REGIONS.filter(r=>prefSet.some(pf=>prefRegion(pf)===r[0])).forEach(([rn])=>{
      const n=places.filter(p=>prefRegion(p.pref||"")===rn).length;
      ar.appendChild(areaChip(rn+" "+n,filterRegion===rn&&!filterPref,()=>{
        if(filterRegion===rn&&!filterPref){filterRegion="";}
        else{filterRegion=rn;filterPref="";}
      }));
      if(filterRegion===rn){
        prefSet.filter(pf=>prefRegion(pf)===rn)
          .sort((a,b)=>PREF_ORDER.indexOf(a)-PREF_ORDER.indexOf(b))
          .forEach(pf=>{
            const c=places.filter(p=>p.pref===pf).length;
            ar.appendChild(areaChip(pf+" "+c,filterPref===pf,()=>{
              filterPref=(filterPref===pf?"":pf);
            }));
          });
      }
    });
  }

  const qr=norm(romaToHira(qi.value));
  const rows=sorted().filter(p=>{
    if(onlyFix && hasSpot(p) && !(p.acc&&p.acc>80)) return false;
    if(filterCat && p.cat!==filterCat) return false;
    if(filterPref){ if(p.pref!==filterPref) return false; }
    else if(filterRegion){ if(prefRegion(p.pref||"")!==filterRegion) return false; }
    if(!qn) return true;
    const pi=PREF_INFO[p.pref]||["",""];
    const rg=REGIONS.find(r=>r[0]===pi[1])||["",""];
    const hay=norm([p.name,p.kana,p.cat,p.addr,p.memo,p.tel,p.pref||"",pi[0],pi[1],rg[1]].join(" "));
    return hay.includes(qn)||(qr&&qr!==qn&&hay.includes(qr));
  });
  document.getElementById("tally").textContent = places.length ? rows.length+" / "+places.length : "";

  const list=document.getElementById("list"); list.innerHTML="";
  list.className=(viewMode==="tile"&&rows.length)?"tiles":"list";
  if(!places.length){
    list.innerHTML='<div class="empty"><b>まだ空です</b>今いる場所で右下のボタンを押すと、その地点が記録されます。名前を入れるだけで登録は終わりです。</div>';
    return;
  }
  if(!rows.length){
    list.innerHTML='<div class="empty"><b>見つかりません</b>別の言葉で探すか、この場所を新しく登録してください。</div>';
    return;
  }
  if(viewMode==="tile"){
    rows.forEach(p=>{
      const el=document.createElement("div");
      el.className="tile"; el.style.setProperty("--catcolor",catColor(p.cat));
      const dm=(sortMode==="near")?placeDist(p):null;
      const sub=[dm!=null?fmtDist(dm):"",p.cat||""].filter(Boolean).join(" ／ ");
      el.innerHTML=
        '<button class="tile-main"><span class="t-name">'+(p.fav?"★ ":"")+esc(p.name)+'</span>'+
        (sub?'<span class="t-sub">'+esc(sub)+'</span>':"")+'</button>'+
        '<button class="t-edit" aria-label="編集">✎</button>';
      el.querySelector(".tile-main").onclick=()=>hasSpot(p)?openMap(p):(toast("位置がまだ入っていません"),form(p));
      el.querySelector(".t-edit").onclick=()=>form(p);
      list.appendChild(el);
    });
    return;
  }
  rows.forEach(p=>{
    const el=document.createElement("div");
    el.className="card"; el.style.setProperty("--catcolor",catColor(p.cat));
    const dm=(sortMode==="near")?placeDist(p):null;
    const sub=[dm!=null?fmtDist(dm):"",p.addr,p.memo].filter(Boolean).join(" ／ ");
    let pill="";
    if(!hasSpot(p)) pill='<div class="pill warn">位置なし</div>';
    else if(p.acc&&p.acc>80) pill='<div class="pill warn">おおよそ ±'+p.acc+'m</div>';
    else if(p.acc) pill='<div class="pill">±'+p.acc+'m</div>';
    el.innerHTML=
      '<div class="card-main">'+
        '<div class="cm-text">'+
          (p.cat?'<div class="cat">'+esc(p.cat)+(multiPref&&p.pref?'<span class="preftag">　'+esc(p.pref)+'</span>':'')+'</div>':'')+
          '<div class="name">'+esc(p.name)+'</div>'+
          (sub?'<div class="sub">'+esc(sub)+'</div>':'')+pill+
        '</div>'+
        '<div class="phbox">'+
          '<div class="phstrip"></div>'+
          '<div class="phbtns">'+
            '<button data-ph="cam">📷写真</button>'+
            '<button data-ph="pick">📁保存画像</button>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<button class="star'+(p.fav?" on":"")+'" aria-label="よく行く">'+(p.fav?"★":"☆")+'</button>'+
      '<div class="actions">'+
        '<button data-a="map">地図を開く</button>'+
        '<button data-a="route">経路</button>'+
        (p.tel?'<button data-a="tel">電話</button>':'')+
        '<button data-a="nav">周辺</button>'+
      '</div>';
    /* カード本体タップ＝編集（地図は「地図を開く」ボタンから） */
    el.querySelector(".card-main").onclick=()=>form(p);
    /* 写真ボックス: サムネ列(新しい順)+下の固定2ボタン。タップ=ライトボックス/長押し=削除 */
    const strip=el.querySelector(".phstrip");
    if(!(p.ph&&p.ph.length)) strip.style.display="none";
    el.querySelectorAll(".phbtns button").forEach(b=>{
      b.onclick=e=>{e.stopPropagation();phShoot(p,b.dataset.ph==="pick");};
    });
    (p.ph||[]).forEach(id=>{
      const im=document.createElement("img");
      im.className="ph"; im.alt="";
      im.oncontextmenu=e=>e.preventDefault();
      im.draggable=false;
      phGet(id).then(du=>{if(du)im.src=du;});
      let lpT=null, lpFired=false, sx=0, sy=0;
      const cancel=()=>{if(lpT){clearTimeout(lpT);lpT=null;}};
      im.onpointerdown=e=>{lpFired=false;sx=e.clientX;sy=e.clientY;
        lpT=setTimeout(()=>{lpT=null;lpFired=true;phDelete(p,id);},600);};
      im.onpointermove=e=>{if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>8)cancel();};
      im.onpointerup=cancel; im.onpointerleave=cancel; im.onpointercancel=cancel;
      im.onclick=e=>{e.stopPropagation(); if(lpFired){lpFired=false;return;} lbOpen(p,id);};
      strip.appendChild(im);
    });
    el.querySelector(".star").onclick=()=>{p.fav=!p.fav;save();};
    el.querySelectorAll(".actions button").forEach(b=>b.onclick=()=>{
      const a=b.dataset.a;
      if(a==="map") hasSpot(p)?openMap(p):(toast("位置がまだ入っていません"),form(p));
      else if(a==="route") hasSpot(p)?openRoute(p):(toast("位置がまだ入っていません"),form(p));
      else if(a==="tel") location.href="tel:"+p.tel.replace(/[^\d+]/g,"");
      else if(a==="nav"){
        /* 座標が無ければリンクからの抽出をもう一度試す（フルURLなら取れる） */
        if(!(p.lat&&p.lng)){
          const c=pickCoords(p.url);
          if(c){p.lat=c.lat;p.lng=c.lng;p.acc=null;updatePref(p);save();}
        }
        if(p.lat&&p.lng){bump(p);nvOpen("place",p);}
        else toast("位置が入っていません。編集の「🗺 地図で位置を決める」でピンを置いてください");
      }
      else form(p);
    });
    list.appendChild(el);
  });
}
function chip(label,val,color){
  const b=document.createElement("button");
  b.className="chip"+(filterCat===val&&!onlyFix?" on":"");
  b.innerHTML=(color?'<span class="dot" style="background:'+color+'"></span>':"")+esc(label);
  b.onclick=()=>{filterCat=(filterCat===val?"":val);onlyFix=false;render();};
  return b;
}
function areaChip(label,on,fn){
  const b=document.createElement("button");
  b.className="chip"+(on?" on":"");
  b.textContent=label;
  b.onclick=()=>{fn();onlyFix=false;render();};
  return b;
}

/* ───── 共有ターゲット受信（Googleマップ「共有」→場所帳） ───── */
function handleShare(){
  const sp=new URLSearchParams(location.search);
  if(!(sp.has("title")||sp.has("text")||sp.has("url"))) return false;
  const title=(sp.get("title")||"").trim(), text=(sp.get("text")||"").trim(), urlP=(sp.get("url")||"").trim();
  history.replaceState(null,"",location.pathname); /* リロード・戻るで再発火させない */
  let url=urlP;
  if(!url){ const m=text.match(/https?:\/\/\S+/); if(m)url=m[0]; }
  let name=title;
  if(!name) name=text.replace(/https?:\/\/\S+/g,"").split("\n").map(s=>s.trim()).filter(Boolean)[0]||"";
  /* 座標が拾えるなら拾う（フルURL内・共有テキスト内の「lat, lng」） */
  let c=pickCoords(url);
  if(!c){ const m=text.match(/(-?\d{1,2}\.\d{3,}),\s*(-?\d{1,3}\.\d{3,})/); if(m)c={lat:m[1],lng:m[2]}; }
  if(!c){ c=dmsToDec(title)||dmsToDec(text); }
  /* ピン長押しの共有は「名称」が座標の文字列そのもの → 名前欄には入れず座標として扱う */
  const nm=name.match(/^\s*(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})\s*$/);
  if(nm){ if(!c)c={lat:nm[1],lng:nm[2]}; name=""; }
  else if(dmsToDec(name)||/^(ドロップされたピン|dropped pin|指定した地点|plus\s?code)/i.test(name.trim())) name="";
  if(!name&&!url&&!c) return false;
  shareAdd(name,url,c);
  return true;
}
/* 度分秒（35°40'48.4"N 139°46'07.7"E）→ 10進。ピン長押し共有はこの形式で来ることがある */
function dmsToDec(t){
  const m=String(t||"").match(/(\d{1,2})[°度]\s*(\d{1,2})['′]\s*([\d.]+)["″]?\s*([NS])[^\dNSEW]{0,5}(\d{1,3})[°度]\s*(\d{1,2})['′]\s*([\d.]+)["″]?\s*([EW])/i);
  if(!m)return null;
  const la=(+m[1]+m[2]/60+m[3]/3600)*(/s/i.test(m[4])?-1:1);
  const lo=(+m[5]+m[6]/60+m[7]/3600)*(/w/i.test(m[8])?-1:1);
  if(!isFinite(la)||!isFinite(lo)||Math.abs(la)>90||Math.abs(lo)>180)return null;
  return {lat:la.toFixed(6),lng:lo.toFixed(6)};
}
function shareAdd(name,url,c){
  let cc=c?{lat:String(c.lat),lng:String(c.lng)}:null;   /* OCR・コピペで後から入ることがある */
  sheet.innerHTML=
    '<h2>共有から登録</h2>'+
    '<div class="gps ok" id="shbox"></div>'+
    '<label>名前</label><input type="text" id="f_name" value="'+esc(name)+'"'+(name?'':' placeholder="この場所の名前を入力"')+'>'+
    '<label>リンク</label><input type="text" id="f_url" value="'+esc(url)+'">'+
    (c?'':'<button class="subbtn" id="shOcr">🔢 スクショから座標を読む</button>')+
    '<details><summary>カテゴリ・メモも入れる</summary>'+
      '<label>カテゴリ</label>'+catFieldHTML("その他")+
      '<label>メモ</label><textarea id="f_memo"></textarea>'+
    '</details>'+
    (c?'':'<div class="hint">共有には座標が入っていませんでした。座標が写ったスクショがあれば「🔢 スクショから座標を読む」で。'+
      'なければ登録後にそのまま「地図で位置を決める」が開きます（検索欄に名前が入った状態・不要なら戻るでスキップ）。</div>')+
    '<div class="sheet-actions">'+
      '<button class="btn" id="cancel">やめる</button>'+
      '<button class="btn primary" id="ok">登録する</button>'+
    '</div>';
  veil.classList.add("on"); sheet.scrollTop=0;
  catFieldWire();
  const shbox=document.getElementById("shbox");
  const shSync=()=>{ shbox.innerHTML='Googleマップから受け取りました'+
    (cc?'<span class="mono">'+esc(cc.lat)+", "+esc(cc.lng)+'</span>':''); };
  shSync();
  const shOcr=document.getElementById("shOcr");
  if(shOcr) shOcr.onclick=()=>{
    ocrPick((lat,lng)=>{ cc={lat:String(lat),lng:String(lng)}; shSync(); toast("座標を入れました。「登録する」で確定"); });
  };
  /* リンク欄：フルURL・座標コピペ（35.67, 139.69）からの自動読み取り（編集シートと同じ挙動） */
  document.getElementById("f_url").addEventListener("input",e=>{

    const m=v.match(/^\s*(-?\d{1,2}\.\d{3,}),\s*(-?\d{1,3}\.\d{3,})\s*$/);
    if(m){ cc={lat:m[1],lng:m[2]}; shSync(); e.target.value=url;
      toast("座標を読み取りました（リンク欄は元に戻しています）"); }
  });
  document.getElementById("cancel").onclick=closeSheet;
  document.getElementById("ok").onclick=()=>{
    const nm=document.getElementById("f_name").value.trim();
    if(!nm) return toast("名前を入れてください");
    const rec={
      id:"p"+Date.now()+Math.random().toString(36).slice(2,5),
      name:nm, kana:"", cat:document.getElementById("f_cat").value,
      memo:document.getElementById("f_memo").value.trim(),
      lat:cc?cc.lat:"", lng:cc?cc.lng:"", acc:null,
      addr:"", url:document.getElementById("f_url").value.trim(), tel:"",
      fav:false, count:0, created:Date.now(), updated:Date.now()
    };
    updatePref(rec); places.push(rec); save(); closeSheet();
    if(rec.lat&&rec.lng){ toast("「"+nm+"」を登録しました"); return; }
    /* 座標なし → そのままピン置きへ（名前で自動検索し、見つかればその辺りへジャンプ） */
    nvOpenPick(null,(lat,lng)=>{
      rec.lat=String(lat); rec.lng=String(lng); rec.acc=null;
      updatePref(rec); save();
      toast("「"+nm+"」の位置も設定しました");
    },nm);
    toast("＋印を合わせて「この位置にする」（あとで入れるなら戻る）");
  };

/* ───── 周辺モード（目的地周辺の拡大地図ナビ・地理院タイル） ───── */
const NV={map:null,std:null,photo:null,photoOn:false,destMk:null,meMk:null,accC:null,trailLn:null,
  watch:null,follow:true,mode:"place",target:null,fitted:false,lastFix:null,hdgFn:null,wl:null,
  headUp:false,curHd:null,rotShown:0,rotT:0,hasCompass:false};
const nvEl=id=>document.getElementById(id);

function nvInitMap(){
  if(NV.map) return;
  const ATT='<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>';
  NV.std=L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
    {maxZoom:20,maxNativeZoom:18,attribution:ATT});
  NV.photo=L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg",
    {maxZoom:20,maxNativeZoom:18,attribution:ATT});
  /* 名前入り地図（OSM）: 神社・店・施設の名称が載る。ピン置きの既定 */
  NV.osm=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom:20,maxNativeZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'});
  NV.map=L.map("nvMap",{zoomControl:false});
  NV.map.attributionControl.setPosition("topright");
  NV.lay=""; nvSetLayer("std");
  NV.map.on("dragstart",()=>nvFollow(false));
  NV.map.on("move zoom viewreset resize",nvEdgeSync);
}
/* レイヤー切替: std(地理院・道が正確) / photo(航空写真) / osm(名前入り) */
function nvSetLayer(k){
  if(!NV.map||NV.lay===k) return;
  [NV.std,NV.photo,NV.osm].forEach(l=>{ if(l&&NV.map.hasLayer(l)) NV.map.removeLayer(l); });
  ({std:NV.std,photo:NV.photo,osm:NV.osm})[k].addTo(NV.map);
  NV.lay=k;
  /* ボタンには「次に押すと何になるか」を表示 */
  nvEl("nvLayer").textContent = k==="std"?"写真":(k==="photo"?"名前":"地図");
}
function nvTargetLL(){
  if(NV.mode==="car") return (parking&&parking.lat!=null)?[parking.lat,parking.lng]:null;
  return NV.target?[NV.target.lat,NV.target.lng]:null;
}
function nvSetDest(){
  const t=nvTargetLL();
  if(NV.destMk){NV.map.removeLayer(NV.destMk);NV.destMk=null;}
  if(!t) return;
  const car=NV.mode==="car";
  const ic=L.divIcon({className:"",iconSize:[0,0],html:
    '<div class="cr"><div class="dest-pin">'+(car?"🚗":"📍")+'</div>'+
    '<div class="dest-name">'+esc(car?"駐車位置":(NV.target.name||""))+'</div></div>'});
  NV.destMk=L.marker(t,{icon:ic,interactive:false}).addTo(NV.map);
  nvEdgeSync();
}
/* ───── 画面外ピンの方向インジケータ ─────
   ピンが画面から外れている間だけ、中心→ピンの直線が画面枠に当たる位置に
   丸バッジ（📍＋距離＋外向き矢印）を出す。タップでピンの位置へジャンプ。
   「向き上」の回転中は #nvMap がCSS回転しているため、コンテナ座標を
   回転角ぶん座標変換してから画面内外を判定する */
let nvEdgeQ=false;
function nvEdgeSync(){
  if(nvEdgeQ) return; nvEdgeQ=true;
  requestAnimationFrame(()=>{ nvEdgeQ=false; nvEdgeDo(); });
}
function nvEdgeDo(){
  const el=nvEl("nvEdge");
  const ov=nvEl("nvov");
  const t=nvTargetLL();
  if(!ov.classList.contains("on")||ov.classList.contains("pick")||!t||!NV.map){
    el.classList.remove("on"); return;
  }
  const wrap=document.querySelector(".nv-mapwrap"), m=document.getElementById("nvMap");
  const W=wrap.clientWidth, H=wrap.clientHeight;
  if(!W||!H){ el.classList.remove("on"); return; }
  /* ピンのコンテナ座標 → 回転を織り込んだ画面（wrap）座標 */
  const p=NV.map.latLngToContainerPoint(t);
  const th=NV.rotShown*Math.PI/180;
  const rx=p.x-m.clientWidth/2, ry=p.y-m.clientHeight/2;   /* #nvMapは常にwrap中央 */
  const sx=W/2 + rx*Math.cos(th)-ry*Math.sin(th);
  const sy=H/2 + rx*Math.sin(th)+ry*Math.cos(th);
  if(sx>=0&&sx<=W&&sy>=0&&sy<=H){ el.classList.remove("on"); return; }
  /* 中心→ピンの直線が枠（余白PAD）に当たる点へクランプ */
  const dx=sx-W/2, dy=sy-H/2, PAD=44;
  const k=Math.min((W/2-PAD)/Math.max(Math.abs(dx),1e-9),(H/2-PAD)/Math.max(Math.abs(dy),1e-9));
  el.style.left=(W/2+dx*k)+"px"; el.style.top=(H/2+dy*k)+"px";
  const ang=Math.atan2(dy,dx)*180/Math.PI;
  nvEl("nvEdgeArr").style.transform="translate(-50%,-50%) rotate("+ang+"deg) translateX(34px)";
  nvEl("nvEdgeIco").textContent = NV.mode==="car"?"🚗":"📍";
  const c=NV.map.getCenter();
  nvEl("nvEdgeDist").textContent=fmtDist(distM({lat:c.lat,lng:c.lng},{lat:t[0],lng:t[1]}));
  el.classList.add("on");
}
nvEl("nvEdge").onclick=()=>{
  const t=nvTargetLL(); if(!t||!NV.map) return;
  nvFollow(false);                       /* 追従で引き戻されないように */
  NV.map.panTo(t);
  toast("ピンの位置へ移動しました（「追従」で自分に戻ります）");
};
function nvDrawTrail(){
  if(NV.trailLn){NV.map.removeLayer(NV.trailLn);NV.trailLn=null;}
  if(!parking||parking.lat==null) return;
  const pts=[[parking.lat,parking.lng]].concat(parking.trail||[]);
  if(pts.length<2) return;
  NV.trailLn=L.polyline(pts,{color:"#274A73",weight:4,opacity:.75,dashArray:"1 8",lineCap:"round"}).addTo(NV.map);
}
function nvCone(h){
  if(!NV.meMk) return;
  const el=NV.meMk.getElement&&NV.meMk.getElement();
  const c=el&&el.querySelector(".me-cone");
  if(c){c.style.display="block";c.style.transform="rotate("+h+"deg)";}
}
function nvMe(ll,acc,hd){
  if(!NV.meMk){
    const ic=L.divIcon({className:"",iconSize:[0,0],html:
      '<div class="me-wrap"><div class="me-cone"></div><div class="me-dot"></div></div>'});
    NV.meMk=L.marker(ll,{icon:ic,interactive:false,zIndexOffset:1000}).addTo(NV.map);
    NV.accC=L.circle(ll,{radius:acc,color:"#1C6EE1",weight:1,opacity:.4,fillColor:"#1C6EE1",fillOpacity:.1,interactive:false}).addTo(NV.map);
  }else{
    NV.meMk.setLatLng(ll); NV.accC.setLatLng(ll); NV.accC.setRadius(acc);
  }
  if(hd!=null) nvCone(hd);
}
function nvFollow(v){
  NV.follow=v; nvEl("nvFollow").classList.toggle("on",v);
  if(!v||!NV.lastFix) return;
  /* 追従ONの最初の一回だけ「自分とピンの両方が見える」ように拡縮。以降は自分を中央に */
  const me=[NV.lastFix.lat,NV.lastFix.lng], tg=nvTargetLL();
  if(tg&&!NV.fitted){
    NV.fitted=true; NV.fitT=Date.now();
    NV.map.fitBounds(L.latLngBounds([me,tg]).pad(NV.headUp?0.55:0.3),{maxZoom:18});
  }else NV.map.panTo(me);
}
/* ───── 北上⇄向き上（自分の向きを上に固定して地図を回す） ───── */
function nvApplyRot(){
  const m=document.getElementById("nvMap");
  const tgt=(NV.headUp&&NV.curHd!=null)?-NV.curHd:0;
  /* 359°→0°の境目で一回転して見えないよう、常に近い側へ回す */
  const d=(((tgt-NV.rotShown)%360)+540)%360-180;
  NV.rotShown+=d;
  m.style.transform="rotate("+NV.rotShown+"deg)";
  m.style.setProperty("--mrot",(-NV.rotShown)+"deg");
  nvEdgeSync();
}
function nvSetHead(v){
  NV.headUp=v;
  const b=nvEl("nvHead");
  b.classList.toggle("on",v); b.textContent=v?"向き上":"北上";
  const wrap=document.querySelector(".nv-mapwrap"), m=document.getElementById("nvMap");
  if(v){
    /* 回転しても四隅が欠けないよう、対角線サイズの正方形に広げて中央に置く */
    const d=Math.ceil(Math.hypot(wrap.clientWidth,wrap.clientHeight));
    m.style.position="absolute"; m.style.left="50%"; m.style.top="50%";
    m.style.width=d+"px"; m.style.height=d+"px";
    m.style.marginLeft=(-d/2)+"px"; m.style.marginTop=(-d/2)+"px";
  }else{
    ["position","left","top","width","height","marginLeft","marginTop"].forEach(k=>m.style[k]="");
  }
  if(NV.map){
    NV.map.invalidateSize();
    /* 回転中はLeaflet標準ドラッグを止め、下の自前ドラッグ（回転を逆補正）が引き継ぐ */
    if(NV.map.dragging){ v?NV.map.dragging.disable():NV.map.dragging.enable(); }
    if(NV.follow&&NV.lastFix) NV.map.panTo([NV.lastFix.lat,NV.lastFix.lng]);
  }
  nvApplyRot();
}
/* 「向き上」用の自前1本指ドラッグ: 指の動きを回転角ぶん逆補正してpan
   （Leaflet標準dragはCSS回転を知らず指とズレるため。2本指ピンチはLeafletに任せる） */
(function(){
  const el=document.getElementById("nvMap");
  const pts=new Map(); let dragging=false, moved=0;
  el.addEventListener("pointerdown",e=>{
    pts.set(e.pointerId,[e.clientX,e.clientY]);
    dragging=(pts.size===1&&NV.headUp&&NV.mode!=="pick"); moved=0;
  });
  el.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId)) return;
    const p=pts.get(e.pointerId), dx=e.clientX-p[0], dy=e.clientY-p[1];
    pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(!dragging||pts.size!==1||!NV.headUp||!NV.map) return;
    moved+=Math.abs(dx)+Math.abs(dy);
    if(moved>6&&NV.follow) nvFollow(false);
    const th=NV.rotShown*Math.PI/180;
    NV.map.panBy([-(dx*Math.cos(th)+dy*Math.sin(th)), -(-dx*Math.sin(th)+dy*Math.cos(th))],{animate:false});
  });
  const up=e=>{ pts.delete(e.pointerId); if(pts.size!==1) dragging=false; };
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
})();
function nvWakeLock(){
  if(navigator.wakeLock&&navigator.wakeLock.request)
    navigator.wakeLock.request("screen").then(w=>{NV.wl=w;}).catch(()=>{});
}
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden&&nvEl("nvov").classList.contains("on")) nvWakeLock();
});

function nvOpen(mode,place){
  NV.mode=mode; NV.fitted=false; NV.fitT=0; NV.lastFix=null;
  NV.target = mode==="place" ? {lat:+place.lat,lng:+place.lng,name:place.name} : null;
  document.documentElement.classList.add("nvon");
  nvEl("nvov").classList.add("on"); nvEl("nvov").classList.remove("pick");
  nvEl("nvov").classList.toggle("car",mode==="car");
  nvPhotosRender();
  nvEl("nvUnpark").style.display = mode==="car"?"":"none";
  nvEl("nvName").textContent = mode==="car"?"駐車位置":place.name;
  nvEl("nvSub").textContent = mode==="car"
    ? (parking?fmtTime(parking.t)+" に駐車"+(parking.acc!=null?" ±"+parking.acc+"m":""):"")
    : (place.acc?"登録精度 ±"+place.acc+"m":"");
  nvEl("nvDist").textContent="—";
  nvEl("nvNote").innerHTML = mode==="car"
    ? "画面を点けたまま歩くと<b>足あと</b>が残ります。帰りはこの線をたどってください。"
    : "まずはピンの周りをゆっくり確認できます。<b>「追従」</b>を押すと、あなた（青い丸）とピンの両方が見える表示になります。";
  /* ナビの地図は前回使っていたレイヤーで開く（初期値=名前入り。本人の見やすさ優先） */
  let lay="osm";
  try{lay=localStorage.getItem("basho_navlay")||"osm";}catch(e){}
  if(lay!=="std"&&lay!=="photo"&&lay!=="osm") lay="osm";
  nvInitMap(); nvSetLayer(lay);
  setTimeout(()=>{
    NV.map.invalidateSize();
    /* 前回「向き上」で使っていたら今回もその向きで開く */
    let hu=false; try{hu=localStorage.getItem("basho_headup")==="1";}catch(e){}
    nvSetHead(hu);
  },60);
  nvSetDest(); nvDrawTrail();
  const t=nvTargetLL();
  if(t) NV.map.setView(t,17);
  /* 場所の周辺: まずピンそばをゆっくり見られるよう追従OFFで開く
     （「追従」を押した時に初めて自分とピンの両方が見えるよう拡縮する）
     駐車メモ: 車へ戻る用途なので従来どおり追従ONで開く */
  nvFollow(mode==="car");
  /* GPS追従開始 */
  if(NV.watch!=null) navigator.geolocation.clearWatch(NV.watch);
  if(navigator.geolocation && location.protocol!=="file:"){
    NV.watch=navigator.geolocation.watchPosition(p=>{
      const c=p.coords, me=[+c.latitude,+c.longitude], acc=Math.round(c.accuracy);
      const hd=(c.heading!=null&&!isNaN(c.heading)&&c.speed!=null&&c.speed>0.4)?c.heading:null;
      NV.lastFix={lat:me[0],lng:me[1],acc:acc,hd:hd};
      /* 駐車直後は位置を磨く（40秒間・より良い精度が来たら差し替え）
         ただし歩き出していたら磨かない（車ピンが引きずられるのを防ぐ） */
      const nearPark = parking&&parking.lat!=null
        ? distM({lat:parking.lat,lng:parking.lng},{lat:me[0],lng:me[1]}) < Math.max(15,(parking.acc||15)*1.5)
        : true;
      if(NV.mode==="car"&&parking&&(parking.lat==null||(Date.now()-parking.t<40000&&acc<parking.acc&&nearPark))){
        parking.lat=+me[0].toFixed(6); parking.lng=+me[1].toFixed(6); parking.acc=acc;
        saveParking(); nvSetDest();
        nvEl("nvSub").textContent=fmtTime(parking.t)+" に駐車 ±"+parking.acc+"m";
      }
      /* 足あと：駐車中は4m以上動くたびに記録（精度35m以内のみ）。
         上限3000点＝そこで記録終了。車へ戻る手がかりなので、一度付けた足あとは絶対に消さない
         （旧: 古い方=車側から削除していた→車に着く直前の線が欠ける本末転倒だったため変更） */
      if(parking&&parking.lat!=null&&acc<=35){
        const tr=parking.trail=parking.trail||[];
        if(tr.length<3000){
          const last=tr.length?tr[tr.length-1]:[parking.lat,parking.lng];
          if(distM({lat:last[0],lng:last[1]},{lat:me[0],lng:me[1]})>=4){
            tr.push([+me[0].toFixed(6),+me[1].toFixed(6)]);
            saveParking(); nvDrawTrail();
            if(tr.length===3000)
              toast("足あとが上限に達したため、ここで記録を止めました（付けた線と車の位置はこのまま残ります）");
          }
        }
      }
      nvMe(me,acc,hd);
      /* コンパス非対応端末: 歩いている間だけGPSの進行方向で地図を回す */
      if(hd!=null&&!NV.hasCompass){NV.curHd=hd;nvApplyRot();}
      const tg=nvTargetLL();
      if(tg){
        const d=distM({lat:me[0],lng:me[1]},{lat:tg[0],lng:tg[1]});
        nvEl("nvDist").innerHTML="あと "+fmtDist(d)+" <small>±"+acc+"m</small>";
        /* 地図を勝手に動かすのは追従ON中だけ（最初の一回は両方が見えるよう拡縮）。
           拡縮直後の数秒は引き戻さず、両方が見える表示を保つ */
        if(NV.follow){
          if(!NV.fitted){NV.fitted=true; NV.fitT=Date.now();
            NV.map.fitBounds(L.latLngBounds([me,tg]).pad(NV.headUp?0.55:0.3),{maxZoom:18});}
          else if(!NV.fitT||Date.now()-NV.fitT>4000) NV.map.panTo(me);
        }
      }else if(NV.follow){
        if(!NV.fitted){NV.fitted=true;NV.map.setView(me,18);}
        else NV.map.panTo(me);
      }
    },err=>{
      if(!NV.lastFix)
        nvEl("nvNote").innerHTML = err.code===1?"位置情報が許可されていません":"位置を取得できませんでした";
    },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
  }
  /* コンパス（対応端末のみ・向きの扇を回す） */
  NV.hdgFn=e=>{
    let h=null;
    if(e.webkitCompassHeading!=null) h=e.webkitCompassHeading;
    else if(e.absolute&&e.alpha!=null) h=360-e.alpha;
    if(h==null) return;
    NV.hasCompass=true; NV.curHd=h;
    /* コンパスは高頻度で来るため200msに間引いて扇と地図回転を更新 */
    const now=Date.now();
    if(now-NV.rotT>200){ NV.rotT=now; nvCone(h); nvApplyRot(); }
  };
  window.addEventListener("deviceorientationabsolute",NV.hdgFn,true);
  nvWakeLock();
}
function nvClose(){
  /* ピン置き地図は「前回どこを見ていたか」を覚えておく（次回の開始位置） */
  if(nvEl("nvov").classList.contains("pick")&&NV.map){
    try{const c=NV.map.getCenter();
      localStorage.setItem("basho_pickview",
        JSON.stringify({lat:+c.lat.toFixed(5),lng:+c.lng.toFixed(5),z:NV.map.getZoom()}));
    }catch(e){}
  }
  nvEl("nvov").classList.remove("on","pick","car");
  nvEl("nvEdge").classList.remove("on");
  document.documentElement.classList.remove("nvon");
  nvEl("nvCands").innerHTML=""; NV.pickCb=null;
  if(NV.watch!=null){navigator.geolocation.clearWatch(NV.watch);NV.watch=null;}
  if(NV.hdgFn){window.removeEventListener("deviceorientationabsolute",NV.hdgFn,true);NV.hdgFn=null;}
  if(NV.wl){NV.wl.release&&NV.wl.release().catch(()=>{});NV.wl=null;}
  parkBtnSync();
}

/* ───── 地図で位置を決める（＋印を合わせてピンを置く・住所検索付き） ───── */
function nvOpenPick(initLL,cb,autoQ){
  NV.mode="pick"; NV.pickCb=cb;
  document.documentElement.classList.add("nvon");
  nvEl("nvov").classList.add("on","pick");
  nvEl("nvov").classList.remove("car");
  nvEl("nvUnpark").style.display="none";
  nvEl("nvName").textContent="地図で位置を決める";
  nvEl("nvSub").textContent="＋印を目的の場所に合わせてください（右下ボタンで写真・地理院に切替可）";
  nvEl("nvDist").textContent="";
  nvEl("nvSearch").value=autoQ||""; nvEl("nvCands").innerHTML="";
  nvInitMap(); nvSetLayer("osm");   /* ピン置きは名称が載る地図から */
  nvSetHead(false);                 /* ピン置きは常に北が上（＋印を正確に合わせるため） */
  setTimeout(()=>NV.map.invalidateSize(),60);
  /* ナビ用の表示物は片づける */
  ["destMk","trailLn","meMk","accC"].forEach(k=>{ if(NV[k]){NV.map.removeLayer(NV[k]);NV[k]=null;} });
  /* 開始位置: 既存座標 → 前回のピン置き地図 → 現在地 → 日本全体 */
  let pv=null;
  try{pv=JSON.parse(localStorage.getItem("basho_pickview"));}catch(e){}
  if(initLL) NV.map.setView(initLL,17);
  else if(pv&&isFinite(pv.lat)&&isFinite(pv.lng)) NV.map.setView([pv.lat,pv.lng],pv.z||15);
  else if(lastPos) NV.map.setView([lastPos.lat,lastPos.lng],14);
  else NV.map.setView([36.5,137.8],5);
  if(autoQ) nvSearchGo(true);   /* 名前で自動検索→最初の候補へジャンプ */
}
function nvSearchGo(autoJump){
  const q=nvEl("nvSearch").value.trim(); if(!q) return;
  const list=nvEl("nvCands");
  list.innerHTML='<div class="nv-cand" style="color:var(--soft)">検索中…</div>';
  const show=(items,jumpOk)=>{
    list.innerHTML="";
    if(!items.length){
      list.innerHTML='<div class="nv-cand" style="color:var(--soft)">見つかりませんでした（地図を動かして合わせてください）</div>';
      setTimeout(()=>{list.innerHTML="";},2200); return;
    }
    items.slice(0,6).forEach(it=>{
      const b=document.createElement("button");
      b.className="nv-cand"; b.textContent=it.t;
      b.onclick=()=>{list.innerHTML="";NV.map.setView([it.lat,it.lng],it.z);};
      list.appendChild(b);
    });
    if(autoJump&&jumpOk) NV.map.setView([items[0].lat,items[0].lng],items[0].z);
  };
  /* 検索語との一致度で並べ替え（「明治神宮」で北海道の地名「明治」に飛ばないように） */
  const rank=t=>t===q?0:(t.startsWith(q)?1:(t.includes(q)?2:3));
  /* ①地理院（住所・地名に強い）→ ②OpenStreetMap（施設名に強い）の順で探す */
  fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q="+encodeURIComponent(q))
    .then(r=>r.json())
    .then(a=>{
      const items=(Array.isArray(a)?a:[]).map(it=>({
        t:it.properties.title,
        lat:it.geometry.coordinates[1], lng:it.geometry.coordinates[0], z:16}));
      items.sort((x,y)=>rank(x.t)-rank(y.t));
      if(items.length&&items[0].t.includes(q)) return show(items,true);
      return fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=jp&accept-language=ja&limit=6&q="+encodeURIComponent(q))
        .then(r=>r.json())
        .then(b=>{
          const ni=(Array.isArray(b)?b:[]).map(it=>({
            t:(it.display_name||"").split(",").slice(0,3).join("、"),
            lat:+it.lat, lng:+it.lon, z:17}));
          if(ni.length) return show(ni,true);
          return show(items,false);   /* 緩い候補のみ＝一覧は出すが自動ジャンプしない */
        });
    })
    .catch(()=>{list.innerHTML="";toast("検索できませんでした（通信を確認）");});
}

      addr:"",url:"",tel:"",fav:false,count:0,created:Date.now(),updated:Date.now()};
    places.push(rec); Store.save(places); form(rec);
  };
  document.getElementById("m_cats").onclick=catEdit;
  document.getElementById("m_exp").onclick=async()=>{
    const images={};
    for(const p of places) for(const id of (p.ph||[])){ const du=await phGet(id); if(du) images[id]=du; }
    const nImg=Object.keys(images).length;
    const blob=new Blob([JSON.stringify({app:"basho",ver:VER,places:places,images:images,
      cats:CATS.filter(x=>x.n!==CAT_OTHER.n)})],{type:"application/json"});
    const a=document.createElement("a"); const t=new Date(), p2=n=>String(n).padStart(2,"0");
    a.href=URL.createObjectURL(blob);
    a.download="basho_"+t.getFullYear()+p2(t.getMonth()+1)+p2(t.getDate())+".json";
    a.click(); URL.revokeObjectURL(a.href); closeSheet();
    toast("書き出しました"+(nImg?"（写真"+nImg+"枚も同梱）":""));
  };
  document.getElementById("m_imp").onclick=()=>{
    const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
    inp.onchange=()=>{
      const f=inp.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=async()=>{
        try{
          const data=JSON.parse(r.result);
          const arr=Array.isArray(data)?data:(data&&Array.isArray(data.places)?data.places:null);
          if(!arr) throw 0;
          if(data&&data.images){
            for(const k in data.images){ await IDB.set(k,data.images[k]); phCache.set(k,data.images[k]); }
          }
          /* 自作カテゴリも引き継ぐ（同名は既存を優先・「その他」の位置は保つ） */
          if(data&&Array.isArray(data.cats)){
            const have=new Set(CATS.map(x=>x.n));
            const add=data.cats.filter(x=>x&&x.n&&!have.has(String(x.n)))
              .map(x=>({n:String(x.n),c:x.c||CAT_COLORS[0]}));
            if(add.length){ CATS=CATS.filter(x=>x.n!==CAT_OTHER.n).concat(add,[CAT_OTHER]); saveCats(); }
          }
          const ids=new Set(places.map(x=>x.id)); let add=0;
          arr.forEach(x=>{ if(x&&x.name&&!ids.has(x.id)){ if(!x.pref)updatePref(x); places.push(x);add++;} });
          save(); closeSheet(); toast(add+"件を追加しました");
        }catch(e){ toast("このファイルは読み込めません"); }
      };
      r.readAsText(f);
    };
    inp.click();
  };
}
