/* ───── Googleマップお気に入り取込（Takeout zip・全部端末内で処理） ─────
   Takeoutの内部ID: Saved=save（お気に入り等リストのCSV）／マップ(マイプレイス)=local_actions（スター付きGeoJSON・座標入り）
   ＝実機Takeout画面のDOMで確定（2026-07-27）。zip解凍はDecompressionStream(deflate-raw)で無依存 */
const GM_TAKEOUT_URL="https://takeout.google.com/settings/takeout/custom/save,local_actions";
function gmImport(){
  sheet.innerHTML=
    '<h2>Googleマップから取り込む</h2>'+
    '<div class="hint">Googleマップの「お気に入り」「行きたい場所」「スター付き」などを、まとめて場所帳に追加します。今ある場所は消えません。</div>'+
    '<button class="menu-item" id="gm_open">① Googleからデータをもらう</button>'+
    '<div class="hint">開いた画面で「2/2 件を選択中」のまま「次のステップ」→ 設定は変えずに「エクスポートを作成」。'+
    'しばらくするとGmailにダウンロードリンクが届くので、タップしてzipをスマホに保存してください。</div>'+
    '<button class="menu-item" id="gm_pick">② 保存したzipを読み込む</button>'+
    '<div class="hint">zipが読めない端末では、zipを解凍して中のCSVファイルを選んでも取り込めます（複数選択可）。</div>'+
    '<input type="file" id="gm_file" accept=".zip,.csv,.json,application/zip,application/json,text/csv" multiple style="display:none">'+
    '<div class="sheet-actions"><button class="btn" id="gm_close">閉じる</button></div>';
  veil.classList.add("on");
  document.getElementById("gm_close").onclick=closeSheet;
  document.getElementById("gm_open").onclick=()=>openUrl(GM_TAKEOUT_URL);
  const inp=document.getElementById("gm_file");
  document.getElementById("gm_pick").onclick=()=>inp.click();
  inp.onchange=async()=>{
    if(!inp.files||!inp.files.length) return;
    toast("読み込んでいます…");
    try{
      const items=await gmReadFiles([...inp.files]);
      if(!items.length){ toast("場所のデータが見つかりませんでした"); return; }
      gmPreview(items);
    }catch(e){ toast(e&&e.gmMsg?e.gmMsg:"このファイルは読み込めませんでした"); }
  };
}
function gmBase(n){ return String(n).split(/[\/\\]/).pop().replace(/\.[^.]+$/,""); }
async function gmReadFiles(files){
  const items=[];
  for(const f of files){
    const nm=f.name.toLowerCase();
    if(nm.endsWith(".zip")){
      const buf=await f.arrayBuffer();
      const ents=gmUnzip(buf);
      /* 座標入りのGeoJSON（スター付き）を先に＝同じ場所がリストにもある時は座標入りを優先 */
      const je=ents.filter(e=>/\.json$/i.test(e.name)&&!/クチコミ|review/i.test(e.name));
      const ce=ents.filter(e=>/\.csv$/i.test(e.name));
      for(const e of je){ try{ gmFromGeo(JSON.parse(new TextDecoder().decode(await gmEntryData(buf,e))),items); }catch(_){} }
      for(const e of ce){ try{ gmFromCsv(new TextDecoder().decode(await gmEntryData(buf,e)),gmBase(e.name),items); }catch(_){} }
    }
    else if(nm.endsWith(".json")){ try{ gmFromGeo(JSON.parse(await f.text()),items); }catch(_){} }
    else if(nm.endsWith(".csv")){ try{ gmFromCsv(await f.text(),gmBase(f.name),items); }catch(_){} }
  }
  return items;
}
/* zip読み: 末尾のセントラルディレクトリを走査（データ記述子付きローカルヘッダに惑わされない） */
function gmUnzip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), td=new TextDecoder("utf-8");
  let eo=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-22-65557);i--){ if(dv.getUint32(i,true)===0x06054b50){eo=i;break;} }
  if(eo<0){ const er=new Error("zip"); er.gmMsg="zipファイルとして読めませんでした"; throw er; }
  const cnt=dv.getUint16(eo+10,true); let p=dv.getUint32(eo+16,true);
  const out=[];
  for(let k=0;k<cnt;k++){
    if(p+46>buf.byteLength||dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true),
      nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true),
      lho=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nlen));
    if(csize!==0xFFFFFFFF&&lho!==0xFFFFFFFF) out.push({name,method,csize,lho});
    p+=46+nlen+elen+clen;
  }
  return out;
}
async function gmEntryData(buf,ent){
  const dv=new DataView(buf);
  const nlen=dv.getUint16(ent.lho+26,true), elen=dv.getUint16(ent.lho+28,true);
  const raw=new Uint8Array(buf,ent.lho+30+nlen+elen,ent.csize);
  if(ent.method===0) return raw;
  if(ent.method===8){
    if(typeof DecompressionStream==="undefined"){ const er=new Error("ds"); er.gmMsg="この端末ではzipを直接読めません。解凍して中のCSVを選んでください"; throw er; }
    return new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  }
  throw new Error("method"+ent.method);
}
/* CSV: 引用符・カンマ・改行入りに対応した素直なパーサ */
function gmCsv(text){
  const rows=[]; let f="",row=[],q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(f); f=""; }
    else if(c==="\n"){ row.push(f); f=""; if(row.some(x=>x!=="")) rows.push(row); row=[]; }
    else if(c!=="\r") f+=c;
  }
  if(f!==""||row.length){ row.push(f); if(row.some(x=>x!=="")) rows.push(row); }
  return rows;
}
/* Savedリスト（お気に入り.csv 等）: タイトル,メモ,URL,コメント（英語版ヘッダにも対応） */
function gmFromCsv(text,listName,items){
  const rows=gmCsv(text.charCodeAt(0)===0xFEFF?text.slice(1):text); if(rows.length<2) return;
  const hdr=rows[0].map(s=>String(s).trim().toLowerCase());
  const iT=hdr.findIndex(h=>h==="タイトル"||h==="title"), iU=hdr.findIndex(h=>h==="url");
  if(iT<0||iU<0) return;
  const iN=hdr.findIndex(h=>h==="メモ"||h==="note"), iC=hdr.findIndex(h=>h==="コメント"||h==="comment");
  for(let r=1;r<rows.length;r++){
    const row=rows[r], name=String(row[iT]||"").trim(); if(!name) continue;
    const url=String(row[iU]||"").trim();
    const memo=[iN>=0?row[iN]:"",iC>=0?row[iC]:""].map(s=>String(s||"").trim()).filter(Boolean).join(" / ");
    const c=pickCoords(url)||gmSearchCoords(url);
    items.push({name:name,url:url,memo:memo,addr:"",lat:c?c.lat:"",lng:c?c.lng:"",list:listName});
  }
}
function gmSearchCoords(url){
  const m=String(url||"").match(/\/maps\/search\/(-?\d+\.\d+)(?:,|%2C)\+?(-?\d+\.\d+)/);
  return m?{lat:m[1],lng:m[2]}:null;
}
/* マイプレイスのGeoJSON（保存した場所.json）: 新旧2形式に対応・クチコミは除外 */
function gmFromGeo(g,items){
  if(!g||g.type!=="FeatureCollection"||!Array.isArray(g.features)) return;
  for(const ft of g.features){
    const pr=(ft&&ft.properties)||{};
    if(pr.review||pr["Star Rating"]||pr["Review Comment"]) continue;
    const name=String(pr.Title||(pr.location&&pr.location.name)||(pr.Location&&pr.Location["Business Name"])||"").trim();
    const url=String(pr["Google Maps URL"]||pr.google_maps_url||"").trim();
    const addr=String((pr.location&&pr.location.address)||(pr.Location&&pr.Location.Address)||"").trim();
    let lat="",lng="";
    if(ft.geometry&&ft.geometry.type==="Point"&&Array.isArray(ft.geometry.coordinates)){
      lng=String(ft.geometry.coordinates[0]); lat=String(ft.geometry.coordinates[1]);
    }else if(pr.Location&&pr.Location["Geo Coordinates"]){
      lat=String(pr.Location["Geo Coordinates"].Latitude||""); lng=String(pr.Location["Geo Coordinates"].Longitude||"");
    }
    if(Math.abs(+lat)<0.01&&Math.abs(+lng)<0.01){ lat=""; lng=""; }   /* 0,0=未解決座標は捨てる */
    if(!name&&!url&&!addr) continue;
    items.push({name:name||addr||"名称不明",url:url,memo:"",addr:addr,lat:lat,lng:lng,list:"スター付き"});
  }
}
/* プレビュー: 重複（URL一致・名前一致）はスキップして内訳を見せてから取り込む */
function gmPreview(items){
  const urls=new Set(places.map(x=>String(x.url||"").trim()).filter(Boolean));
  const names=new Set(places.map(x=>norm(x.name)));
  const bu=new Set(), bn=new Set(), fresh=[]; let dup=0;
  for(const it of items){
    const uk=String(it.url||"").trim(), nk=norm(it.name);
    if((uk&&(urls.has(uk)||bu.has(uk)))||(nk&&(names.has(nk)||bn.has(nk)))){ dup++; continue; }
    fresh.push(it); if(uk)bu.add(uk); if(nk)bn.add(nk);
  }
  if(!fresh.length){ toast("すべて登録済みでした（新しい場所はありません）"); return; }
  const byList={}; fresh.forEach(it=>{ byList[it.list]=(byList[it.list]||0)+1; });
  const nGeo=fresh.filter(it=>it.lat&&it.lng).length;
  sheet.innerHTML=
    '<h2>取り込む内容の確認</h2>'+
    '<div class="hint">リストの名前がそのままカテゴリになります。</div>'+
    Object.keys(byList).map(k=>'<div class="menu-item" style="pointer-events:none">'+esc(k)+'　'+byList[k]+'件</div>').join("")+
    '<div class="hint">合計 '+fresh.length+'件（うち位置情報付き '+nGeo+'件）'+(dup?'／登録済みのため '+dup+'件はスキップ':'')+'</div>'+
    '<div class="sheet-actions"><button class="btn" id="gm_no">やめる</button>'+
    '<button class="btn primary" id="gm_go">'+fresh.length+'件を取り込む</button></div>';
  document.getElementById("gm_no").onclick=closeSheet;
  document.getElementById("gm_go").onclick=()=>gmApply(fresh);
}
function gmApply(fresh){
  let catCh=false;
  for(const ln of [...new Set(fresh.map(x=>x.list))]){
    if(!CATS.some(c=>c.n===ln)){
      const used=CATS.map(x=>x.c);
      const col=CAT_COLORS.find(c=>!used.includes(c))||CAT_COLORS[CATS.length%CAT_COLORS.length];
      CATS=CATS.filter(x=>x.n!==CAT_OTHER.n).concat([{n:ln,c:col}],[CAT_OTHER]); catCh=true;
    }
  }
  if(catCh) saveCats();
  const t0=Date.now();
  fresh.forEach((it,i)=>{
    const rec={id:"p"+t0+"_g"+i,name:it.name,kana:"",cat:it.list,memo:it.memo||"",lat:it.lat||"",lng:it.lng||"",acc:null,
      addr:it.addr||"",url:it.url||"",tel:"",fav:false,count:0,created:t0,updated:t0};
    if(rec.lat&&rec.lng) updatePref(rec);
    places.push(rec);
  });
  save(); closeSheet(); toast(fresh.length+"件を取り込みました");
}

/* ───── カテゴリ編集（名前変更・色変え・削除・新設。「その他」は受け皿として固定） ───── */
function catEdit(){
  const rows=CATS.filter(x=>x.n!==CAT_OTHER.n).map(x=>({orig:x.n,n:x.n,c:x.c}));
  function draw(){
    sheet.innerHTML=
      '<h2>カテゴリを編集</h2>'+
      '<div id="catList"></div>'+
      '<button class="subbtn" id="c_add">＋ カテゴリを追加</button>'+
      '<div class="hint">●をタップすると色を選べます。名前を変えると、そのカテゴリの場所もまとめて変わります。'+
      '「その他」は削除したカテゴリの受け皿として固定です。</div>'+
      '<div class="sheet-actions"><button class="btn" id="c_cancel">やめる</button>'+
      '<button class="btn primary" id="c_ok">保存する</button></div>';
    const list=document.getElementById("catList");
    rows.forEach((r,i)=>{
      const div=document.createElement("div");
      div.className="catrow";
      div.innerHTML='<button class="catdot" style="background:'+esc(r.c)+'"></button>'+
        '<input type="text" value="'+esc(r.n)+'" placeholder="カテゴリ名">'+
        '<button class="catdel">🗑</button>';
      const dot=div.children[0], inp=div.children[1], del=div.children[2];
      dot.onclick=()=>cpickOpen(r.c,c=>{r.c=c;dot.style.background=c;});
      inp.oninput=()=>{r.n=inp.value;};
      del.onclick=()=>{
        const cnt=r.orig?places.filter(p=>p.cat===r.orig).length:0;
        if(cnt&&!confirm('「'+(r.n.trim()||r.orig)+'」を削除します。\nこのカテゴリの'+cnt+'件は「その他」に変わります。よろしいですか？'))return;
        rows.splice(i,1); draw();
      };
      list.appendChild(div);
    });
    const oth=document.createElement("div");
    oth.className="catrow";
    oth.innerHTML='<span class="catdot" style="background:'+CAT_OTHER.c+';cursor:default"></span>'+
      '<span style="flex:1;color:#6B7280">その他（固定）</span>';
    list.appendChild(oth);
    document.getElementById("c_add").onclick=()=>{
      const used=rows.map(r=>r.c);
      rows.push({orig:null,n:"",c:CAT_COLORS.find(x=>!used.includes(x))||CAT_COLORS[rows.length%CAT_COLORS.length]});
      draw(); sheet.scrollTop=sheet.scrollHeight;
    };
    document.getElementById("c_cancel").onclick=closeSheet;
    document.getElementById("c_ok").onclick=()=>{
      const names=rows.map(r=>r.n.trim());
      if(names.some(n=>!n)) return toast("名前が空のカテゴリがあります");
      if(names.some(n=>n===CAT_OTHER.n)) return toast("「その他」という名前は固定分と重なるため使えません");
      if(new Set(names).size!==names.length) return toast("同じ名前のカテゴリがあります");
      /* 名前変更は場所にも反映・削除した分は「その他」へ */
      const ren={}; rows.forEach(r=>{ const n=r.n.trim(); if(r.orig&&r.orig!==n) ren[r.orig]=n; });
      const kept=new Set(rows.map(r=>r.orig).filter(Boolean));
      const removed=CATS.filter(x=>x.n!==CAT_OTHER.n&&!kept.has(x.n)).map(x=>x.n);
      places.forEach(p=>{
        if(ren[p.cat]) p.cat=ren[p.cat];
        else if(removed.includes(p.cat)){ p.cat=CAT_OTHER.n; delete p.sf; }
      });
      if(ren[filterCat]) filterCat=ren[filterCat];
      else if(removed.includes(filterCat)) filterCat="";
      /* 本棚の表紙と開いている本もカテゴリの改名・削除に追随 */
      for(const o in ren){ if(COVERS[o]!=null){COVERS[ren[o]]=COVERS[o];delete COVERS[o];} }
      removed.forEach(cn=>{ const c=covOf(cn);
        if(c){IDB.del(c.id).catch(()=>{});phCache.delete(c.id);delete COVERS[cn];} });
      saveCovers();
      if(ren[shelfCat]) shelfCat=ren[shelfCat];
      else if(removed.includes(shelfCat)) shelfCat=null;
      CATS=rows.map(r=>({n:r.n.trim(),c:r.c})).concat([CAT_OTHER]);
      saveCats(); save(); closeSheet(); toast("カテゴリを保存しました");
    };
  }
  draw();
}

/* ───── OCR: スクショから座標を読む ─────
   Googleマップでピンを長押し→検索窓に出る座標をスクショ→ここで読み取る。
   Tesseract.jsをローカル同梱（ocr/）＝画像も座標も端末の外に出さない。
   エンジンは初回タップ時にだけ読み込み、閉じたら破棄（メモリ対策） */
const OCR={img:null,url:null,cb:null,found:null,libP:null,wk:null,wkP:null,q:Promise.resolve()};
const ocrEl=id=>document.getElementById(id);
function ocrBase(){return new URL("ocr",location.href).href;}   /* 絶対URL（worker内の相対解決ズレ防止） */
function ocrLib(){
  if(!OCR.libP){
    OCR.libP=new Promise((ok,ng)=>{
      if(window.Tesseract)return ok();
      const s=document.createElement("script");
      s.src="ocr/tesseract.min.js";
      s.onload=()=>ok();
      s.onerror=()=>{OCR.libP=null;ng(new Error("lib"));};
      document.head.appendChild(s);
    });
  }
  return OCR.libP;
}
function ocrWorker(){
  if(!OCR.wkP){
    OCR.wkP=(async()=>{
      await ocrLib();
      const b=ocrBase();
      /* cacheMethod:none = Tesseract内蔵のIndexedDBキャッシュを使わない
         （環境により読み込みが固まる不具合を実測。オフライン持続はsw.jsのbasho-ocrキャッシュが担う） */
      const wk=await Tesseract.createWorker("eng",1,{
        workerPath:b+"/worker.min.js",corePath:b,langPath:b,cacheMethod:"none"});
      OCR.wk=wk; return wk;
    })();
    OCR.wkP.catch(()=>{OCR.wkP=null;OCR.wk=null;});
  }
  return OCR.wkP;
}
/* recognizeの直列化（範囲選択の連打とautoScanが混ざらないように） */
function ocrJob(fn){const p=OCR.q.then(fn);OCR.q=p.catch(()=>{});return p;}
/* OCR結果テキスト→「緯度, 経度」抽出。小数3桁以上の数字ペアだけを座標とみなす */
function ocrParseCoords(text){
  const t=String(text||"")
    .replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
    .replace(/[．]/g,".").replace(/[，、]/g,",").replace(/[ー−―–—]/g,"-");
  const re=/(-?\d{1,3}[.,]\d{3,8})[^\d-]{1,8}(-?\d{1,3}[.,]\d{3,8})/g;
  const cands=[]; let m;
  while((m=re.exec(t))){
    let s1=m[1].replace(",","."),s2=m[2].replace(",",".");
    let a=parseFloat(s1),b=parseFloat(s2);
    if(!isFinite(a)||!isFinite(b))continue;
    if(Math.abs(a)>90&&Math.abs(b)<=90){const ss=s1;s1=s2;s2=ss;const nn=a;a=b;b=nn;}  /* 経度,緯度の順で写っていた */
    if(Math.abs(a)>90||Math.abs(b)>180)continue;
    let sc=Math.min(s1.split(".")[1].length,s2.split(".")[1].length);
    if(a>=20&&a<=46&&b>=122&&b<=154)sc+=4;   /* 日本域ボーナス */
    cands.push({lat:s1,lng:s2,sc});
  }
  if(!cands.length)return null;
  cands.sort((x,y)=>y.sc-x.sc);
  return cands[0];
}
/* 元画像の指定範囲を切り出し＋拡大。暗い画像（ダークモード）は白黒反転してOCRを通す */
function ocrCropCanvas(nx,ny,nw,nh){
  const scale=Math.max(1,Math.min(nh<90?3:2,1600/nw));
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(nw*scale));c.height=Math.max(1,Math.round(nh*scale));
  const g=c.getContext("2d",{willReadFrequently:true});
  g.imageSmoothingEnabled=true;g.imageSmoothingQuality="high";
  g.drawImage(OCR.img,nx,ny,nw,nh,0,0,c.width,c.height);
  try{
    const d=g.getImageData(0,0,c.width,c.height),px=d.data;
    let sum=0,n=0;
    for(let i=0;i<px.length;i+=64){sum+=px[i]*.299+px[i+1]*.587+px[i+2]*.114;n++;}
    if(sum/n<110){
      for(let i=0;i<px.length;i+=4){px[i]=255-px[i];px[i+1]=255-px[i+1];px[i+2]=255-px[i+2];}
      g.putImageData(d,0,0);
    }
  }catch(e){}
  return c;
}
function ocrScanRegion(nx,ny,nw,nh,psm){
  return ocrJob(async()=>{
    const wk=await ocrWorker();
    const c=ocrCropCanvas(nx,ny,nw,nh);
    await wk.setParameters({tessedit_pageseg_mode:String(psm)});
    const r=await wk.recognize(c);
    return ocrParseCoords(r.data.text);
  });
}
/* statusは固定文言のみ（ユーザーデータを混ぜない） */
function ocrStatus(html){ocrEl("ocrStatus").innerHTML=html;}
function ocrSetFound(c,msg){
  OCR.found=c||null;
  ocrEl("ocrRes").textContent=c?(c.lat+", "+c.lng):"";
  ocrEl("ocrCopy").disabled=!c;
  ocrEl("ocrUse").disabled=!c;
  if(c)ocrStatus((msg||"")+"違う数字を読みたい時は、その部分を<b>指でなぞって囲み直せます</b>");
}
async function ocrAutoScan(){
  const im=OCR.img; if(!im)return;
  const W=im.naturalWidth,H=im.naturalHeight;
  ocrStatus("読み取り中…（初回はエンジンの準備に少し時間がかかります）");
  try{
    /* 検索窓＝画面上部をまず読む（速い）。ダメなら下部のカード帯も試す */
    let c=await ocrScanRegion(0,0,W,Math.round(H*0.22),6);
    if(!c&&OCR.img===im) c=await ocrScanRegion(0,Math.round(H*0.60),W,H-Math.round(H*0.60),6);
    if(OCR.img!==im)return;   /* 途中で閉じられた */
    if(c)ocrSetFound(c,"見つかりました。");
    else ocrStatus("自動では見つかりませんでした。座標の数字を<b>指でなぞって囲んで</b>ください");
  }catch(e){
    if(OCR.img===im)ocrStatus("読み取りエンジンを読み込めませんでした。電波のある場所で一度だけ開き直してください（以後はオフラインでも動きます）");
  }
}
function ocrOpen(file,cb){
  if(OCR.url){try{URL.revokeObjectURL(OCR.url);}catch(e){}}
  OCR.url=URL.createObjectURL(file);
  const im=new Image();
  im.onload=()=>{
    OCR.img=im;OCR.cb=cb||null;
    ocrEl("ocrImg").src=OCR.url;
    ocrSetFound(null);
    ocrEl("ocrov").classList.add("on");
    ocrAutoScan();
  };
  im.onerror=()=>toast("画像を読み込めませんでした");
  im.src=OCR.url;
}
function ocrPick(cb){
  const inp=ocrEl("ocrFile");
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];
    inp.value="";
    if(f)ocrOpen(f,cb);
  };
  inp.click();
}
function ocrClose(){
  ocrEl("ocrov").classList.remove("on");
  ocrEl("ocrImg").removeAttribute("src");
  ocrEl("ocrSel").style.display="none";
  if(OCR.url){try{URL.revokeObjectURL(OCR.url);}catch(e){}OCR.url=null;}
  OCR.img=null;OCR.found=null;OCR.cb=null;
  /* エンジンは閉じるたびに破棄（スマホのメモリを食い続けない。言語データはキャッシュ済みで再開は速い） */
  if(OCR.wkP){OCR.wkP.then(wk=>{try{wk.terminate();}catch(e){}}).catch(()=>{});OCR.wkP=null;OCR.wk=null;}
  OCR.q=Promise.resolve();
}
ocrEl("ocrCloseBtn").onclick=ocrClose;
ocrEl("ocrCopy").onclick=async()=>{
  const c=OCR.found; if(!c)return;
  const s=c.lat+", "+c.lng;
  try{await navigator.clipboard.writeText(s);toast("コピーしました: "+s);}
  catch(e){
    const ta=document.createElement("textarea");
    ta.value=s;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");toast("コピーしました: "+s);}catch(x){toast("コピーできませんでした");}
    ta.remove();
  }
};
ocrEl("ocrUse").onclick=()=>{
  const c=OCR.found,cb=OCR.cb;
  if(!c)return;
  ocrClose();
  if(cb)cb(c.lat,c.lng);
};
/* 範囲選択（簡易選択状態）: 画像の上を指でなぞって矩形を囲む→その部分だけOCR */
(function(){
  const st=ocrEl("ocrStage"),sel=ocrEl("ocrSel");
  let p0=null;
  function rectOf(e){
    const sr=st.getBoundingClientRect();
    const x1=Math.min(p0.x,e.clientX),y1=Math.min(p0.y,e.clientY);
    const x2=Math.max(p0.x,e.clientX),y2=Math.max(p0.y,e.clientY);
    return {l:x1-sr.left,t:y1-sr.top,w:x2-x1,h:y2-y1,x1,y1,x2,y2};
  }
  function show(r){
    sel.style.display="block";
    sel.style.left=r.l+"px";sel.style.top=r.t+"px";
    sel.style.width=r.w+"px";sel.style.height=r.h+"px";
  }
  st.addEventListener("pointerdown",e=>{
    if(!OCR.img)return;
    try{st.setPointerCapture(e.pointerId);}catch(x){}
    p0={x:e.clientX,y:e.clientY};
    show(rectOf(e));
  });
  st.addEventListener("pointermove",e=>{if(p0)show(rectOf(e));});
  st.addEventListener("pointerup",async e=>{
    if(!p0)return;
    const r=rectOf(e);p0=null;
    if(r.w<24||r.h<10){sel.style.display="none";return;}   /* タップだけなら無視 */
    /* 表示px→元画像pxへ変換（imgはアスペクト比維持で縮小表示＝要素枠がそのまま画像） */
    const ir=ocrEl("ocrImg").getBoundingClientRect();
    const im=OCR.img,W=im.naturalWidth,H=im.naturalHeight;
    const fx=W/ir.width,fy=H/ir.height;
    let nx=Math.max(0,(r.x1-ir.left)*fx),ny=Math.max(0,(r.y1-ir.top)*fy);
    let nx2=Math.min(W,(r.x2-ir.left)*fx),ny2=Math.min(H,(r.y2-ir.top)*fy);
    setTimeout(()=>sel.style.display="none",300);
    if(nx2-nx<10||ny2-ny<6)return;
    ocrStatus("囲んだ範囲を読み取り中…");
    try{
      const c=await ocrScanRegion(nx,ny,nx2-nx,ny2-ny,7);
      if(!OCR.img)return;
      if(c)ocrSetFound(c,"読み取りました。");
      else ocrStatus("数字を読めませんでした。<b>数字の行だけを少し広めに</b>囲み直してみてください");
    }catch(x){if(OCR.img)ocrStatus("読み取りに失敗しました。もう一度囲んでみてください");}
  });
  st.addEventListener("pointercancel",()=>{p0=null;sel.style.display="none";});
})();
/* 保険: OCR画面のスワイプをブラウザに渡さない（引っ張って更新の封じ・周辺モードと同方式） */
ocrEl("ocrov").addEventListener("touchmove",e=>{if(e.cancelable)e.preventDefault();},{passive:false});

/* ───── トースト ───── */
let tt;
function toast(m,actLabel,actFn){
  const t=document.getElementById("toast");
  if(actLabel){
    t.innerHTML=esc(m)+'<button class="undo">'+esc(actLabel)+'</button>';
    t.classList.add("act");
    t.querySelector(".undo").onclick=()=>{t.classList.remove("on","act");actFn&&actFn();};
  }else{
    t.textContent=m; t.classList.remove("act");
  }
  t.classList.add("on");
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on","act"),actLabel?6000:2000);
}

/* ───── 起動 ───── */
document.getElementById("q").addEventListener("input",render);
document.getElementById("clearq").onclick=()=>{document.getElementById("q").value="";render();document.getElementById("q").focus();};
document.getElementById("addBtn").onclick=quickAdd;
document.getElementById("menuBtn").onclick=menu;
const SORTS=[["use","よく行く順"],["kana","五十音順"],["near","近い順"]];
const sortLabel=()=>(SORTS.find(s=>s[0]===sortMode)||SORTS[0])[1];
document.getElementById("sortBtn").textContent=sortLabel();
document.getElementById("sortBtn").onclick=e=>{
  const i=SORTS.findIndex(s=>s[0]===sortMode);
  sortMode=SORTS[(i+1)%SORTS.length][0];
  try{localStorage.setItem("basho_sort",sortMode);}catch(x){}
  e.target.textContent=sortLabel();
  if(sortMode==="near"){lastPos=null;ensurePos();}
  render();
};
/* ホームタブ（一覧⇄本棚）。前回開いていたタブを記憶。本棚タップは常に棚トップへ */
document.getElementById("tabList").onclick=()=>{
  homeTab="list"; shelfCat=null;
  try{localStorage.setItem("basho_home","list");}catch(e){}
  renderTop();
};
document.getElementById("tabShelf").onclick=()=>{
  homeTab="shelf"; shelfCat=null;
  try{localStorage.setItem("basho_home","shelf");}catch(e){}
  renderTop();
};
const viewLabel=()=>viewMode==="tile"?"一覧":"タイル";
document.getElementById("viewBtn").textContent=viewLabel();
document.getElementById("viewBtn").onclick=e=>{
  viewMode=viewMode==="tile"?"list":"tile";
  try{localStorage.setItem("basho_view",viewMode);}catch(x){}
  e.target.textContent=viewLabel();
  render();
};
/* 開いている面を上から順に1つ閉じる（Escape・Android戻るボタン共通） */
function closeTopOverlay(){
  if(document.getElementById("cpick").classList.contains("on")) cpickClose();
  else if(lb.classList.contains("on")) lbClose();
  else if(pv.classList.contains("on")) pvClose();   /* ライトボックス→縦閲覧→一覧 の順で1段ずつ */
  else if(document.getElementById("ocrov").classList.contains("on")) ocrClose();
  else if(document.getElementById("nvov").classList.contains("on")) nvClose();
  else if(veil.classList.contains("on")) closeSheet();
  else if(homeTab==="shelf"&&shelfCat&&shelfSub){ shelfSub=null; renderTop(); }   /* フォルダ→本へ */
  else if(homeTab==="shelf"&&shelfCat){ shelfCat=null; renderTop(); }   /* 本の中→本棚へ */
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeTopOverlay(); });
/* Android戻るボタン対応（番兵方式）: 戻る＝面を1つ閉じる。アプリ自体は終了させない */
try{
  window.addEventListener("popstate",()=>{
    /* ★先に番兵を積み直す（同期）＝連打で番兵が尽きてアプリごと閉じるのを防ぐ。
       画面を閉じる処理（再描画で重いことがある）はその後 */
    try{ history.pushState({basho:"guard"},""); }catch(e){}
    closeTopOverlay();
  });
}catch(e){}
/* 周辺モード・足あと（旗） */
parkBtnSync();
document.getElementById("parkBtn").onclick=()=>{
  if(!parking){
    parking={lat:null,lng:null,acc:null,t:Date.now(),trail:[]};
    saveParking();
    toast("この場所に旗を立てます");
  }
  parkBtnSync();
  nvOpen("car");
};
document.getElementById("nvClose").onclick=nvClose;
document.getElementById("nvUnpark").onclick=()=>{
  const nPh=(parking&&parking.ph||[]).length;
  if(!confirm("足あとを解除しますか？\n（旗の位置と足あと"+(nPh?"・写真"+nPh+"枚":"")+"が消えます）")) return;
  if(parking) phPurgePlace(parking);   /* 一時保存の写真もIndexedDBから消す */
  parking=null; saveParking(); nvClose(); toast("足あとを解除しました");
};
document.getElementById("nvLayer").onclick=()=>{
  nvSetLayer(NV.lay==="std"?"photo":(NV.lay==="photo"?"osm":"std"));
  /* ナビ中の切替は記憶して次回もその地図で開く（ピン置きは常にosm開始なので記憶しない） */
  if(NV.mode!=="pick"){ try{localStorage.setItem("basho_navlay",NV.lay);}catch(e){} }
};
document.getElementById("nvFollow").onclick=()=>nvFollow(!NV.follow);
document.getElementById("nvHead").onclick=()=>{
  const v=!NV.headUp;
  try{ if(v)localStorage.setItem("basho_headup","1"); else localStorage.removeItem("basho_headup"); }catch(e){}
  nvSetHead(v);
  if(v){ nvFollow(true); toast("自分の向きが常に上になります"); }
};
/* 保険: 周辺モード内のスワイプをブラウザに渡さない（引っ張って更新の完全封じ） */
document.getElementById("nvov").addEventListener("touchmove",e=>{
  if(e.target.closest(".nv-pickbar")) return;   /* 検索欄まわりの操作は邪魔しない */
  if(e.cancelable) e.preventDefault();
},{passive:false});
/* 画面回転・リサイズ時は「向き上」の正方形サイズを取り直す */
window.addEventListener("resize",()=>{
  const ov=document.getElementById("nvov");
  if(NV.headUp&&ov.classList.contains("on")&&!ov.classList.contains("pick")) nvSetHead(true);
});
document.getElementById("nvSearchBtn").onclick=nvSearchGo;
document.getElementById("nvSearch").addEventListener("keydown",e=>{if(e.key==="Enter")nvSearchGo();});
document.getElementById("nvPickOk").onclick=()=>{
  const c=NV.map?NV.map.getCenter():null;
  const cb=NV.pickCb;
  nvClose();
  if(c&&cb) cb(+c.lat.toFixed(6),+c.lng.toFixed(6));
};
Store.load().then(d=>{
  places=Array.isArray(d)?d:[];
  /* 写真は登録の古い順（左端=一番最初）に統一。旧版は新しい順だったため、
     写真id（"i"+登録時刻13桁+乱数3字）の時刻部分で並べ直す（毎回実行しても同じ結果） */
  places.forEach(p=>{
    if(p.ph&&p.ph.length>1)
      p.ph.sort((a,b)=>parseInt(a.slice(1,14))-parseInt(b.slice(1,14)));
  });
  /* 既存データの県を一括判定（初回のみ） */
  if(window.PREF_GEO){
    let ch=false;
    places.forEach(p=>{ if(p.lat&&p.lng&&!p.pref){updatePref(p); if(p.pref)ch=true;} });
    if(ch) Store.save(places);
  }
  render();
  if(sortMode==="near")ensurePos();
  handleShare();   /* Googleマップ「共有」経由で開かれた場合は登録シートを出す */
  /* 番兵を1つ積む: 戻るボタンはこれを消費→popstateで面を閉じ、番兵を積み直す。
     scrollRestoration=manual: 戻るボタンでブラウザが「積んだ時点のスクロール位置(先頭)」を
     勝手に復元して見ていたカードを見失うのを防ぐ */
  try{ history.scrollRestoration="manual"; }catch(e){}
  /* 番兵は3枚積む＝連打で処理が追いつかなくても、尽きる前に積み直しが間に合う緩衝 */
  try{ history.replaceState({basho:"root"},"");
    history.pushState({basho:"guard"},""); history.pushState({basho:"guard"},""); history.pushState({basho:"guard"},""); }catch(e){}
});
if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
})();
