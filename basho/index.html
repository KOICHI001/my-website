  ra:"ら",ri:"り",ru:"る",re:"れ",ro:"ろ",wa:"わ",wo:"を",
  a:"あ",i:"い",u:"う",e:"え",o:"お",n:"ん"};
function romaToHira(s){
  s=String(s||"").toLowerCase().replace(/[^a-z\-]/g,"");
  if(!s) return "";
  let out="",i=0;
  while(i<s.length){
    const c=s[i];
    if(c==="-"){out+="ー";i++;continue;}
    if(c===s[i+1]&&!"aiueon".includes(c)){out+="っ";i++;continue;}
    if(c==="n"){
      const nx=s[i+1];
      if(nx==null||!"aiueoyn".includes(nx)){out+="ん";i++;continue;}
      if(nx==="n"){out+="ん";i+=("aiueoy".includes(s[i+2]||"")?1:2);continue;}
    }
    const t3=ROMA[s.slice(i,i+3)],t2=ROMA[s.slice(i,i+2)],t1=ROMA[c];
    if(t3){out+=t3;i+=3;}
    else if(t2){out+=t2;i+=2;}
    else if(t1){out+=t1;i+=1;}
    else{out+=c;i++;}
  }
  return out;
}

/* ───── 一覧 ───── */
function sorted(){
  return places.slice().sort((a,b)=>{
    if(sortMode==="near"){
      const da=placeDist(a), db=placeDist(b);
      if(da!=null&&db!=null&&da!==db) return da-db;
      if((da!=null)!==(db!=null)) return da!=null?-1:1;
      return norm(a.kana||a.name).localeCompare(norm(b.kana||b.name),"ja");
    }
    if((b.fav?1:0)!==(a.fav?1:0)) return (b.fav?1:0)-(a.fav?1:0);
    if(sortMode==="kana") return norm(a.kana||a.name).localeCompare(norm(b.kana||b.name),"ja");
    if((b.count||0)!==(a.count||0)) return (b.count||0)-(a.count||0);
    return (b.used||b.created||0)-(a.used||a.created||0);
  });
}
function render(){
  /* 再描画（編集保存・★・写真操作など）で一覧のスクロールが先頭に戻らないよう保持。
     内容が減った時はブラウザが自動で上限に丸めてくれる */
  const se=document.scrollingElement||document.documentElement;
  const y=se.scrollTop;
  _renderBody();
  se.scrollTop=y;
}
/* 画面の切り替え（タブ・本の開閉）は別の画面になるので必ず先頭から表示
   （renderのスクロール保持をそのまま使うと、前の画面のスクロール分だけ中身が上にめり込む） */
function renderTop(){
  _renderBody();
  (document.scrollingElement||document.documentElement).scrollTop=0;
}
/* 登録直後、本棚タブにいるなら登録先の本の中を開く＝どの本に入ったか迷わない */
function showInBook(cat){
  if(homeTab!=="shelf") return;
  const nc=CATS.some(x=>x.n===cat)?cat:CAT_OTHER.n;
  if(shelfCat!==nc) shelfSub=null;   /* 別の本に移る時はフォルダ表示を解除 */
  shelfCat=nc;
  renderTop();
}
/* v0.36.0: その場所のカードの所まで連れて行く（周辺ビューで見つけた店の情報がすぐ見られるように）。
   ★絞り込みや検索が効いているとカードが出てこないので、その場所が隠れる条件だけを外す
     （関係ない絞り込みはそのまま＝画面が勝手に変わりすぎないように）。
   本棚にいる時は、その場所が入っている本（＋小フォルダ）を開く＝カテゴリが違っても迷子にならない */
function revealPlace(p){
  if(!p||!places.some(x=>x&&x.id===p.id)) return;
  const cat=(p.cat&&CATS.some(x=>x.n===p.cat))?p.cat:CAT_OTHER.n;
  const qi=document.getElementById("q");
  if(qi&&qi.value){ qi.value=""; }                       /* 検索語は必ず解除（一致判定が複雑なので） */
  if(nearFilter) nearFilter=false;                       /* 📍2km以内: 遠い場所だと消えてしまう */
  if(filterPref&&filterPref!==p.pref) filterPref="";
  if(filterRegion&&prefRegion(p.pref||"")!==filterRegion) filterRegion="";
  if(homeTab==="shelf"){
    if(shelfCat!==cat) shelfSub=null;
    shelfCat=cat;
    shelfSub=p.sf||null;                                 /* 小フォルダに入っているならその中を開く */
  }else{
    if(onlyFix&&hasSpot(p)&&!(p.acc&&p.acc>80)) onlyFix=false;
    if(filterCat&&filterCat!==p.cat) filterCat="";
    if(filterSub&&filterSub!==p.sf) filterSub="";
  }
  renderTop();
  const el=document.querySelector('#list .card[data-id="'+p.id+'"], #list .tile[data-id="'+p.id+'"], #list .row[data-id="'+p.id+'"]');
  if(!el) return;
  el.scrollIntoView({block:"center"});
  el.classList.add("justcame");                          /* どれか一目で分かるよう一瞬だけ光らせる */
  setTimeout(()=>el.classList.remove("justcame"),1900);
}
function _renderBody(){
  const qi=document.getElementById("q"), qn=norm(qi.value);
  document.getElementById("clearq").classList.toggle("on",!!qi.value);

  /* ホームタブの状態と、本棚トップでは検索行を隠す（本の中では出す=本の中だけを検索） */
  const inShelfTop=(homeTab==="shelf"&&!shelfCat);
  const inBook=(homeTab==="shelf"&&!!shelfCat);
  document.getElementById("tabList").classList.toggle("on",homeTab==="list");
  document.getElementById("tabShelf").classList.toggle("on",homeTab==="shelf");
  document.querySelector(".searchrow").style.display=inShelfTop?"none":"";

  const lg=document.getElementById("legend"); lg.innerHTML="";
  const cats=[...new Set(places.map(p=>p.cat).filter(Boolean))];
  const fixN=places.filter(p=>!hasSpot(p)||(p.acc&&p.acc>80)).length;
  /* 📍近く2km: 一覧・本の中の両方に置く共通チップ */
  function nearChip(){
    const b=document.createElement("button");
    b.className="chip"+(nearFilter?" on":"");
    b.textContent="📍 2km以内";
    b.onclick=()=>{
      nearFilter=!nearFilter;
      if(nearFilter){ toast("現在地から2km以内だけを表示します"); lastPos=null; ensurePos(); }
      render();
    };
    return b;
  }
  if(inBook){
    /* 本の中: カテゴリチップの代わりに「← 本棚」と本のタイトル。フォルダの中では「← 本」とフォルダ名 */
    const bk=document.createElement("button");
    bk.className="chip";
    if(shelfSub){ bk.textContent="← "+shelfCat; bk.onclick=()=>{shelfSub=null;renderTop();}; }
    else{ bk.textContent="← 本棚"; bk.onclick=()=>{shelfCat=null;shelfSub=null;renderTop();}; }
    lg.appendChild(bk);
    const tt=document.createElement("span");
    tt.className="chip on";
    tt.innerHTML='<span class="dot" style="background:'+esc(catColor(shelfCat))+'"></span>'+esc(shelfSub?"📁 "+shelfSub:shelfCat);
    lg.appendChild(tt);
    lg.appendChild(nearChip());
  }else if(places.length&&homeTab==="list"){
    lg.appendChild(chip("すべて","",""));
    cats.forEach(c=>lg.appendChild(chip(c,c,catColor(c))));
    lg.appendChild(nearChip());
    if(fixN){
      const b=document.createElement("button");
      b.className="chip fix"+(onlyFix?" on":"");
      b.textContent="位置を直す "+fixN;
      b.onclick=()=>{onlyFix=!onlyFix;render();};
      lg.appendChild(b);
    }
  }

  /* サブフォルダ行（一覧タブのみ・カテゴリの下/地域の上）:
     カテゴリ横断で同名フォルダを集める＝「飲食/軽井沢周辺」と「レジャー/軽井沢周辺」をまとめて見られる */
  const sb=document.getElementById("subs"); sb.innerHTML="";
  if(homeTab==="list"&&places.length){
    const scopeC=filterCat?places.filter(p=>p.cat===filterCat):places;
    const subMap=new Map();
    scopeC.forEach(p=>{ if(p.sf) subMap.set(p.sf,(subMap.get(p.sf)||0)+1); });
    if(filterSub&&!subMap.has(filterSub)) filterSub="";
    subMap.forEach((n,name)=>{
      const b=document.createElement("button");
      b.className="chip"+(filterSub===name?" on":"");
      b.textContent="📁 "+name+" "+n;
      b.onclick=()=>{ filterSub=(filterSub===name?"":name); render(); };
      sb.appendChild(b);
    });
  }else filterSub="";

  /* エリア行: 2つ以上の県にまたがった時だけ出す（一覧と本の中。本の中は本の中身だけで数える） */
  const scope=inBook?places.filter(p=>(p.cat||CAT_OTHER.n)===shelfCat&&(!shelfSub||p.sf===shelfSub)):places;
  const ar=document.getElementById("areas"); ar.innerHTML="";
  const prefSet=[...new Set(scope.map(p=>p.pref).filter(Boolean))];
  const multiPref=prefSet.length>1&&!inShelfTop;
  if(!multiPref){ if(!inShelfTop){filterRegion=""; filterPref="";} }
  else{
    ar.appendChild(areaChip("全国",!filterRegion&&!filterPref,()=>{filterRegion="";filterPref="";}));
    REGIONS.filter(r=>prefSet.some(pf=>prefRegion(pf)===r[0])).forEach(([rn])=>{
      const n=scope.filter(p=>prefRegion(p.pref||"")===rn).length;
      ar.appendChild(areaChip(rn+" "+n,filterRegion===rn&&!filterPref,()=>{
        if(filterRegion===rn&&!filterPref){filterRegion="";}
        else{filterRegion=rn;filterPref="";}
      }));
      if(filterRegion===rn){
        prefSet.filter(pf=>prefRegion(pf)===rn)
          .sort((a,b)=>PREF_ORDER.indexOf(a)-PREF_ORDER.indexOf(b))
          .forEach(pf=>{
            const c=scope.filter(p=>p.pref===pf).length;
            ar.appendChild(areaChip(pf+" "+c,filterPref===pf,()=>{
              filterPref=(filterPref===pf?"":pf);
            }));
          });
      }
    });
  }

  const qr=norm(romaToHira(qi.value));
  /* 本の中のフォルダたたみ表示: 検索・地域・2km等の絞り込み中はフォルダを畳まず全カードを平らに出す
     （フォルダの中の場所が「絞ったのに出てこない」を防ぐ） */
  const flatMode=!!(qn||filterPref||filterRegion||nearFilter);
  const folderBrowse=inBook&&!shelfSub&&!flatMode;
  const rows=sorted().filter(p=>{
    if(inBook){
      if((p.cat||CAT_OTHER.n)!==shelfCat) return false;   /* 本の中=そのカテゴリだけ */
      if(shelfSub){ if(p.sf!==shelfSub) return false; }   /* フォルダの中=そのフォルダだけ */
      else if(folderBrowse&&p.sf) return false;           /* 本の直下ではフォルダ入りは畳む */
    }
    else{
      if(onlyFix && hasSpot(p) && !(p.acc&&p.acc>80)) return false;
      if(filterCat && p.cat!==filterCat) return false;
      if(filterSub && p.sf!==filterSub) return false;   /* サブフォルダ絞り込み（カテゴリ横断） */
    }
    /* 地域と📍2km以内は一覧・本の中の両方で効く */
    if(filterPref){ if(p.pref!==filterPref) return false; }
    else if(filterRegion){ if(prefRegion(p.pref||"")!==filterRegion) return false; }
    if(nearFilter){ const d=placeDist(p); if(d==null||d>2000) return false; }
    if(!qn) return true;
    const pi=PREF_INFO[p.pref]||["",""];
    const rg=REGIONS.find(r=>r[0]===pi[1])||["",""];
    const hay=norm([p.name,p.kana,p.cat,p.sf||"",p.addr,p.memo,p.tel,p.pref||"",pi[0],pi[1],rg[1]].join(" "));
    return hay.includes(qn)||(qr&&qr!==qn&&hay.includes(qr));
  });
  document.getElementById("tally").textContent = places.length ? rows.length+" / "+places.length : "";

  const list=document.getElementById("list"); list.innerHTML="";
  if(inShelfTop){
    document.getElementById("tally").textContent=places.length?places.length+"件":"";
    renderShelf(list); return;
  }
  list.className=rows.length?(viewMode==="tile"?"tiles":viewMode==="row"?"rows":"list"):"list";
  /* 本の直下: 小フォルダのタイル（左=先頭4件ミニカード2×2 / 右=フォルダ名）を先頭に出す */
  const nFolders=folderBrowse?renderFolders(list):0;
  if(!places.length){
    list.innerHTML='<div class="empty"><b>まだ空です</b>今いる場所で右下のボタンを押すと、その地点が記録されます。名前を入れるだけで登録は終わりです。</div>';
    return;
  }
  if(!rows.length){
    if(nFolders) return;   /* フォルダだけの本＝空メッセージは出さない */
    if(nearFilter&&!lastPos)
      list.innerHTML='<div class="empty"><b>現在地を取得しています…</b>取得できると、2km以内の場所だけが表示されます。</div>';
    else if(nearFilter)
      list.innerHTML='<div class="empty"><b>2km以内には登録がありません</b>チップをもう一度押すと絞り込みを解除できます。</div>';
    else if(inBook&&shelfSub&&!qn)
      list.innerHTML='<div class="empty"><b>このフォルダは空になりました</b>「← '+esc(shelfCat)+'」で本に戻れます。</div>';
    else list.innerHTML = (inBook&&!qn)
      ? '<div class="empty"><b>この本はまだ空です</b>登録のときカテゴリで「'+esc(shelfCat)+'」を選ぶと、ここに入ります。</div>'
      : '<div class="empty"><b>見つかりません</b>別の言葉で探すか、この場所を新しく登録してください。</div>';
    return;
  }
  if(viewMode==="tile"){
    rows.forEach(p=>{
      const el=document.createElement("div");
      el.className="tile"; el.dataset.id=p.id; el.style.setProperty("--catcolor",catColor(p.cat));   /* v0.36.0: 戻ってくる時の目印 */
      const dm=(sortMode==="near")?placeDist(p):null;
      const sub=[dm!=null?fmtDist(dm):"",p.cat||""].filter(Boolean).join(" ／ ");
      el.innerHTML=
        '<button class="tile-main"><span class="t-name">'+(p.fav?"★ ":"")+esc(p.name)+'</span>'+
        (sub?'<span class="t-sub">'+esc(sub)+'</span>':"")+'</button>'+
        '<button class="t-edit" aria-label="編集">✎</button>';
      el.querySelector(".tile-main").onclick=()=>hasSpot(p)?openMap(p):(toast("位置がまだ入っていません"),form(p));
      el.querySelector(".t-edit").onclick=()=>form(p);
      list.appendChild(el);
    });
    return;
  }
  if(viewMode==="row"){
    /* リスト表示（v0.50.0 テスターFB）: 名前タップ=編集（面積は名前だけに絞る）・
       右の3ボタン=カード表示と同じ実行部（cardAction共用）。赤=位置情報不足のサインも同じ */
    rows.forEach(p=>{
      const el=document.createElement("div");
      el.className="row"; el.dataset.id=p.id; el.style.setProperty("--catcolor",catColor(p.cat));
      el.innerHTML=
        '<button class="r-name">'+(p.fav?"★ ":"")+esc(p.name)+'</button>'+
        '<div class="r-acts">'+
          '<button data-a="map"'+(hasSpot(p)?'':' class="warn"')+'>地図を開く</button>'+
          '<button data-a="area"'+((p.lat&&p.lng)?'':' class="warn"')+'>場所周辺</button>'+
          '<button data-a="nav"'+(goodPin(p)?'':' class="warn"')+'>到達距離</button>'+
        '</div>';
      el.querySelector(".r-name").onclick=()=>form(p);
      el.querySelectorAll(".r-acts button").forEach(b=>b.onclick=()=>cardAction(p,b.dataset.a));
      list.appendChild(el);
    });
    return;
  }
  rows.forEach(p=>{
    const el=document.createElement("div");
    el.className="card"; el.dataset.id=p.id; el.style.setProperty("--catcolor",catColor(p.cat));   /* v0.36.0: 戻ってくる時の目印 */
    const dm=(sortMode==="near")?placeDist(p):null;
    const sub=[dm!=null?fmtDist(dm):"",p.addr,p.memo].filter(Boolean).join(" ／ ");
    let pill="";
    if(!hasSpot(p)) pill='<div class="pill warn">位置なし</div>';
    else if(p.acc&&p.acc>80) pill='<div class="pill warn">おおよそ ±'+p.acc+'m</div>';
    else if(p.acc) pill='<div class="pill">±'+p.acc+'m</div>';
    el.innerHTML=
      '<div class="card-main">'+
        '<div class="cm-text">'+
          (p.cat?'<div class="cat">'+esc(p.cat)+(multiPref&&p.pref?'<span class="preftag">　'+esc(p.pref)+'</span>':'')+'</div>':'')+

          /* 電話番号があれば、この行（距離／住所／メモ）の右端に☎を置く。
             住所も距離もメモも無いカードでは、名前のすぐ下に☎だけの行になる */
          (sub?'<div class="sub">'+esc(sub)+'</div>':'')+
          /* 電話番号があれば、住所の下（±◯mの行）の右端に☎を置く */
          ((pill||p.tel)?'<div class="metarow">'+pill+
            (p.tel?'<button class="telmk" aria-label="電話をかける">☎</button>':'')+'</div>':'')+
        '</div>'+
        '<div class="phbox">'+
          '<div class="phstrip"></div>'+
          '<div class="phbtns">'+
            '<button data-ph="cam">📷写真</button>'+
            '<button data-ph="pick">📁保存画像</button>'+
            /* 🔍=私用の隠し機能（Gマップの写真取得）。APIキーを登録した端末でだけ現れる */
            (gpKey()?'<button data-ph="gp">🔍探す</button>':'')+
          '</div>'+
          '<div class="phbtns"><button data-ph="att">🔗リンクPDF</button><button data-ph="ord">⇅並び順</button></div>'+
        '</div>'+
      '</div>'+
      '<button class="star'+(p.fav?" on":"")+'" aria-label="よく行く">'+(p.fav?"★":"☆")+'</button>'+
      /* ボタンの赤=頼る位置情報が未確定のサイン（初見ユーザーへの視覚的な案内）。
         経路・近く=正確な座標（±80m以内 or 手動ピン）が無ければ赤。
         周辺=中心を置くだけなので座標さえあれば足りる（粗くても俯瞰の役には立つ）。
         地図を開く=URL・座標・住所のどれも無い時だけ赤。全部そろえば全ボタン白 */
      '<div class="actions">'+
        '<button data-a="map"'+(hasSpot(p)?'':' class="warn"')+'>地図を開く</button>'+
        '<button data-a="route"'+(goodPin(p)?'':' class="warn"')+'>経路</button>'+
        /* 電話はこの並びから外して、上の行の☎に移した（4つのボタンの幅を守るため） */
        /* 場所周辺=この場所を真ん中にして、まわりに登録した場所を見る（v0.34.0の「周辺」）
           到達距離=自分との位置・距離を知る拡大地図（v0.50.0の改名。旧「近く」。
           テスターFB「周辺と近くが同じ意味に見える」→距離の言葉から目的の言葉へ） */
        '<button data-a="area"'+((p.lat&&p.lng)?'':' class="warn"')+'>場所周辺</button>'+
        '<button data-a="nav"'+(goodPin(p)?'':' class="warn"')+'>到達距離</button>'+
      '</div>';
    /* カード本体タップ＝編集（地図は「地図を開く」ボタンから） */
    el.querySelector(".card-main").onclick=()=>form(p);
    /* ☎はカード本体の中にあるので、押した時に編集が開かないよう止める */
    const tb=el.querySelector(".telmk");
    if(tb) tb.onclick=e=>{e.stopPropagation(); location.href="tel:"+p.tel.replace(/[^\d+]/g,"");};
    /* 写真ボックス: サムネ列(新しい順)+下の固定2ボタン。タップ=ライトボックス/長押し=削除 */
    const strip=el.querySelector(".phstrip");
    if(!((p.ph&&p.ph.length)||(p.att&&p.att.length))) strip.style.display="none";
    el.querySelectorAll(".phbtns button").forEach(b=>{
      b.onclick=e=>{e.stopPropagation();
        if(b.dataset.ph==="att") attSheet(p);
        else if(b.dataset.ph==="ord") ordSheet(p);
        else if(b.dataset.ph==="gp") gpOpen(p);
        else phShoot(p,b.dataset.ph==="pick");};
    });
    /* サムネ列は p.ord の順（写真と添付ミニタイルが混ざって並ぶ）。
       写真: タップ=縦閲覧 / 長押し=削除。添付: タップ=縦閲覧のその位置へ / 長押し=メニュー
       ★ordSync（添付ID採番）を先に呼んでからatMapを作ること（逆だと追加直後の添付が写真扱いになる） */
    const toks=ordSync(p);
    const atMap=new Map((p.att||[]).map(a=>[a.id,a]));
    toks.forEach(tok=>{
      const a=atMap.get(tok);
      if(a){
        const tl=document.createElement("div");
        tl.className="ph attile";
        if(a.t==="pdf") tl.textContent="📄";
        else{
          tl.textContent="🌐";
          tl.innerHTML+='<span class="abdg">🔗</span>';
          if(a.ic) phGet(a.ic).then(du=>{ if(du){tl.firstChild.textContent="";tl.style.backgroundImage="url("+du+")";} });
        }
        tl.oncontextmenu=e=>e.preventDefault();
        bookLongPress(tl,()=>attMenu(p,a));
        tl.onclick=e=>{e.stopPropagation(); if(tl.longFired){tl.longFired=false;return;} pvOpen(p,tok);};
        strip.appendChild(tl);
        return;
      }
      const id=tok;
      const im=document.createElement("img");
      im.className="ph"; im.alt="";
      im.oncontextmenu=e=>e.preventDefault();
      im.draggable=false;
      phGet(id).then(du=>{if(du)im.src=du;});
      let lpT=null, lpFired=false, sx=0, sy=0;
      const cancel=()=>{if(lpT){clearTimeout(lpT);lpT=null;}};
      im.onpointerdown=e=>{lpFired=false;sx=e.clientX;sy=e.clientY;
        lpT=setTimeout(()=>{lpT=null;lpFired=true;phDelete(p,id);},600);};
      im.onpointermove=e=>{if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>8)cancel();};
      im.onpointerup=cancel; im.onpointerleave=cancel; im.onpointercancel=cancel;
      im.onclick=e=>{e.stopPropagation(); if(lpFired){lpFired=false;return;} pvOpen(p,id);};
      strip.appendChild(im);
    });
    el.querySelector(".star").onclick=()=>{p.fav=!p.fav;save();};
    el.querySelectorAll(".actions button").forEach(b=>b.onclick=()=>cardAction(p,b.dataset.a));
    list.appendChild(el);
  });
}
/* 地図を開く・経路・場所周辺・到達距離ボタンの実行部（カード表示とリスト表示で共用・v0.50.0で切り出し） */
function cardAction(p,a){
      if(a==="map") hasSpot(p)?openMap(p):(toast("位置がまだ入っていません"),form(p));
      else if(a==="route"){
        if(!hasSpot(p)){toast("位置がまだ入っていません");form(p);}
        else if(!goodPin(p)){
          /* 赤ボタン=素通しにしない。理由を明示した確認を挟み、「開く」で初めてマップへ
             （赤なのに普通に開くと、ユーザーが赤の意味を学べないため） */
          const why=(p.lat&&p.lng)
            ? "登録位置の精度が粗いです（おおよそ±"+p.acc+"m）。"
            : (p.addr
              ? "正確なピンが未設定です。住所だけを頼りに経路を開きます。"
              : "正確なピンも住所も未記入です。Googleマップのリンクと名前だけを頼りに経路を開きます。");
          dlgOpen(why+"\n本来の場所とズレることがありますのでご注意ください。\n（編集→「🗺 地図で位置を決める」で確定できます）",true,
            ok=>{ if(ok) openRoute(p); });
        }
        else openRoute(p);
      }
      else if(a==="area"){
        /* この場所を真ん中にして周辺ビューを開く。座標が無ければリンクから拾い直す */
        if(!(p.lat&&p.lng)){
          const c=pickCoords(p.url);
          if(c){p.lat=c.lat;p.lng=c.lng;p.acc=null;updatePref(p);save();}
        }
        if(p.lat&&p.lng){ bump(p); nearOpen(p); }
        /* v0.40.0: 「置いてください」で突き放さず、その場で地図に進むか選べる2択に。
           地図で決めたらそのまま周辺を開く＝押した目的を最後まで果たす */
        else dlgOpen("「場所周辺」を使うには、この場所の位置（座標）が必要です。\n地図の＋印を合わせて、位置を設定しますか？",true,
          ok=>{ if(!ok) return;
            nvOpenPick(null,(lat,lng)=>{
              p.lat=String(lat); p.lng=String(lng); p.acc=null;
              updatePref(p); save();
              toast("位置を設定しました");
              bump(p); nearOpen(p);
            },p.addr||p.name);
          },{yes:"🗺 地図で位置を決める",no:"今回はやめる"});
      }
      else if(a==="nav"){
        /* 座標が無ければリンクからの抽出をもう一度試す（フルURLなら取れる） */
        if(!(p.lat&&p.lng)){
          const c=pickCoords(p.url);
          if(c){p.lat=c.lat;p.lng=c.lng;p.acc=null;updatePref(p);save();}
        }
        if(p.lat&&p.lng){
          /* 赤（精度が粗い）は理由つき確認を挟む。押すまで消えない＝読める */
          if(!goodPin(p)){
            dlgOpen("登録位置の精度が粗いです（おおよそ±"+p.acc+"m）。\nピンが本来の場所とズレていることがあります。\n（編集→「🗺 地図で位置を決める」で確定できます）",true,
              ok=>{ if(ok){bump(p);nvOpen("place",p);} });
            return;
          }
          bump(p);nvOpen("place",p);
        }
        /* v0.40.0: 場所周辺と同じ2択方式。地図で決めたらそのまま「到達距離」を開く */
        else dlgOpen("「到達距離」（自分との位置・距離の確認）には正確な位置が必要ですが、この場所にはまだ入っていません。\n地図の＋印を合わせて、位置を設定しますか？",true,
          ok=>{ if(!ok) return;
            nvOpenPick(null,(lat,lng)=>{
              p.lat=String(lat); p.lng=String(lng); p.acc=null;
              updatePref(p); save();
              toast("位置を設定しました");
              bump(p); nvOpen("place",p);
            },p.addr||p.name);
          },{yes:"🗺 地図で位置を決める",no:"今回はやめる"});
      }
      else form(p);
}

/* ───── 本の中の小フォルダ（1段だけ。p.sf=フォルダ名） ─────
   本の直下にタイルで並ぶ: 左=中の先頭4件のミニカード2×2 / 右=フォルダ名と件数。
   タップ=そのフォルダだけ表示 / 長押し=名前変更・解除・削除 */
function bookSubs(cat){
  const m=new Map();
  sorted().forEach(p=>{ if((p.cat||CAT_OTHER.n)===cat&&p.sf){ if(!m.has(p.sf))m.set(p.sf,[]); m.get(p.sf).push(p); } });
  return m;
}
function renderFolders(list){
  const m=bookSubs(shelfCat);
  if(!m.size) return 0;
  const box=document.createElement("div"); box.className="folders";
  m.forEach((arr,name)=>{
    const el=document.createElement("button"); el.className="folder";
    el.style.setProperty("--catcolor",catColor(shelfCat));
    let cells="";
    for(let i=0;i<4;i++){
      const p=arr[i];
      cells+='<div class="fcell">'+(p?esc(p.name):"")+'</div>';
    }
    el.innerHTML='<div class="fgrid">'+cells+'</div>'+
      '<div><div class="fname">📁 '+esc(name)+'</div><div class="fcnt">'+arr.length+'件</div></div>';
    /* 写真がある場所はミニカードに写真を敷く（名前より画で分かる） */
    arr.slice(0,4).forEach((p,i)=>{
      if(p.ph&&p.ph[0]) phGet(p.ph[0]).then(du=>{
        if(!du)return;
        const c=el.querySelectorAll(".fcell")[i]; if(!c)return;
        c.style.backgroundImage="url("+du+")"; c.textContent="";
      });
    });
    el.onclick=()=>{ if(el.longFired){el.longFired=false;return;} shelfSub=name; renderTop(); };
    bookLongPress(el,()=>folderMenu(name));
    box.appendChild(el);
  });
  list.appendChild(box);
  return m.size;
}
function folderMenu(sub){
  const arr=places.filter(p=>(p.cat||CAT_OTHER.n)===shelfCat&&p.sf===sub);
  const nPh=arr.reduce((s,p)=>s+((p.ph||[]).length),0);
  sheet.innerHTML=
    '<h2>📁「'+esc(sub)+'」</h2>'+
    '<div class="hint">サブカテゴリ（全カテゴリ共通）。「'+esc(shelfCat)+'」の本には '+arr.length+'件 入っています。</div>'+
    '<button class="menu-item" id="fm_ren">名前を変更する（全カテゴリに反映）</button>'+
    '<button class="menu-item" id="fm_flat">この本の中だけ外す（場所はバラに戻る）</button>'+
    '<button class="menu-item" id="fm_del" style="color:#B4462F">🗑 この本の中の場所 '+arr.length+'件'+(nPh?'（写真'+nPh+'枚）':'')+' ごと削除</button>'+
    '<div class="sheet-actions"><button class="btn" id="fm_close">閉じる</button></div>';
  veil.classList.add("on");
  document.getElementById("fm_close").onclick=closeSheet;
  document.getElementById("fm_ren").onclick=()=>{
    const nv=(prompt("新しい名前（全カテゴリのカードに反映されます）",sub)||"").trim();
    if(!nv||nv===sub) return;
    /* サブカテゴリは全カテゴリ共通＝改名は全カードへ（本ごとに改名すると同名が割れてしまう） */
    places.forEach(p=>{ if(p.sf===sub) p.sf=nv; });
    if(shelfSub===sub) shelfSub=nv;
    Store.save(places); closeSheet(); renderTop(); toast("名前を変更しました（全カテゴリに反映）");
  };
  document.getElementById("fm_flat").onclick=()=>{
    if(!confirm('「'+shelfCat+'」の中の場所 '+arr.length+'件 からサブカテゴリを外して、本の直下に戻します。\n（他のカテゴリの「'+sub+'」はそのまま。場所は消えません）よろしいですか？'))return;
    arr.forEach(p=>{delete p.sf;});
    if(shelfSub===sub) shelfSub=null;
    Store.save(places); closeSheet(); renderTop(); toast("この本の中のサブカテゴリを外しました");
  };
  document.getElementById("fm_del").onclick=()=>{
    if(!confirm('「'+sub+'」の中の場所 '+arr.length+'件'+(nPh?'と写真'+nPh+'枚':'')+'を削除します。\n元に戻せません。よろしいですか？'))return;
    arr.forEach(phPurgePlace);
    const ids=new Set(arr.map(p=>p.id));
    places=places.filter(p=>!ids.has(p.id));
    if(shelfSub===sub) shelfSub=null;
    Store.save(places); closeSheet(); renderTop(); toast("フォルダごと削除しました");
  };
}

/* ───── 本棚（カテゴリ=本） ─────
   タップ=その本を開く / 長押し=表紙の画像を設定。
   表紙が無い本はカテゴリ色の表紙＋頭文字 */
function bookLongPress(el,onLong){
  let t=null,x0=0,y0=0;
  el.longFired=false;
  el.addEventListener("pointerdown",e=>{
    el.longFired=false; x0=e.clientX; y0=e.clientY;
    t=setTimeout(()=>{el.longFired=true;onLong();},600);
  });
  el.addEventListener("pointermove",e=>{
    if(t&&Math.hypot(e.clientX-x0,e.clientY-y0)>10){clearTimeout(t);t=null;}
  });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>
    el.addEventListener(ev,()=>{if(t){clearTimeout(t);t=null;}}));
  el.addEventListener("contextmenu",e=>e.preventDefault());
}
function renderShelf(list){
  list.className="shelf";
  if(!places.length&&CATS.length<=1){
    list.className="list";
    list.innerHTML='<div class="empty"><b>まだ空です</b>今いる場所で右下のボタンを押すと、その地点が記録されます。名前を入れるだけで登録は終わりです。</div>';
    return;
  }
  const counts={};
  places.forEach(p=>{const c=p.cat||CAT_OTHER.n;counts[c]=(counts[c]||0)+1;});
  const cats=CATS.filter(x=>x.n!==CAT_OTHER.n||counts[x.n]);   /* その他は空なら出さない */
  cats.forEach(x=>{
    const b=document.createElement("button");
    b.className="book"; b.style.setProperty("--catcolor",x.c);
    /* 表紙: 画像なし=カテゴリ色の二色構え（上=明るく/下=濃く）。帯（黒帯カテゴリ名）は
       cov.t で ON/OFF（表紙情報なし=帯あり）。画像あり+帯OFF=画像のみ／画像なし+帯OFF=色だけ */
    const cov=covOf(x.n);
    const two="linear-gradient(155deg,rgba(255,255,255,.18),rgba(255,255,255,0) 45%,rgba(0,0,0,.12)),"+
      "linear-gradient(180deg,"+mixHex(x.c,"#FFFFFF",.38)+" 0 46%,"+mixHex(x.c,"#000000",.22)+" 46% 100%)";
    b.innerHTML=
      '<div class="bcover">'+
        '<div class="bdefault" style="background-image:'+two+'"></div>'+
        (!cov||cov.t?'<div class="btitle">'+esc(x.n)+'</div>':'')+
      '</div>'+
      '<div class="bcount">'+(counts[x.n]||0)+'件</div>';
    if(cov&&cov.id) phGet(cov.id).then(du=>{
      if(!du)return;
      const c=b.querySelector(".bcover"); if(!c)return;
      const im=document.createElement("img"); im.alt=""; im.src=du;
      c.insertBefore(im,c.querySelector(".btitle"));   /* 帯より下・スパインより下(z指定)に敷く */
    });
    /* 長いカテゴリ名は折り返さずフォントを縮めて1行に収める */
    const tt=b.querySelector(".btitle");
    if(tt) requestAnimationFrame(()=>{
      let fs=16;
      while(fs>9&&tt.scrollWidth>tt.clientWidth){fs--;tt.style.fontSize=fs+"px";}
    });
    b.onclick=()=>{ if(b.longFired){b.longFired=false;return;} shelfCat=x.n; shelfSub=null; renderTop(); };
    bookLongPress(b,()=>coverMenu(x));

  const h=document.createElement("div");
  h.className="shelfhint";

  list.appendChild(h);

function coverMenu(cat){

      '<input type="checkbox" id="cv_label" style="width:20px;height:20px"'+(!cur||cur.t?" checked":"")+'>'+
      '表紙にカテゴリ名を入れる</label>'+
    '<button class="menu-item" id="cv_pick">📁 表紙の画像を選ぶ</button>'+
    (cur&&cur.id&&cur.src?'<button class="menu-item" id="cv_adj">🎛 位置やサイズを調整する</button>':'')+
    (cur&&cur.id?'<button class="menu-item" id="cv_del">表紙の画像を外す</button>':'')+

  veil.classList.add("on");
  document.getElementById("cv_close").onclick=closeSheet;
  const chk=document.getElementById("cv_label");
  /* チェック切替だけで帯のON/OFFが即反映される。
     ★画像なしの本でも記憶する（id:nullで帯フラグだけ保存）＝デフォルト表紙の文字も消せる */
  chk.onchange=()=>{
    const c=covOf(cat.n);
    COVERS[cat.n]={id:c?c.id:null,t:chk.checked?1:0,src:(c&&c.src)||null,cs:(c&&c.cs)||null};
    saveCovers(); render();
  };
  /* 画像選択→クロップ画面（位置決め・拡縮）→決定で保存。箱のヘッダー画像と同じ流儀 */
  document.getElementById("cv_pick").onclick=()=>cvCropPick(cat);
  const adj=document.getElementById("cv_adj");
  if(adj) adj.onclick=()=>cvCropEdit(cat);
  const del=document.getElementById("cv_del");
  if(del) del.onclick=()=>{
    if(!confirm("表紙の画像を外します。よろしいですか？"))return;
    const old=covOf(cat.n);
    if(old&&old.id){IDB.del(old.id).catch(()=>{});phCache.delete(old.id);}
    if(old&&old.src){IDB.del(old.src).catch(()=>{});phCache.delete(old.src);}
    /* 画像だけ外して帯フラグは残す（チェックOFFの本が外した途端に帯復活しないように） */
    COVERS[cat.n]={id:null,t:old&&old.t?1:0}; saveCovers(); closeSheet(); render();
    toast("表紙を外しました");

  const db=document.getElementById("cv_delbook");
  if(db) db.onclick=()=>bookDelete(cat);

/* ───── 表紙の位置調整（クロップ） ─────
   箱のヘッダー画像クロップと同じ流儀: 画像を選ぶ→本と同じ3:4の枠にドラッグで位置決め・
   ピンチ/ホイールで拡縮→決定で枠の範囲だけをCanvasに焼いて保存。
   ズームはcoverスケールを下限にする＝枠の中に余白が出ない（iOSプロフィール画像と同じ） */
let CVC=null;
function cvCropPick(cat){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*";
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const img=new Image();
    img.onload=()=>cvCropShow(cat,img,{file:f});
    img.onerror=()=>{ URL.revokeObjectURL(img.src); toast("画像を読み込めませんでした"); };
    img.src=URL.createObjectURL(f);
  };
  inp.click();
}
/* 既存の表紙の微調整（v0.44.0）: 決定時に保存しておいた元画像を、前回の配置(cs)そのままで開き直す。
   ＝選び直して0からやり直さなくても「少しずらす」ができる。元画像が無い（旧版で作った表紙・
   バックアップ欠け）時はボタン自体が出ない */
function cvCropEdit(cat){
  const cur=covOf(cat.n);
  if(!(cur&&cur.src)){ toast("調整できる元画像がありません（画像を選び直してください）"); return; }
  phGet(cur.src).then(du=>{
    if(!du){ toast("元画像が見つかりません（画像を選び直してください）"); return; }
    const img=new Image();
    img.onload=()=>cvCropShow(cat,img,{srcId:cur.src,cs:cur.cs});
    img.onerror=()=>toast("元画像を読み込めませんでした");
    img.src=du;
  });
}
function cvCropShow(cat,img,opt){
  opt=opt||{};
  const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  if(!iw||!ih){
    if(img.src&&img.src.startsWith("blob:")) URL.revokeObjectURL(img.src);
    toast("画像を読み込めませんでした"); return;
  }
  const vp=document.getElementById("cvcropVp"), imEl=document.getElementById("cvcropImg");
  vp.style.setProperty("--catcolor",cat.c);   /* 左端の背表紙ラインも実物どおり見せる */
  vp.style.background=cat.c;                  /* 画像の入らない余白はカテゴリ色（焼き込みと同じ見た目） */
  document.getElementById("cvcrop").classList.add("on");
  requestAnimationFrame(()=>{                  /* 表示後でないと枠サイズが取れない */
    const r=vp.getBoundingClientRect();
    const cover=Math.max(r.width/iw,r.height/ih);
    const fit=Math.min(r.width/iw,r.height/ih);
    /* v0.43.0: 縮小の下限を「枠いっぱい(cover)」から「全体が入る大きさの1/4」まで解放。
       開始位置は従来どおり枠いっぱい＝今まで通りの使い方は何も変わらない */
    CVC={cat:cat,img:img,iw:iw,ih:ih,vw:r.width,vh:r.height,
         sc:cover,min:fit*0.25,max:cover*4,tx:0,ty:0,
         file:opt.file||null,srcId:opt.srcId||null,
         ptr:new Map(),lx:0,ly:0,pd:null,ps:0,ptx:0,pty:0,pmx:0,pmy:0,pcx:0,pcy:0};
    /* 微調整＝前回の配置を復元。倍率は「枠いっぱい比」・位置は「枠サイズ比」で保存してあるので、
       画面サイズが変わっていても同じ見た目から始まる */
    if(opt.cs&&isFinite(opt.cs.rs)){
      CVC.sc=Math.min(CVC.max,Math.max(CVC.min,opt.cs.rs*cover));
      CVC.tx=(opt.cs.ntx||0)*r.width; CVC.ty=(opt.cs.nty||0)*r.height;
      cvCropClamp();
    }
    imEl.src=img.src;
    imEl.style.width=iw+"px"; imEl.style.height=ih+"px";
    cvCropApply();
  });
}
function cvCropApply(){
  if(!CVC) return;
  const w=CVC.iw*CVC.sc, h=CVC.ih*CVC.sc;
  document.getElementById("cvcropImg").style.transform=
    "translate("+(-w/2+CVC.tx)+"px,"+(-h/2+CVC.ty)+"px) scale("+CVC.sc+")";
}
function cvCropClamp(){
  /* v0.43.0: 自由配置。枠の外へも動かせるが、画像が完全に消えて迷子にならないよう
     最低30pxは枠の中に残す（旧: 常に枠いっぱいを画像で埋めるクランプだった） */
  const w=CVC.iw*CVC.sc, h=CVC.ih*CVC.sc, K=30;
  const mx=CVC.vw/2+w/2-K, my=CVC.vh/2+h/2-K;
  CVC.tx=Math.min(mx,Math.max(-mx,CVC.tx));
  CVC.ty=Math.min(my,Math.max(-my,CVC.ty));
}
(function(){
  const vp=document.getElementById("cvcropVp");
  vp.addEventListener("pointerdown",e=>{
    if(!CVC) return;
    try{vp.setPointerCapture&&vp.setPointerCapture(e.pointerId);}catch(x){}   /* 失敗してもドラッグ自体は続行 */
    CVC.ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    CVC.lx=e.clientX; CVC.ly=e.clientY; CVC.pd=null;   /* 指の数が変わるたびピンチ基準はリセット */
    vp.classList.add("drag"); e.preventDefault();
  });
  vp.addEventListener("pointermove",e=>{
    if(!CVC||!CVC.ptr.has(e.pointerId)) return;
    CVC.ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const ps=[...CVC.ptr.values()];
    if(ps.length===1){                                  /* 1本指=パン */
      CVC.tx+=e.clientX-CVC.lx; CVC.ty+=e.clientY-CVC.ly;
      CVC.lx=e.clientX; CVC.ly=e.clientY;
      cvCropClamp(); cvCropApply();
    }else if(ps.length===2){                            /* 2本指=ピンチ（中点の画像点をピン留め） */
      const dx=ps[0].x-ps[1].x, dy=ps[0].y-ps[1].y, d=Math.hypot(dx,dy),
            mx=(ps[0].x+ps[1].x)/2, my=(ps[0].y+ps[1].y)/2;
      if(CVC.pd==null){
        const r=vp.getBoundingClientRect();
        CVC.pcx=r.left+CVC.vw/2; CVC.pcy=r.top+CVC.vh/2;
        CVC.pd=Math.max(d,1); CVC.ps=CVC.sc; CVC.ptx=CVC.tx; CVC.pty=CVC.ty;
        CVC.pmx=mx-CVC.pcx; CVC.pmy=my-CVC.pcy;
      }else{
        const Mx=mx-CVC.pcx, My=my-CVC.pcy;
        const ix=(CVC.pmx-CVC.ptx)/CVC.ps, iy=(CVC.pmy-CVC.pty)/CVC.ps;
        const ns=Math.min(CVC.max,Math.max(CVC.min,CVC.ps*(d/CVC.pd)));
        CVC.sc=ns; CVC.tx=Mx-ix*ns; CVC.ty=My-iy*ns;
        cvCropClamp(); cvCropApply();
      }
    }
    e.preventDefault();
  });
  const up=e=>{
    if(!CVC) return;
    CVC.ptr.delete(e.pointerId); CVC.pd=null;
    if(!CVC.ptr.size) vp.classList.remove("drag");
    else{ const p=[...CVC.ptr.values()][0]; CVC.lx=p.x; CVC.ly=p.y; }   /* ピンチ→パンの引き継ぎ */
    try{vp.releasePointerCapture&&vp.releasePointerCapture(e.pointerId);}catch(x){}
  };
  vp.addEventListener("pointerup",up);
  vp.addEventListener("pointercancel",up);
  vp.addEventListener("wheel",e=>{                      /* デスクトップ用: マウス位置ピン留めズーム */
    if(!CVC) return; e.preventDefault();
    const f=e.deltaY>0?0.92:1/0.92, r=vp.getBoundingClientRect();
    const Mx=e.clientX-(r.left+CVC.vw/2), My=e.clientY-(r.top+CVC.vh/2);
    const ix=(Mx-CVC.tx)/CVC.sc, iy=(My-CVC.ty)/CVC.sc;
    const ns=Math.min(CVC.max,Math.max(CVC.min,CVC.sc*f));
    CVC.sc=ns; CVC.tx=Mx-ix*ns; CVC.ty=My-iy*ns;
    cvCropClamp(); cvCropApply();
  },{passive:false});
  document.getElementById("cvcropNg").onclick=cvCropCancel;
  document.getElementById("cvcropOk").onclick=cvCropOk;
})();
function cvCropCancel(){
  const im=document.getElementById("cvcropImg");
  if(im.src&&im.src.startsWith("blob:")) URL.revokeObjectURL(im.src);
  im.removeAttribute("src");
  document.getElementById("cvcrop").classList.remove("on");
  CVC=null;
}
function cvCropOk(){
  if(!CVC){ cvCropCancel(); return; }
  /* 枠に写っている範囲を600×800(3:4)に焼く＝表紙の表示幅は最大でも300px程度なので十分な解像度。
     v0.43.0: 先にカテゴリ色で塗る＝画像が枠より小さい・枠からはみ出た余白はカテゴリ色になる */
  const OW=600, OH=800, k=OW/CVC.vw;
  const w=CVC.iw*CVC.sc, h=CVC.ih*CVC.sc;
  const X=(CVC.vw-w)/2+CVC.tx, Y=(CVC.vh-h)/2+CVC.ty;   /* 枠左上から見た画像左上（枠内プレビューと同じ座標系） */
  const cv=document.createElement("canvas"); cv.width=OW; cv.height=OH;
  const g=cv.getContext("2d");
  g.fillStyle=CVC.cat.c; g.fillRect(0,0,OW,OH);
  g.drawImage(CVC.img,0,0,CVC.iw,CVC.ih,X*k,Y*k,w*k,h*k);
  const du=cv.toDataURL("image/jpeg",.85);
  const cat=CVC.cat, file=CVC.file, srcOld=CVC.srcId;
  /* 微調整用に配置を記憶（倍率=枠いっぱい比・位置=枠サイズ比） */
  const cover=Math.max(CVC.vw/CVC.iw,CVC.vh/CVC.ih);
  const cs={rs:+(CVC.sc/cover).toFixed(5),ntx:+(CVC.tx/CVC.vw).toFixed(5),nty:+(CVC.ty/CVC.vh).toFixed(5)};
  cvCropCancel();   /* blob URLの後片付け（drawImage済みなので安全） */
  const id="i"+Date.now()+Math.random().toString(36).slice(2,5);
  /* 元画像も保存（新しく選んだ時だけ圧縮して保存・微調整は既存を使い回す）＝「🎛調整」の種 */
  const pSrc=file?phProcessFile(file):Promise.resolve(srcOld||null);
  Promise.all([IDB.set(id,du),pSrc]).then(rr=>{
    const srcId=rr[1]||null;
    phCache.set(id,du);
    const old=covOf(cat.n);
    if(old&&old.id){IDB.del(old.id).catch(()=>{});phCache.delete(old.id);}
    if(old&&old.src&&old.src!==srcId){IDB.del(old.src).catch(()=>{});phCache.delete(old.src);}
    const chk=document.getElementById("cv_label");   /* 帯フラグはシートの今のチェック状態を引き継ぐ */
    COVERS[cat.n]={id:id,t:chk?(chk.checked?1:0):1,src:srcId,cs:cs};
    saveCovers(); closeSheet(); render();
    toast("表紙を設定しました");
  }).catch(()=>toast("表紙を保存できませんでした（空き容量を確認）"));
}

function bookDelete(cat){
  const inPl=places.filter(p=>p.cat===cat.n);
  const nPh=inPl.reduce((s,p)=>s+((p.ph||[]).length),0);
  if(!inPl.length){
    if(confirm('「'+cat.n+'」の本を削除します。よろしいですか？\n（中に場所はありません）')) bookRemove(cat,false);
    return;
  }
  sheet.innerHTML=

    '<div class="hint">中に場所が '+inPl.length+'件 あります。どうするか選んでください。</div>'+
    '<button class="menu-item" id="bd_keep">場所は「その他」へ移して、本だけ削除</button>'+

function bookRemove(cat,withPlaces){
  if(withPlaces){
    places.filter(p=>p.cat===cat.n).forEach(phPurgePlace);   /* 写真もIndexedDBから道連れパージ */
    places=places.filter(p=>p.cat!==cat.n);
  }else{
    places.forEach(p=>{ if(p.cat===cat.n){ p.cat=CAT_OTHER.n; } });   /* サブカテゴリは全カテゴリ共通＝移動しても保持（v0.41.0） */
  }
  const c=covOf(cat.n);
  if(c){ ["id","src"].forEach(k=>{ if(c[k]){IDB.del(c[k]).catch(()=>{});phCache.delete(c[k]);} }); }
  delete COVERS[cat.n]; saveCovers();
  CATS=CATS.filter(x=>x.n!==cat.n); saveCats();
  if(filterCat===cat.n) filterCat="";
  if(shelfCat===cat.n) shelfCat=null;
  save(); closeSheet();
  toast(withPlaces?"本と中の場所を削除しました":"本を削除しました（場所は「その他」へ）");
}

/* ───── 共有ターゲット受信（Googleマップ「共有」→場所帳） ───── */
function handleShare(){
  const sp=new URLSearchParams(location.search);
  if(!(sp.has("title")||sp.has("text")||sp.has("url"))) return false;
  const title=(sp.get("title")||"").trim(), text=(sp.get("text")||"").trim(), urlP=(sp.get("url")||"").trim();
  history.replaceState(null,"",location.pathname); /* リロード・戻るで再発火させない */
  let url=urlP;
  if(!url){ const m=text.match(/https?:\/\/\S+/); if(m)url=m[0]; }
  let name=title;
  if(!name) name=text.replace(/https?:\/\/\S+/g,"").split("\n").map(s=>s.trim()).filter(Boolean)[0]||"";
  /* 座標が拾えるなら拾う（フルURL内・共有テキスト内の「lat, lng」） */
  let c=pickCoords(url);
  if(!c){ const m=text.match(/(-?\d{1,2}\.\d{3,}),\s*(-?\d{1,3}\.\d{3,})/); if(m)c={lat:m[1],lng:m[2]}; }
  if(!c){ c=dmsToDec(title)||dmsToDec(text); }
  /* ピン長押しの共有は「名称」が座標の文字列そのもの → 名前欄には入れず座標として扱う */
  const nm=name.match(/^\s*(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})\s*$/);
  if(nm){ if(!c)c={lat:nm[1],lng:nm[2]}; name=""; }
  else if(dmsToDec(name)||/^(ドロップされたピン|dropped pin|指定した地点|plus\s?code)/i.test(name.trim())) name="";
  if(!name&&!url&&!c) return false;
  shareAdd(name,url,c,pickAddr(title+"\n"+text));
  return true;
}
/* 共有テキストから住所らしき行を拾う（都道府県名で始まり数字を含む部分。〒や「日本、」付きも可） */
function pickAddr(t){
  const re=new RegExp("(〒?\\s*\\d{3}[-−]?\\d{4}\\s*)?(日本[、,]?\\s*)?("+PREF_ORDER.join("|")+")[^\\n]+");
  const lines=String(t||"").replace(/https?:\/\/\S+/g,"").split("\n").map(s=>s.trim()).filter(Boolean);
  for(const L of lines){
    const m=L.match(re);
    if(m&&/\d|[０-９〇一二三四五六七八九]/.test(m[0])) return m[0].trim();
  }
  return "";
}
/* 度分秒（35°40'48.4"N 139°46'07.7"E）→ 10進。ピン長押し共有はこの形式で来ることがある */
function dmsToDec(t){
  const m=String(t||"").match(/(\d{1,2})[°度]\s*(\d{1,2})['′]\s*([\d.]+)["″]?\s*([NS])[^\dNSEW]{0,5}(\d{1,3})[°度]\s*(\d{1,2})['′]\s*([\d.]+)["″]?\s*([EW])/i);
  if(!m)return null;
  const la=(+m[1]+m[2]/60+m[3]/3600)*(/s/i.test(m[4])?-1:1);
  const lo=(+m[5]+m[6]/60+m[7]/3600)*(/w/i.test(m[8])?-1:1);
  if(!isFinite(la)||!isFinite(lo)||Math.abs(la)>90||Math.abs(lo)>180)return null;
  return {lat:la.toFixed(6),lng:lo.toFixed(6)};
}
let shareSeq=0;   /* 共有シートの通し番号（裏で調べた結果が古い画面に書き込まれるのを防ぐ） */

    /* v0.40.0: 座標なしでもピン置きは自動で開かない（自動検索が外れて「全然違う場所」が
       出ることが多く混乱のもと＝コーイチさん実使用FB）。位置が要る「近く」「周辺」を
       押した時に、その場で設定するか選んでもらう方式へ */
    toast("「"+nm+"」を登録しました"+((rec.lat&&rec.lng)?"":"（位置はまだ未設定です）"));
  };

/* ───── 周辺モード（目的地周辺の拡大地図ナビ・地理院タイル） ───── */
const NV={map:null,std:null,photo:null,photoOn:false,destMk:null,meMk:null,accC:null,trailLn:null,
  watch:null,follow:true,mode:"place",target:null,fitted:false,lastFix:null,hdgFn:null,wl:null,
  headUp:false,curHd:null,rotShown:0,rotT:0,hasCompass:false,gpsT:0,
  cmpFix:0,rawHd:null,rawHdT:0,fixBuf:[],cmpTold:false,   /* コンパス自動補正（GPS照合） */
  gpsOn:false,walkN:0,gline:null};
const nvEl=id=>document.getElementById(id);

function nvInitMap(){
  if(NV.map) return;
  const ATT='<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>';
  NV.std=L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
    {maxZoom:20,maxNativeZoom:18,attribution:ATT});
  NV.photo=L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg",
    {maxZoom:20,maxNativeZoom:18,attribution:ATT});
  /* 名前入り地図（OSM）: 神社・店・施設の名称が載る。ピン置きの既定 */
  NV.osm=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom:20,maxNativeZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'});
  NV.map=L.map("nvMap",{zoomControl:false});
  NV.map.attributionControl.setPosition("topright");
  NV.lay=""; nvSetLayer("std");
  NV.map.on("dragstart",()=>nvFollow(false));
  NV.map.on("move zoom viewreset resize",nvEdgeSync);
}
/* 地理院タイルは日本専用＝日本の外は白紙になる（v0.45.0・海外テスター対策）。
   緯度20〜46・経度122〜154のざっくり日本範囲かどうかで地理院2種を出すか決める */
function nvJp(lat,lng){ return lat>=20&&lat<=46&&lng>=122&&lng<=154; }
function nvJpHere(){
  try{ const c=NV.map.getCenter(); return nvJp(c.lat,c.lng); }catch(e){ return true; }
}
/* レイヤー切替: std(地理院・道が正確) / photo(航空写真) / osm(名前入り) */
function nvSetLayer(k){
  if(!NV.map||NV.lay===k) return;
  [NV.std,NV.photo,NV.osm].forEach(l=>{ if(l&&NV.map.hasLayer(l)) NV.map.removeLayer(l); });
  ({std:NV.std,photo:NV.photo,osm:NV.osm})[k].addTo(NV.map);
  NV.lay=k;
  /* ボタンには「次に押すと何になるか」を表示 */
  nvEl("nvLayer").textContent = k==="std"?"写真":(k==="photo"?"名前":"地図");
}
function nvTargetLL(){
  if(NV.mode==="car") return (parking&&parking.lat!=null)?[parking.lat,parking.lng]:null;
  return NV.target?[NV.target.lat,NV.target.lng]:null;
}
/* 自分→目的地の赤い点線ガイド（細め・目立たない程度）: どちらへ向かえばよいかの目印。
   画面外バッジ(🏁方向)と対になって、線をたどれば目的地に着く */
function nvGuide(me,tg){
  if(!NV.map) return;
  if(!tg){ if(NV.gline){NV.map.removeLayer(NV.gline);NV.gline=null;} return; }
  if(!NV.gline)
    NV.gline=L.polyline([me,tg],{color:"#C43A2F",weight:2,opacity:.6,dashArray:"3 7",interactive:false}).addTo(NV.map);
  else NV.gline.setLatLngs([me,tg]);
}
function nvSetDest(){
  const t=nvTargetLL();
  if(NV.destMk){NV.map.removeLayer(NV.destMk);NV.destMk=null;}
  if(!t) return;
  const car=NV.mode==="car";
  const ic=L.divIcon({className:"",iconSize:[0,0],html:
    '<div class="cr"><div class="dest-pin">'+(car?"🚩":"🏁")+'</div>'+
    '<div class="dest-name">'+esc(car?"旗の位置":(NV.target.name||""))+'</div></div>'});
  NV.destMk=L.marker(t,{icon:ic,interactive:false}).addTo(NV.map);
  nvEdgeSync();
}
/* ───── 画面外ピンの方向インジケータ ─────
   ピンが画面から外れている間だけ、中心→ピンの直線が画面枠に当たる位置に
   丸バッジ（📍＋距離＋外向き矢印）を出す。タップでピンの位置へジャンプ。
   「向き上」の回転中は #nvMap がCSS回転しているため、コンテナ座標を
   回転角ぶん座標変換してから画面内外を判定する */
let nvEdgeQ=false;
function nvEdgeSync(){
  if(nvEdgeQ) return; nvEdgeQ=true;
  requestAnimationFrame(()=>{ nvEdgeQ=false; nvEdgeDo(); });
}
function nvEdgeDo(){
  const el=nvEl("nvEdge");
  const ov=nvEl("nvov");
  const t=nvTargetLL();
  if(!ov.classList.contains("on")||ov.classList.contains("pick")||!t||!NV.map){
    el.classList.remove("on"); return;
  }
  const wrap=document.querySelector(".nv-mapwrap"), m=document.getElementById("nvMap");
  const W=wrap.clientWidth, H=wrap.clientHeight;
  if(!W||!H){ el.classList.remove("on"); return; }
  /* ピンのコンテナ座標 → 回転を織り込んだ画面（wrap）座標 */
  const p=NV.map.latLngToContainerPoint(t);
  const th=NV.rotShown*Math.PI/180;
  const rx=p.x-m.clientWidth/2, ry=p.y-m.clientHeight/2;   /* #nvMapは常にwrap中央 */
  const sx=W/2 + rx*Math.cos(th)-ry*Math.sin(th);
  const sy=H/2 + rx*Math.sin(th)+ry*Math.cos(th);
  if(sx>=0&&sx<=W&&sy>=0&&sy<=H){ el.classList.remove("on"); return; }
  /* 中心→ピンの直線が枠（余白PAD）に当たる点へクランプ */
  const dx=sx-W/2, dy=sy-H/2, PAD=44;
  const k=Math.min((W/2-PAD)/Math.max(Math.abs(dx),1e-9),(H/2-PAD)/Math.max(Math.abs(dy),1e-9));
  el.style.left=(W/2+dx*k)+"px"; el.style.top=(H/2+dy*k)+"px";
  const ang=Math.atan2(dy,dx)*180/Math.PI;
  nvEl("nvEdgeArr").style.transform="translate(-50%,-50%) rotate("+ang+"deg) translateX(34px)";
  nvEl("nvEdgeIco").textContent = NV.mode==="car"?"🚩":"🏁";
  const c=NV.map.getCenter();
  nvEl("nvEdgeDist").textContent=fmtDist(distM({lat:c.lat,lng:c.lng},{lat:t[0],lng:t[1]}));
  el.classList.add("on");
}
nvEl("nvEdge").onclick=()=>{
  const t=nvTargetLL(); if(!t||!NV.map) return;
  nvFollow(false);                       /* 追従で引き戻されないように */
  NV.map.panTo(t);
  toast("ピンの位置へ移動しました（「追従」で自分に戻ります）");
};
function nvDrawTrail(){
  if(NV.trailLn){NV.map.removeLayer(NV.trailLn);NV.trailLn=null;}
  if(!parking||parking.lat==null) return;
  const pts=[[parking.lat,parking.lng]].concat(parking.trail||[]);
  if(pts.length<2) return;
  NV.trailLn=L.polyline(pts,{color:"#274A73",weight:4,opacity:.75,dashArray:"1 8",lineCap:"round"}).addTo(NV.map);
}
function nvCone(h){
  if(!NV.meMk) return;
  const el=NV.meMk.getElement&&NV.meMk.getElement();

function nvMe(ll,acc,hd){
  if(!NV.meMk){
    const ic=L.divIcon({className:"",iconSize:[0,0],html:
      '<div class="me-wrap"><div class="me-cone"></div><div class="me-dot"></div></div>'});
    NV.meMk=L.marker(ll,{icon:ic,interactive:false,zIndexOffset:1000}).addTo(NV.map);
    NV.accC=L.circle(ll,{radius:acc,color:"#1C6EE1",weight:1,opacity:.4,fillColor:"#1C6EE1",fillOpacity:.1,interactive:false}).addTo(NV.map);
  }else{

function nvFollow(v){
  NV.follow=v; nvEl("nvFollow").classList.toggle("on",v);
  if(!v||!NV.lastFix) return;
  /* 追従ONの最初の一回だけ「自分とピンの両方が見える」ように拡縮。以降は自分を中央に */
  const me=[NV.lastFix.lat,NV.lastFix.lng], tg=nvTargetLL();
  if(tg&&!NV.fitted){
    NV.fitted=true; NV.fitT=Date.now();
    NV.map.fitBounds(L.latLngBounds([me,tg]).pad(NV.headUp?0.55:0.3),{maxZoom:18});
  }else NV.map.panTo(me);
}
/* ───── 北上⇄向き上（自分の向きを上に固定して地図を回す） ───── */
function angNorm(d){ return ((d%360)+540)%360-180; }   /* 角度差を -180〜180 に */
function nvApplyRot(){
  const m=document.getElementById("nvMap");
  const tgt=(NV.headUp&&NV.curHd!=null)?-NV.curHd:0;
  /* 359°→0°の境目で一回転して見えないよう、常に近い側へ回す */
  const d=(((tgt-NV.rotShown)%360)+540)%360-180;
  NV.rotShown+=d;
  m.style.transform="rotate("+NV.rotShown+"deg)";
  m.style.setProperty("--mrot",(-NV.rotShown)+"deg");
  nvEdgeSync();
}
function nvSetHead(v){
  NV.headUp=v;
  const b=nvEl("nvHead");
  b.classList.toggle("on",v); b.textContent=v?"向き上":"北上";
  const wrap=document.querySelector(".nv-mapwrap"), m=document.getElementById("nvMap");
  if(v){
    /* 回転しても四隅が欠けないよう、対角線サイズの正方形に広げて中央に置く */
    const d=Math.ceil(Math.hypot(wrap.clientWidth,wrap.clientHeight));
    m.style.position="absolute"; m.style.left="50%"; m.style.top="50%";
    m.style.width=d+"px"; m.style.height=d+"px";
    m.style.marginLeft=(-d/2)+"px"; m.style.marginTop=(-d/2)+"px";
  }else{
    ["position","left","top","width","height","marginLeft","marginTop"].forEach(k=>m.style[k]="");
  }
  if(NV.map){
    NV.map.invalidateSize();
    /* 回転中はLeaflet標準ドラッグを止め、下の自前ドラッグ（回転を逆補正）が引き継ぐ */
    if(NV.map.dragging){ v?NV.map.dragging.disable():NV.map.dragging.enable(); }
    if(NV.follow&&NV.lastFix) NV.map.panTo([NV.lastFix.lat,NV.lastFix.lng]);
  }
  nvApplyRot();
}
/* 「向き上」用の自前1本指ドラッグ: 指の動きを回転角ぶん逆補正してpan
   （Leaflet標準dragはCSS回転を知らず指とズレるため。2本指ピンチはLeafletに任せる） */
(function(){
  const el=document.getElementById("nvMap");
  const pts=new Map(); let dragging=false, moved=0;
  el.addEventListener("pointerdown",e=>{
    pts.set(e.pointerId,[e.clientX,e.clientY]);
    dragging=(pts.size===1&&NV.headUp&&NV.mode!=="pick"); moved=0;
  });
  el.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId)) return;
    const p=pts.get(e.pointerId), dx=e.clientX-p[0], dy=e.clientY-p[1];
    pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(!dragging||pts.size!==1||!NV.headUp||!NV.map) return;
    moved+=Math.abs(dx)+Math.abs(dy);
    if(moved>6&&NV.follow) nvFollow(false);
    const th=NV.rotShown*Math.PI/180;
    NV.map.panBy([-(dx*Math.cos(th)+dy*Math.sin(th)), -(-dx*Math.sin(th)+dy*Math.cos(th))],{animate:false});
  });
  const up=e=>{ pts.delete(e.pointerId); if(pts.size!==1) dragging=false; };
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
})();
function nvWakeLock(){

document.addEventListener("visibilitychange",()=>{

function nvOpen(mode,place){
  NV.mode=mode; NV.fitted=false; NV.fitT=0; NV.lastFix=null; NV.gpsT=0; NV.gpsOn=false; NV.walkN=0;
  NV.fixBuf=[];   /* 補正値cmpFix自体は持ち越す（磁気狂いは開き直しでは直らないため） */
  NV.target = mode==="place" ? {lat:+place.lat,lng:+place.lng,name:place.name} : null;
  document.documentElement.classList.add("nvon");
  nvEl("nvov").classList.add("on"); nvEl("nvov").classList.remove("pick");
  nvEl("nvov").classList.toggle("car",mode==="car");
  nvPhotosRender();
  nvEl("nvUnpark").style.display = mode==="car"?"":"none";
  nvEl("nvName").textContent = mode==="car"?"旗の位置":place.name;
  nvEl("nvSub").textContent = mode==="car"
    ? (parking?fmtTime(parking.t)+" に記録"+(parking.acc!=null?" ±"+parking.acc+"m":""):"")
    : (place.acc?"登録精度 ±"+place.acc+"m":"");
  nvEl("nvDist").textContent="—";
  nvEl("nvNote").innerHTML = mode==="car"
    ? "画面を点けたまま歩くと<b>足あと</b>が残ります。帰りはこの線をたどってください。"
    : "まずはピンの周りをゆっくり確認できます。<b>「追従」</b>を押すと、あなた（青い丸）とピンの両方が見える表示になります。";
  /* ナビの地図は前回使っていたレイヤーで開く（初期値=名前入り。本人の見やすさ優先） */
  let lay="osm";
  try{lay=localStorage.getItem("basho_navlay")||"osm";}catch(e){}
  if(lay!=="std"&&lay!=="photo"&&lay!=="osm") lay="osm";
  nvInitMap();
  /* 目的地が日本の外なら地理院は白紙＝名前入り(OSM)で開く（記憶した好みは変えない） */
  const t0=nvTargetLL();
  if(t0&&!nvJp(t0[0],t0[1])&&lay!=="osm") lay="osm";
  nvSetLayer(lay);
  setTimeout(()=>{
    NV.map.invalidateSize();
    /* 前回「向き上」で使っていたら今回もその向きで開く */
    let hu=false; try{hu=localStorage.getItem("basho_headup")==="1";}catch(e){}
    nvSetHead(hu);
  },60);
  nvSetDest(); nvDrawTrail();
  const t=nvTargetLL();
  if(t) NV.map.setView(t,17);
  /* 場所の周辺: まずピンそばをゆっくり見られるよう追従OFFで開く
     （「追従」を押した時に初めて自分とピンの両方が見えるよう拡縮する）
     駐車メモ: 車へ戻る用途なので従来どおり追従ONで開く */
  nvFollow(mode==="car");
  /* GPS追従開始 */
  if(NV.watch!=null) navigator.geolocation.clearWatch(NV.watch);
  if(navigator.geolocation && location.protocol!=="file:"){
    NV.watch=navigator.geolocation.watchPosition(p=>{
      const c=p.coords, me=[+c.latitude,+c.longitude], acc=Math.round(c.accuracy);
      const hd=(c.heading!=null&&!isNaN(c.heading)&&c.speed!=null&&c.speed>0.4)?c.heading:null;
      NV.lastFix={lat:me[0],lng:me[1],acc:acc,hd:hd};
      /* 駐車直後は位置を磨く（40秒間・より良い精度が来たら差し替え）
         ただし歩き出していたら磨かない（車ピンが引きずられるのを防ぐ） */
      const nearPark = parking&&parking.lat!=null
        ? distM({lat:parking.lat,lng:parking.lng},{lat:me[0],lng:me[1]}) < Math.max(15,(parking.acc||15)*1.5)
        : true;
      if(NV.mode==="car"&&parking&&(parking.lat==null||(Date.now()-parking.t<40000&&acc<parking.acc&&nearPark))){
        parking.lat=+me[0].toFixed(6); parking.lng=+me[1].toFixed(6); parking.acc=acc;
        saveParking(); nvSetDest();
        nvEl("nvSub").textContent=fmtTime(parking.t)+" に記録 ±"+parking.acc+"m";
      }
      /* 足あと：駐車中は4m以上動くたびに記録（精度35m以内のみ）。
         上限3000点＝そこで記録終了。車へ戻る手がかりなので、一度付けた足あとは絶対に消さない
         （旧: 古い方=車側から削除していた→車に着く直前の線が欠ける本末転倒だったため変更） */
      if(parking&&parking.lat!=null&&acc<=35){
        const tr=parking.trail=parking.trail||[];
        if(tr.length<3000){
          const last=tr.length?tr[tr.length-1]:[parking.lat,parking.lng];
          if(distM({lat:last[0],lng:last[1]},{lat:me[0],lng:me[1]})>=4){
            tr.push([+me[0].toFixed(6),+me[1].toFixed(6)]);
            saveParking(); nvDrawTrail();
            if(tr.length===3000)
              toast("足あとが上限に達したため、ここで記録を止めました（付けた線と車の位置はこのまま残ります）");
          }
        }
      }
      nvMe(me,acc,hd);
      /* 走行中（7km/h以上）はGPSの進行方向で地図を回す＝車内で狂うコンパスに握らせない。
         ★一度GPSが握ったら「停止」では手放さない（信号待ちでコンパスに切り替わると挙動が乱れる）。
         手放すのは人間の歩く速度（0.4〜1.8m/s）が3回続いた時＝車を降りて歩き出した時だけ */
      const sp=(c.speed!=null&&!isNaN(c.speed))?c.speed:null;
      if(hd!=null&&sp!=null&&sp>=2){NV.gpsOn=true;NV.walkN=0;NV.gpsT=Date.now();NV.curHd=hd;nvApplyRot();}
      else if(NV.gpsOn){
        if(sp!=null&&sp>=0.4&&sp<1.8){ if(++NV.walkN>=3){NV.gpsOn=false;NV.walkN=0;} }
        else NV.walkN=0;   /* 停止（≒0）や速度不明では解除しない＝向きは最後のGPS進行方向のまま */
        if(NV.gpsOn&&hd!=null){NV.curHd=hd;nvApplyRot();}   /* ノロノロ走行中も向きは更新 */
      }
      /* コンパス非対応端末: 歩いている間もGPSの進行方向で地図を回す */
      else if(hd!=null&&!NV.hasCompass){NV.curHd=hd;nvApplyRot();}
      /* ★コンパス自動補正（GPS×方位のフュージョン）:
         歩行中のGPS進行方向とコンパスの生値を照合し、同じ方向の大きなズレが
         3回続いたらその差を補正値(cmpFix)としてコンパスに適用する。
         磁気で狂ったコンパス（地図の上下あべこべ）を再起動なしで自動的に立て直す。
         GPSの進行方向が「正」・コンパスは相対的な向きの変化担当 */
      if(hd!=null&&!NV.gpsOn&&NV.hasCompass&&Date.now()-NV.rawHdT<3000){
        NV.fixBuf.push(angNorm(hd-NV.rawHd));
        if(NV.fixBuf.length>5) NV.fixBuf.shift();
        if(NV.fixBuf.length>=3){
          const r=Math.PI/180;
          const mean=Math.atan2(
            NV.fixBuf.reduce((s,a)=>s+Math.sin(a*r),0),
            NV.fixBuf.reduce((s,a)=>s+Math.cos(a*r),0))/r;
          /* 全サンプルが同じ方向にズレている時だけ動かす（歩行GPSのノイズで暴れない）。
             25°未満の小ズレは触らない＝通常時はコンパスの応答性そのまま */
          if(NV.fixBuf.every(a=>Math.abs(angNorm(a-mean))<=30)
             &&Math.abs(angNorm(mean-NV.cmpFix))>25){
            NV.cmpFix=Math.round(angNorm(mean)); NV.fixBuf=[];
            NV.curHd=(NV.rawHd+NV.cmpFix+3600)%360;
            nvCone(NV.curHd); nvApplyRot();
            if(!NV.cmpTold){NV.cmpTold=true;
              toast("コンパスのズレを検知し、GPSの進行方向で自動補正しました");}
          }
        }
      }
      const tg=nvTargetLL();
      nvGuide(me,tg);   /* 自分→目的地の赤点線を常に引き直す */
      if(tg){
        const d=distM({lat:me[0],lng:me[1]},{lat:tg[0],lng:tg[1]});
        nvEl("nvDist").innerHTML="あと "+fmtDist(d)+" <small>±"+acc+"m</small>";
        /* 地図を勝手に動かすのは追従ON中だけ（最初の一回は両方が見えるよう拡縮）。
           拡縮直後の数秒は引き戻さず、両方が見える表示を保つ */
        if(NV.follow){
          if(!NV.fitted){NV.fitted=true; NV.fitT=Date.now();
            NV.map.fitBounds(L.latLngBounds([me,tg]).pad(NV.headUp?0.55:0.3),{maxZoom:18});}
          else if(!NV.fitT||Date.now()-NV.fitT>4000) NV.map.panTo(me);
        }
      }else if(NV.follow){
        if(!NV.fitted){NV.fitted=true;NV.map.setView(me,18);}
        else NV.map.panTo(me);
      }
    },err=>{
      if(!NV.lastFix)
        nvEl("nvNote").innerHTML = err.code===1?"位置情報が許可されていません":"位置を取得できませんでした";
    },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
  }
  /* コンパス（対応端末のみ・向きの扇を回す） */
  NV.hdgFn=e=>{
    let h=null;
    if(e.webkitCompassHeading!=null) h=e.webkitCompassHeading;
    else if(e.absolute&&e.alpha!=null) h=360-e.alpha;
    if(h==null) return;
    NV.hasCompass=true;
    NV.rawHd=h; NV.rawHdT=Date.now();   /* 生値はGPS照合（自動補正）用に保存 */
    /* GPSモード中はGPSの進行方向が地図を握っている＝コンパスは黙る（車内の磁気で狂うため）。
       停止しても解除しない。解除は歩く速度が続いた時だけ（watchPosition側で判定） */
    if(NV.gpsOn) return;
    h=(h+NV.cmpFix+3600)%360;   /* GPS照合で得た自動補正を適用 */
    NV.curHd=h;
    /* コンパスは高頻度で来るため200msに間引いて扇と地図回転を更新 */
    const now=Date.now();
    if(now-NV.rotT>200){ NV.rotT=now; nvCone(h); nvApplyRot(); }
  };
  window.addEventListener("deviceorientationabsolute",NV.hdgFn,true);
  nvWakeLock();
}

function nvSearchGo(autoJump){
  const q0=nvEl("nvSearch").value.trim(); if(!q0) return;
  const list=nvEl("nvCands");
  list.innerHTML='<div class="nv-cand" style="color:var(--soft)">検索中…</div>';
  const show=(items,jumpOk)=>{
    list.innerHTML="";
    if(!items.length){
      list.innerHTML='<div class="nv-cand" style="color:var(--soft)">見つかりませんでした（地図を動かして合わせてください）</div>';
      setTimeout(()=>{list.innerHTML="";},2200); return;
    }
    items.slice(0,6).forEach(it=>{
      const b=document.createElement("button");
      b.className="nv-cand"; b.textContent=it.t;
      b.onclick=()=>{list.innerHTML="";NV.map.setView([it.lat,it.lng],it.z);};
      list.appendChild(b);
    });
    if(autoJump&&jumpOk) NV.map.setView([items[0].lat,items[0].lng],items[0].z);
  };
  /* 検索語との一致度チェック（「明治神宮」で北海道の地名「明治」に飛ばないように）。
     住所は表記ゆれを正規化して比較（「3-1-4」⇄「三丁目１番４号」を同一視） */
  const anorm=s=>{
    s=String(s||"").normalize("NFKC");
    const K={"〇":"0","一":"1","二":"2","三":"3","四":"4","五":"5","六":"6","七":"7","八":"8","九":"9"};
    return s.replace(/[〇一二三四五六七八九]/g,m=>K[m])
      .replace(/丁目|番地|番|号/g,"-").replace(/[ 　]/g,"")
      .replace(/-+$/,"").replace(/--+/g,"-");
  };
  /* クエリの掃除: Googleマップのコピペ住所は「日本、〒330-0063 …」形式で
     〒付き=地理院0件・「日本、」付き=別地名に誤ヒットを実測 → 前置きを剥がす */
  const clean=q0.normalize("NFKC")
    .replace(/^日本[、,]?\s*/,"")
    .replace(/〒\s*\d{3}-?\d{4}\s*/,"").replace(/^\d{3}-\d{4}\s+/,"")
    .replace(/[－ー―‐−‑]/g,"-").replace(/\s+/g," ").trim();   /* −(U+2212)=マップコピペのマイナス記号も統一 */
  /* 段階クエリ: フル → 番地まで(後ろの建物名を落とす) → 枝番を1つずつ落とす → 町名まで。
     深い段ほどザックリ表示になるが、日本全体のままより圧倒的にマシ */
  const steps=[clean];
  const m=clean.match(/^(.+?\d+(?:-\d+)*)/);
  if(m){
    if(m[1]!==clean) steps.push(m[1]);
    let base=m[1];
    while(/-\d+$/.test(base)){ base=base.replace(/-\d+$/,""); steps.push(base); }
    const town=base.replace(/\d+$/,"").replace(/[-\s]+$/,"");
    if(town&&town!==base) steps.push(town);
  }
  const uniq=[...new Set(steps)].filter(Boolean);
  const gsiURL=s=>"https://msearch.gsi.go.jp/address-search/AddressSearch?q="+encodeURIComponent(s);
  let loose=[];   /* 1段目の緩い候補（全滅時に自動ジャンプなしで見せる用） */
  const tryGsi=i=>{
    if(i>=uniq.length) return tryNomi();
    const s=uniq[i], ns=anorm(s);
    const rank=t=>{const T=anorm(t);return T===ns?0:(T.startsWith(ns)?1:(T.includes(ns)?2:3));};
    return fetch(gsiURL(s)).then(r=>r.json()).then(a=>{
      const z=Math.max(14,16-i);
      const items=(Array.isArray(a)?a:[]).map(it=>({
        t:it.properties.title,
        lat:it.geometry.coordinates[1], lng:it.geometry.coordinates[0], z:z}));
      items.sort((x,y)=>rank(x.t)-rank(y.t));
      if(items.length&&(items[0].t.includes(s)||anorm(items[0].t).includes(ns))){
        if(autoJump&&i>0) toast("番地までは特定できず、近いところを表示しています。＋印で合わせてください");
        return show(items,true);
      }
      if(i===0) loose=items;
      return tryGsi(i+1);
    }).catch(()=>tryGsi(i+1));
  };
  /* OpenStreetMap（施設名に強い）: 地理院が全段ダメだった時の最後の手 */
  const tryNomi=()=>fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=jp&accept-language=ja&limit=6&q="+encodeURIComponent(clean))
    .then(r=>r.json())
    .then(b=>{
      const ni=(Array.isArray(b)?b:[]).map(it=>({
        t:(it.display_name||"").split(",").slice(0,3).join("、"),
        lat:+it.lat, lng:+it.lon, z:17}));
      if(ni.length) return show(ni,true);
      return show(loose,false);   /* 緩い候補のみ＝一覧は出すが自動ジャンプしない */
    })
    .catch(()=>{ if(loose.length) return show(loose,false);
      list.innerHTML=""; toast("検索できませんでした（通信を確認）"); });
  tryGsi(0);
}

/* ───── Googleマップお気に入り取込（Takeout zip・全部端末内で処理） ─────
   Takeoutの内部ID: Saved=save（お気に入り等リストのCSV）／マップ(マイプレイス)=local_actions（スター付きGeoJSON・座標入り）
   ＝実機Takeout画面のDOMで確定（2026-07-27）。zip解凍はDecompressionStream(deflate-raw)で無依存 */
const GM_TAKEOUT_URL="https://takeout.google.com/settings/takeout/custom/save,local_actions";
function gmImport(){
  sheet.innerHTML=
    '<h2>Googleマップから取り込む</h2>'+
    '<div class="hint">Googleマップの「お気に入り」「行きたい場所」「スター付き」などを、まとめて場所帳に追加します。今ある場所は消えません。</div>'+
    '<button class="menu-item" id="gm_open">① Googleからデータをもらう</button>'+
    '<div class="hint">開いた画面で「2/2 件を選択中」のまま「次のステップ」→ 設定は変えずに「エクスポートを作成」。'+
    'しばらくするとGmailにダウンロードリンクが届くので、タップしてzipをスマホに保存してください。</div>'+
    '<button class="menu-item" id="gm_pick">② 保存したzipを読み込む</button>'+
    '<div class="hint">zipが読めない端末では、zipを解凍して中のCSVファイルを選んでも取り込めます（複数選択可）。</div>'+
    '<input type="file" id="gm_file" accept=".zip,.csv,.json,application/zip,application/json,text/csv" multiple style="display:none">'+
    '<div class="sheet-actions"><button class="btn" id="gm_close">閉じる</button></div>';
  veil.classList.add("on");
  document.getElementById("gm_close").onclick=closeSheet;
  document.getElementById("gm_open").onclick=()=>openUrl(GM_TAKEOUT_URL);
  const inp=document.getElementById("gm_file");
  document.getElementById("gm_pick").onclick=()=>inp.click();
  inp.onchange=async()=>{
    if(!inp.files||!inp.files.length) return;
    toast("読み込んでいます…");
    try{
      const items=await gmReadFiles([...inp.files]);
      if(!items.length){ toast("場所のデータが見つかりませんでした"); return; }
      gmPreview(items);
    }catch(e){ toast(e&&e.gmMsg?e.gmMsg:"このファイルは読み込めませんでした"); }
  };
}
function gmBase(n){ return String(n).split(/[\/\\]/).pop().replace(/\.[^.]+$/,""); }
async function gmReadFiles(files){
  const items=[];
  for(const f of files){
    const nm=f.name.toLowerCase();
    if(nm.endsWith(".zip")){
      const buf=await f.arrayBuffer();
      const ents=gmUnzip(buf);
      /* 座標入りのGeoJSON（スター付き）を先に＝同じ場所がリストにもある時は座標入りを優先 */
      const je=ents.filter(e=>/\.json$/i.test(e.name)&&!/クチコミ|review/i.test(e.name));
      const ce=ents.filter(e=>/\.csv$/i.test(e.name));
      for(const e of je){ try{ gmFromGeo(JSON.parse(new TextDecoder().decode(await gmEntryData(buf,e))),items); }catch(_){} }
      for(const e of ce){ try{ gmFromCsv(new TextDecoder().decode(await gmEntryData(buf,e)),gmBase(e.name),items); }catch(_){} }
    }
    else if(nm.endsWith(".json")){ try{ gmFromGeo(JSON.parse(await f.text()),items); }catch(_){} }
    else if(nm.endsWith(".csv")){ try{ gmFromCsv(await f.text(),gmBase(f.name),items); }catch(_){} }
  }
  return items;
}
/* zip読み: 末尾のセントラルディレクトリを走査（データ記述子付きローカルヘッダに惑わされない） */
function gmUnzip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), td=new TextDecoder("utf-8");
  let eo=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-22-65557);i--){ if(dv.getUint32(i,true)===0x06054b50){eo=i;break;} }
  if(eo<0){ const er=new Error("zip"); er.gmMsg="zipファイルとして読めませんでした"; throw er; }
  const cnt=dv.getUint16(eo+10,true); let p=dv.getUint32(eo+16,true);
  const out=[];
  for(let k=0;k<cnt;k++){
    if(p+46>buf.byteLength||dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true),
      nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true),
      lho=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nlen));
    if(csize!==0xFFFFFFFF&&lho!==0xFFFFFFFF) out.push({name,method,csize,lho});
    p+=46+nlen+elen+clen;
  }
  return out;
}
async function gmEntryData(buf,ent){
  const dv=new DataView(buf);
  const nlen=dv.getUint16(ent.lho+26,true), elen=dv.getUint16(ent.lho+28,true);
  const raw=new Uint8Array(buf,ent.lho+30+nlen+elen,ent.csize);
  if(ent.method===0) return raw;
  if(ent.method===8){
    if(typeof DecompressionStream==="undefined"){ const er=new Error("ds"); er.gmMsg="この端末ではzipを直接読めません。解凍して中のCSVを選んでください"; throw er; }
    return new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  }
  throw new Error("method"+ent.method);
}
/* CSV: 引用符・カンマ・改行入りに対応した素直なパーサ */
function gmCsv(text){
  const rows=[]; let f="",row=[],q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(f); f=""; }
    else if(c==="\n"){ row.push(f); f=""; if(row.some(x=>x!=="")) rows.push(row); row=[]; }
    else if(c!=="\r") f+=c;
  }
  if(f!==""||row.length){ row.push(f); if(row.some(x=>x!=="")) rows.push(row); }
  return rows;
}
/* Savedリスト（お気に入り.csv 等）: タイトル,メモ,URL,コメント（英語版ヘッダにも対応） */
function gmFromCsv(text,listName,items){
  const rows=gmCsv(text.charCodeAt(0)===0xFEFF?text.slice(1):text); if(rows.length<2) return;
  const hdr=rows[0].map(s=>String(s).trim().toLowerCase());
  const iT=hdr.findIndex(h=>h==="タイトル"||h==="title"), iU=hdr.findIndex(h=>h==="url");
  if(iT<0||iU<0) return;
  const iN=hdr.findIndex(h=>h==="メモ"||h==="note"), iC=hdr.findIndex(h=>h==="コメント"||h==="comment");
  for(let r=1;r<rows.length;r++){
    const row=rows[r], name=String(row[iT]||"").trim(); if(!name) continue;
    const url=String(row[iU]||"").trim();
    const memo=[iN>=0?row[iN]:"",iC>=0?row[iC]:""].map(s=>String(s||"").trim()).filter(Boolean).join(" / ");
    const c=pickCoords(url)||gmSearchCoords(url);
    items.push({name:name,url:url,memo:memo,addr:"",lat:c?c.lat:"",lng:c?c.lng:"",list:listName});
  }
}
function gmSearchCoords(url){
  const m=String(url||"").match(/\/maps\/search\/(-?\d+\.\d+)(?:,|%2C)\+?(-?\d+\.\d+)/);
  return m?{lat:m[1],lng:m[2]}:null;
}
/* マイプレイスのGeoJSON（保存した場所.json）: 新旧2形式に対応・クチコミは除外 */
function gmFromGeo(g,items){
  if(!g||g.type!=="FeatureCollection"||!Array.isArray(g.features)) return;
  for(const ft of g.features){
    const pr=(ft&&ft.properties)||{};
    if(pr.review||pr["Star Rating"]||pr["Review Comment"]) continue;
    const name=String(pr.Title||(pr.location&&pr.location.name)||(pr.Location&&pr.Location["Business Name"])||"").trim();
    const url=String(pr["Google Maps URL"]||pr.google_maps_url||"").trim();
    const addr=String((pr.location&&pr.location.address)||(pr.Location&&pr.Location.Address)||"").trim();
    let lat="",lng="";
    if(ft.geometry&&ft.geometry.type==="Point"&&Array.isArray(ft.geometry.coordinates)){
      lng=String(ft.geometry.coordinates[0]); lat=String(ft.geometry.coordinates[1]);
    }else if(pr.Location&&pr.Location["Geo Coordinates"]){
      lat=String(pr.Location["Geo Coordinates"].Latitude||""); lng=String(pr.Location["Geo Coordinates"].Longitude||"");
    }
    if(Math.abs(+lat)<0.01&&Math.abs(+lng)<0.01){ lat=""; lng=""; }   /* 0,0=未解決座標は捨てる */
    if(!name&&!url&&!addr) continue;
    items.push({name:name||addr||"名称不明",url:url,memo:"",addr:addr,lat:lat,lng:lng,list:"スター付き"});
  }
}
/* プレビュー: 重複（URL一致・名前一致）はスキップして内訳を見せてから取り込む */
function gmPreview(items){
  const urls=new Set(places.map(x=>String(x.url||"").trim()).filter(Boolean));
  const names=new Set(places.map(x=>norm(x.name)));
  const bu=new Set(), bn=new Set(), fresh=[]; let dup=0;
  for(const it of items){
    const uk=String(it.url||"").trim(), nk=norm(it.name);
    if((uk&&(urls.has(uk)||bu.has(uk)))||(nk&&(names.has(nk)||bn.has(nk)))){ dup++; continue; }
    fresh.push(it); if(uk)bu.add(uk); if(nk)bn.add(nk);
  }
  if(!fresh.length){ toast("すべて登録済みでした（新しい場所はありません）"); return; }
  const byList={}; fresh.forEach(it=>{ byList[it.list]=(byList[it.list]||0)+1; });
  const nGeo=fresh.filter(it=>it.lat&&it.lng).length;
  sheet.innerHTML=
    '<h2>取り込む内容の確認</h2>'+
    '<div class="hint">リストの名前がそのままカテゴリになります。</div>'+
    Object.keys(byList).map(k=>'<div class="menu-item" style="pointer-events:none">'+esc(k)+'　'+byList[k]+'件</div>').join("")+
    '<div class="hint">合計 '+fresh.length+'件（うち位置情報付き '+nGeo+'件）'+(dup?'／登録済みのため '+dup+'件はスキップ':'')+'</div>'+
    '<div class="sheet-actions"><button class="btn" id="gm_no">やめる</button>'+
    '<button class="btn primary" id="gm_go">'+fresh.length+'件を取り込む</button></div>';
  document.getElementById("gm_no").onclick=closeSheet;
  document.getElementById("gm_go").onclick=()=>gmApply(fresh);
}
function gmApply(fresh){
  let catCh=false;
  for(const ln of [...new Set(fresh.map(x=>x.list))]){
    if(!CATS.some(c=>c.n===ln)){
      const used=CATS.map(x=>x.c);
      const col=CAT_COLORS.find(c=>!used.includes(c))||CAT_COLORS[CATS.length%CAT_COLORS.length];
      CATS=CATS.filter(x=>x.n!==CAT_OTHER.n).concat([{n:ln,c:col}],[CAT_OTHER]); catCh=true;
    }
  }
  if(catCh) saveCats();
  const t0=Date.now();
  fresh.forEach((it,i)=>{
    const rec={id:"p"+t0+"_g"+i,name:it.name,kana:"",cat:it.list,memo:it.memo||"",lat:it.lat||"",lng:it.lng||"",acc:null,
      addr:it.addr||"",url:it.url||"",tel:"",fav:false,count:0,created:t0,updated:t0};
    if(rec.lat&&rec.lng) updatePref(rec);
    places.push(rec);
  });
  save(); closeSheet(); toast(fresh.length+"件を取り込みました");
}
