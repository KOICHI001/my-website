/* サブカテゴリ欄（編集・登録シート用・任意）: v0.41.0で全カテゴリ共通に昇格。
   「軽井沢周辺」を一度作れば、飲食でも宿泊でも同じ候補に出る＝カテゴリ横断の第二軸。
   データはp.sfのまま（本棚の中では従来どおり📁フォルダとして見える） */
function allSubs(){
  const m=new Map();
  places.forEach(p=>{ if(p.sf) m.set(p.sf,(m.get(p.sf)||0)+1); });
  return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"ja"));
}
/* 「＋新しく作る」で作ったばかりでまだどのカードにも保存されていない名前。
   カードを保存するまで places に現れない＝ピッカーを開き直すと消えて見える問題への受け皿（この起動中だけ持つ） */
let sfPending=[];
function sfFieldHTML(cur){
  return '<input type="hidden" id="f_sf" value="'+esc(cur||"")+'">'+
    '<button type="button" class="catsel" id="f_sfBtn">'+
    '<span id="f_sfLabel">'+(cur?"📁 "+esc(cur):"（なし）")+'</span><span class="catsel-arrow">▼</span></button>';
}
function sfFieldWire(){
  const btn=document.getElementById("f_sfBtn");
  if(!btn) return;
  btn.onclick=()=>{
    const cur=document.getElementById("f_sf").value;
    const w=document.getElementById("cpickWin");
    w.innerHTML="";
    const pick=v=>{cpickClose();
      document.getElementById("f_sf").value=v;
      document.getElementById("f_sfLabel").textContent=v?"📁 "+v:"（なし）";};
    const none=document.createElement("button");
    none.className="cpick-row"+(!cur?" cat":"");
    if(!cur) none.style.background="#0B6E5F18";
    none.textContent="（なし）"; none.onclick=()=>pick("");
    w.appendChild(none);
    /* 候補は全カテゴリ横断（多く使っている順）＋保存前の新規（sfPending・選択中の名前も保険で合流）。
       各行の右端🗑=その場で削除（全カテゴリのカードから外す。場所は消えない） */
    const cnt=new Map(allSubs());
    sfPending.forEach(n=>{ if(!cnt.has(n)) cnt.set(n,0); });
    if(cur&&!cnt.has(cur)) cnt.set(cur,0);
    cnt.forEach((c,n)=>{
      const wr=document.createElement("div"); wr.className="cpick-sub";
      const b=document.createElement("button");
      b.className="cpick-row"+(n===cur?" cat":"");
      if(n===cur) b.style.background="#0B6E5F18";
      b.textContent="📁 "+n+(c?"（"+c+"件）":"（新規）");
      b.onclick=()=>pick(n);
      const d=document.createElement("button");
      d.className="cpick-del"; d.textContent="🗑"; d.setAttribute("aria-label","削除");
      d.onclick=()=>{
        if(!confirm('サブカテゴリ「'+n+'」を削除します。\n'+
          (c?('全カテゴリのカード '+c+'件 から外れます（場所そのものは消えません）。'):'（まだどのカードにも付いていません）')+
          '\nよろしいですか？')) return;
        places.forEach(p=>{ if(p.sf===n) delete p.sf; });
        sfPending=sfPending.filter(x=>x!==n);
        save();
        /* 今この欄で選んでいた名前を消したら「（なし）」へ戻す（ピッカーは開いたまま） */
        if(document.getElementById("f_sf").value===n){
          document.getElementById("f_sf").value="";
          document.getElementById("f_sfLabel").textContent="（なし）";
        }
        toast("サブカテゴリ「"+n+"」を削除しました");
        btn.onclick();   /* 開いたままリストを作り直す */
      };
      wr.appendChild(b); wr.appendChild(d); w.appendChild(wr);
    });
    const nb=document.createElement("button");
    nb.className="cpick-row"; nb.textContent="＋ 新しいサブカテゴリを作る";
    nb.onclick=()=>{
      const nv=(prompt("サブカテゴリの名前（例: 軽井沢周辺）")||"").trim();
      if(!nv) return;
      if(!sfPending.includes(nv)) sfPending.push(nv);   /* 保存前でも次から候補に出す */
      pick(nv);
    };
    w.appendChild(nb);
    document.getElementById("cpick").classList.add("on");
    w.scrollTop=0;
  };
}

/* ───── カテゴリ編集（名前変更・色変え・削除・新設。「その他」は受け皿として固定） ───── */
function catEdit(){
  const rows=CATS.filter(x=>x.n!==CAT_OTHER.n).map(x=>({orig:x.n,n:x.n,c:x.c}));
  function draw(){
    sheet.innerHTML=
      '<h2>カテゴリを編集</h2>'+
      '<div id="catList"></div>'+
      '<button class="subbtn" id="c_add">＋ カテゴリを追加</button>'+
      '<div class="hint">●をタップすると色を選べます。名前を変えると、そのカテゴリの場所もまとめて変わります。'+
      '▲▼の順番がそのまま本棚の並びになります。「その他」は削除したカテゴリの受け皿として最後尾に固定です。</div>'+
      '<div class="sheet-actions"><button class="btn" id="c_cancel">やめる</button>'+
      '<button class="btn primary" id="c_ok">保存する</button></div>';
    const list=document.getElementById("catList");
    rows.forEach((r,i)=>{
      const div=document.createElement("div");
      div.className="catrow";
      div.innerHTML='<button class="catdot" style="background:'+esc(r.c)+'"></button>'+
        '<input type="text" value="'+esc(r.n)+'" placeholder="カテゴリ名">'+
        '<button class="catmv" '+(i===0?"disabled":"")+'>▲</button>'+
        '<button class="catmv" '+(i===rows.length-1?"disabled":"")+'>▼</button>'+
        '<button class="catdel">🗑</button>';
      const dot=div.children[0], inp=div.children[1], up=div.children[2], dn=div.children[3], del=div.children[4];
      dot.onclick=()=>cpickOpen(r.c,c=>{r.c=c;dot.style.background=c;});
      inp.oninput=()=>{r.n=inp.value;};
      /* ▲▼で並び替え＝保存時この順がそのまま本棚・チップ・カテゴリ選択の順になる */
      up.onclick=()=>{ if(i>0){[rows[i-1],rows[i]]=[rows[i],rows[i-1]];draw();} };
      dn.onclick=()=>{ if(i<rows.length-1){[rows[i],rows[i+1]]=[rows[i+1],rows[i]];draw();} };
      del.onclick=()=>{
        const cnt=r.orig?places.filter(p=>p.cat===r.orig).length:0;
        if(cnt&&!confirm('「'+(r.n.trim()||r.orig)+'」を削除します。\nこのカテゴリの'+cnt+'件は「その他」に変わります。よろしいですか？'))return;
        rows.splice(i,1); draw();
      };
      list.appendChild(div);
    });
    const oth=document.createElement("div");
    oth.className="catrow";
    oth.innerHTML='<span class="catdot" style="background:'+CAT_OTHER.c+';cursor:default"></span>'+
      '<span style="flex:1;color:#6B7280">その他（固定）</span>';
    list.appendChild(oth);
    document.getElementById("c_add").onclick=()=>{
      const used=rows.map(r=>r.c);
      rows.push({orig:null,n:"",c:CAT_COLORS.find(x=>!used.includes(x))||CAT_COLORS[rows.length%CAT_COLORS.length]});
      draw(); sheet.scrollTop=sheet.scrollHeight;
    };
    document.getElementById("c_cancel").onclick=closeSheet;
    document.getElementById("c_ok").onclick=()=>{
      const names=rows.map(r=>r.n.trim());
      if(names.some(n=>!n)) return toast("名前が空のカテゴリがあります");
      if(names.some(n=>n===CAT_OTHER.n)) return toast("「その他」という名前は固定分と重なるため使えません");
      if(new Set(names).size!==names.length) return toast("同じ名前のカテゴリがあります");
      /* 名前変更は場所にも反映・削除した分は「その他」へ */
      const ren={}; rows.forEach(r=>{ const n=r.n.trim(); if(r.orig&&r.orig!==n) ren[r.orig]=n; });
      const kept=new Set(rows.map(r=>r.orig).filter(Boolean));
      const removed=CATS.filter(x=>x.n!==CAT_OTHER.n&&!kept.has(x.n)).map(x=>x.n);
      places.forEach(p=>{
        if(ren[p.cat]) p.cat=ren[p.cat];
        else if(removed.includes(p.cat)){ p.cat=CAT_OTHER.n; delete p.sf; }
      });
      if(ren[filterCat]) filterCat=ren[filterCat];
      else if(removed.includes(filterCat)) filterCat="";
      /* 本棚の表紙と開いている本もカテゴリの改名・削除に追随 */
      for(const o in ren){ if(COVERS[o]!=null){COVERS[ren[o]]=COVERS[o];delete COVERS[o];} }
      removed.forEach(cn=>{ const c=covOf(cn);
        if(c){ ["id","src"].forEach(k=>{ if(c[k]){IDB.del(c[k]).catch(()=>{});phCache.delete(c[k]);} }); delete COVERS[cn]; } });
      saveCovers();
      if(ren[shelfCat]) shelfCat=ren[shelfCat];
      else if(removed.includes(shelfCat)) shelfCat=null;
      CATS=rows.map(r=>({n:r.n.trim(),c:r.c})).concat([CAT_OTHER]);
      saveCats(); save(); closeSheet(); toast("カテゴリを保存しました");
    };
  }
  draw();
}

/* ───── OCR: スクショから読み取る（名前・住所・座標） ─────
   Googleマップでピンを長押し→検索窓に出る座標／カードの名前・住所をスクショ→ここで読み取る。
   Tesseract.jsをローカル同梱（ocr/）＝画像も座標も住所も端末の外に出さない。
   ★実測（実機スクショ1080×2400で検証）で役割がはっきり分かれた:
     ・座標(小数15桁) → engモデル+数字ホワイトリストが完璧。jpnだと桁を1つ増やす誤読が出る
     ・日本語の住所   → jpnモデルがほぼ完璧。engでは原理的に読めない
   そこで1回のタップで eng（座標）→ jpn（住所・名前）の順に試し、読めた方を採用する＝
   ユーザーは「読みたいあたりをタップ」するだけでよく、モード切替がいらない。
   ひとタップでひとつ（名前／住所／座標）。読んだ分は消えずにたまるので、
   名前・住所・座標と順にタップすれば1枚のスクショから全部そろう。
   エンジンは開いた時に裏で温め、閉じたら破棄（メモリ対策） */
const OCR={img:null,url:null,cb:null,res:null,lock:{},bad:{},libP:null,wkP:{},q:{}};
const ocrEl=id=>document.getElementById(id);
function ocrBase(){return new URL("ocr",location.href).href;}   /* 絶対URL（worker内の相対解決ズレ防止） */
function ocrLib(){
  if(!OCR.libP){
    OCR.libP=new Promise((ok,ng)=>{
      if(window.Tesseract)return ok();
      const s=document.createElement("script");
      s.src="ocr/tesseract.min.js";
      s.onload=()=>ok();
      s.onerror=()=>{OCR.libP=null;ng(new Error("lib"));};
      document.head.appendChild(s);
    });
  }
  return OCR.libP;
}
/* 言語ごとにworkerを持つ（eng=座標用 / jpn=住所用）。使う時に初めて作る */
function ocrWorker(lang){
  lang=lang||"eng";
  if(!OCR.wkP[lang]){
    OCR.wkP[lang]=(async()=>{
      await ocrLib();
      const b=ocrBase();
      /* cacheMethod:none = Tesseract内蔵のIndexedDBキャッシュを使わない
         （環境により読み込みが固まる不具合を実測。オフライン持続はsw.jsのbasho-ocrキャッシュが担う）
         ★APK版(Capacitor): AndroidのAAPTがassets内の.gzを自動解凍して拡張子を剥がすため
         <言語>.traineddata.gzは404、実体は拡張子なしの<言語>.traineddata。
         createWorkerは404でもrejectせずworker内でUncaughtになり永遠に固まる（実測）ので、
         先に.gzの存在をfetchで確かめてからgzip設定を決める。workerはgzipマジックバイトを
         自動判定するので中身はどちらでも動く。PWAではこの判定は走らない（従来どおり.gz固定） */
      const native=window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform();
      let gz=true;
      if(native){
        try{gz=(await fetch(b+"/"+lang+".traineddata.gz",{cache:"no-store"})).ok;}catch(e){gz=false;}
      }
      return await Tesseract.createWorker(lang,1,{
        workerPath:b+"/worker.min.js",corePath:b,langPath:b,cacheMethod:"none",gzip:gz});
    })();
    OCR.wkP[lang].catch(()=>{OCR.wkP[lang]=null;});
  }
  return OCR.wkP[lang];
}
/* recognizeの直列化（連打が混ざらないように）。★キューは言語ごと＝
   1つのworkerの中では順番待ちだが、英語(座標)と日本語(住所)は同時に走れる。
   実機は1回の認識に約4秒かかるため、直列だと住所タップが約8秒＝並列で半分にする */
function ocrJob(lang,fn){
  const prev=OCR.q[lang]||Promise.resolve();
  const p=prev.then(fn);
  OCR.q[lang]=p.catch(()=>{});
  return p;
}
/* OCR結果テキスト→「緯度, 経度」抽出。小数3桁以上の数字ペアだけを座標とみなす */
function ocrParseCoords(text){
  const t=String(text||"")
    .replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
    .replace(/[．]/g,".").replace(/[，、]/g,",").replace(/[ー−―–—]/g,"-");
  /* 小数は3〜15桁（マップのピン長押しは15桁精度で出る） */
  const re=/(-?\d{1,3}[.,]\d{3,15})[^\d-]{1,8}(-?\d{1,3}[.,]\d{3,15})/g;
  const cands=[]; let m;
  while((m=re.exec(t))){
    let s1=m[1].replace(",","."),s2=m[2].replace(",",".");
    let a=parseFloat(s1),b=parseFloat(s2);
    if(!isFinite(a)||!isFinite(b))continue;
    if(Math.abs(a)>90&&Math.abs(b)<=90){const ss=s1;s1=s2;s2=ss;const nn=a;a=b;b=nn;}  /* 経度,緯度の順で写っていた */
    if(Math.abs(a)>90||Math.abs(b)>180)continue;
    let sc=Math.min(s1.split(".")[1].length,s2.split(".")[1].length);
    if(a>=20&&a<=46&&b>=122&&b<=154)sc+=4;   /* 日本域ボーナス */
    cands.push({lat:s1,lng:s2,sc});
  }
  if(!cands.length)return null;
  cands.sort((x,y)=>y.sc-x.sc);
  return cands[0];
}
/* OCR結果 → 1行ずつの「文字」と「位置・大きさ」。
   ★v0.21.0: 名前も住所も2行に折り返すことがある（実機スクショで確認）。
   文字だけを見ていると「どこまでが1つのかたまりか」が分からないので、
   Tesseractが返す各行の枠（bbox）＝上下の位置・左端・文字の高さを使う。
   折り返しの続きの行は「左端がそろう・行間が狭い・文字の大きさが同じ」で見分けられる。
   位置が取れない場合（古い版・失敗時）は文字だけの行に落として従来どおり動かす */
function ocrRecLines(rec){
  const raw=[];
  const d=rec||{};
  let ls=Array.isArray(d.lines)?d.lines:null;
  if(!ls||!ls.length){                                  /* 版によっては blocks の中にだけ入っている */
    ls=[];
    (d.blocks||[]).forEach(b=>(b.paragraphs||[]).forEach(p=>(p.lines||[]).forEach(l=>ls.push(l))));
  }
  ls.forEach(l=>{
    const t=String((l&&l.text)||"").trim();
    if(!t)return;
    const b=(l&&l.bbox)||{};
    const y0=+b.y0||0,y1=+b.y1||0;
    raw.push({t,x0:+b.x0||0,x1:+b.x1||0,y0,y1,h:Math.max(0,y1-y0),
              conf:(l&&typeof l.confidence==="number")?l.confidence:null,
              /* 単語ごとの読めた自信。住所からアイコンの誤読を落とすのに使う */
              words:((l&&l.words)||[]).map(w=>{
                const wb=(w&&w.bbox)||{};
                return {t:String((w&&w.text)||"").trim(),
                        conf:(w&&typeof w.confidence==="number")?w.confidence:null,
                        h:Math.max(0,(+wb.y1||0)-(+wb.y0||0))};})});
  });
  if(!raw.length){
    String(d.text||"").split(/\r?\n/).forEach(s=>{
      s=s.trim();
      if(s)raw.push({t:s,x0:0,x1:0,y0:0,y1:0,h:0,conf:(typeof d.conf==="number"?d.conf:null)});
    });
  }
  /* ★指で四角く囲って指定された時は、その四角に「中心が入っている行」だけを判断に使う（v0.32.0）。
     読む範囲には薄い余白を足してあるが、それは文字の上下が切れて別の字に化けるのを防ぐためのもの。
     余白にかすった隣の行まで判断に混ぜると、住所の末尾が汚れたり、崩れた読みが名前として競り勝つ。
     ＝「読むのは余白込み・判断は囲いの中だけ」。囲っていない（タップ）時は素通り。 */
  const cr=d.core;
  if(cr&&raw.length){
    const inside=raw.filter(o=>{const c=(o.y0+o.y1)/2;return c>=cr.t&&c<=cr.b;});
    if(inside.length)return inside;   /* 1つも入らない＝囲いが細すぎた時だけ、従来どおり全部使う */
  }
  return raw;
}
/* 2つの行が「同じかたまりの折り返し」か。true=折り返し / false=別のもの / null=位置が無くて判断不能 */
function ocrWrapped(prev,cur){
  if(!prev||!cur||!prev.h||!cur.h)return null;
  const hi=Math.max(prev.h,cur.h),lo=Math.min(prev.h,cur.h);
  if(hi>lo*1.45)return false;                     /* 文字の大きさが違う＝別の項目 */
  const gap=cur.y0-prev.y1;
  if(gap>lo*1.15||gap<-lo*0.7)return false;       /* 行間が空きすぎ／重なりすぎ */
  if(Math.abs(cur.x0-prev.x0)>lo*1.6)return false;/* 折り返しは左端がそろう */
  return true;
}
/* OCR結果→住所。〒か都道府県名で始まる所を頭にして、折り返した続きの行を繋ぐ。
   ★実機スクショの実測で分かったこと:
     ・カードの住所は幅で折り返す（「…仙石原9」「40-48」の2行）→ 繋がないと番地が切れる
     ・折り返しは数字だけとは限らない（「…軽井沢町軽」「井沢1178-1246 旧駅舎口」）→
       v0.21.0から行の位置で見分ける。数字だけ判定は位置が無い時の保険に残す
     ・地図ピンのアイコンが1文字のゴミ（"o"等）として頭に付く → 〒/県名より前は捨てる
     ・番地が全角（９４０－４８）で写る → 半角に正規化する */
const OCR_ADDR_DROP=/[^0-9A-Za-zぁ-ゖァ-ヺ一-鿿々〆ヶ\- ]/g;      /* 住所に出ない字＝落とす（行ごとは捨てない） */
const OCR_ADDR_NG=/口コミ|レビュー|評価|営業|閉店|開店|定休|時間|経路|保存|共有|ラベル|電話|予約|ナビ|メニュー|注文|ウェブ|サイト|www|http|^\d{2,4}-\d{2,4}-\d{4}$/;
/* 住所の続き行かどうか。★実測（実機スクショ 2026-07-31）で分かったこと:
   住所1行目の枠には地図ピンのアイコンまで入るので、高さも左端も2行目と全くそろわない
     1行目 "o 〒389-0102 長野県北佐久郡軽井沢町軽井沢1"  高さ109 左端155
     2行目 "178-1246 旧駅舎口"                          高さ 52 左端286
   ここに ocrWrapped の「大きさがそろう・左端がそろう」を求めると2行目は必ず落ちる＝番地が消える。
   行間だけ見れば十分見分けられる（続き＝-2px / 次の項目「1 階」＝134px空く）ので大きさと左端は見ない。
   ★判断の基準は「読めない」より「余分が付く」＝余分は消せばいいが、読めないと手打ちになる */
/* 住所の行から、カード右のアイコン（しおり・共有・×）を読み違えた単語だけを落とす。
   ★実測（2026-07-31 実機スクショ2枚目）: 住所の行に
     「〒389-0111(90) 長野(96) 県(93) 北(41) 呈(0) ぐ(72) ペ(67) ※(89)」
   のようにアイコン由来の単語が混ざる。単語ごとの自信と文字種で見分けられる。
   ★落としすぎない: 迷ったら残す（[[余分が付く方がまし]]）。消すのは
   「まるで読めていない(0)」「使える字が1つも無い」「ぽつんと1文字だけの仮名」だけ */
function ocrAddrWords(o){
  const ws=o&&o.words;
  if(!ws||!ws.length)return o.t;
  const kept=ws.filter(w=>{
    if(!w.t)return false;

    return {text:r.data.text||"",conf:(typeof r.data.confidence==="number"?r.data.confidence:null),

/* 指定範囲を「座標？住所？名前？」の順に自動判定して読む。
   そのまま／白黒反転の2巡（暗い地図＋白い吹き出しの混在に強くする。
   囲みの中に暗背景＋白カードが混ざると旧・全体平均の一発反転では数字が壊れていた）。
   ほとんどの場合は1巡目の1回目（座標）か2回目（住所・名前）で決まる。
   戻りは {coord} / {addr} / {name} のどれか1つ＝ひとタップでひとつ。
   ★住所が読めた帯からは名前を採らない: 帯には評価や営業時間の行も入り、その崩れた読み
   （実測「4Se エ っ7二日折記る」）が名前として入ってくると、せっかくの名前を汚す。
   名前はユーザーが名前のあたりをタップした時＝住所も座標も無い帯の時だけ拾う */
async function ocrScanAuto(nx,ny,nw,nh,psm,core){
  const im=OCR.img;
  /* core＝ユーザーが囲った四角（読む範囲に対する上下の割合0〜1）。
     囲いの中に中心がある行だけを判断に使うために、認識のたびに結果へ持たせる */
  const setCore=r=>{ if(r&&core&&r.ch)r.core={t:core.t*r.ch,b:core.b*r.ch}; return r; };
  const coreText=r=>{ const ls=ocrRecLines(r); return ls.length?ls.map(o=>o.t).join("\n"):(r.text||""); };
  const dark=ocrRegionIsDark(nx,ny,nw,nh);
  const passes=[dark,!dark];
  /* 都道府県名が入っていれば「ちゃんと読めた住所」とみなす。
     入っていない時は文字が壊れている可能性が高いので、もう一方のパスも試して良い方を採る */
  const good=a=>!!a&&PREF_ORDER.some(p=>a.indexOf(p)>=0);
  let weakA=null,bestN=null;
  /* ★実測（実機）: 1回の認識はおよそ4秒で、切り出しを小さくしても速くならない＝
     コストは「認識の回数」で決まる。2エンジンの同時実行も競合で逆に遅くなった（13秒）ので、
     英語→ダメなら日本語 の順に1回ずつ動かす。座標は1回(約4秒)、住所と名前は2回目(約8秒)で確定する */
  for(let i=0;i<passes.length;i++){
    const rc=setCore(await ocrText("eng",nx,ny,nw,nh,psm,passes[i],OCR_WL));
    if(OCR.img!==im)return null;
    const engT=core?coreText(rc):rc.text;
    const c=ocrParseCoords(engT);
    if(c)return {coord:c};   /* 座標が読めた帯＝数字だけ。名前は混ざらない */
    const tl=ocrParseTel(engT);
    if(tl)return {tel:tl};   /* 電話番号も数字だけの帯＝ここで確定（日本語で読み直す必要がない） */
    if(i===0)ocrStatus("日本語（住所・名前）としても読んでいます…");
    const rj=setCore(await ocrText("jpn",nx,ny,nw,nh,psm,passes[i],""));
    if(OCR.img!==im)return null;
    const a=ocrParseAddr(rj);
    if(good(a))return {addr:a};
    if(a&&!weakA)weakA=a;
    const n=a?null:ocrParseName(rj);   /* 住所が写っている帯は名前を探さない */
    if(n&&(!bestN||n.sc>bestN.sc))bestN=n;
    /* 名前がしっかり読めた＝カードの見出しをタップした時。ここで打ち切る */
    if(n&&n.strong)return {name:n.text};
  }
  if(weakA)return {addr:weakA};
  return bestN?{name:bestN.text}:null;
}
/* statusは固定文言のみ（ユーザーデータを混ぜない） */
function ocrStatus(html){ocrEl("ocrStatus").innerHTML=html;}
/* 読み取り中の目印を画像の真ん中に点滅表示。★下の帯は読めたものが並ぶと説明文が押し出されて
   見えなくなるため、これが無いと進んでいるのか止まっているのか分からない（コーイチさん指摘） */
function ocrBusy(on){ocrEl("ocrBusy").classList.toggle("on",!!on);}
/* 読み取り結果は名前・住所・座標を別々にためる＝1枚のスクショから全部そろえられる。
   ★チェックを外したものは使わない（v0.23.0）。読み違えた1つのために、
   正しく読めた残りまで捨てなくて済む＝足りない分は「別のスクショ」から読み足せる */
const OCR_KIND={name:{item:"ocrNameItem",chk:"ocrNameChk",el:"ocrName",label:"名前"},
                coord:{item:"ocrResItem", chk:"ocrResChk", el:"ocrRes", label:"座標"},
                addr:{item:"ocrAddrItem",chk:"ocrAddrChk",el:"ocrAddr",label:"住所"},
                tel: {item:"ocrTelItem", chk:"ocrTelChk", el:"ocrTel", label:"電話"}};

  return ocrHas(kind)&&!!ocrEl(OCR_KIND[kind].chk).checked&&!OCR.bad[kind];
}
function ocrText2(kind){   /* 画面に出す文字 */
  const r=OCR.res||{};

function ocrSync(msg){
  const foc=document.activeElement;
  OCR_KINDS.forEach(k=>{
    const K=OCR_KIND[k],el=ocrEl(K.el);
    /* ★編集中の欄は書き換えない（打っている文字が消える・カーソルが飛ぶ） */
    if(el!==foc&&el.textContent!==ocrText2(k))el.textContent=ocrText2(k);
    el.classList.toggle("ocr-bad",!!OCR.bad[k]);

  });
  const use=OCR_KINDS.filter(ocrOn).map(k=>OCR_KIND[k].label);
  ocrEl("ocrCopy").disabled=!use.length;
  ocrEl("ocrUse").disabled=!use.length;
  ocrEl("ocrUse").textContent=
    use.length?((use.length===1?"この":"")+use.join("と")+"を使う"):"使うものにチェック";
  if(msg!==undefined){
    const miss=OCR_KINDS.filter(k=>!ocrHas(k)).map(k=>OCR_KIND[k].label);
    ocrStatus(msg+(miss.length
      ? "<b>"+miss.join("・")+"</b>も読むなら、そのあたりをタップ（<b>別のスクショ</b>からでもOK）"
      : (OCR.bad.coord
          ? "座標の形が違います（例 36.343116, 138.634493）。直すか、チェックを外してください。"
          : "ぜんぶそろいました。<b>文字はその場で直せます</b>。使わないものはチェックを外してください。")));

/* 読み取った値を結果に入れる。★別のスクショに切り替えたあとは、前のスクショで読めていて
   チェックが入ったままのものを黙って上書きしない＝正しく読めた分を捨てないため、
   トーストの「こちらにする」を押した時だけ差し替える。

  const r=OCR.res,K=OCR_KIND[kind];

    if(kind==="coord"){r.lat=val.lat;r.lng=val.lng;}else r[kind]=val;
    ocrEl(K.chk).checked=true; OCR.lock[kind]=false;
  };
  if(ocrHas(kind)&&OCR.lock[kind]&&ocrEl(K.chk).checked){
    const shown=kind==="coord"?(val.lat+", "+val.lng):val;
    const now=kind==="coord"?(r.lat+", "+r.lng):r[kind];
    /* ★「はい／いいえ」で必ず答えてもらう。トーストだと数秒で消えて、
       せっかく読み取ったものが気づかないうちに失われる（コーイチさん指摘 v0.26.0） */
    dlgOpen(K.label+"はすでに入っています。\n\n今の"+K.label+"：\n"+now+"\n\n読み取った"+K.label+"：\n"+shown+"\n\n入れ替えますか？",
      true,v=>{if(v){set();ocrSync(K.label+"を差し替えました。");}},
      {title:K.label+"を入れ替えますか？",yes:"入れ替える",no:"今のまま"});
    return false;
  }
  set(); return true;

/* ★読み取った文字はその場で直せる（v0.24.0）。1文字だけ違う時に全部打ち直さなくていい。
   直した内容がそのまま「使う」に乗る＝チェックが入っていれば採用される */
function ocrEdited(kind,quiet){
  const K=OCR_KIND[kind],r=OCR.res;
  if(!r)return false;
  if(ocrEl(K.item).style.display==="none")return false;   /* 出ていない行は触らない */
  const wasBad=!!OCR.bad[kind];
  const t=ocrEl(K.el).textContent.replace(/[\r\n\t]+/g," ").replace(/\s{2,}/g," ").trim();
  const before=ocrText2(kind);
  if(t===before&&!wasBad)return false;   /* 変わっていない＝チェックも触らない（読むだけで採用にしない） */
  if(kind==="coord"){
    const m=t.match(/^(-?\d{1,3}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)$/);
    /* 座標だけは形が決まっている＝壊れた形のまま使わせない（赤くして「使う」から外す） */
    OCR.bad.coord=!m;
    if(m){r.lat=m[1];r.lng=m[2];}
  }else r[kind]=t;
  ocrEl(K.chk).checked=true;   /* 自分で直した＝使うつもり */
  OCR.lock[kind]=false;        /* 自分の手で直したものは、以後まもる対象から外す */
  if(quiet)return true;
  ocrSync();
  if(kind==="coord"){
    if(OCR.bad.coord)ocrStatus("<b>座標の形</b>が違います（例 36.343116, 138.634493）。直すか、チェックを外してください");
    else if(wasBad)ocrStatus("座標を直しました。");

  return true;
}
/* ★画面に出ている文字を必ず結果に取り込んでから使う（v0.26.0）。
   スマホの日本語入力（IME）では変換を確定するまでinputイベントが来ないことがあり、
   直した文字が結果に入らないまま「使う」を押されると、直す前の文字が入ってしまう
   （実測: 「ケーキの家 果楓」に直したのに「ケーキの家 果」が入った）。
   イベント頼みをやめ、押された瞬間に画面から読み直す */

  let ch=false;
  OCR_KINDS.forEach(k=>{if(ocrEdited(k,true))ch=true;});
  if(ch)ocrSync();

OCR_KINDS.forEach(k=>{
  const el=ocrEl(OCR_KIND[k].el);
  el.addEventListener("input",()=>ocrEdited(k));
  el.addEventListener("compositionend",()=>ocrEdited(k));   /* 日本語入力の確定 */
  /* 改行は入れさせない（1行のまま）。Enter＝入力おわり */
  el.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();el.blur();}});
  /* 書式付きの貼り付けは字だけにする */
  el.addEventListener("paste",e=>{
    e.preventDefault();
    const t=(e.clipboardData||window.clipboardData).getData("text").replace(/\s+/g," ");
    document.execCommand("insertText",false,t);
  });
  el.addEventListener("blur",()=>{ocrEdited(k);ocrSync();});
});
function ocrOpen(file,cb){
  if(OCR.url){try{URL.revokeObjectURL(OCR.url);}catch(e){}}
  OCR.url=URL.createObjectURL(file);
  const im=new Image();
  im.onload=()=>{
    OCR.img=im;
    if(cb)OCR.cb=cb;
    /* ★2枚目以降は、それまでに読めた分をそのまま残す（別のスクショから足りないものだけ読み足す）。
       残っているものは「前のスクショ由来」として鍵をかけ、勝手に上書きされないようにする */
    const keep=!!OCR.res;
    if(!keep){OCR.res={lat:null,lng:null,addr:null,name:null,tel:null};OCR.bad={};}
    OCR.lock=keep?{name:true,coord:true,addr:true,tel:true}:{};
    ocrEl("ocrImg").src=OCR.url;
    if(OCR.zreset)OCR.zreset();       /* 新しい絵は必ず等倍から */
    ocrSync();
    ocrEl("ocrov").classList.add("on");
    /* 全面自動スキャンはしない＝ユーザーが読みたい場所をタップで教えてくれる方が速くて確実。
       狙いを定めている間に裏でエンジンだけ温めておく（初回の待ちを吸収）。
       日本語（住所用）は英語の後ろで静かに続けて温める＝住所タップの初回待ちも吸収 */
    const kept=OCR_KINDS.filter(ocrOn).map(k=>OCR_KIND[k].label);   /* チェックが入っている＝採用中のものだけ */
    ocrStatus((kept.length
      ? "<b>"+kept.join("・")+"</b>は前のスクショの分を残しています。足りないものを<b>指で四角く囲む</b>"
      : "読みたい<b>名前</b>・<b>住所</b>・<b>座標</b>・<b>電話</b>を<b>指で四角く囲む</b>（囲ったところだけを読みます・トンとタップでもOK）")
      +"<br>スクショは<b>2本指で広げると大きく</b>できます（大きくするほど囲みやすく、読み違いも減ります）");
    ocrWorker("eng").then(()=>ocrWorker("jpn")).catch(()=>{
      if(OCR.img===im)ocrStatus("読み取りエンジンを読み込めませんでした。電波のある場所で一度だけ開き直してください（以後はオフラインでも動きます）");
    });
  };
  im.onerror=()=>toast("画像を読み込めませんでした");

/* 読み取った名前を名前欄（共有・編集どちらも id="f_name"）へ入れる。

   ★v0.26.0: 確認は必ず「はい／いいえ」のダイアログで出す。以前はトーストのボタンだったが
   数秒で消えてしまい、気づかないうちに読み取った名前が失われていた（コーイチさん指摘）。 */
function ocrNameApply(nm){
  const el=document.getElementById("f_name");

  if(!el||!nm||cur===nm)return {filled:false,ask:null};
  if(!cur){el.value=nm;return {filled:true,ask:null};}
  return {filled:false,ask:()=>{
    dlgOpen("名前がすでに入っています。\n\n今の名前：\n"+cur+"\n\n読み取った名前：\n"+nm+"\n\n入れ替えますか？",
      true,v=>{if(v){el.value=nm;toast("名前を「"+nm+"」にしました");}},
      {title:"名前を入れ替えますか？",yes:"入れ替える",no:"今のまま"});
  }};
}
function ocrPick(cb){
  const inp=ocrEl("ocrFile");
  /* ★スクショ選びのワンクッション（タップ→チェック→「完了」）はAndroidの写真ピッカー側の作りで、
     acceptの書き方では変わらないことを実機で確認済み。APK版はアプリ側（MainActivity）で
     1タップで確定するファイル選択UIに差し替えている */
  inp.onchange=()=>{

function ocrClose(){

  ocrBusy(false);
  if(OCR.url){try{URL.revokeObjectURL(OCR.url);}catch(e){}OCR.url=null;}
  OCR.img=null;OCR.res=null;OCR.cb=null;OCR.lock={};OCR.bad={};

ocrEl("ocrCloseBtn").onclick=ocrClose;
ocrEl("ocrCopy").onclick=async()=>{

           ocrOn("coord")?(r.lat+", "+r.lng):"",
           ocrOn("tel")?r.tel:""].filter(Boolean).join("\n");
  if(!s)return;

  try{await navigator.clipboard.writeText(s);done();}
  catch(e){
    const ta=document.createElement("textarea");
    ta.value=s;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");done();}catch(x){toast("コピーできませんでした");}
    ta.remove();
  }

ocrEl("ocrUse").onclick=()=>{

/* 「別のスクショ」＝読めた分はそのままに、次の画像を開く（onchangeはocrPickで登録済み） */
ocrEl("ocrSwapBtn").onclick=()=>{ocrEl("ocrFile").click();};

["ocrNameChk","ocrResChk","ocrAddrChk","ocrTelChk"].forEach(id=>{ocrEl(id).onchange=()=>ocrSync();});

   ・2本指＝広げると拡大／動かすと移動（1本指のパンにすると、なぞって囲むのと区別できない）

    const on=Z.s>1.02;
    zb.classList.toggle("on",on);
    if(on)zb.textContent="×"+(Math.round(Z.s*10)/10)+" ⟲もとの大きさ";
  }
  function zreset(){Z.s=1;Z.x=0;Z.y=0;apply();}
  OCR.zreset=zreset;            /* 別のスクショを開いた時に等倍へ戻す */
  const two=()=>{const a=[...pts.values()];return [a[0],a[1]];};
  function pinchStart(){
    const [a,b]=two();if(!a||!b)return;
    const cr=img.getBoundingClientRect();
    pinch={d:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),
           m:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},s:Z.s,x:Z.x,y:Z.y,
           /* 拡大前の中心＝今の枠の中心から今のズレを引いたもの */
           c:{x:cr.left+cr.width/2-Z.x,y:cr.top+cr.height/2-Z.y}};
  }
  function pinchMove(){
    const [a,b]=two();if(!a||!b||!pinch)return;
    const d=Math.max(1,Math.hypot(a.x-b.x,a.y-b.y));
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const s=Math.max(Z.min,Math.min(Z.max,pinch.s*d/pinch.d)),k=s/pinch.s;
    /* 2本指の真ん中にある画像の点が、指の真ん中から動かないようにする（つまんだ所が中心） */
    Z.s=s;
    Z.x=mx-pinch.c.x-k*(pinch.m.x-pinch.c.x-pinch.x);
    Z.y=my-pinch.c.y-k*(pinch.m.y-pinch.c.y-pinch.y);
    apply();
  }
  /* ★下からキーボードが出ると画面が縮み、スクショもその分だけ小さくなって
     手直しのお手本にならない（コーイチさん指摘 v0.30.0）。拡大している間は、
     縮んだ分だけ倍率を上げ直して「今見えている大きさ」を保つ */
  let lastH=0;
  function zkeep(){
    const h=baseH();
    if(!h){lastH=0;return;}                       /* 画面を閉じている間は覚え直し */
    if(lastH&&Z.s>1.001&&Math.abs(h-lastH)>1){
      Z.s=Math.max(Z.min,Math.min(Z.max,Z.s*lastH/h));apply();
    }
    lastH=h;
  }
  /* 2通りの合図で拾う（機種差の保険）: 画像の大きさが変わった時／画面そのものが変わった時 */
  if(window.ResizeObserver)new ResizeObserver(zkeep).observe(img);
  window.addEventListener("resize",zkeep);
  if(window.visualViewport)window.visualViewport.addEventListener("resize",zkeep);
  /* 倍率の札＝押したら等倍に戻す。画像の上にあるので、押しても読み取りは起こさない */
  ["pointerdown","pointermove","pointerup","pointercancel"].forEach(t=>
    zb.addEventListener(t,e=>e.stopPropagation()));
  zb.onclick=e=>{e.stopPropagation();zreset();};
  function rectOf(e){
    const sr=st.getBoundingClientRect();
    const x1=Math.min(p0.x,e.clientX),y1=Math.min(p0.y,e.clientY);
    const x2=Math.max(p0.x,e.clientX),y2=Math.max(p0.y,e.clientY);
    return {l:x1-sr.left,t:y1-sr.top,w:x2-x1,h:y2-y1,x1,y1,x2,y2};
  }
  function show(r){
    sel.style.display="block";
    sel.style.left=r.l+"px";sel.style.top=r.t+"px";
    sel.style.width=r.w+"px";sel.style.height=r.h+"px";
  }
  /* ★パソコンのブラウザでマウスで囲もうとすると、ブラウザの「画像のドラッグ＆ドロップ」が
     始まって指の操作が打ち切られる（pointerdown→dragstart→pointercancel を実測）＝囲めない。
     指で触るスマホでは起きないが、PWAはパソコンでも開ける。ここで断ち切る */
  st.addEventListener("dragstart",e=>e.preventDefault());
  st.addEventListener("pointerdown",e=>{
    if(!OCR.img)return;
    try{st.setPointerCapture(e.pointerId);}catch(x){}   /* 枠の外まで指が出ても最後まで追える */
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size>=2){                       /* 2本目が触れた＝拡大縮小へ。書きかけの囲みは取り消す */
      p0=null;sel.style.display="none";hold=true;
      pinchStart();
      return;
    }
    p0={x:e.clientX,y:e.clientY};
    show(rectOf(e));
  });
  st.addEventListener("pointermove",e=>{
    if(pts.has(e.pointerId))pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&pts.size>=2){pinchMove();return;}
    if(p0)show(rectOf(e));
  });
  st.addEventListener("pointerup",async e=>{
    pts.delete(e.pointerId);
    if(pinch){pinch=null;hold=pts.size>0;return;}      /* 拡大縮小の指離し＝読み取りはしない */
    if(hold){hold=pts.size>0;return;}                  /* 残りの1本を離しただけ */
    if(!p0)return;
    const r=rectOf(e);p0=null;
    /* 表示px→元画像pxへ変換（imgはアスペクト比維持で縮小表示＝要素枠がそのまま画像） */
    const ir=ocrEl("ocrImg").getBoundingClientRect();
    const im=OCR.img,W=im.naturalWidth,H=im.naturalHeight;
    if(!im||ir.width<1||ir.height<1){sel.style.display="none";return;}
    const fx=W/ir.width,fy=H/ir.height;
    setTimeout(()=>sel.style.display="none",300);
    ocrBusy(true);
    try{
      let c=null;
      if(r.w<24&&r.h<24){
        /* タップ＝「この辺り」指定：その点を中心にした全幅の帯を読む。
           帯は画像の高さの18%＝大きい字の名前が2行に折り返していても丸ごと入る
           （v0.20.0の10%・v0.21.0の14%では2行目が帯から切れることがあった。
             認識の時間は帯の広さでは変わらない＝広く取っても遅くならない）
           ★外しても読めるように、空振りしたら黙って倍近くまで広げてもう一度探す */
        const cy=Math.min(H,Math.max(0,((r.y1+r.y2)/2-ir.top)*fy));
        /* ★拡大している時は帯も同じだけ狭める（v0.32.0）。
           帯の広さは元画像に対する割合なので、拡大したまま等倍と同じ割合で取ると
           「画面に見えているより ずっと広い範囲」を読むことになり、狙ったつもりが外れる */
        const z=Math.max(1,Z.s);
        const band=async ratio=>{
          const h=Math.min(H,Math.max(Math.round(110/z),Math.round(H*ratio/z)));
          const y=Math.max(0,Math.min(H-h,Math.round(cy-h/2)));
          return await ocrScanAuto(0,y,W,h,6);
        };
        ocrStatus("タップした<b>あたり</b>を読み取り中…");
        c=await band(0.18);
        if(!c&&OCR.img===im){
          ocrStatus("見つからないので<b>もう少し広げて</b>探しています…");
          c=await band(0.34);
        }
      }else{
        /* ★囲みは「囲ったとおり」に読む（v0.32.0）。2本指で拡大できるようになったので、
           こちらが範囲を決めた方が余計な行が混ざらず読み違いも減る（コーイチさん判断）。
           足すのは「文字の上下が切れて別の字に化けないぶん」だけの薄い余白。
           ★欠けると読めなくなるのではなく“別の字に化ける”のが怖い＝
             数字は化けても形が通ってしまい、間違った座標が黙って入る。
           余白に隣の行がかすっても、判断に使うのは囲いの中に中心がある行だけ（ocrRecLines）。
           旧・自動でひと回り広げて再挑戦は廃止＝空振りの待ち時間が半分になる（囲い直す方が速い） */
        let nx=Math.max(0,(r.x1-ir.left)*fx),ny=Math.max(0,(r.y1-ir.top)*fy);
        let nx2=Math.min(W,(r.x2-ir.left)*fx),ny2=Math.min(H,(r.y2-ir.top)*fy);
        if(nx2-nx<10||ny2-ny<6)return;
        const padX=Math.max(6,(nx2-nx)*0.04),padY=Math.max(8,(ny2-ny)*0.15);
        const ex=Math.max(0,nx-padX),ey=Math.max(0,ny-padY);
        const ew=Math.min(W,nx2+padX)-ex,eh=Math.min(H,ny2+padY)-ey;
        ocrStatus("囲んだところを読み取り中…");
        c=await ocrScanAuto(ex,ey,ew,eh,6,{t:(ny-ey)/eh,b:(ny2-ey)/eh});
      }
      if(OCR.img!==im)return;
      const got=[];
      if(c&&c.coord&&ocrPut("coord",c.coord)) got.push("座標");
      if(c&&c.name &&ocrPut("name", c.name )) got.push("名前");
      if(c&&c.addr &&ocrPut("addr", c.addr )) got.push("住所");
      if(c&&c.tel  &&ocrPut("tel",  c.tel  )) got.push("電話");
      if(got.length) ocrSync(got.join("と")+"を読み取りました。");
      else if(c) ocrSync("");   /* 前のスクショの分を守った＝トーストの「〜にする」で差し替えられる */
      else ocrStatus("読めませんでした。<b>2本指で大きく</b>してから、読みたい部分を<b>少し広めに囲って</b>みてください");
    }catch(x){if(OCR.img)ocrStatus("読み取りに失敗しました。もう一度囲ってみてください");}
    finally{ocrBusy(false);}
  });
  st.addEventListener("pointercancel",e=>{
    pts.delete(e.pointerId);
    if(pts.size<2)pinch=null;
    hold=pts.size>0;
    p0=null;sel.style.display="none";
  });
})();
/* 保険: OCR画面のスワイプをブラウザに渡さない（引っ張って更新の封じ・周辺モードと同方式）。
   ★ただし読み取り結果の枠の中だけは通す＝隠れた行を指で上下に動かして見られるようにする */
ocrEl("ocrov").addEventListener("touchmove",e=>{
  if(e.target&&e.target.closest&&e.target.closest(".ocr-info"))return;
  if(e.cancelable)e.preventDefault();
},{passive:false});

let tt;
function toast(m,actLabel,actFn){
  const t=document.getElementById("toast");
  if(actLabel){
    t.innerHTML=esc(m)+'<button class="undo">'+esc(actLabel)+'</button>';
    t.classList.add("act");
    t.querySelector(".undo").onclick=()=>{t.classList.remove("on","act");actFn&&actFn();};
  }else{
    t.textContent=m; t.classList.remove("act");
  }
  t.classList.add("on");
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on","act"),actLabel?6000:2000);
}

/* 開いている面を上から順に1つ閉じる（Escape・Android戻るボタン共通） */
function closeTopOverlay(){
  if(dlg.classList.contains("on")) dlgClose();   /* 注意ダイアログ=最前面（キャンセル扱い） */
  else if(document.getElementById("cvcrop").classList.contains("on")) cvCropCancel();   /* 表紙の位置調整 */
  else if(document.getElementById("cpick").classList.contains("on")) cpickClose();
  else if(lb.classList.contains("on")) lbClose();
  else if(veil.classList.contains("abovepv")&&veil.classList.contains("on")) closeSheet();   /* 縦閲覧の上の添付メニュー */
  else if(pv.classList.contains("on")) pvClose();   /* ライトボックス→縦閲覧→一覧 の順で1段ずつ */
  else if(document.getElementById("gpov").classList.contains("on")) gpClose();   /* 🔍Gマップの写真 */
  else if(document.getElementById("ocrov").classList.contains("on")) ocrClose();
  else if(document.getElementById("nvov").classList.contains("on")) nvClose();
  else if(document.getElementById("helpov").classList.contains("on")) helpClose();   /* 使い方 */
  else if(document.getElementById("advov").classList.contains("on")) advClose();   /* ⚙追加機能 */
  else if(document.getElementById("nearov").classList.contains("on")) nearClose();
  else if(veil.classList.contains("on")) closeSheet();
  else if(homeTab==="shelf"&&shelfCat&&shelfSub){ shelfSub=null; renderTop(); }   /* フォルダ→本へ */
  else if(homeTab==="shelf"&&shelfCat){ shelfCat=null; renderTop(); }   /* 本の中→本棚へ */
}

/* 本の中・フォルダの中（カード一覧の画面）だけ: 右フリックで1つ戻る（フォルダ→本→本棚）。
   戻るボタンは左⇐＝本棚は左にある心象。画面を右へよけて左の本棚へ帰る＝右フリックが自然（コーイチさん指摘で左→右に修正）。
   Androidナビバーを隠して使う場合、戻るボタンの呼び出しがもどかしいため（コーイチさん要望）。
   写真サムネの横スクロール(.phstrip)とは衝突させない。
   ★v0.35.0: 受け口を main.wrap から document へ移した。
     .wrap は中身のぶんしか高さが無いので、カードが1枚しか無い時の「下の余白」は .wrap の外＝
     指が触れても届いていなかった（カードの上でしか効かない、の正体）。document で受ければ
     余白でもヘッダーの上でも同じように効く。
   ★v0.35.0: 写真の縦閲覧(pv)でも右フリックで閲覧終了。
     それ以外の面（地図・周辺・OCR・ライトボックス・シート等）は横方向の操作と衝突するので付けない。 */
(function(){
  let sx=0,sy=0,st=0,ok=false,mode="";
  const on=id=>{ const e=document.getElementById(id); return !!(e&&e.classList.contains("on")); };
  /* 今この右フリックで何をすべきか。前面に別の面が出ている時は "" ＝何もしない */
  function mode4(){
    if(dlg.classList.contains("on")||on("cvcrop")||on("cpick")||lb.classList.contains("on")||veil.classList.contains("on")) return "";
    if(pv.classList.contains("on")) return "pv";                  /* 写真の縦閲覧＝閲覧終了 */
    if(on("ocrov")||on("nvov")||on("helpov")||on("nearov")||on("gpov")||on("advov")) return "";
    if(homeTab==="shelf"&&shelfCat) return "shelf";               /* 本の中/フォルダの中＝1つ戻る */
    return "";
  }
  document.addEventListener("touchstart",e=>{
    ok=false;
    if(e.touches.length!==1) return;
    if(e.target&&e.target.closest&&e.target.closest(".phstrip")) return;
    mode=mode4(); if(!mode) return;
    ok=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY; st=Date.now();
  },{passive:true});
  document.addEventListener("touchend",e=>{
    if(!ok) return; ok=false;
    if(mode4()!==mode) return;                                           /* 途中で面が変わったら何もしない */
    const t=e.changedTouches[0]; if(!t) return;
    const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Date.now()-st>600) return;                                        /* フリック=素早い動きだけ */
    if(dx<70||Math.abs(dy)>60||Math.abs(dx)<Math.abs(dy)*1.5) return;    /* 右向き・横優勢のみ=縦スクロール誤爆なし */
    flickSwiped=true; setTimeout(()=>{flickSwiped=false;},400);          /* 指を離した所のボタンを押したことにしない */
    if(mode==="pv"){ pvClose(); return; }
    if(shelfSub){ shelfSub=null; renderTop(); }
    else { shelfCat=null; shelfSub=null; renderTop(); }
  },{passive:true});
})();
/* Android戻るボタン対応（番兵方式）: 戻る＝面を1つ閉じる。アプリ自体は終了させない */
/* ★番兵の補充は「画面タッチ中」に行う。
   Chromeはユーザー操作なしで積まれた履歴を戻るボタンでスキップする（バックトラップ防止）ため、
   popstate内で積み直した番兵は無効＝2段戻り・連打でアプリごと閉じる原因だった。
   タッチのたびに5枚まで補充しておけば、戻るを何回押しても直前のタッチ分の番兵で受け止められる */
let guardN=1;   /* 起動時にload内で1枚積む */
function guardTopUp(){ while(guardN<5){ try{history.pushState({basho:"guard"},"");}catch(e){break;} guardN++; } }
try{
  document.addEventListener("pointerdown",guardTopUp,true);
  window.addEventListener("popstate",()=>{
    guardN=Math.max(0,guardN-1);
    if(!guardN){ try{history.pushState({basho:"guard"},""); guardN=1;}catch(e){} }   /* 最後の保険 */
    closeTopOverlay();
  });
}catch(e){}
/* ★APK版(Capacitor): 戻るボタンはネイティブイベントで受ける。
   WebViewの履歴（番兵）頼みだと最後まで抜けてアプリが終了してしまうため。
   面を1つずつ閉じ、最初の画面では何もしない＝PWAと同じ「誤終了ゼロ」挙動 */
try{
  if(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()
     &&window.Capacitor.Plugins&&window.Capacitor.Plugins.App){
    window.Capacitor.Plugins.App.addListener("backButton",()=>closeTopOverlay());
  }
}catch(e){}

/* ───── 📍近くビュー: 現在地から一定距離の登録場所を「カード列+地図」で連動表示 ─────
   上=距離順カード(真ん中のカードにフォーカス) / 下=自分中心の地図(フォーカス中の点が赤)。
   カードのスクロール⇄地図の点タップ、双方向で連動する */
const NEAR={map:null,osm:null,meMk:null,circle:null,dots:{},items:[],r:2000,center:null,at:null,focusId:null,raf:0};
function nearInitMap(){
  if(NEAR.map) return;
  /* 名前入り地図(OSM)=店・施設の名称が見えるのでこの用途に最適 */
  NEAR.osm=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom:20,maxNativeZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'});
  /* v0.51.0: この画面のピンチは「地図のズーム」ではなく「円の伸縮」に割り当てる。
     地図のズームは円に自動追従（常に円全体が見える）ので、ネイティブのズーム操作は全部切る。
     ドラッグ（ちょっと横を覗く）だけ残す。
     v0.51.1: zoomSnap:0=小数ズーム許可（整数刻みだと伸縮中に地図がガクッと段階ジャンプする）・
     zoomAnimation:false=連続setView中のアニメで円が一瞬消えるのを防ぐ */
  NEAR.map=L.map("nearMap",{zoomControl:false,touchZoom:false,scrollWheelZoom:false,
    doubleClickZoom:false,boxZoom:false,keyboard:false,zoomSnap:0,zoomAnimation:false});
  NEAR.map.attributionControl.setPosition("topright");
  NEAR.osm.addTo(NEAR.map);
}
/* ───── v0.51.0: 円を「掴んで伸ばす」 ─────
   地図の上で2本指を広げる＝円の実半径がそのまま広がる（狭める＝縮む）。
   広げた先に登録場所があれば上のカード列にも同じ挙動で並ぶ。日本全体まで広げれば全カードが圏内。
   4択（500m〜5km）と一致しない間は、5kmの右に「≈○km」のおおよそチップが出る。
   PCはホイールでも同じ操作（下に回す=広げる）。 */
const NEARR_MIN=200, NEARR_MAX=3000000;   /* 200m〜3000km（日本のどこからでも全国を覆える） */
/* v0.51.1: 円が常に「画面中央・ほぼ同じ大きさ」で見え続けるよう、半径から必要ズームを
   連続計算して直接セットする（fitBoundsはズームが段階刻みでガクッと飛ぶ＋中心がズレ得る） */
function nearFitCircle(){
  const c=NEAR.center; if(!c||!NEAR.map) return;
  const el=document.getElementById("nearMap");
  const px=Math.min(el.clientWidth,el.clientHeight)*0.42;      /* 円の画面半径の目標px */
  const z=Math.max(2,Math.min(19,
    Math.log2(px*156543.03392*Math.cos(c.lat*Math.PI/180)/NEAR.r)));
  NEAR.map.setView([c.lat,c.lng],z,{animate:false});
}
function nearSetRLive(r){
  NEAR.r=Math.max(NEARR_MIN,Math.min(NEARR_MAX,r));
  if(NEAR.circle){
    NEAR.circle.setRadius(NEAR.r);
    nearFitCircle();
  }
  nearRadsSync();
  const big=document.getElementById("nearRbig");
  big.textContent="半径 ≈ "+fmtDist(NEAR.r); big.classList.add("on");
}
function nearPinchEnd(){
  document.getElementById("nearRbig").classList.remove("on");
  if(NEAR.center) nearRender();          /* カード列と地図の点はここでまとめて更新（ピンチ中は円と数字だけ） */
}
/* 半径チップの点灯を今のNEAR.rに合わせる。4択と一致＝そのボタン点灯、不一致＝自由チップ点灯 */
function nearRadsSync(){
  let hit=false;
  document.querySelectorAll("#nearRads button[data-r]").forEach(b=>{
    const on=Math.abs(+b.dataset.r-NEAR.r)<1; b.classList.toggle("on",on); if(on)hit=true;
  });
  const f=document.getElementById("nearFree");
  f.hidden=hit; f.classList.toggle("on",!hit);
  if(!hit) f.textContent="≈"+fmtDist(NEAR.r);
}
(function(){
  const el=document.getElementById("nearMap");
  const pin={on:false,d0:0,r0:0,raf:0,pend:0};
  const dd=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  el.addEventListener("touchstart",e=>{
    if(e.touches.length===2){
      pin.on=true;pin.d0=dd(e.touches);pin.r0=NEAR.r;
      /* v0.51.1: ピンチ中はドラッグを切る（1本目の指のパンが混ざると中心が流れて円が画面から消える） */
      if(NEAR.map){ NEAR.map.dragging.disable(); }
    }
  },{passive:true});
  el.addEventListener("touchmove",e=>{
    if(!pin.on||e.touches.length!==2)return;
    e.preventDefault();                   /* ブラウザのページズーム・引っ張って更新に渡さない */
    const d=dd(e.touches); if(!pin.d0||!d)return;
    pin.pend=pin.r0*(d/pin.d0);
    if(!pin.raf)pin.raf=requestAnimationFrame(()=>{pin.raf=0;if(pin.pend)nearSetRLive(pin.pend);});
  },{passive:false});
  const end=e=>{
    if(!pin.on||e.touches.length>=2)return;
    pin.on=false;
    if(NEAR.map){ NEAR.map.dragging.enable(); }
    if(pin.raf){cancelAnimationFrame(pin.raf);pin.raf=0;}
    if(pin.pend){nearSetRLive(pin.pend);pin.pend=0;}   /* rAF待ちの最後の動きを捨てない */
    nearPinchEnd();
  };
  el.addEventListener("touchend",end); el.addEventListener("touchcancel",end);
  let wt=0;
  el.addEventListener("wheel",e=>{
    e.preventDefault();
    nearSetRLive(NEAR.r*(e.deltaY>0?1.18:1/1.18));
    clearTimeout(wt); wt=setTimeout(nearPinchEnd,300);
  },{passive:false});
})();
/* place を渡すとその場所が真ん中になる（泊まるホテルの周りに何があるかを見る）。
   渡さなければ従来どおり現在地が真ん中（FABの「周辺」）。v0.34.0 */
function nearOpen(place){
  NEAR.at=(place&&place.lat&&place.lng)?place:null;
  document.getElementById("nearov").classList.add("on");
  document.body.classList.add("nearon");                    /* FAB(足あと・ここを登録)を隠す */
  document.documentElement.classList.add("nvon");           /* 引っ張って更新の封じを流用 */
  NEAR.focusId=null;
  document.getElementById("nearTt").textContent=
    NEAR.at?("📍 "+NEAR.at.name+" の周辺"):"📍 周辺の場所";
  /* 場所が真ん中なら現在地は要らない＝GPSを待たずにすぐ出る（電波の悪い場所でも使える） */
  if(NEAR.at){ NEAR.center={lat:+NEAR.at.lat,lng:+NEAR.at.lng}; nearRender(); }
  else nearLocate();
}
function nearClose(){
  document.getElementById("nearov").classList.remove("on");
  document.body.classList.remove("nearon");
  if(!document.getElementById("nvov").classList.contains("on"))
    document.documentElement.classList.remove("nvon");
  /* v0.36.0: 戻り先は「今この画面の真ん中にしている場所」のカード。
     周辺→周辺と渡り歩いて見つけた店は、戻った先にその店のカードが無いと探し直しになるため
     （カテゴリが違えば本も違う＝なおさら見つけにくい）。現在地が真ん中の時(FABの周辺)は何もしない */
  const at=NEAR.at; NEAR.at=null;
  if(at) revealPlace(places.find(x=>x&&x.id===at.id)||at);
}
function nearLocate(){
  const cards=document.getElementById("nearCards");
  cards.style.paddingTop=cards.style.paddingBottom="";
  cards.innerHTML='<div class="near-empty">現在地を取得しています…</div>';
  const use=pos=>{NEAR.center=pos; nearRender();};
  if(!navigator.geolocation){
    if(lastPos) use(lastPos);
    else{ toast("この端末では位置情報が使えません"); nearClose(); }
    return;
  }
  navigator.geolocation.getCurrentPosition(
    p=>{ lastPos={lat:p.coords.latitude,lng:p.coords.longitude}; use(lastPos); },
    ()=>{
      if(lastPos){ use(lastPos); toast("少し前の現在地を使っています"); }
      else cards.innerHTML='<div class="near-empty">現在地が取れませんでした。<br>電波の良い場所でもう一度お試しください</div>';
    },
    {enableHighAccuracy:false,timeout:8000,maximumAge:30000});
}
function nearRender(){
  nearInitMap();
  nearRadsSync();
  const c=NEAR.center, r=NEAR.r, cards=document.getElementById("nearCards");
  /* 真ん中にした場所そのものは一覧に出さない（真ん中の印として地図に出る） */
  NEAR.items=places.filter(p=>p.lat&&p.lng&&(!NEAR.at||p.id!==NEAR.at.id))
    .map(p=>({p,d:distM(c,{lat:+p.lat,lng:+p.lng})}))
    .filter(x=>x.d<=r).sort((a,b)=>a.d-b.d);
  /* 地図: 先にビューを確定(未設定だとレイヤー追加でエラー)→掃除→自分+円+点 */
  NEAR.map.invalidateSize();
  NEAR.map.setView([c.lat,c.lng],14,{animate:false});
  Object.values(NEAR.dots).forEach(m=>NEAR.map.removeLayer(m)); NEAR.dots={};
  if(NEAR.meMk){NEAR.map.removeLayer(NEAR.meMk);NEAR.meMk=null;}
  if(NEAR.circle){NEAR.map.removeLayer(NEAR.circle);NEAR.circle=null;}
  NEAR.circle=L.circle([c.lat,c.lng],{radius:r,color:"#0B6E5F",weight:1.5,dashArray:"4 6",fill:false}).addTo(NEAR.map);
  /* 真ん中の印: 現在地=青丸／場所を中心にした時=その本の色で一回り大きく（自分と見間違えない） */
  NEAR.meMk=L.circleMarker([c.lat,c.lng],
    NEAR.at?{radius:11,color:"#fff",weight:3.5,fillColor:catColor(NEAR.at.cat),fillOpacity:1}
           :{radius:8,color:"#fff",weight:2.5,fillColor:"#2A6BC9",fillOpacity:1}).addTo(NEAR.map);
  if(NEAR.at) NEAR.meMk.bindTooltip(NEAR.at.name,{permanent:true,direction:"top",offset:[0,-6]});
  NEAR.items.forEach(x=>{
    const mk=L.circleMarker([+x.p.lat,+x.p.lng],{radius:8,color:"#fff",weight:2,fillColor:catColor(x.p.cat),fillOpacity:1});
    mk.on("click",()=>nearJump(x.p.id));
    mk.addTo(NEAR.map); NEAR.dots[x.p.id]=mk;
  });
  NEAR.map.invalidateSize();
  nearFitCircle();
  /* カード列（距離順） */
  NEAR.focusId=null;
  if(!NEAR.items.length){
    cards.style.paddingTop=cards.style.paddingBottom="";
    cards.innerHTML='<div class="near-empty">この距離には登録した場所がありません。<br>上のボタンのほか、地図を2本指で広げると<br>円ごと遠くまで広げられます</div>';
    return;
  }
  cards.innerHTML="";
  NEAR.items.forEach(x=>{
    const el=document.createElement("div");
    el.className="nearrow"; el.dataset.id=x.p.id;
    el.style.setProperty("--nrc",catColor(x.p.cat));
    el.innerHTML='<div class="nr-t"><div class="nr-c">'+esc(x.p.cat)+'</div>'+
      '<div class="nr-n">'+esc(x.p.name)+'</div></div>'+
      '<div class="nr-d">'+fmtDist(x.d)+'</div>'+
      '<div class="nr-b"><button data-a="route">経路</button>'+
      '<button data-a="area">場所周辺</button><button data-a="nav">到達距離</button></div>';
    el.onclick=()=>nearJump(x.p.id);
    el.querySelector('[data-a="route"]').onclick=e=>{e.stopPropagation(); openRoute(x.p);};
    /* 周辺=この場所を真ん中に置き直す（次々に見て回れる） */
    el.querySelector('[data-a="area"]').onclick=e=>{e.stopPropagation(); nearOpen(x.p);};
    el.querySelector('[data-a="nav"]').onclick=e=>{e.stopPropagation(); nvOpen("place",x.p);};
    cards.appendChild(el);
  });
  /* 最初/最後のカードも「真ん中」に来られるよう上下に余白 */
  const row=cards.querySelector(".nearrow");
  const pad=Math.max(0,(cards.clientHeight-(row?row.offsetHeight:72))/2);
  cards.style.paddingTop=pad+"px"; cards.style.paddingBottom=pad+"px";
  cards.scrollTop=0;
  nearSyncFocus();
}
/* スクロール位置の真ん中に一番近いカードへフォーカス＝地図の点を赤に */
function nearSyncFocus(){
  const cards=document.getElementById("nearCards");
  const mid=cards.scrollTop+cards.clientHeight/2;
  let best=null,bd=Infinity;
  cards.querySelectorAll(".nearrow").forEach(el=>{
    const d=Math.abs(el.offsetTop+el.offsetHeight/2-mid);
    if(d<bd){bd=d;best=el;}
  });
  const id=best?best.dataset.id:null;
  if(id===NEAR.focusId) return;
  const prev=cards.querySelector(".nearrow.focus"); if(prev)prev.classList.remove("focus");
  if(best)best.classList.add("focus");
  /* 地図の点: 色はカテゴリ色のまま、フォーカス中だけ大きく(白縁も太く) */
  if(NEAR.focusId&&NEAR.dots[NEAR.focusId]){
    NEAR.dots[NEAR.focusId].setRadius(8);
    NEAR.dots[NEAR.focusId].setStyle({weight:2});
  }
  NEAR.focusId=id;
  if(id&&NEAR.dots[id]){
    NEAR.dots[id].setRadius(13);
    NEAR.dots[id].setStyle({weight:3});
    NEAR.dots[id].bringToFront();
  }
}
/* 地図の点タップ or カードタップ→そのカードを真ん中へ（スクロールがフォーカスを連動させる） */
function nearJump(id){
  const cards=document.getElementById("nearCards");
  const el=cards.querySelector('.nearrow[data-id="'+id+'"]'); if(!el)return;
  cards.scrollTo({top:el.offsetTop-(cards.clientHeight-el.offsetHeight)/2,behavior:"smooth"});
}
document.getElementById("nearBtn").onclick=nearOpen;
document.getElementById("nearBack").onclick=nearClose;
document.getElementById("nearCards").addEventListener("scroll",()=>{
  if(NEAR.raf) return;
  NEAR.raf=requestAnimationFrame(()=>{NEAR.raf=0;nearSyncFocus();});
},{passive:true});
document.querySelectorAll("#nearRads button[data-r]").forEach(b=>{
  b.onclick=()=>{
    NEAR.r=+b.dataset.r; nearRadsSync();
    if(NEAR.center) nearRender();
  };
});
/* 自由チップのタップ＝円全体が見える位置に戻す（ドラッグで覗いた後の帰り道） */
document.getElementById("nearFree").onclick=()=>{ if(NEAR.center) nearRender(); };

/* ───── 🧭経由地モード（v0.52.0 コーイチさん発案） ─────
   出発地→①②③→目的地 を登録場所から順不同に選び、経由地セット済みの経路URLで
   Googleマップを開く（api=1&waypoints=A|B|C・経由地はGoogle仕様で最大9だがUIは3枠固定）。
   メモリ3枠=長押しで保存・タップで呼び出し。選択中の枠は赤枠、場所を入れると次の空枠へ自動移動 */
const RT={cur:{s:null,w:[null,null,null],d:null},sel:null,cat:"",q:""};
const RT_SLOTS=["s","0","1","2","d"];
function rtLoad(){
  try{const s=JSON.parse(localStorage.getItem("basho_route_cur"));
      if(s&&s.w) RT.cur={s:s.s||null,w:[s.w[0]||null,s.w[1]||null,s.w[2]||null],d:s.d||null};}catch(e){}
}
function rtSaveCur(){try{localStorage.setItem("basho_route_cur",JSON.stringify(RT.cur));}catch(e){}}
/* v0.53.0: メモリは「名前付き・数の制限なし」(basho_route_mem2)。
   旧3枠(basho_route_mem・v0.52)が残っていれば初回に名前を付けて移行する */
const RT_MEMCAT="␀mem";   /* カテゴリチップ「💾 メモリ」の内部値（実カテゴリ名と衝突しない） */
function rtMemsSave(a){try{localStorage.setItem("basho_route_mem2",JSON.stringify(a));}catch(e){}}
function rtMems2(){
  try{const m=JSON.parse(localStorage.getItem("basho_route_mem2"));
      if(Array.isArray(m))return m;}catch(e){}
  let out=[];
  try{const old=JSON.parse(localStorage.getItem("basho_route_mem"));
    if(Array.isArray(old)) old.forEach((m,i)=>{ if(m) out.push(
      {n:"メモリ"+(i+1),s:m.s||null,w:[(m.w||[])[0]||null,(m.w||[])[1]||null,(m.w||[])[2]||null],d:m.d||null}); });
  }catch(e){}
  if(out.length){ rtMemsSave(out); try{localStorage.removeItem("basho_route_mem");}catch(e){} }
  return out;
}
/* メモリ行の右側=行程のあらまし（現在地→①…→目的地の名前をつなぐ） */
function rtMemSummary(m){
  const nm=id=>{const p=rtP(id);return p?p.name:null;};
  return [nm(m.s)||"現在地"].concat((m.w||[]).map(nm).filter(Boolean))
    .concat([nm(m.d)||"？"]).join("→");
}
/* メモリを上のバーへ即反映（タップした瞬間に表示＝同期でレンダリング） */
function rtApplyMem(m){
  RT.cur={s:m.s||null,w:[(m.w||[])[0]||null,(m.w||[])[1]||null,(m.w||[])[2]||null],d:m.d||null};
  RT_SLOTS.forEach(sl=>{const id=rtGet(sl); if(id&&!rtP(id))rtSet(sl,null);});
  rtSaveCur(); RT.sel=null; rtRender();
}
/* 長押し(600ms)ヘルパー。発動時刻をel.__longに残す＝直後のclickを呼び出し側で無視できる */
function rtLong(el,fn){
  let t=0;
  const down=()=>{t=setTimeout(()=>{el.__long=Date.now();fn();},600);};
  const up=()=>clearTimeout(t);
  el.addEventListener("touchstart",down,{passive:true});
  el.addEventListener("touchend",up); el.addEventListener("touchmove",up,{passive:true});
  el.addEventListener("mousedown",down); el.addEventListener("mouseup",up); el.addEventListener("mouseleave",up);
  el.addEventListener("contextmenu",e=>e.preventDefault());
}
function rtLongAte(el){ return el.__long&&Date.now()-el.__long<500; }
function rtP(id){ return id?(places.find(x=>x&&x.id===id)||null):null; }
function rtGet(sl){ return sl==="s"?RT.cur.s:sl==="d"?RT.cur.d:RT.cur.w[+sl]; }
function rtSet(sl,id){ if(sl==="s")RT.cur.s=id; else if(sl==="d")RT.cur.d=id; else RT.cur.w[+sl]=id; rtSaveCur(); }
function rtSlotName(sl){return sl==="s"?"出発地":sl==="d"?"目的地":"経由地"+["①","②","③"][+sl];}
function rtNextEmpty(){ for(const sl of ["0","1","2","d"]) if(!rtGet(sl)) return sl; return null; }
function rtOpen(){
  rtLoad();
  RT_SLOTS.forEach(sl=>{const id=rtGet(sl); if(id&&!rtP(id))rtSet(sl,null);});   /* 消された場所は静かに外す */
  document.getElementById("rtov").classList.add("on");
  document.body.classList.add("rton");
  document.documentElement.classList.add("nvon");
  RT.sel=rtNextEmpty();
  RT.q=""; document.getElementById("rtQ").value="";
  /* メモリが1つでもあれば真っ先に「💾 メモリ」を選択した状態で開く＝保存済みコースを即タップできる */
  RT.cat=rtMems2().length?RT_MEMCAT:"";
  rtRender(); rtRenderCats(); rtRenderList();
}
function rtClose(){
  document.getElementById("rtov").classList.remove("on");
  document.body.classList.remove("rton");
  if(!document.getElementById("nvov").classList.contains("on")&&!document.getElementById("nearov").classList.contains("on"))
    document.documentElement.classList.remove("nvon");
}
function rtRender(){
  document.querySelectorAll("#rtov .rt-stop").forEach(el=>{
    const sl=el.dataset.slot, p=rtP(rtGet(sl));
    el.classList.toggle("sel",RT.sel===sl);
    el.classList.toggle("filled",!!p);
    const nm=el.querySelector(".rt-name");
    if(sl==="s") nm.textContent=p?p.name:"現在地";
    else if(sl==="d") nm.textContent=p?p.name:"未選択";
    else nm.textContent=p?p.name:"";
    nm.classList.toggle("ph",!p);
  });
  const selP=RT.sel?rtP(rtGet(RT.sel)):null;
  document.getElementById("rtHint").innerHTML = RT.sel
    ? (selP ? '<button id="rtDrop">✕ 「'+esc(selP.name)+'」を外す</button>'
            : '下のリストをタップ → <b>'+rtSlotName(RT.sel)+'</b> に入ります')
    : '枠（出発地・①②③・目的地）をタップすると選び直せます';

}
function rtRenderCats(){
  const box=document.getElementById("rtCats");
  box.innerHTML="";

}
function rtRenderList(){
  const list=document.getElementById("rtList");
  const qq=norm(RT.q||"");
  /* 「💾 メモリ」選択中＝保存済みコースを同じリスト形式で（タップ=即呼び出し・長押し=削除） */
  if(RT.cat===RT_MEMCAT){
    const all=rtMems2();
    const mems=all.filter(m=>!qq||norm(m.n+" "+rtMemSummary(m)).includes(qq));
    list.innerHTML=mems.length?"":'<div class="near-empty">保存したコースはまだありません。<br>経由地を組んで「💾 メモリに保存」を長押しすると、<br>名前を付けてここに並べられます</div>';
    mems.forEach(m=>{
      const el=document.createElement("div");
      el.className="rtrow mem";
      el.innerHTML='<div class="rt-rn">💾 '+esc(m.n)+'</div><div class="rt-ra">'+esc(rtMemSummary(m))+'</div>';
      el.onclick=()=>{
        if(rtLongAte(el))return;
        rtApplyMem(m);                      /* タップした瞬間に上のバーへ反映 */
        toast("「"+m.n+"」を呼び出しました");
      };
      rtLong(el,()=>{
        dlgOpen("メモリ「"+m.n+"」を削除しますか？",true,v=>{
          if(!v)return;
          rtMemsSave(all.filter(x=>x!==m)); rtRenderList(); toast("削除しました");
        },{title:"💾 メモリ",yes:"削除"});
      });
      list.appendChild(el);
    });
    return;
  }
  /* 経路に使えるのは行き先を渡せる場所だけ（座標か住所がある） */
  let arr=places.filter(p=>p&&((p.lat&&p.lng)||p.addr));
  if(RT.cat) arr=arr.filter(p=>(p.cat||CAT_OTHER.n)===RT.cat);
  if(qq) arr=arr.filter(p=>norm((p.name||"")+" "+(p.addr||"")).includes(qq));
  arr=arr.slice().sort((a,b)=>(b.count||0)-(a.count||0)||(b.used||0)-(a.used||0));   /* よく行く順 */
  list.innerHTML=arr.length?"":'<div class="near-empty">この条件の場所がありません</div>';
  arr.forEach(p=>{
    const el=document.createElement("div");
    el.className="rtrow"; el.style.setProperty("--nrc",catColor(p.cat));
    el.innerHTML='<div class="rt-rn">'+esc(p.name)+'</div><div class="rt-ra">'+esc(p.addr||"")+'</div>';
    el.onclick=()=>{
      if(!RT.sel){ toast("上の枠（出発地・①②③・目的地）をタップしてから選んでください"); return; }
      rtSet(RT.sel,p.id);
      RT.sel=rtNextEmpty();                      /* 次の空枠へ自動移動＝順にタップするだけで組める */
      rtRender();
    };
    list.appendChild(el);
  });
}
document.getElementById("routeBtn").onclick=rtOpen;
document.getElementById("rtBack").onclick=rtClose;
document.querySelectorAll("#rtov .rt-stop").forEach(el=>{
  el.onclick=()=>{ RT.sel=(RT.sel===el.dataset.slot)?null:el.dataset.slot; rtRender(); };
});
document.getElementById("rtQ").addEventListener("input",e=>{RT.q=e.target.value; rtRenderList();});
document.getElementById("rtQx").onclick=()=>{RT.q=""; document.getElementById("rtQ").value=""; rtRenderList();};
/* 経由地・出発地は「その地点ぴったり」が命（裏道の一点など）＝座標を最優先で渡す。
   名称+住所の文字で渡すとGoogleが検索で当てるため、自作の名前だと別の場所に飛ぶ
   （v0.52.1 実機FB: 影取町裏道1〜3のA/B/C地点ズレ）。目的地だけは従来どおり
   名称+住所優先＝お店のカードがちゃんと出る */
function rtQ(p){ return (p.lat&&p.lng)?(p.lat+","+p.lng):q(p); }
document.getElementById("rtGo").onclick=()=>{
  const d=rtP(RT.cur.d);
  if(!d){ toast("目的地を選んでください（目的地の枠をタップ→下のリストから）"); return; }
  const s=rtP(RT.cur.s);
  const ws=RT.cur.w.map(rtP).filter(Boolean);
  let u="https://www.google.com/maps/dir/?api=1&destination="+q(d);
  if(s) u+="&origin="+rtQ(s);
  if(ws.length) u+="&waypoints="+ws.map(rtQ).join("%7C");
  [s,d].concat(ws).filter(Boolean).forEach(p=>{p.count=(p.count||0)+1;p.used=Date.now();});
  Store.save(places);
  openUrl(u);
};
/* クリア: 全枠を一度に空へ（「外す」の一つずつ修正はそのまま残す・v0.53.0）。
   確認ダイアログは出さず、トーストの「取り消す」で戻せる方式＝軽さと安全の両立 */
document.getElementById("rtClear").onclick=()=>{
  if(!RT_SLOTS.some(sl=>rtGet(sl))) return;
  const prev={s:RT.cur.s,w:RT.cur.w.slice(),d:RT.cur.d};
  RT.cur={s:null,w:[null,null,null],d:null}; rtSaveCur();
  RT.sel=rtNextEmpty(); rtRender();
  toast("クリアしました","取り消す",()=>{RT.cur=prev; rtSaveCur(); RT.sel=null; rtRender();});
};
/* 💾 メモリに保存: 長押し→名前を付けて保存（数の制限なし・同名は上書き確認）。
   タップだけで上書きされる事故を作らない＝deliberate action の流儀 */
function rtSaveMem(){
  if(!RT_SLOTS.some(sl=>rtGet(sl))){ toast("先に経由地リストを組んでください"); return; }
  const d=rtP(RT.cur.d);
  const nv=(prompt("メモリの名前（例: 実家からの帰り道）",d?d.name:"")||"").trim();
  if(!nv) return;
  const all=rtMems2();
  const dup=all.findIndex(x=>x.n===nv);
  const rec={n:nv,s:RT.cur.s,w:RT.cur.w.slice(),d:RT.cur.d};
  const put=()=>{
    if(dup>=0)all[dup]=rec; else all.unshift(rec);
    rtMemsSave(all);
    RT.cat=RT_MEMCAT; rtRenderCats(); rtRenderList();   /* 保存した結果がすぐ見える */
    toast("「"+nv+"」で保存しました");
  };
  if(dup>=0) dlgOpen("「"+nv+"」は既にあります。今の内容で上書きしますか？",true,
    v=>{if(v)put();},{title:"💾 メモリ",yes:"上書き"});
  else put();
}
{
  const sb=document.getElementById("rtSave");
  rtLong(sb,rtSaveMem);
  sb.onclick=()=>{ if(rtLongAte(sb))return; toast("長押しで、今の経由地リストに名前を付けて保存します"); };
}
document.getElementById("nvClose").onclick=nvClose;
document.getElementById("nvUnpark").onclick=()=>{
  const nPh=(parking&&parking.ph||[]).length;
  if(!confirm("足あとを解除しますか？\n（旗の位置と足あと"+(nPh?"・写真"+nPh+"枚":"")+"が消えます）")) return;
  if(parking) phPurgePlace(parking);   /* 一時保存の写真もIndexedDBから消す */
  parking=null; saveParking(); nvClose(); toast("足あとを解除しました");
};
document.getElementById("nvLayer").onclick=()=>{
  let next=NV.lay==="std"?"photo":(NV.lay==="photo"?"osm":"std");
  /* 地図の中心が日本の外＝地理院2種を飛ばして白紙を見せない（v0.45.0） */
  if(next!=="osm"&&!nvJpHere()){
    if(NV.lay==="osm"){ toast("この地域では「名前入り」の地図だけ使えます（地理院の地図は日本専用です）"); return; }
    next="osm";
  }
  nvSetLayer(next);
  /* ナビ中の切替は記憶して次回もその地図で開く（ピン置きは常にosm開始なので記憶しない）。
     海外で強制的にosmへ寄せた時は好みを上書きしない＝日本に帰れば前の地図に戻る */
  if(NV.mode!=="pick"&&nvJpHere()){ try{localStorage.setItem("basho_navlay",NV.lay);}catch(e){} }
};
document.getElementById("nvFollow").onclick=()=>nvFollow(!NV.follow);
document.getElementById("nvHead").onclick=()=>{
  const v=!NV.headUp;
  try{ if(v)localStorage.setItem("basho_headup","1"); else localStorage.removeItem("basho_headup"); }catch(e){}
  nvSetHead(v);
  if(v){ nvFollow(true); toast("自分の向きが常に上になります"); }
};
/* 保険: 周辺モード内のスワイプをブラウザに渡さない（引っ張って更新の完全封じ） */
document.getElementById("nvov").addEventListener("touchmove",e=>{
  if(e.target.closest(".nv-pickbar")) return;   /* 検索欄まわりの操作は邪魔しない */
  if(e.cancelable) e.preventDefault();
},{passive:false});
/* 画面回転・リサイズ時は「向き上」の正方形サイズを取り直す */
window.addEventListener("resize",()=>{
  const ov=document.getElementById("nvov");
  if(NV.headUp&&ov.classList.contains("on")&&!ov.classList.contains("pick")) nvSetHead(true);
});
document.getElementById("nvSearchBtn").onclick=nvSearchGo;
document.getElementById("nvSearch").addEventListener("keydown",e=>{if(e.key==="Enter")nvSearchGo();});
document.getElementById("nvPickOk").onclick=()=>{
  const c=NV.map?NV.map.getCenter():null;
  const cb=NV.pickCb;
  nvClose();
  if(c&&cb) cb(+c.lat.toFixed(6),+c.lng.toFixed(6));
};
Store.load().then(d=>{
  places=Array.isArray(d)?d:[];
  /* 写真は登録の古い順（左端=一番最初）に統一。旧版は新しい順だったため、
     写真id（"i"+登録時刻13桁+乱数3字）の時刻部分で並べ直す（毎回実行しても同じ結果） */
  places.forEach(p=>{
    if(p.ph&&p.ph.length>1)
      p.ph.sort((a,b)=>parseInt(a.slice(1,14))-parseInt(b.slice(1,14)));
  });
  /* 既存データの県を一括判定（初回のみ） */
  if(window.PREF_GEO){
    let ch=false;
    places.forEach(p=>{ if(p.lat&&p.lng&&!p.pref){updatePref(p); if(p.pref)ch=true;} });
    if(ch) Store.save(places);
  }
  render();
  if(sortMode==="near")ensurePos();
  handleShare();   /* Googleマップ「共有」経由で開かれた場合は登録シートを出す */
  /* 番兵を1つ積む: 戻るボタンはこれを消費→popstateで面を閉じ、番兵を積み直す。
     scrollRestoration=manual: 戻るボタンでブラウザが「積んだ時点のスクロール位置(先頭)」を
     勝手に復元して見ていたカードを見失うのを防ぐ */
  try{ history.scrollRestoration="manual"; }catch(e){}
  try{ history.replaceState({basho:"root"},""); history.pushState({basho:"guard"},""); }catch(e){}
});
if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
})();
</script>
